<!-- ================================
     index.html v495.2 (SHOWROOM FIXED ID + CLEAN DELIVERY SHARE)
     A) Showroom (default):
        - Always read TW0001
        - Keep chooser + CTA + form
        - You give customers this link for booking
     B) Delivery/Clean (?view=1 or ?clean=1):
        - Read customer id from URL
        - Hide chooser/admin-panel
        - Add floating share button (share/copy link)
        - Still keep admin hotspot (bottom-right triple tap / long-press)

     DO NOT TOUCH: app.js / manifest logic / sw / share logic
================================ -->

  <style>
    /* ---- CTA visibility guard ---- */
    #btnLineCta,
    #btnLineCtaPremium,
    #btnFormCta,
    #btnFormCtaPremium,
    #btnShare,
    #btnSharePremium {
      display: inline-flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    #free-controls,
    #premium-controls {
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* ✅ CLEAN DELIVERY MODE: hide chooser panel */
    html.is-clean #admin-panel{
      display:none !important;
    }

    /* Hidden admin hotspot (bottom-right) */
    #adminHotspotBR{
      position: fixed;
      right: 8px;
      bottom: 8px;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: transparent;
      z-index: 2147482000;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ✅ Clean share floating button (only shown in clean view) */
    #cleanShareFab{
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 2147482100;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(20,24,34,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.92);
      font-weight: 900;
      letter-spacing: .3px;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #cleanShareFab i{ opacity:.9; }
    html.is-clean #cleanShareFab{ display: inline-flex; }

    /* Form overlay */
    .safe-form-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 19, 24, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .safe-form-overlay .box {
      width: min(520px, 92vw);
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px 14px;
      color: rgba(255,255,255,0.92);
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .safe-form-overlay .spinner {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 3px solid rgba(255,255,255,0.18);
      border-top-color: rgba(255,255,255,0.75);
      margin: 0 auto 10px;
      animation: safeSpin 0.9s linear infinite;
    }
    @keyframes safeSpin { to { transform: rotate(360deg); } }
    .safe-form-overlay .hint {
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.76);
      line-height: 1.5;
    }
    .safe-form-overlay .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .safe-form-overlay .btn {
      border: 1px solid rgba(255,255,255,0.18);

      color: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

  <!-- ✅ align v491 -->
  <script src="./app.js?v=491"></script>

  <script>
    (function () {
      "use strict";

      var VERSION = "491";
      var SHOWROOM_ID = "TW0001"; // ✅ front showroom ALWAYS reads this record

      function qs(id) { return document.getElementById(id); }

      function getParams_() {
        try { return new URLSearchParams(location.search || ""); }
        catch (e) { return new URLSearchParams(); }
      }

      function isCleanView_(){
        try{
          var p = getParams_();
          return (p.get("view") === "1") || (p.get("clean") === "1");
        }catch(e){
          return false;
        }
      }

      function effectiveId_(){
        var p = getParams_();
        var raw = (p.get("id") || "").trim();
        // ✅ clean: use URL id (customer)
        if (isCleanView_()) return raw;
        // ✅ showroom: force TW0001
        return SHOWROOM_ID;
      }

      function enforceShowroomIdInUrl_(){
        // In showroom mode, ensure URL id is TW0001 (so app.js fetches the right record)
        if (isCleanView_()) return;
        var p = getParams_();
        if ((p.get("id") || "").trim() !== SHOWROOM_ID){
          p.set("id", SHOWROOM_ID);
          // keep other params (mode/view/etc), but showroom blocks clean anyway
          var s = p.toString();
          var url = location.pathname + (s ? ("?" + s) : "");
          try { history.replaceState({ showroom: true }, "", url); } catch(e) {}
        }
      }

      function buildUrl_(mode) {
        var p = getParams_();

        // ✅ always set id based on mode
        var id = effectiveId_();
        if (id) p.set("id", id); else p.delete("id");

        // mode=form only for showroom
        if (mode) p.set("mode", mode);
        else p.delete("mode");

        // keep view/clean as-is (if clean, mode switching is blocked anyway)
        var s = p.toString();
        return location.pathname + (s ? ("?" + s) : "");
      }

      var __adminPanelDisplay = null;

      function rememberAdminPanelDisplay_() {
        var adminPanel = qs("admin-panel");
        if (!adminPanel) return;
        if (__adminPanelDisplay === null) {
          try { __adminPanelDisplay = getComputedStyle(adminPanel).display || ""; }
          catch (e) { __adminPanelDisplay = ""; }
        }
      }

      function restoreAdminPanelDisplay_() {
        var adminPanel = qs("admin-panel");
        if (!adminPanel) return;

        if (isCleanView_()){
          adminPanel.style.display = "none";
          return;
        }

        if (__adminPanelDisplay && __adminPanelDisplay !== "none") adminPanel.style.display = __adminPanelDisplay;
        else adminPanel.style.display = "";
      }

      var __formMounted = false;
      var __lastCardScrollTop = 0;

      function showOverlay_(on) {
        var ov = qs("safeFormOverlay");
        if (!ov) return;
        ov.style.display = on ? "flex" : "none";
        ov.setAttribute("aria-hidden", on ? "false" : "true");
      }

      function copyText_(t) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t);
            return true;
          }
        } catch (e) {}
        try {
          var ta = document.createElement("textarea");
          ta.value = t;
          ta.setAttribute("readonly", "readonly");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          ta.style.top = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch (e2) {}
        return false;
      }

      function mountFormOnce_() {
        if (__formMounted) return;

        var host = qs("form-container");
        if (!host) return;

        host.innerHTML = "";

        var bar = document.createElement("div");
        bar.setAttribute("role", "navigation");
        bar.style.position = "sticky";
        bar.style.top = "0";
        bar.style.zIndex = "999";
        bar.style.display = "flex";
        bar.style.alignItems = "center";
        bar.style.justifyContent = "space-between";
        bar.style.gap = "10px";
        bar.style.padding = "10px 12px";
        bar.style.background = "rgba(17, 19, 24, 0.92)";
        bar.style.backdropFilter = "blur(10px)";
        bar.style.webkitBackdropFilter = "blur(10px)";
        bar.style.borderBottom = "1px solid rgba(255,255,255,0.12)";

        var left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";
        left.style.gap = "10px";

        var btnBack = document.createElement("button");
        btnBack.type = "button";
        btnBack.textContent = "返回門面";
        btnBack.setAttribute("aria-label", "返回門面");
        btnBack.style.border = "1px solid rgba(255,255,255,0.18)";
        btnBack.style.background = "rgba(255,255,255,0.06)";
        btnBack.style.color = "#fff";
        btnBack.style.padding = "10px 12px";
        btnBack.style.borderRadius = "14px";
        btnBack.style.fontWeight = "800";
        btnBack.style.cursor = "pointer";
        btnBack.style.webkitTapHighlightColor = "transparent";
        btnBack.addEventListener("click", function () { setMode_("card"); });

        var title = document.createElement("div");
        title.textContent = "填寫名片資料";
        title.style.color = "rgba(255,255,255,0.95)";
        title.style.fontWeight = "900";
        title.style.letterSpacing = "0.4px";

        left.appendChild(btnBack);
        left.appendChild(title);

        bar.appendChild(left);

        var frame = document.createElement("iframe");
        frame.setAttribute("title", "名片資料表單");
        frame.setAttribute("loading", "eager");
        frame.src = "./form.html?v=" + VERSION;
        frame.style.width = "100%";
        frame.style.height = "calc(100vh - 60px)";
        frame.style.border = "0";
        frame.style.display = "block";
        frame.style.background = "transparent";

        host.appendChild(bar);
        host.appendChild(frame);

        var retryBtn = qs("safeFormRetryBtn");
        if (retryBtn) {
          retryBtn.onclick = function () {
            try { frame.src = "./form.html?v=" + VERSION + "&ts=" + Date.now(); } catch (e) {}
            showOverlay_(true);
          };
        }
        var copyBtn = qs("safeFormCopyBtn");
        if (copyBtn) {
          copyBtn.onclick = function () {
            copyText_(location.href);
            var hint = qs("safeFormHint");
            if (hint) hint.textContent = "已嘗試複製目前連結（若未成功，可長按網址列複製）。";
          };
        }

        var loaded = false;
        var t0 = Date.now();

        function markLoaded_() {
          if (loaded) return;
          loaded = true;
          showOverlay_(false);
        }

        frame.addEventListener("load", function () { markLoaded_(); });

        showOverlay_(true);

        setTimeout(function () {
          if (loaded) return;
          var hint = qs("safeFormHint");
          if (hint) {
            var sec = Math.max(1, Math.round((Date.now() - t0) / 1000));
            hint.textContent = "載入較慢（" + sec + " 秒）— 可點「重新載入」或「複製連結」改用外部瀏覽器開啟。";
          }
          showOverlay_(true);
        }, 8500);

        __formMounted = true;
      }

      function applyMode_(mode) {
        var cardMain = qs("card-container");
        var adminPanel = qs("admin-panel");
        var formMain = qs("form-container");
        if (!cardMain || !adminPanel || !formMain) return;

        rememberAdminPanelDisplay_();

        var clean = isCleanView_();
        if (clean) {
          document.documentElement.classList.add("is-clean");
          mode = "card"; // clean forbids form mode
        } else {
          document.documentElement.classList.remove("is-clean");
        }

        if (mode === "form") {
          try { __lastCardScrollTop = (document.scrollingElement || document.documentElement).scrollTop || 0; } catch (e) {}
          mountFormOnce_();

          cardMain.style.display = "none";
          adminPanel.style.display = "none";
          formMain.style.display = "block";
          document.body.setAttribute("data-mode", "form");
          document.documentElement.classList.add("mode-form");
          document.documentElement.classList.remove("mode-card");
        } else {
          showOverlay_(false);

          formMain.style.display = "none";
          cardMain.style.display = "block";
          restoreAdminPanelDisplay_();
          document.body.setAttribute("data-mode", "card");
          document.documentElement.classList.add("mode-card");
          document.documentElement.classList.remove("mode-form");

          try {
            var se = (document.scrollingElement || document.documentElement);
            se.scrollTop = __lastCardScrollTop || 0;
          } catch (e2) {}
        }

        if(clean){
          adminPanel.style.display = "none";
        }
      }

      function setMode_(mode) {
        if (isCleanView_()) return;

        enforceShowroomIdInUrl_();

        var nextMode = (mode === "form") ? "form" : "";
        var url = buildUrl_(nextMode);

        try { history.pushState({ mode: nextMode || "card" }, "", url); }
        catch (e) {}

        applyMode_(nextMode ? "form" : "card");
      }

      window.__safeFormMode = window.__safeFormMode || {};
      window.__safeFormMode.setMode = setMode_;

      function safeGoFillForm_() {
        setMode_("form");
        return false;
      }

      try {
        Object.defineProperty(window, "goFillForm", {
          configurable: true,
          enumerable: true,
          get: function () { return safeGoFillForm_; },
          set: function (_) {}
        });
      } catch (e) {
        window.goFillForm = safeGoFillForm_;
      }

      function boot_() {
        // ✅ showroom: force TW0001 into URL before app.js runs fetch logic
        if (!isCleanView_()) {
          enforceShowroomIdInUrl_();
        } else {
          document.documentElement.classList.add("is-clean");
        }

        var p = getParams_();
        var mode = (p.get("mode") || "").trim().toLowerCase();
        applyMode_(mode === "form" ? "form" : "card");
      }

      window.addEventListener("popstate", function () {
        if (!isCleanView_()) enforceShowroomIdInUrl_();
        var p = getParams_();
        var mode = (p.get("mode") || "").trim().toLowerCase();
        applyMode_(mode === "form" ? "form" : "card");
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot_, { once: true });
      } else {
        boot_();
      }

      /* =========================
         Clean view share FAB
         ========================= */
      (function cleanShare_(){
        var fab = qs("cleanShareFab");
        if(!fab) return;

        function shareOrCopy_(){
          var url = location.href;
          // try native share
          try{
            if(navigator.share){
              navigator.share({ title: document.title || "名片", url: url }).catch(function(){});
              return;
            }
          }catch(e){}
          // fallback copy
          var ok = copyText_(url);
          try{
            fab.innerHTML = '<i class="fa-solid fa-check"></i> 已複製連結';
            setTimeout(function(){
              fab.innerHTML = '<i class="fa-solid fa-share-nodes"></i> 分享名片';
            }, ok ? 1600 : 2200);
          }catch(e2){}
        }

        fab.addEventListener("click", function(e){
          e.preventDefault();
          e.stopPropagation();
          shareOrCopy_();
        });

        // only meaningful in clean view
        if(!isCleanView_()){
          fab.style.display = "none";
        }
      })();

      /* =========================
         Admin hidden entry setup
         ========================= */
      (function adminEntry_(){
        var hot = qs("adminHotspotBR");
        if(!hot) return;

        var taps = [];
        var TAP_WINDOW_MS = 900;
        var LONG_PRESS_MS = 1200;
        var pressTimer = null;
        var moved = false;

        function goAdmin_(){
          var p = getParams_();
          // ✅ pass id currently used by app (showroom => TW0001, clean => URL id)
          var id = effectiveId_();
          var url = "./admin.html?v=" + VERSION + (id ? ("&id=" + encodeURIComponent(id)) : "");
          try { location.href = url; } catch(e) {}
        }

        function registerTap_(){
          var now = Date.now();
          taps.push(now);
          taps = taps.filter(function(t){ return (now - t) <= TAP_WINDOW_MS; });
          if(taps.length >= 3){
            taps = [];
            goAdmin_();
          }
        }

        hot.addEventListener("click", function(e){
          e.preventDefault();
          e.stopPropagation();
          registerTap_();
        }, { passive:false });

        hot.addEventListener("touchstart", function(){
          moved = false;
          if(pressTimer) clearTimeout(pressTimer);
          pressTimer = setTimeout(function(){
            if(!moved) goAdmin_();
          }, LONG_PRESS_MS);
        }, { passive:true });

        hot.addEventListener("touchmove", function(){
          moved = true;
          if(pressTimer) clearTimeout(pressTimer);
        }, { passive:true });

        hot.addEventListener("touchend", function(){
          if(pressTimer) clearTimeout(pressTimer);
        }, { passive:true });

        hot.addEventListener("touchcancel", function(){
          if(pressTimer) clearTimeout(pressTimer);
        }, { passive:true });
      })();

    })();
  </script>
