<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>天使幸福智慧名片｜選版參考 v362</title>
  <meta name="theme-color" content="#3aa0ff" />
  <link rel="stylesheet" href="./style.css?v=362" />
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="title">
        <div class="kicker">天使幸福智慧名片館</div>
        <h1>先選版參考，再填表</h1>
      </div>
      <div class="ver">v362</div>
    </header>

    <section class="panel">
      <div class="step">
        <div class="step-badge">1</div>
        <div class="step-title">步驟一：點選顏色、版型、紙感</div>
      </div>

      <!-- Colors -->
      <div class="row">
        <div class="label">顏色</div>
        <div class="colors" id="colorGroup">
          <button class="dot" data-color="rose" aria-label="玫瑰紅"></button>
          <button class="dot" data-color="sky" aria-label="晴空藍"></button>
          <button class="dot" data-color="amber" aria-label="琥珀橘"></button>
          <button class="dot" data-color="violet" aria-label="紫羅蘭"></button>
          <button class="dot" data-color="green" aria-label="森林綠"></button>
        </div>
      </div>

      <!-- Plans -->
      <div class="row">
        <div class="label">版型</div>
        <div class="seg" id="planGroup">
          <button class="pill" data-plan="精品設計款">精品設計款</button>
          <button class="pill" data-plan="自由搭配款">自由搭配款</button>
        </div>
      </div>

      <!-- Papers -->
      <div class="row">
        <div class="label">紙感</div>
        <div class="seg" id="paperGroup">
          <button class="pill" data-paper="霧面棉紙">霧面棉紙</button>
          <button class="pill" data-paper="細顆粒紙">細顆粒紙</button>
          <button class="pill" data-paper="亞麻紋">亞麻紋</button>
          <button class="pill" data-paper="水彩紙">水彩紙</button>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step2">
        <button id="btnGoForm" class="btn primary" type="button" aria-disabled="true">
          步驟二：填寫名片資料
        </button>
        <div id="hint" class="hint">
          小提醒：請先選擇一個版型（上方兩個其一），填表時要選相同名稱。
        </div>

        <div class="mini">
          <span class="chip" id="chipColor">顏色：未選</span>
          <span class="chip" id="chipPlan">版型：未選</span>
          <span class="chip" id="chipPaper">紙感：未選</span>
          <button id="btnClear" class="btn ghost" type="button">清除選擇</button>
        </div>
      </div>
    </section>

    <!-- Simple preview (kept clean) -->
    <section class="preview" id="preview">
      <div class="card">
        <div class="cover"></div>
        <div class="avatar"></div>
        <div class="name">小天使</div>
        <div class="sub">天使幸福智慧名片館</div>
      </div>
    </section>

    <footer class="foot">
      <span>© Angel</span>
      <span>｜</span>
      <span>選版只作為外觀參考</span>
    </footer>
  </div>

  <script src="./app.js?v=362"></script>
</body>
</html>
