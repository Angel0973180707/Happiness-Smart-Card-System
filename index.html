<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>天使幸福智慧名片館 v7.4-renderer-unified</title>

  <link rel="manifest" href="./manifest.json?v=v7.4-renderer-unified" />
  <meta name="theme-color" content="#f8f4ee" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=v7.4-renderer-unified" />
  <link rel="icon" href="./icons/icon-192.png?v=v7.4-renderer-unified" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="天使幸福智慧名片館" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="天使幸福智慧名片館" />
  <meta property="og:description" content="智慧名片訂製｜打造可分享的專屬名片入口" />
  <meta property="og:image" content="og-card.png?v=v7.4-renderer-unified" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./style.css" />

  <style>
    :root{ --poster-bg:#f8f4ee; --poster-bg-2:#f3ece3; --poster-ink:#433227; --poster-ink-soft:#6b5a4d; --poster-line:rgba(102,78,57,.09); --poster-shadow:0 18px 42px rgba(83,62,45,.07); --poster-shadow-soft:0 10px 24px rgba(83,62,45,.05); }
    html,body{ background: radial-gradient(1200px 760px at 50% -10%, rgba(255,255,255,.95), transparent 58%), linear-gradient(180deg, var(--poster-bg), var(--poster-bg-2)) !important; color:var(--poster-ink);}
    body{ min-height:100vh; }
    .facade-brand,.facade-qr{ width:100%; max-width:520px; border-radius:24px; padding:16px 14px 14px; border:1px solid var(--poster-line); background:linear-gradient(180deg, rgba(255,253,250,.98), rgba(255,248,241,.98)); box-shadow:var(--poster-shadow);}
    .facade-brand-head{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .facade-brand-title{ font-weight:1000; font-size:18px; line-height:1.25; letter-spacing:.6px; color:var(--poster-ink); text-align:center; }
    .facade-brand-subtitle{ margin-top:6px; font-size:13px; line-height:1.35; font-weight:800; letter-spacing:.18em; color:#a08f82; text-align:center; }
    .facade-brand .p{ margin-top:10px; font-size:11px; line-height:1.72; color:var(--poster-ink-soft); font-weight:700; text-align:center; max-width:320px; margin-left:auto; margin-right:auto; }
    .facade-qr-box{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .facade-qr-canvas{ position:relative; width:172px; height:172px; padding:12px; border-radius:22px; background:#fff; box-shadow:0 8px 18px rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.035); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .facade-qr-grid{ position:relative; width:148px; height:148px; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:14px; background:#fff; }
    #cleanShareFab,#installFab{ position:fixed; right:12px; z-index:2147482500; width:50px; height:50px; border-radius:16px; border:1px solid rgba(255,255,255,0.18); background: rgba(24,26,32,0.46); backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); box-shadow: 0 10px 24px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.16), 0 0 0 1px rgba(255,255,255,0.05); color: rgba(255,255,255,0.94); display: none; align-items: center; justify-content: center; cursor: pointer; }
    #cleanShareFab{ bottom:12px;} #installFab{ bottom:68px;}
  </style>
</head>

<body class="mode-free color-1 style-arch paper-1">
  <div id="adminHotspotBR" aria-hidden="true"></div>

  <button id="installFab" type="button" aria-label="一鍵安裝">⬇</button>
  <button id="cleanShareFab" type="button" aria-label="分享這張名片">⤴</button>

  <header id="admin-panel">
    <div class="panel-inner">
      <div class="facade-brand" id="facadeBrand">
        <div class="facade-brand-head">
          <div class="facade-brand-title">天使幸福智慧名片館</div>
          <div class="facade-brand-subtitle">Angel Smart Card</div>
        </div>
        <div class="p" id="facadePitch">智慧名片訂製｜為創業者、講師、店家與個人品牌打造專屬名片入口</div>
      </div>

      <div class="facade-qr" id="facadeQrCard">
        <div class="facade-qr-box">
          <div class="facade-qr-canvas" id="facadeQrCanvas"><div class="facade-qr-grid" id="facadeQrGrid"></div></div>
          <div class="facade-qr-title">掃描 QRcode｜帶走智慧名片館</div>
          <div class="facade-qr-sub">可收藏・可分享・可隨時回來慢慢體驗</div>
        </div>
      </div>

      <div class="plan-row" id="planRow">
        <button class="btn-neo pill active" data-group="plan" id="btnPlanFree" type="button">自由搭配</button>
        <button class="btn-neo pill" data-group="plan" id="btnPlanPremium" type="button">精品設計</button>
      </div>

      <div class="controls-block" id="free-controls">
        <div class="announcement-panel" data-announcement-panel style="display:none;">
          <button class="announcement-card" data-announcement-track type="button">
            <span class="announcement-card-top"><span class="announcement-badge">公告</span><span class="announcement-counter" data-announcement-counter>1 / 1</span></span>
            <span class="announcement-title" data-announcement-title>載入中…</span>
            <span class="announcement-summary" data-announcement-text>載入中…</span>
          </button>
        </div>
      </div>

      <div class="controls-block" id="premium-controls" style="display:none;">
        <div class="announcement-panel" data-announcement-panel style="display:none;">
          <button class="announcement-card" data-announcement-track type="button">
            <span class="announcement-card-top"><span class="announcement-badge">公告</span><span class="announcement-counter" data-announcement-counter>1 / 1</span></span>
            <span class="announcement-title" data-announcement-title>載入中…</span>
            <span class="announcement-summary" data-announcement-text>載入中…</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="card-container">
    <div id="livePreviewCard"></div>
  </main>

  <script src="./card-renderer.js"></script>
  <script src="./app.js"></script>
</body>
</html>
