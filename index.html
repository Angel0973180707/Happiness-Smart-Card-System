<!-- index.html (V385.3 UI complete overwrite - works with your app.js + style.css) -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幸福智慧名片 V385.3</title>

  <link rel="manifest" href="./manifest.json?v=3853" />
  <meta name="theme-color" content="#ff5e5e" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./style.css?v=3853" />
</head>

<body class="mode-free color-1 style-arch paper-1">
  <!-- 控制區（方案/顏色/版型/紙感） -->
  <header id="admin-panel">
    <!-- 自由搭配：顏色 -->
    <div class="dots-row">
      <button class="dot active" style="background:#ff5e5e" onclick="setV382('free','color-1',this)" aria-label="自由-粉紅"></button>
      <button class="dot" style="background:#00a8ff" onclick="setV382('free','color-2',this)" aria-label="自由-藍"></button>
      <button class="dot" style="background:#ffa502" onclick="setV382('free','color-3',this)" aria-label="自由-橘"></button>
      <button class="dot" style="background:#7d5fff" onclick="setV382('free','color-4',this)" aria-label="自由-紫"></button>
      <button class="dot" style="background:#2ecc71" onclick="setV382('free','color-5',this)" aria-label="自由-綠"></button>
    </div>

    <!-- 精品設計：顏色 -->
    <div class="dots-row">
      <button class="p-dot" style="background:#a36d6d" onclick="setV382('premium','p1',this)" aria-label="精品-p1 胭脂"></button>
      <button class="p-dot" style="background:#722f37" onclick="setV382('premium','p2',this)" aria-label="精品-p2 酒紅"></button>
      <button class="p-dot" style="background:#1c2e42" onclick="setV382('premium','p3',this)" aria-label="精品-p3 深藍"></button>
      <button class="p-dot" style="background:#5e548e" onclick="setV382('premium','p4',this)" aria-label="精品-p4 霧紫"></button>
      <button class="p-dot" style="background:#7a94a6" onclick="setV382('premium','p5',this)" aria-label="精品-p5 藍灰"></button>
      <button class="p-dot" style="background:#bf953f" onclick="setV382('premium','p6',this)" aria-label="精品-p6 金箔"></button>
      <button class="p-dot" style="background:#444444" onclick="setV382('premium','p7',this)" aria-label="精品-p7 褐碳"></button>
    </div>

    <!-- 自由搭配 controls -->
    <div id="free-controls" style="margin-top:12px;">
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:0 12px;">
        <button class="btn-neo active" onclick="setV382Style('arch',this)">正拱</button>
        <button class="btn-neo" onclick="setV382Style('flat',this)">平直</button>
        <button class="btn-neo" onclick="setV382Style('spot',this)">晨曦</button>

        <span style="width:10px;"></span>

        <button class="btn-neo active" onclick="setV382Paper('paper-1',this)">霧面棉紙</button>
        <button class="btn-neo" onclick="setV382Paper('paper-2',this)">細顆粒紙</button>
        <button class="btn-neo" onclick="setV382Paper('paper-3',this)">亞麻紋</button>
      </div>
    </div>

    <!-- 說明 / CTA -->
    <div style="margin-top:12px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
      <button class="btn-help" onclick="openOrderHelp()">
        <span aria-hidden="true">?</span> 訂購流程說明
      </button>
      <button class="btn-cta mini" onclick="goFillForm()">立即填寫預約表單</button>
    </div>
  </header>

  <!-- 名片卡 -->
  <main class="card" role="main" aria-label="智慧名片">
    <!-- premium fx + paper -->
    <div class="premium-fx-layer"></div>
    <div class="paper-overlay"></div>

    <!-- free banner -->
    <div class="banner">
      <div class="dynamic-mask"></div>
    </div>

    <!-- avatar -->
    <div class="avatar-wrap">
      <div class="avatar-circle">
        <img id="u-img" class="avatar" alt="形象照" />
      </div>
    </div>

    <!-- content -->
    <section class="info-scroll">
      <h1 id="u-name" class="name">載入中...</h1>
      <div id="u-unit" class="unit">同步中...</div>

      <div class="content-box" style="margin-top:14px;">
        <div class="cta-box" onclick="goFillForm()">立即預約訂製名片 →</div>
      </div>

      <div class="content-box">
        <div style="font-weight:900; margin-bottom:8px;">服務項目</div>
        <div id="u-service" class="service-box">正在同步雲端服務項目...</div>
      </div>

      <div class="version-tag">V385.3</div>
    </section>
  </main>

  <div class="footer">© Angel Card</div>

  <!-- 訂購流程 modal -->
  <div id="orderHelpModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="訂購流程說明">
      <div class="modal-head">
        <div class="modal-title">訂購流程說明</div>
        <button class="modal-x" onclick="closeOrderHelp()" aria-label="關閉">×</button>
      </div>

      <div class="modal-body">
        <ol class="modal-ol">
          <li>先選擇方案（自由搭配 / 精品設計）與喜歡的外觀。</li>
          <li>點「立即填寫預約表單」，送出你的名片資料。</li>
          <li>我們會依你選擇的方案進行設計製作，完成後提供專屬名片連結。</li>
        </ol>

        <div class="modal-note">
          小提醒：如果你是第一次預約，建議先加 LINE 官方帳號，溝通更順暢。
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn-cta mini" onclick="goFillForm()">我知道了，去填表</button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=3853"></script>
</body>
</html>
