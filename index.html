<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幸福智慧名片 V382.2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="mode-free color-1 style-arch paper-1">

  <div id="admin-panel">
    <div class="picker-section">
      <span class="section-label"><i class="fa-solid fa-palette"></i> 自由搭配：亮色親和 (5色)</span>
      <div class="dots-row">
        <div class="dot active" style="background:#ee5253" onclick="window.setV382('free', 'color-1', this)"></div>
        <div class="dot" style="background:#00a8ff" onclick="window.setV382('free', 'color-2', this)"></div>
        <div class="dot" style="background:#f0932b" onclick="window.setV382('free', 'color-3', this)"></div>
        <div class="dot" style="background:#6c5ce7" onclick="window.setV382('free', 'color-4', this)"></div>
        <div class="dot" style="background:#20bf6b" onclick="window.setV382('free', 'color-5', this)"></div>
      </div>
      
      <div id="free-controls" class="panel-box">
        <div class="control-row">
          <span class="row-tag">版型</span>
          <div class="btn-stack">
            <button class="btn-neo active" onclick="window.setV382Style('arch', this)">正拱型</button>
            <button class="btn-neo" onclick="window.setV382Style('flat', this)">平直型</button>
            <button class="btn-neo" onclick="window.setV382Style('spot', this)">晨曦款</button>
          </div>
        </div>
        <div class="control-row">
          <span class="row-tag">紙感</span>
          <div class="btn-stack">
            <button class="btn-neo active" onclick="window.setV382Paper('paper-1', this)">霧面棉</button>
            <button class="btn-neo" onclick="window.setV382Paper('paper-2', this)">細顆粒</button>
            <button class="btn-neo" onclick="window.setV382Paper('paper-3', this)">亞麻紋</button>
            <button class="btn-neo" onclick="window.setV382Paper('paper-4', this)">水彩紙</button>
          </div>
        </div>
      </div>
    </div>

    <div class="picker-section">
      <span class="section-label"><i class="fa-solid fa-leaf"></i> 精品氣質：七種語彙 (方案 B)</span>
      <div class="dots-row">
        <div class="p-dot" style="background:#1a2f27" onclick="window.setV382('premium', 'p1', this)"></div>
        <div class="p-dot" style="background:#2c3e50" onclick="window.setV382('premium', 'p2', this)"></div>
        <div class="p-dot" style="background:#5d2525" onclick="window.setV382('premium', 'p3', this)"></div>
        <div class="p-dot" style="background:#8e5a3c" onclick="setV382('premium', 'p4', this)"></div>
        <div class="p-dot" style="background:#7a94a6" onclick="setV382('premium', 'p5', this)"></div>
        <div class="p-dot" style="background:#6b6687" onclick="setV382('premium', 'p6', this)"></div>
        <div class="p-dot" style="background:#1a1a1a" onclick="setV382('premium', 'p7', this)"></div>
      </div>
    </div>

    <button class="btn-main-cta" onclick="window.goFillForm()">立即預約訂製 <i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <div id="card-container" class="card">
    <div class="paper-fx-overlay"></div>
    <div class="premium-fx-overlay"></div>
    
    <div class="banner">
      <div class="arch-mask"></div>
      <div class="spot-mask"></div> </div>
    
    <div class="avatar-wrap">
      <div class="avatar-circle">
        <img id="u-img" src="" class="avatar" alt="樣板" />
      </div>
    </div>

    <div class="info-scroll">
      <h1 id="u-name" class="name">載入中...</h1>
      <div id="u-unit" class="unit">...</div>
      <div id="order-box" class="content-box bounce-box" onclick="window.goFillForm()">立即填寫預約表單</div>
      <div class="content-box">
        <div class="label">服務項目</div>
        <div id="u-service">正在載入雲端資料...</div>
      </div>
    </div>
  </div>

  <footer id="gate-footer" onclick="window.handleHiddenGate()">
    © 2026 幸福智慧名片 V382.2｜版權所有
  </footer>

  <script src="./app.js"></script>
</body>
</html>
