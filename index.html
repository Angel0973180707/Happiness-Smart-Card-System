  <!-- ✅ Force DEMO front id BEFORE app.js runs -->
  <script>
    (function(){

      var isClean = (sp.get("view") === "1") || (sp.get("clean") === "1");
      var isAdmin = (sp.get("admin") === "1");

      // NOTE: CSS uses body.clean, so we set body in runtime too.
      if (isClean) {
        try{ document.addEventListener("DOMContentLoaded", function(){ document.body.classList.add("clean"); }, {once:true}); }catch(e){}

      if (!isClean && !isAdmin) {
        if ((sp.get("id") || "").trim() !== DEMO_ID) {
          sp.set("id", DEMO_ID);
          try { history.replaceState({}, "", location.pathname + "?" + sp.toString()); } catch(e) {}
        }

  <script>
    (function(){
      "use strict";

      var VERSION = "521.1";
      var LINE_OA_URL = "https://lin.ee/3r2ZePN"; // ✅ 你的 LINE OA

      function qs(id){ return document.getElementById(id); }
      function sp(){ try{return new URLSearchParams(location.search||"");}catch(e){return new URLSearchParams();} }
      function isClean(){
        var p = sp();
        return (p.get("view")==="1") || (p.get("clean")==="1");
      }

      // ===== Clean UI =====
      function applyCleanUI(){
        if(!isClean()) return;
        document.body.classList.add("clean");
        var panel = qs("admin-panel");
        var hot = qs("adminHotspotBR");
        var fab = qs("cleanShareFab");
        if(panel) panel.style.display = "none";
        if(hot) hot.style.display = "none";
        if(fab) fab.style.display = "flex";
      }

      // Clean share FAB
      (function(){
        var fab = qs("cleanShareFab");
        if(!fab) return;
        fab.addEventListener("click", function(){
          try{
            var b = qs("btnShare");
            if(b && b.click) b.click();
            else if(navigator.share) navigator.share({ title: document.title, url: location.href });
          }catch(e){}
        }, {passive:true});
      })();

      // ===== LINE OA CTA =====
      function bindLineOa(){
        function openOA(){
          try{ window.open(LINE_OA_URL, "_blank"); }catch(e){ location.href = LINE_OA_URL; }
        }
        ["btnLineOaCta","btnLineOaCta2"].forEach(function(id){
          var b = qs(id);
          if(b) b.addEventListener("click", function(e){ e.preventDefault(); openOA(); }, {passive:false});
        });
      }

      // ===== Feature modal =====
      function bindFeature(){
        var mask = qs("featureMask");
        var close = qs("featureCloseBtn");
        function open(){
          if(!mask) return;
          mask.style.display="flex";
          mask.setAttribute("aria-hidden","false");
        }
        function shut(){
          if(!mask) return;
          mask.style.display="none";
          mask.setAttribute("aria-hidden","true");
        }
        ["btnFeature","btnFeature2"].forEach(function(id){
          var b = qs(id);
          if(b) b.addEventListener("click", function(e){ e.preventDefault(); open(); }, {passive:false});
        });
        if(close) close.addEventListener("click", function(){ shut(); });
        if(mask) mask.addEventListener("click", function(e){
          if(e.target === mask) shut();
        });
      }

      // ===== Invite Gate =====
      function bindInviteGate(){
        var mask = qs("inviteMask");
        var close = qs("inviteCloseBtn");
        var input = qs("inviteInput");
        var go = qs("inviteGoBtn");

        function open(){
          if(isClean()) return; // 成品不提供
          if(!mask) return;
          mask.style.display="flex";
          mask.setAttribute("aria-hidden","false");
          setTimeout(function(){ try{ input && input.focus(); }catch(e){} }, 50);
        }
        function shut(){
          if(!mask) return;
          mask.style.display="none";
          mask.setAttribute("aria-hidden","true");
        }
        function goForm(){
          if(isClean()) return;
          var code = (input && input.value ? input.value : "").trim();
          if(!code){
            try{ input && input.focus(); }catch(e){}
            return;
          }
          var url = "./form.html?v=" + encodeURIComponent(VERSION) + "&invite=" + encodeURIComponent(code);
          try{ window.open(url, "_blank"); }catch(e){ location.href = url; }
        }

        ["btnInviteGate","btnInviteGate2"].forEach(function(id){
          var b = qs(id);
          if(b) b.addEventListener("click", function(e){ e.preventDefault(); open(); }, {passive:false});
        });

        if(close) close.addEventListener("click", function(){ shut(); });
        if(mask) mask.addEventListener("click", function(e){ if(e.target === mask) shut(); });

        if(go) go.addEventListener("click", function(){ goForm(); });
        if(input) input.addEventListener("keydown", function(e){
          if(e.key === "Enter"){ e.preventDefault(); goForm(); }
        });
      }

      // ===== Admin hidden entry (disabled in clean) =====
      (function adminEntry(){
        if(isClean()) return;
        var hot = qs("adminHotspotBR");
        if(!hot) return;

        var taps = [];
        var TAP_WINDOW_MS = 900;
        var LONG_PRESS_MS = 1200;
        var pressTimer = null;
        var moved = false;

        function goAdmin(){
          var p = sp();
          var id = (p.get("id") || "").trim();
          var url = "./admin.html?v=" + encodeURIComponent(VERSION) + (id ? ("&id=" + encodeURIComponent(id)) : "");
          try{ location.href = url; }catch(e){}
        }

        function registerTap(){
          var now = Date.now();
          taps.push(now);
          taps = taps.filter(function(t){ return (now - t) <= TAP_WINDOW_MS; });
          if(taps.length >= 3){
            taps = [];
            goAdmin();
          }
        }

        hot.addEventListener("click", function(e){
          e.preventDefault(); e.stopPropagation();
          registerTap();
        }, {passive:false});

        hot.addEventListener("touchstart", function(){
          moved = false;
          if(pressTimer) clearTimeout(pressTimer);
          pressTimer = setTimeout(function(){ if(!moved) goAdmin(); }, LONG_PRESS_MS);
        }, {passive:true});

        hot.addEventListener("touchmove", function(){
          moved = true;
          if(pressTimer) clearTimeout(pressTimer);
        }, {passive:true});

        hot.addEventListener("touchend", function(){
          if(pressTimer) clearTimeout(pressTimer);
        }, {passive:true});

        hot.addEventListener("touchcancel", function(){
          if(pressTimer) clearTimeout(pressTimer);
        }, {passive:true});
      })();

      // ===== Boot =====
      function boot(){
        applyCleanUI();
        bindLineOa();
        bindFeature();
        bindInviteGate();

        // keep CTA visible
        setTimeout(function(){
          ["btnLineOaCta","btnLinePrivateCta","btnFeature","btnInviteGate","btnShare",
           "btnLineOaCta2","btnLinePrivateCta2","btnFeature2","btnInviteGate2"
          ].forEach(function(id){
            var b = qs(id);
            if(b){ b.style.display="inline-flex"; b.style.visibility="visible"; b.style.opacity="1"; }
          });
        }, 280);
      }

      if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", boot, {once:true});
      }else{
        boot();
      }
    })();
  </script>
</body>
