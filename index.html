<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f5f1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>天使幸福智慧名片館 v7.7.4.2</title>
  <meta name="description" content="智慧名片訂製服務｜適合創業者、講師與服務業｜打造可分享的專屬名片入口" />

  <link rel="manifest" href="./manifest.json?v=v7.7.4.2" />
  <link rel="icon" href="./icon-192.png?v=v7.7.4.2" />
  <link rel="apple-touch-icon" href="./icon-192.png?v=v7.7.4.2" />
  <link rel="stylesheet" href="./style.css?v=v7.7.4.2" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="mode-free color-1 style-arch paper-1">
  <div class="page-shell">

    <!-- 頂部公告 -->
    <section class="announcement-zone">
      <article class="announcement-card" data-announcement-panel>
        <div class="announcement-head">
          <div class="announcement-badge">
            <i class="fa-solid fa-bullhorn"></i>
            <span>最新公告</span>
          </div>
          <div class="announcement-counter" data-announcement-counter></div>
        </div>
        <h3 class="announcement-title" data-announcement-title>公告載入中</h3>
        <p class="announcement-text" data-announcement-text>請稍候…</p>
        <button class="announcement-more-btn" type="button" data-announcement-track>
          查看全文
        </button>
      </article>
    </section>

    <!-- 品牌門面 -->
    <header class="hero-section">
      <div class="hero-copy-wrap">
        <p class="hero-kicker">天使幸福智慧名片</p>
        <h1 class="hero-title">天使幸福智慧名片</h1>
        <p class="hero-copy" data-balance-type="hero-copy">
          智慧名片訂製服務｜適合創業者、講師與服務業｜打造可分享的專屬名片入口
        </p>
      </div>
    </header>

    <!-- 方案切換 -->
    <section class="facade-controls card-shell">
      <div class="section-title-row">
        <h2 class="section-title">門面樣品體驗</h2>
        <div class="version-pill" id="versionTag">v7.7.4.2</div>
      </div>

      <div class="plan-row">
        <button id="btnPlanFree" class="btn-neo active" type="button" onclick="setPlan('free', this)">自由搭配</button>
        <button id="btnPlanPremium" class="btn-neo" type="button" onclick="setPlan('premium', this)">精品設計</button>
      </div>

      <div id="free-controls" class="control-group">
        <div class="control-label">顏色</div>
        <div id="freeDotsRow" class="dot-row">
          <button class="dot dot-1 active" type="button" aria-label="c1" onclick="setTheme('c1', this)"></button>
          <button class="dot dot-2" type="button" aria-label="c2" onclick="setTheme('c2', this)"></button>
          <button class="dot dot-3" type="button" aria-label="c3" onclick="setTheme('c3', this)"></button>
          <button class="dot dot-4" type="button" aria-label="c4" onclick="setTheme('c4', this)"></button>
          <button class="dot dot-5" type="button" aria-label="c5" onclick="setTheme('c5', this)"></button>
        </div>

        <div class="control-label">版型</div>
        <div id="styleRow" class="chip-row">
          <button class="btn-neo active" type="button" onclick="setStyle('s1', this)">正拱</button>
          <button class="btn-neo" type="button" onclick="setStyle('s2', this)">平直</button>
          <button class="btn-neo" type="button" onclick="setStyle('s3', this)">晨曦</button>
        </div>

        <div class="control-label">紙感</div>
        <div id="paperRow" class="chip-row">
          <button class="btn-neo active" type="button" onclick="setPaper('f1', this)">棉紙</button>
          <button class="btn-neo" type="button" onclick="setPaper('f2', this)">象牙紙</button>
          <button class="btn-neo" type="button" onclick="setPaper('f3', this)">霧灰</button>
        </div>
      </div>

      <div id="premium-controls" class="control-group" style="display:none;">
        <div class="control-label">精品色系</div>
        <div id="premiumDotsRow" class="premium-dot-row">
          <button class="p-dot" type="button" aria-label="p1" onclick="setTheme('p1', this)"></button>
          <button class="p-dot" type="button" aria-label="p2" onclick="setTheme('p2', this)"></button>
          <button class="p-dot" type="button" aria-label="p3" onclick="setTheme('p3', this)"></button>
          <button class="p-dot" type="button" aria-label="p4" onclick="setTheme('p4', this)"></button>
          <button class="p-dot" type="button" aria-label="p5" onclick="setTheme('p5', this)"></button>
          <button class="p-dot" type="button" aria-label="p6" onclick="setTheme('p6', this)"></button>
          <button class="p-dot" type="button" aria-label="p7" onclick="setTheme('p7', this)"></button>
        </div>
      </div>
    </section>

    <!-- 主預覽 -->
    <section class="preview-section">
      <div id="livePreviewCard"></div>
    </section>

    <!-- 品牌補充區 -->
    <section class="info-enhance-section">
      <div class="info-stack">
        <div id="u-unit-wrap" class="info-card">
          <div class="info-card-head">
            <div class="info-card-title">單位 / 品牌</div>
          </div>
          <div class="expandable-wrap">
            <div id="u-unit" class="block-body expandable-text is-collapsed preline" style="--max-lines:2;"></div>
            <button id="u-unit-toggle" class="expand-toggle" type="button" style="display:none;">看更多</button>
          </div>
        </div>

        <div class="info-card slogan-card">
          <div class="info-card-head">
            <div class="info-card-title">一句話理念</div>
            <div id="cardExpiry" class="expiry-pill" style="display:none;"></div>
          </div>
          <div class="expandable-wrap">
            <div id="u-slogan" class="block-body expandable-text is-collapsed preline" style="--max-lines:3;"></div>
            <button id="u-slogan-toggle" class="expand-toggle" type="button" style="display:none;">看更多</button>
          </div>
        </div>

        <div id="block-service" class="info-card" style="display:none;"></div>
        <div id="block-exp" class="info-card" style="display:none;"></div>
      </div>
    </section>

    <!-- 門面 QR -->
    <section class="qr-showcase-section">
      <div class="qr-card">
        <div class="qr-copy">
          <h3 class="qr-title" data-balance-type="qr-title">分享名片館｜門面入口</h3>
          <p class="qr-sub" data-balance-type="qr-sub">掃碼快速體驗・可分享給朋友</p>
        </div>
        <div class="qr-box">
          <div id="facadeQrGrid" class="qr-grid"></div>
        </div>
      </div>
    </section>

    <!-- 功能區 QR -->
    <section class="qr-showcase-section">
      <div class="qr-card">
        <div class="qr-copy">
          <h3 class="qr-title" data-balance-type="product-qr-title">成品名片｜分享 QR</h3>
          <p class="qr-sub" data-balance-type="product-qr-sub">聯繫・影音・照片・內容一頁整合</p>
        </div>
        <div class="qr-box qr-box-has-center">
          <div id="featureQrGrid" class="qr-grid"></div>
          <img id="featureQrAvatar" alt="QR Center Avatar" />
        </div>
      </div>
    </section>

    <!-- 底部 QR -->
    <section id="bottomQrSection" class="bottom-qr-section">
      <div class="bottom-qr-card">
        <div class="bottom-qr-copy">
          <h3 class="bottom-qr-title">我的名片 QR</h3>
          <p class="bottom-qr-text">可直接掃碼打開目前名片頁</p>
        </div>
        <div class="bottom-qr-box qr-box-has-center">
          <div id="bottomQrGrid" class="qr-grid"></div>
          <img id="bottomQrAvatar" alt="Bottom QR Center Avatar" />
        </div>
      </div>
    </section>

    <!-- 安裝區 -->
    <section id="installDock" class="install-dock" style="display:none;">
      <button id="btnInstallCard" class="dock-btn dock-install" type="button" onclick="__triggerPwaInstall()">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>加入主畫面</span>
      </button>
    </section>

    <!-- 浮動安裝 -->
    <button id="installFab" class="install-fab" type="button" onclick="__triggerPwaInstall()" style="display:none;">
      <i class="fa-solid fa-download"></i>
    </button>

  </div>

  <!-- 公告 Modal -->
  <div id="announcementMask" class="modal-mask" style="display:none;" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="announcementModalTitle">公告</h3>
        <button id="announcementCloseBtn" class="modal-close-btn" type="button" aria-label="關閉">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="announcementModalMeta" class="modal-meta"></div>
      <div id="announcementModalBody" class="modal-body"></div>
    </div>
  </div>

  <script>
    /* 讓 app.js 可安全呼叫 */
    window.__lockBodyScroll = function(){
      document.documentElement.classList.add("is-modal-open");
      document.body.classList.add("is-modal-open");
    };
    window.__unlockBodyScroll = function(){
      document.documentElement.classList.remove("is-modal-open");
      document.body.classList.remove("is-modal-open");
    };
  </script>

  <!-- 只保留 renderer + app，QR 由 app.js 全權接管 -->
  <script src="./card-renderer.js?v=v7.7.4.2-full-facade-actions-on-qr-force"></script>
  <script src="./app.js?v=v7.7.4.2-full-facade-actions-on-qr-force"></script>
</body>
</html>
