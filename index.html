<!-- index.html (v400 COMPLETE OVERWRITE) 1/3 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happiness Smart Card System v400</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json?v=400" />
  <meta name="theme-color" content="#ff5e5e" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=400" />
  <link rel="icon" href="./icons/icon-192.png?v=400" />

  <!-- Fonts / Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css?v=400" />
</head>

<body class="mode-free color-1 style-arch paper-1">

  <!-- top invisible admin hotspot -->
  <div id="adminHotspotTop" aria-label="admin-hotspot"></div>

  <!-- Control panel (門面) -->
  <section id="admin-panel">
    <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">

      <!-- Plan buttons -->
      <div style="display:flex; gap:12px; justify-content:center;">
        <button id="btnPlanFree" class="btn-neo pill active" onclick="setV382('free','color-1', this)">方案A｜自由搭配</button>
        <button id="btnPlanPremium" class="btn-neo pill" onclick="setV382('premium','p1', this)">方案B｜精品設計</button>
      </div>

      <!-- Free dots -->
      <div id="free-controls">
        <div id="freeDotsRow" class="dots-row">
          <div class="dot active" style="background:#ff5e5e" onclick="setV382('free','color-1', this)"></div>
          <div class="dot" style="background:#00a8ff" onclick="setV382('free','color-2', this)"></div>
          <div class="dot" style="background:#ffa502" onclick="setV382('free','color-3', this)"></div>
          <div class="dot" style="background:#7d5fff" onclick="setV382('free','color-4', this)"></div>
          <div class="dot" style="background:#2ecc71" onclick="setV382('free','color-5', this)"></div>
        </div>

        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          <button class="btn-neo" onclick="setV382Style('arch', this)">正拱</button>
          <button class="btn-neo" onclick="setV382Style('flat', this)">平直</button>
          <button class="btn-neo" onclick="setV382Style('spot', this)">晨曦</button>
        </div>

        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
          <button class="btn-neo" onclick="setV382Paper('paper-1', this)">霧面棉紙</button>
          <button class="btn-neo" onclick="setV382Paper('paper-2', this)">細顆粒紙</button>
          <button class="btn-neo" onclick="setV382Paper('paper-3', this)">亞麻紋</button>
        </div>
      </div>

      <!-- Premium dots -->
      <div id="premiumDotsRow" class="dots-row" style="display:none;">
        <div class="p-dot active" style="background:#a36d6d" onclick="setV382('premium','p1', this)"></div>
        <div class="p-dot" style="background:#722f37" onclick="setV382('premium','p2', this)"></div>
        <div class="p-dot" style="background:#1c2e42" onclick="setV382('premium','p3', this)"></div>
        <div class="p-dot" style="background:#5e548e" onclick="setV382('premium','p4', this)"></div>
        <div class="p-dot" style="background:#7a94a6" onclick="setV382('premium','p5', this)"></div>
        <div class="p-dot" style="background:#bf953f" onclick="setV382('premium','p6', this)"></div>
        <div class="p-dot" style="background:#444444" onclick="setV382('premium','p7', this)"></div>
      </div>

      <button class="btn-cta" onclick="goFillForm()">立即預約訂製名片 →</button>
    </div>
  </section><!-- Card container -->
  <main id="card-container">
    <div class="card">

      <!-- premium FX layer (optional by CSS vars) -->
      <div class="premium-fx-layer"></div>
      <div class="paper-overlay"></div>

      <!-- free mode banner + dynamic mask -->
      <div class="banner">
        <div class="dynamic-mask"></div>
      </div>

      <!-- avatar -->
      <div class="avatar-wrap">
        <div class="avatar-circle">
          <img id="u-img" class="avatar" alt="個人照" />
        </div>
      </div>

      <!-- logo -->
      <div id="logoWrap" class="logo-wrap" style="display:none;">
        <img id="u-logo" class="logo-img" alt="Logo" />
      </div>

      <!-- scroll content -->
      <section class="info-scroll">
        <h1 id="u-name" class="name">載入中...</h1>
        <div id="u-unit" class="unit"></div>
        <div id="u-title" class="title"></div>

        <div id="u-slogan" class="slogan" style="display:none;"></div>

        <!-- v398 blocks (service / exp) -->
        <div id="v398-blocks">
          <div id="block-service" class="info-block" style="display:none;"></div>
          <div id="block-exp" class="info-block" style="display:none;"></div>
        </div>

        <!-- 影音 / 社群（獨立區塊，不混在聯繫區） -->
        <div id="mediaDock" class="contact-dock" style="display:none; margin-top:12px;">
          <div class="dock-buttons" id="mediaButtons"></div>
        </div>

        <!-- 聯繫 Dock（電話/Email/官網/導航/LINE/微信） -->
        <div id="contactDock" class="contact-dock" style="display:none;">
          <div class="dock-buttons" id="contactButtons"></div>
        </div>

        <!-- Photo wall -->
        <div id="photoWall" class="photo-wall" style="display:none;">
          <div id="photoGrid" class="photo-grid"></div>
        </div>

        <!-- version tag -->
        <div id="versionTag" class="version-tag "></div>
      </section>

    </div>
  </main><!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
  <script src="./app.js?v=400"></script>

  <!-- Service Worker (optional) -->
  <script>
    (function () {
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js?v=400").catch(function(){});
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
