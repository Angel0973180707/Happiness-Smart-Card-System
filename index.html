<!-- index.html (v400 COMPLETE OVERWRITE) -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Happiness Smart Card System v400</title>

  <!-- ✅ SEO (keep v399) -->
  <meta name="description" content="Happiness Smart Card System｜點擊查看專屬名片" />

  <!-- ✅ OG (keep v399; baseline fallback image; dynamic delivery uses share.html) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Happiness Smart Card System" />
  <meta property="og:description" content="點擊查看智慧名片" />
  <meta property="og:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />

  <!-- ✅ PWA -->
  <link rel="manifest" href="./manifest.json?v=400" />
  <meta name="theme-color" content="#111111" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=400" />
  <link rel="icon" href="./icons/icon-192.png?v=400" />

  <!-- ✅ Cache control (keep your no-cache strategy) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- ✅ Font (keep v399) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css?v=400" />
</head>

<body class="mode-free color-1 style-arch paper-1">
  <!-- ✅ 隱形後台入口（上方三連點） -->
  <div id="adminHotspotTop" aria-label="admin hotspot"></div>

  <main class="page">

    <!-- ===== Plan Zone ===== -->
    <section class="plan-zone">
      <div class="plan-title">先選方案</div>

      <div class="plan-buttons">
        <button id="btnPlanFree" class="plan-btn active" type="button"
          onclick="window.setV382 && window.setV382('free','color-1',this)">
          自由搭配款
        </button>
        <button id="btnPlanPremium" class="plan-btn" type="button"
          onclick="window.setV382 && window.setV382('premium','p1',this)">
          精品設計款
        </button>
      </div>

      <!-- FREE controls -->
      <div id="free-controls" class="controls">
        <div class="controls-row">
          <div class="controls-label">選顏色</div>
          <div id="freeDotsRow" class="dots-row">
            <button class="dot active" type="button"
              onclick="window.setV382 && window.setV382('free','color-1',this)" aria-label="color-1"></button>
            <button class="dot" type="button"
              onclick="window.setV382 && window.setV382('free','color-2',this)" aria-label="color-2"></button>
            <button class="dot" type="button"
              onclick="window.setV382 && window.setV382('free','color-3',this)" aria-label="color-3"></button>
            <button class="dot" type="button"
              onclick="window.setV382 && window.setV382('free','color-4',this)" aria-label="color-4"></button>
            <button class="dot" type="button"
              onclick="window.setV382 && window.setV382('free','color-5',this)" aria-label="color-5"></button>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-label">選版型</div>
          <div class="btn-row">
            <button class="btn-neo active" type="button"
              onclick="window.setV382Style && window.setV382Style('arch',this)">正拱</button>
            <button class="btn-neo" type="button"
              onclick="window.setV382Style && window.setV382Style('flat',this)">平直</button>
            <button class="btn-neo" type="button"
              onclick="window.setV382Style && window.setV382Style('dawn',this)">晨曦</button>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-label">選紙感</div>
          <div class="btn-row">
            <button class="btn-neo active" type="button"
              onclick="window.setV382Paper && window.setV382Paper('paper-1',this)">霧面棉紙</button>
            <button class="btn-neo" type="button"
              onclick="window.setV382Paper && window.setV382Paper('paper-2',this)">細顆粒紙</button>
            <button class="btn-neo" type="button"
              onclick="window.setV382Paper && window.setV382Paper('paper-3',this)">亞麻紋</button>
          </div>
        </div>
      </div>

      <!-- PREMIUM controls (keep hook; do NOT hard-hide; let JS control) -->
      <div class="controls premium-controls">
        <div class="controls-row">
          <div class="controls-label">精品色系</div>
          <div id="premiumDotsRow" class="dots-row">
            <button class="p-dot active" type="button"
              onclick="window.setV382 && window.setV382('premium','p1',this)" aria-label="p1"></button>
            <button class="p-dot" type="button"
              onclick="window.setV382 && window.setV382('premium','p2',this)" aria-label="p2"></button>
            <button class="p-dot" type="button"
              onclick="window.setV382 && window.setV382('premium','p3',this)" aria-label="p3"></button>
            <button class="p-dot" type="button"
              onclick="window.setV382 && window.setV382('premium','p4',this)" aria-label="p4"></button>
            <button class="p-dot" type="button"
              onclick="window.setV382 && window.setV382('premium','p5',this)" aria-label="p5"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Card Zone ===== -->
    <section id="card" class="card">
      <!-- Header -->
      <div class="card-head">
        <div class="avatar-wrap">
          <img id="u-img" alt="個人照" />
        </div>

        <div class="head-meta">
          <div id="u-name" class="u-name">載入中...</div>
          <div id="u-unit" class="u-unit"></div>
          <div id="u-title" class="u-title"></div>
        </div>

        <div id="logoWrap" class="logo-wrap" style="display:none;">
          <img id="u-logo" alt="Logo" />
        </div>
      </div>

      <!-- Slogan -->
      <div id="u-slogan" class="u-slogan" style="display:none;"></div>

      <!-- Blocks -->
      <div class="blocks">
        <div id="block-service" class="block"></div>
        <div id="block-exp" class="block"></div>

        <!-- ✅ v400 SocialBox（跳轉型展示層） -->
        <div id="socialBox" class="social-box" style="display:none;">
          <div class="block-title">影音社群平台 / 個人網頁</div>
          <div id="socialButtons" class="social-buttons"></div>
        </div>

        <!-- ✅ PhotoWall（純展示層） -->
        <div id="photoWall" class="photo-wall" style="display:none;">
          <div class="block-title">相片牆</div>
          <div id="photoGrid" class="photo-grid"></div>
        </div>
      </div>

      <div class="footer-row">
        <button class="mini-btn" type="button"
          onclick="window.copyCardUrl && window.copyCardUrl()">複製名片連結</button>
        <button class="mini-btn" type="button"
          onclick="window.goFillForm && window.goFillForm()">填寫表單</button>
        <div id="versionTag" class="version-tag">v400</div>
      </div>
    </section>
  </main>

  <!-- ✅ v400 Contact Dock（動作型聯繫層） -->
  <section id="contactDock" class="contact-dock" style="display:none;">
    <div id="contactButtons" class="dock-buttons"></div>
  </section>

  <!-- JS -->
  <script src="./app.js?v=400"></script>

  <!-- ✅ SW register (must) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=400").catch(() => {});
      });
    }
  </script>
</body>
</html>
