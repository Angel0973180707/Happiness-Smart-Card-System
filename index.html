index.html (v395 COMPLETE OVERWRITE)
========================= -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happiness Smart Card System v395</title>

  <link rel="manifest" href="./manifest.json?v=395" />
  <meta name="theme-color" content="#ee5253" />

  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=395" />
</head>

<body class="mode-free color-1 style-arch paper-1">

  <!-- ================= 前台：門面區 ================= -->
  <div id="admin-panel">

    <!-- 方案 A/B -->
    <div class="control-row plan-row">
      <button id="btnPlanFree" class="btn-neo pill active" type="button"
        onclick="window.setV382('free','color-1', this)">
        方案 A｜自由搭配
      </button>

      <button id="btnPlanPremium" class="btn-neo pill" type="button"
        onclick="window.setV382('premium','p1', this)">
        方案 B｜精品設計
      </button>
    </div>

    <!-- 步驟一 -->
    <div class="step-row">
      <div class="step-badge">步驟一</div>
      <div class="step-title">選擇方案</div>
    </div>

    <!-- 自由搭配：5 色點 -->
    <div class="dots-row">
      <div class="dot active" style="background:#ff5e5e" onclick="window.setV382('free', 'color-1', this)"></div>
      <div class="dot" style="background:#00a8ff" onclick="window.setV382('free', 'color-2', this)"></div>
      <div class="dot" style="background:#ffa502" onclick="window.setV382('free', 'color-3', this)"></div>
      <div class="dot" style="background:#7d5fff" onclick="window.setV382('free', 'color-4', this)"></div>
      <div class="dot" style="background:#2ecc71" onclick="window.setV382('free', 'color-5', this)"></div>
    </div>

    <!-- 自由搭配：版型 + 紙感 -->
    <div id="free-controls">
      <div class="control-row">
        <button class="btn-neo active" type="button" onclick="window.setV382Style('arch', this)">優雅正拱</button>
        <button class="btn-neo" type="button" onclick="window.setV382Style('flat', this)">簡潔平直</button>
        <button class="btn-neo" type="button" onclick="window.setV382Style('spot', this)">晨曦款</button>
      </div>

      <div class="control-row" style="margin-top:8px;">
        <button class="btn-neo active" type="button" onclick="window.setV382Paper('paper-1', this)">棉紙</button>
        <button class="btn-neo" type="button" onclick="window.setV382Paper('paper-2', this)">顆粒</button>
        <button class="btn-neo" type="button" onclick="window.setV382Paper('paper-3', this)">亞麻</button>
      </div>
    </div>

    <!-- 精品設計：色點 -->
    <div class="dots-row">
      <div class="p-dot" style="background:#a36d6d" onclick="window.setV382('premium', 'p1', this)"></div>
      <div class="p-dot" style="background:#722f37" onclick="window.setV382('premium', 'p2', this)"></div>
      <div class="p-dot" style="background:#1c2e42" onclick="window.setV382('premium', 'p3', this)"></div>
      <div class="p-dot" style="background:#5e548e" onclick="window.setV382('premium', 'p4', this)"></div>
      <div class="p-dot" style="background:#7a94a6" onclick="window.setV382('premium', 'p5', this)"></div>
      <div class="p-dot" style="background:#bf953f" onclick="window.setV382('premium', 'p6', this)"></div>
      <div class="p-dot" style="background:#444444" onclick="window.setV382('premium', 'p7', this)"></div>
    </div>

    <!-- 表單 CTA -->
    <button class="btn-cta" type="button" onclick="window.goFillForm()">立即預約訂製名片 →</button>
  </div>

  <!-- ================= 前台：樣品區（一定要顯示） ================= -->
  <div id="card-container" class="card">
    <div class="paper-overlay"></div>
    <div class="premium-fx-layer"></div>

    <div class="banner"><div class="dynamic-mask"></div></div>

    <div class="avatar-wrap">
      <div class="avatar-circle">
        <img id="u-img" src="" class="avatar" alt="形象照" />
      </div>
    </div>

    <!-- ✅ 卡片空間規劃：上固定、下可捲 -->
    <div class="info-scroll">

      <!-- A) 主資訊（固定） -->
      <div class="card-head">
        <h1 id="u-name" class="name">載入中...</h1>
        <div id="u-unit" class="unit">同步中...</div>
      </div>

      <!-- B) 內容區（可捲動） -->
      <div class="card-body" id="cardBody">

        <!-- ① 一句話/定位/標語 -->
        <div class="content-box" id="blk-tagline" style="display:none;">
          <div class="box-title">一句話</div>
          <div class="box-text" id="u-tagline"></div>
        </div>

        <!-- ② 服務項目/介紹 -->
        <div class="content-box" id="blk-service">
          <div class="box-title">服務介紹</div>
          <div class="box-text" id="u-service">正在同步雲端內容...</div>
        </div>

        <!-- ③ 照片輪播牆 -->
        <div class="content-box" id="blk-gallery" style="display:none;">
          <div class="box-title">作品照片</div>
          <div class="gallery-wrap" id="galleryWrap"></div>
          <div class="gallery-dots" id="galleryDots"></div>
        </div>

        <!-- ④ 聯繫區 -->
        <div class="content-box" id="blk-contact" style="display:none;">
          <div class="box-title">聯繫方式</div>
          <div class="contact-row" id="contactRow"></div>
        </div>

        <!-- ⑤ 地址 -->
        <div class="content-box" id="blk-address" style="display:none;">
          <div class="box-title">地址</div>
          <div class="addr" id="u-address"></div>
          <button class="btn-mini" id="btnNav" type="button">一鍵導航</button>
        </div>

        <!-- ⑥ 其餘欄位自動生成 -->
        <div id="blk-extra" class="extra-stack"></div>

      </div>
    </div>

    <!-- ✅ 後台隱形入口：長按 1.2s -->
    <div class="version-tag" id="versionTag">v395</div>
  </div>

  <footer id="footerTag" class="footer-mini">
    Happiness Smart Card System v395
  </footer>

  <script src="app.js?v=395"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=395')
          .then(reg => reg.update())
          .catch(()=>{});
      });
    }
  </script>
</body>
</html>
