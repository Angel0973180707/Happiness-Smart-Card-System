<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>天使幸福智慧名片 v377.1-clean</title>

<meta name="theme-color" content="#155e4b" />
<meta name="description" content="天使幸福智慧名片｜方案A自由款｜方案B精品款｜讀取小天使樣版" />

<link rel="manifest" href="./manifest.json?v=3771" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css?v=3771" />
</head>

<body>

<div class="app" id="app" data-plan="free" data-theme="arch">

<header class="top">
<div class="top__bg"></div>
<div class="top__inner">
<div class="brand">
<div class="brand__mark">A</div>
<div class="brand__txt">
<div class="brand__title">天使幸福智慧名片</div>
<div class="brand__sub">v377.1-clean｜讀取小天使樣版</div>
</div>
</div>
</div>
</header>

<main class="main">

<section class="card stepper">
<div class="stepper__row">
<div class="step is-done"><span class="step__no">1</span><span class="step__txt">API 連線</span></div>
<div class="step is-done"><span class="step__no">2</span><span class="step__txt">讀取試算表</span></div>
<div class="step"><span class="step__no">3</span><span class="step__txt">渲染名片</span></div>
</div>
<div class="hint" id="hint">門面資料讀取中…（小天使 TW0001）</div>
</section>

<section class="preview-wrap">

<div class="preview" id="preview">

<div class="phead">
<div class="avatar">
<img id="avatarImg" style="display:none;border-radius:50%;width:90px;height:90px;">
<div id="avatarFallback"></div>
</div>

<div class="pmeta">
<div class="pname" id="pname"></div>
<div class="ptitle" id="ptitle"></div>
</div>
</div>

<div class="pbody">
<div class="pblock">
<div class="pblock__title">一句話定位</div>
<div class="pblock__text" id="pone"></div>
</div>

<div class="pgrid">

<a class="pbtn" id="btnLine" style="display:none" target="_blank">
<span>💚 LINE 官方帳號</span>
</a>

<a class="pbtn" id="btnSite" style="display:none" target="_blank">
<span>🏠 官網入口</span>
</a>

<a class="pbtn" id="btnForm" style="display:none" target="_blank">
<span>📝 直接訂製填表</span>
</a>

</div>

<div id="platforms"></div>

</div>
</div>

</section>

</main>
</div>

<script>

/* ===== 新部署 API ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwALQLscdoompGvO3iphBgcgn3nYIhVfYghirifzu2PYBaeCZWWzSkw3SaGoJZRbKU/exec";

async function loadAngelCard(){

const hint = document.getElementById("hint");
hint.textContent = "門面資料讀取中…（小天使）";

try{

const res = await fetch(API_URL + "?action=angel&ts=" + Date.now());
const data = await res.json();

if(!data.ok || !data.item){
hint.textContent = "找不到小天使資料";
return;
}

const card = data.item;

/* === 對應妳試算表欄位 === */

const name = card["姓名（名片大標題）"] || "";
const unit = card["單位名稱（如：幸福教養概念館）"] || "";
const slogan = card["理念標語（顯示在照片下方，精簡有力）"] || "";
const avatar = card["個人專業形象照（名片主圖）"] || "";
const line = card["​LINE 官方帳號連結（綠色主按鈕）"] || "";
const youtube = card["影音平台 1（如：YouTube或其他連結）"] || "";
const form = card["私訊 LINE 連結（第一行填連結，換行填line名稱）"] || "";

/* 填資料 */

document.getElementById("pname").textContent = name;
document.getElementById("ptitle").textContent = unit;
document.getElementById("pone").textContent = slogan;

/* 頭像 */

if(avatar){
const img = document.getElementById("avatarImg");
img.src = avatar;
img.style.display = "block";
document.getElementById("avatarFallback").style.display = "none";
}

/* LINE */

if(line){
const btn = document.getElementById("btnLine");
btn.href = line;
btn.style.display = "block";
}

/* 官網 */

if(youtube){
const btn = document.getElementById("btnSite");
btn.href = youtube;
btn.style.display = "block";
}

/* 填表 */

if(form){
const btn = document.getElementById("btnForm");
btn.href = form;
btn.style.display = "block";
}

hint.textContent = "已成功讀取：小天使樣版";

}catch(err){
hint.textContent = "讀取失敗：" + err.message;
}

}

document.addEventListener("DOMContentLoaded", loadAngelCard);

</script>

</body>
</html>
