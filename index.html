<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幸福智慧名片 V382.7</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=382.7" />
</head>
<body class="mode-free color-1 style-arch paper-1">

  <div id="admin-panel">
    <div class="picker-section">
      <span class="section-label">🎨 自由搭配：亮色淨化款</span>
      <div class="dots-row">
        <div class="dot active" style="background:#ff5e5e" onclick="window.setV382('free', 'color-1', this)"></div>
        <div class="dot" style="background:#00a8ff" onclick="window.setV382('free', 'color-2', this)"></div>
        <div class="dot" style="background:#ffa502" onclick="window.setV382('free', 'color-3', this)"></div>
        <div class="dot" style="background:#7d5fff" onclick="window.setV382('free', 'color-4', this)"></div>
        <div class="dot" style="background:#2ecc71" onclick="window.setV382('free', 'color-5', this)"></div>
      </div>
      
      <div id="free-controls" class="panel-box-neo">
        <div class="control-row"><span class="row-tag">版型</span>
          <div class="btn-stack">
            <button class="btn-neo active" onclick="window.setV382Style('arch', this)">優雅正拱</button>
            <button class="btn-neo" onclick="window.setV382Style('flat', this)">簡潔平直</button>
            <button class="btn-neo" onclick="window.setV382Style('spot', this)">晨曦款</button>
          </div>
        </div>
        <div class="control-row"><span class="row-tag">紙感</span>
          <div class="btn-stack">
            <button class="btn-neo active" onclick="window.setV382Paper('paper-1', this)">霧面棉</button>
            <button class="btn-neo" onclick="window.setV382Paper('paper-2', this)">細顆粒</button>
            <button class="btn-neo" onclick="window.setV382Paper('paper-3', this)">亞麻紋</button>
            <button class="btn-neo" onclick="window.setV382Paper('paper-4', this)">水彩紙</button>
          </div>
        </div>
      </div>
    </div>

    <div class="picker-section">
      <span class="section-label">🌿 精品設計：氣質選區</span>
      <div class="dots-row">
        <div class="p-dot" style="background:#1a2f27" onclick="window.setV382('premium', 'p1', this)"></div>
        <div class="p-dot" style="background:#2c3e50" onclick="window.setV382('premium', 'p2', this)"></div>
        <div class="p-dot" style="background:#1a1a1a" onclick="window.setV382('premium', 'p7', this)"></div>
      </div>
    </div>
    <button class="btn-cta" onclick="window.goFillForm()">立即預約訂製名片 <i class="fa-solid fa-arrow-right"></i></button>
  </div>

  <div id="card-container" class="card">
    <div class="paper-overlay"></div>
    <div class="banner"><div class="dynamic-mask"></div></div>
    <div class="avatar-wrap">
      <div class="avatar-circle"><img id="u-img" src="" class="avatar" alt="形象照" /></div>
    </div>
    <div class="info-scroll">
      <h1 id="u-name" class="name">載入中...</h1>
      <div id="u-unit" class="unit">同步中...</div>
      <div class="content-box" style="text-align:center; font-weight:900; color:var(--p); cursor:pointer;" onclick="window.goFillForm()">立即填寫預約表單</div>
      <div class="content-box"><span class="label">服務項目</span><div id="u-service">載入中...</div></div>
    </div>
  </div>
  <script src="app.js?v=382.7"></script>
</body>
</html>
