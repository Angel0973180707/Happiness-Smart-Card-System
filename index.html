<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Angel｜選版參考</title>
  <meta name="theme-color" content="#0c2a16" />
  <link rel="stylesheet" href="./style.css?v=1" />
</head>

<body>
  <main class="wrap">
    <header class="hero">
      <div class="badge">先選版型 → 再填表</div>
      <h1>請先選一張喜歡的名片樣式（僅作參考）</h1>
      <p class="sub">
        這裡是「版型參考區」。<br/>
        <b>請記住你選的版型名稱</b>，下一步填表時需要填寫相同款式。
      </p>
    </header>

    <section class="cards" aria-label="版型選擇">
      <button class="card breathe" data-plan="精品設計款" type="button">
        <div class="card-top">
          <span class="tag premium">精品</span>
          <span class="hint">適合想要「整體感」與「設計一致性」</span>
        </div>
        <div class="card-title">精品設計款</div>
        <div class="card-desc">
          由我們協助統一視覺、版面與呈現節奏。<br/>
          你提供內容，我們做整體設計。
        </div>
      </button>

      <button class="card breathe" data-plan="自由搭配款" type="button">
        <div class="card-top">
          <span class="tag flex">自由</span>
          <span class="hint">適合想要「自己搭配」與「快速完成」</span>
        </div>
        <div class="card-title">自由搭配款</div>
        <div class="card-desc">
          你可依照喜好自由組合內容區塊。<br/>
          想保留彈性、快速上線很適合。
        </div>
      </button>
    </section>

    <section class="confirm" aria-live="polite">
      <div class="confirm-box">
        <div class="confirm-title">你目前選的是：</div>
        <div class="confirm-plan" id="chosenPlan">尚未選擇</div>
        <div class="confirm-note" id="chosenNote">
          請先點選上方其中一個版型（版型卡片會跳動提醒你）。
        </div>
      </div>
    </section>

    <section class="actions">
      <button id="btnNext" class="btn next disabled" type="button" aria-disabled="true">
        請先選一個版型 ↑
      </button>
      <button id="btnClear" class="btn ghost" type="button">
        清除選擇
      </button>
    </section>

    <footer class="foot">
      <div class="mini">
        小提醒：選版只是參考，<b>記住名稱</b> → 下一步表單要填一樣的款式。
      </div>
    </footer>
  </main>

  <script src="./app.js?v=1"></script>
</body>
</html>
