<!-- index.html (V387 COMPLETE OVERWRITE) -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幸福智慧名片 V387</title>

  <link rel="manifest" href="./manifest.json?v=387" />
  <meta name="theme-color" content="#ee5253" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=387" />
</head>

<body class="mode-free color-1 style-arch paper-1">

  <!-- ================= 门面控制区（保持 V385 逻辑） ================= -->
  <div id="admin-panel">

    <!-- ✅ 方案 A/B：方案 2（Badge） -->
    <div class="plan-row">
      <span class="step-badge">步驟一</span>
      <span class="step-title">選擇方案</span>
    </div>

    <div class="plan-buttons">
      <button id="btnPlanFree" type="button" class="btn-neo pill active">自由搭配款 A</button>
      <button id="btnPlanPremium" type="button" class="btn-neo pill">精品設計款 B</button>
    </div>

    <!-- 自由搭配款 dots（5色） -->
    <div class="dots-row" id="dotsFree">
      <div class="dot active" style="background:#ff5e5e" onclick="window.setV382('free','color-1',this)"></div>
      <div class="dot" style="background:#00a8ff" onclick="window.setV382('free','color-2',this)"></div>
      <div class="dot" style="background:#ffa502" onclick="window.setV382('free','color-3',this)"></div>
      <div class="dot" style="background:#7d5fff" onclick="window.setV382('free','color-4',this)"></div>
      <div class="dot" style="background:#2ecc71" onclick="window.setV382('free','color-5',this)"></div>
    </div>

    <!-- 自由款：版型/紙感 -->
    <div id="free-controls">
      <div class="control-row">
        <button class="btn-neo active" onclick="window.setV382Style('arch',this)">優雅正拱</button>
        <button class="btn-neo" onclick="window.setV382Style('flat',this)">簡潔平直</button>
        <button class="btn-neo" onclick="window.setV382Style('spot',this)">晨曦款</button>
      </div>
      <div class="control-row" style="margin-top:8px;">
        <button class="btn-neo active" onclick="window.setV382Paper('paper-1',this)">棉紙</button>
        <button class="btn-neo" onclick="window.setV382Paper('paper-2',this)">顆粒</button>
        <button class="btn-neo" onclick="window.setV382Paper('paper-3',this)">亞麻</button>
      </div>
    </div>

    <!-- ✅ 精品設計款 dots（按你指定順序） -->
    <div class="dots-row" id="dotsPremium" style="display:none;">
      <!-- p1 胭脂 -->
      <div class="p-dot" style="background:#a36d6d" onclick="window.setV382('premium','p1',this)"></div>
      <!-- p2 酒紅 -->
      <div class="p-dot" style="background:#722f37" onclick="window.setV382('premium','p2',this)"></div>
      <!-- p3 深藍 -->
      <div class="p-dot" style="background:#1c2e42" onclick="window.setV382('premium','p3',this)"></div>
      <!-- p4 霧紫 -->
      <div class="p-dot" style="background:#5e548e" onclick="window.setV382('premium','p4',this)"></div>
      <!-- p5 藍灰 -->
      <div class="p-dot" style="background:#7a94a6" onclick="window.setV382('premium','p5',this)"></div>
      <!-- p6 金箔 -->
      <div class="p-dot" style="background:#bf953f" onclick="window.setV382('premium','p6',this)"></div>
      <!-- p7 褐碳 -->
      <div class="p-dot" style="background:#444444" onclick="window.setV382('premium','p7',this)"></div>
    </div>

    <button class="btn-cta" onclick="window.goFillForm()">立即預約訂製名片 →</button>
  </div>

  <!-- ================= 样品区（保持你 V385 的门面/样品结构） ================= -->
  <div id="card-container" class="card">
    <div class="paper-overlay"></div>
    <div class="premium-fx-layer"></div>

    <!-- ✅ 自由款 banner：顏色變化只在 banner（CSS已鎖） -->
    <div class="banner"><div class="dynamic-mask"></div></div>

    <div class="avatar-wrap">
      <div class="avatar-circle">
        <img id="u-img" src="" class="avatar" alt="形象照" />
      </div>
    </div>

    <div class="info-scroll">
      <h1 id="u-name" class="name">載入中...</h1>
      <div id="u-unit" class="unit">同步中...</div>

      <div class="content-box cta-box" onclick="window.goFillForm()">
        立即填寫預約表單
      </div>

      <!-- 服務項目：會自動加「看全文」 -->
      <div id="u-service" class="content-box" style="font-size:13px; line-height:1.6;">正在同步雲端服務項目...</div>
    </div>

    <div class="version-tag">V387</div>
  </div>

  <footer class="footer">幸福智慧名片 V387</footer>

  <script src="app.js?v=387"></script>
</body>
</html>
