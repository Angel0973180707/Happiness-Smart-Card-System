<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happiness Smart Card System v4030</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json?v=4030" />
  <meta name="theme-color" content="#111318" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=4030" />
  <link rel="icon" href="./icons/icon-192.png?v=4030" />

  <!-- OG (static fallback; delivery uses admin OG preview image) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="幸福智慧名片" />
  <meta property="og:description" content="一點，就看見彼此的價值" />
  <meta property="og:image" content="og-card.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./style.css?v=4020" />
</head>

<body class="mode-free color-1 style-arch paper-1">
  <!-- Hidden admin hotspot (bottom-right triple tap) -->
  <div id="adminHotspotBR" aria-hidden="true"></div>

  <!-- ================= Control Panel (sticky) ================= -->
  <header id="admin-panel">
    <div class="panel-inner">

      <!-- Step 1: Plan -->
      <div class="plan-row" id="planRow">
        <button
          class="btn-neo pill breathe"
          data-group="plan"
          id="btnPlanFree"
          type="button"
          onclick="window.setPlan('free', this)"
        >
          自由搭配
        </button>
        <button
          class="btn-neo pill"
          data-group="plan"
          id="btnPlanPremium"
          type="button"
          onclick="window.setPlan('premium', this)"
        >
          精品設計
        </button>
      </div>

      <!-- Step 2A: Free controls -->
      <div class="controls-block" id="free-controls">
        <div class="section-title">選顏色</div>
        <div class="dots-row" id="freeDotsRow">
          <button class="dot dot-1 active" data-group="theme" type="button" aria-label="粉" onclick="window.setTheme('color-1', this)"></button>
          <button class="dot dot-2" data-group="theme" type="button" aria-label="藍" onclick="window.setTheme('color-2', this)"></button>
          <button class="dot dot-3" data-group="theme" type="button" aria-label="橘" onclick="window.setTheme('color-3', this)"></button>
          <button class="dot dot-4" data-group="theme" type="button" aria-label="紫" onclick="window.setTheme('color-4', this)"></button>
          <button class="dot dot-5" data-group="theme" type="button" aria-label="綠" onclick="window.setTheme('color-5', this)"></button>
        </div>

        <div class="section-title">選版型</div>
        <div class="btn-row" id="styleRow">
          <button class="btn-neo active" data-group="style" type="button" onclick="window.setStyle('arch', this)">正拱</button>
          <button class="btn-neo" data-group="style" type="button" onclick="window.setStyle('flat', this)">平直</button>
          <button class="btn-neo" data-group="style" type="button" onclick="window.setStyle('spot', this)">晨曦</button>
        </div>

        <div class="section-title">選紙感</div>
        <div class="btn-row" id="paperRow">
          <button class="btn-neo active" data-group="paper" type="button" onclick="window.setPaper('paper-1', this)">霧面棉紙</button>
          <button class="btn-neo" data-group="paper" type="button" onclick="window.setPaper('paper-2', this)">細顆粒紙</button>
          <button class="btn-neo" data-group="paper" type="button" onclick="window.setPaper('paper-3', this)">亞麻紋</button>
        </div>

        <button class="btn-cta breathe" id="btnLineCta" type="button" onclick="window.goLineIntro()">
          <i class="fa-brands fa-line"></i> LINE 官網｜了解預約
        </button>

        <button class="btn-cta subtle" id="btnFormCta" type="button" onclick="window.goFillForm()">
          <i class="fa-solid fa-pen-to-square"></i> 直接訂製｜填寫名片資料
        </button>

        <!-- NEW: share card -->
        <button class="btn-cta btn-share" id="btnShare" type="button">
          <i class="fa-solid fa-share-nodes"></i> 分享客戶名片
        </button>
      </div>

      <!-- Step 2B: Premium controls -->
      <div class="controls-block" id="premium-controls" style="display:none;">
        <div class="section-title">選底色</div>
        <div class="dots-row" id="premiumDotsRow">
          <button class="p-dot p1 active" data-group="theme" type="button" aria-label="p1" onclick="window.setTheme('p1', this)"></button>
          <button class="p-dot p2" data-group="theme" type="button" aria-label="p2" onclick="window.setTheme('p2', this)"></button>
          <button class="p-dot p3" data-group="theme" type="button" aria-label="p3" onclick="window.setTheme('p3', this)"></button>
          <button class="p-dot p4" data-group="theme" type="button" aria-label="p4" onclick="window.setTheme('p4', this)"></button>
          <button class="p-dot p5" data-group="theme" type="button" aria-label="p5" onclick="window.setTheme('p5', this)"></button>
          <button class="p-dot p6" data-group="theme" type="button" aria-label="p6" onclick="window.setTheme('p6', this)"></button>
          <button class="p-dot p7" data-group="theme" type="button" aria-label="p7" onclick="window.setTheme('p7', this)"></button>
        </div>

        <button class="btn-cta breathe" id="btnLineCtaPremium" type="button" onclick="window.goLineIntro()">
          <i class="fa-brands fa-line"></i> LINE 官網｜了解預約
        </button>

        <button class="btn-cta subtle" id="btnFormCtaPremium" type="button" onclick="window.goFillForm()">
          <i class="fa-solid fa-pen-to-square"></i> 直接訂製｜填寫名片資料
        </button>

        <!-- NEW: share card -->
        <button class="btn-cta btn-share" id="btnSharePremium" type="button" onclick="document.getElementById('btnShare')?.click()">
          <i class="fa-solid fa-share-nodes"></i> 分享智慧名片
        </button>
      </div>

    </div>
  </header>

  <!-- ================= Card Container ================= -->
  <main id="card-container">
    <section class="card" id="card">
      <div class="premium-fx-layer"></div>

      <div class="banner" id="banner">
        <div class="dynamic-mask"></div>
      </div>

      <div class="paper-overlay" id="paperOverlay"></div>

      <div class="avatar-wrap">
        <div class="avatar-circle">
          <img class="avatar" id="u-img" alt="個人照" />
        </div>
      </div>

      <div class="premium-badge" id="premiumBadge" style="display:none;">
        <span class="badge-dot"></span>
        <span class="badge-text">精品設計</span>
      </div>

      <div class="logo-wrap" id="logoWrap" style="display:none;">
        <img id="u-logo" class="logo-img" alt="Logo" />
      </div>

      <div class="info-scroll">
        <div class="name" id="u-name">載入中…</div>
        <div class="unit" id="u-unit"></div>
        <div class="title" id="u-title"></div>

        <div class="slogan" id="u-slogan" style="display:none;"></div>

        <div class="info-block" id="block-service" style="display:none;"></div>
        <div class="info-block" id="block-exp" style="display:none;"></div>

        <div class="contact-dock" id="mediaDock" style="display:none;">
          <div class="dock-title"><i class="fa-solid fa-clapperboard"></i> 影音／平台</div>
          <div class="dock-buttons" id="mediaButtons"></div>
        </div>

        <div class="contact-dock" id="contactDock" style="display:none;">
          <div class="dock-title"><i class="fa-solid fa-address-card"></i> 聯繫方式</div>
          <div class="dock-buttons" id="contactButtons"></div>
        </div>

        <div class="photo-wall" id="photoWall" style="display:none;">
          <div class="dock-title"><i class="fa-regular fa-images"></i> 照片</div>
          <div class="photo-grid" id="photoGrid"></div>
        </div>

        <div class="version-tag" id="versionTag">v4030</div>
      </div>
    </section>
  </main>

  <script src="./app.js?v=4030"></script>
</body>
</html>
