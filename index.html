<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幸福智慧名片 | 幸福教養概念館</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="mode-free color-1 style-arch paper-1">

  <div class="card-container">
    <img src="https://via.placeholder.com/60x60?text=Logo" id="u-logo" class="brand-logo" alt="Logo">

    <div class="hero-section">
      <div class="photo-frame">
        <img src="" id="u-img" class="profile-photo" alt="形象照">
      </div>
      <h1 id="u-name" class="user-name">載入中...</h1>
      <p id="u-unit" class="unit-name"></p>
      <div id="u-slogan" class="slogan-tag"></div>
    </div>

    <div class="content-section">
      <div class="section-title">核心服務</div>
      <div id="u-service" class="service-list"></div>
      
      <div id="u-slider" class="product-slider">
        </div>
    </div>

    <div class="action-grid">
      <a href="#" id="u-map" class="action-item" target="_blank">📍 導航</a>
      <a href="#" id="u-line" class="action-item">💬 LINE</a>
      <a href="#" id="u-yt" class="action-item" target="_blank">📺 影音</a>
      <a href="#" id="u-fb" class="action-item" target="_blank">👥 社群</a>
    </div>

    <footer class="footer">
      <p>© 幸福教養概念館 | 讓愛發揮力量</p>
      <div class="version-tag" onclick="triggerLock()">V385.8 旗艦版</div>
    </footer>
  </div>

  <div id="delivery-bar" class="admin-bar" style="display: none;">
    <input type="text" id="id-input" placeholder="客戶 ID (如 TW0001)">
    <button class="btn-admin" onclick="loadV385Data()">載入資料</button>
    <button class="btn-admin" onclick="copyUrl()">複製交貨網址</button>
  </div>

  <div id="free-controls" class="style-panel">
    <div class="color-picker">
      <div class="dot c1 active" onclick="setV382('free','color-1',this)"></div>
      <div class="dot c2" onclick="setV382('free','color-2',this)"></div>
      <div class="dot c3" onclick="setV382('free','color-3',this)"></div>
      <div class="dot c4" onclick="setV382('free','color-4',this)"></div>
      <div class="dot c5" onclick="setV382('free','color-5',this)"></div>
    </div>
    <div class="button-group">
      <button class="btn-neo active" onclick="setV382Style('arch', this)">拱形</button>
      <button class="btn-neo" onclick="setV382Style('flat', this)">平直</button>
      <button class="btn-neo" onclick="setV382Style('spot', this)">晨曦</button>
    </div>
    <div class="button-group">
      <button class="btn-neo active" onclick="setV382Paper('paper-1', this)">布紋</button>
      <button class="btn-neo" onclick="setV382Paper('paper-2', this)">磨砂</button>
    </div>
  </div>

  <div id="premium-controls" class="style-panel" style="display: none;">
    <div class="color-picker">
      <div class="p-dot p1" onclick="setV382('premium','p1',this)"></div>
      <div class="p-dot p2" onclick="setV382('premium','p2',this)"></div>
      <div class="p-dot p3" onclick="setV382('premium','p3',this)"></div>
      <div class="p-dot p4 active" onclick="setV382('premium','p4',this)"></div>
      <div class="p-dot p5" onclick="setV382('premium','p5',this)"></div>
      <div class="p-dot p6" onclick="setV382('premium','p6',this)"></div>
      <div class="p-dot p7" onclick="setV382('premium','p7',this)"></div>
    </div>
  </div>

  <div id="lock-mask" class="mask-layer" style="display: none;">
    <div class="lock-box">
      <h3>管理員驗證</h3>
      <input type="password" id="pass-input" placeholder="請輸入管理密碼">
      <div class="lock-btns">
        <button class="btn-verify" onclick="verifyLock()">驗證</button>
        <button class="btn-close" onclick="closeLock()">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
