<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happiness Smart Card System v399.6</title>

  <link rel="manifest" href="./manifest.json?v=3996" />
  <meta name="theme-color" content="#111111" />

  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=3996" />
  <link rel="icon" href="./icons/icon-192.png?v=3996" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./style.css?v=3996" />
</head>

<body class="mode-free color-1 style-arch paper-1">

  <!-- ===== Top: Plan ===== -->
  <header class="top">
    <div class="plan-row">
      <button id="btnPlanFree" class="plan-btn active" type="button"
        onclick="window.setV382('free','color-1', this)">方案 A｜自由搭配</button>

      <button id="btnPlanPremium" class="plan-btn" type="button"
        onclick="window.setV382('premium','pcolor-1', this)">方案 B｜精品設計</button>
    </div>

    <div id="free-controls" class="free-controls">
      <div class="step-title">步驟一｜選顏色</div>
      <div class="dots-row">
        <div class="dot active" title="粉" onclick="window.setV382('free','color-1', this)"></div>
        <div class="dot" title="酒紅" onclick="window.setV382('free','color-2', this)"></div>
        <div class="dot" title="深藍" onclick="window.setV382('free','color-3', this)"></div>
        <div class="dot" title="紫" onclick="window.setV382('free','color-4', this)"></div>
        <div class="dot" title="灰藍" onclick="window.setV382('free','color-5', this)"></div>
        <div class="dot" title="金" onclick="window.setV382('free','color-6', this)"></div>
        <div class="dot" title="黑" onclick="window.setV382('free','color-7', this)"></div>
      </div>

      <div class="step-title">步驟二｜選版型</div>
      <div class="btn-row style-buttons">
        <button class="btn-neo btn-style active" type="button" onclick="window.setV382Style('arch', this)" data-style="arch">正拱</button>
        <button class="btn-neo btn-style" type="button" onclick="window.setV382Style('flat', this)" data-style="flat">平直</button>
        <button class="btn-neo btn-style" type="button" onclick="window.setV382Style('dawn', this)" data-style="dawn">晨曦</button>
      </div>

      <div class="step-title">步驟三｜選紙感</div>
      <div class="btn-row paper-buttons">
        <button class="btn-neo btn-paper active" type="button" onclick="window.setV382Paper('paper-1', this)" data-paper="paper-1">霧面棉紙</button>
        <button class="btn-neo btn-paper" type="button" onclick="window.setV382Paper('paper-2', this)" data-paper="paper-2">細顆粒紙</button>
        <button class="btn-neo btn-paper" type="button" onclick="window.setV382Paper('paper-3', this)" data-paper="paper-3">亞麻紋</button>
      </div>
    </div>

    <button class="cta" type="button" onclick="window.goFillForm()">
      立即預約訂製名片 →
    </button>
  </header>

  <!-- ===== Preview Card ===== -->
  <main class="stage">
    <section class="card" id="card">

      <!-- floating share button -->
      <button id="btnShareCard" class="share-fab" type="button" aria-label="分享名片">
        <span class="share-icon"></span>
      </button>

      <!-- Premium header layout (also used by free, controlled by CSS) -->
      <div class="card-head">
        <div class="avatar-wrap">
          <img id="u-img" alt="個人照" />
        </div>

        <div class="name-wrap">
          <div id="u-name" class="name">載入中...</div>
          <div id="u-slogan" class="slogan"></div>
        </div>

        <div id="logoWrap" class="logo-wrap">
          <img id="u-logo" alt="Logo" />
        </div>
      </div>

      <!-- Unit/Title: fixed under avatar in premium, normal in free -->
      <div class="meta">
        <div id="u-unit" class="unit">同步中...</div>
        <div id="u-title" class="title"></div>
      </div>

      <!-- Blocks -->
      <div id="block-service" class="block"></div>
      <div id="block-exp" class="block"></div>

      <!-- Dock -->
      <div id="contactDock" class="dock">
        <div id="contactButtons" class="dock-buttons"></div>
      </div>

      <!-- Photo wall -->
      <div id="photoWall" class="photos">
        <div class="photos-title">照片</div>
        <div id="photoGrid" class="photo-grid"></div>
      </div>

      <div class="foot">
        <span id="versionTag" class="tag">v399.6</span>
        <span id="footerTag" class="tag">Happiness Smart Card System</span>
      </div>

      <!-- ✅ 隱形後台入口：右下角熱點（長按/三點） -->
      <div id="adminHotspot" class="admin-hotspot" aria-label="admin hotspot"></div>

    </section>
  </main>

  <script src="./app.js?v=3996"></script>
</body>
</html>
