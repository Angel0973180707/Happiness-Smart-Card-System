<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happiness Smart Card System v400</title>
  <meta name="description" content="Happiness Smart Card System｜點擊查看專屬名片" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Happiness Smart Card System" />
  <meta property="og:description" content="點擊查看智慧名片" />
  <meta property="og:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />
  
  <link rel="manifest" href="./manifest.json?v=400" />
  <meta name="theme-color" content="#ee5253" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=400" />
</head>

<body class="mode-free color-1 style-arch paper-1">

  <div id="adminHotspotTop" aria-label="admin-hotspot-top"></div>

  <div id="admin-panel">
    <div class="control-row" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; padding:10px 12px 4px;">
      <button id="btnPlanFree" class="btn-neo pill active" type="button" onclick="window.setV382('free','color-1', this)">
        方案 A｜自由搭配
      </button>
      <button id="btnPlanPremium" class="btn-neo pill" type="button" onclick="window.setV382('premium','p1', this)">
        方案 B｜精品設計
      </button>
    </div>

    <div class="dots-row" id="freeDotsRow">
      <div class="dot active" style="background:#ff5e5e" onclick="window.setV382('free', 'color-1', this)"></div>
      <div class="dot" style="background:#00a8ff" onclick="window.setV382('free', 'color-2', this)"></div>
      <div class="dot" style="background:#ffa502" onclick="window.setV382('free', 'color-3', this)"></div>
      <div class="dot" style="background:#7d5fff" onclick="window.setV382('free', 'color-4', this)"></div>
      <div class="dot" style="background:#2ecc71" onclick="window.setV382('free', 'color-5', this)"></div>
    </div>

    <div id="free-controls">
      <div class="control-row" style="display:flex; justify-content:center; gap:8px;">
        <button class="btn-neo active" type="button" onclick="window.setV382Style('arch', this)">優雅正拱</button>
        <button class="btn-neo" type="button" onclick="window.setV382Style('flat', this)">簡潔平直</button>
        <button class="btn-neo" type="button" onclick="window.setV382Style('spot', this)">晨曦款</button>
      </div>
      <div class="control-row" style="display:flex; justify-content:center; gap:8px; margin-top:8px;">
        <button class="btn-neo active" type="button" onclick="window.setV382Paper('paper-1', this)">棉紙</button>
        <button class="btn-neo" type="button" onclick="window.setV382Paper('paper-2', this)">顆粒</button>
        <button class="btn-neo" type="button" onclick="window.setV382Paper('paper-3', this)">亞麻</button>
      </div>
    </div>

    <div class="dots-row" id="premiumDotsRow" style="display:none;">
      <div class="p-dot" style="background:#a36d6d" onclick="window.setV382('premium', 'p1', this)"></div>
      <div class="p-dot" style="background:#722f37" onclick="window.setV382('premium', 'p2', this)"></div>
      <div class="p-dot" style="background:#1c2e42" onclick="window.setV382('premium', 'p3', this)"></div>
      <div class="p-dot" style="background:#5e548e" onclick="window.setV382('premium', 'p4', this)"></div>
      <div class="p-dot" style="background:#7a94a6" onclick="window.setV382('premium', 'p5', this)"></div>
      <div class="p-dot" style="background:#bf953f" onclick="window.setV382('premium', 'p6', this)"></div>
      <div class="p-dot" style="background:#444444" onclick="window.setV382('premium', 'p7', this)"></div>
    </div>

    <button class="btn-cta" type="button" onclick="window.goFillForm()">立即預約訂製名片 →</button>
  </div>

  <div id="card-container" class="card">
    <div class="paper-overlay"></div>
    <div class="premium-fx-layer"></div>

    <div class="banner">
      <div class="dynamic-mask"></div>
      <div id="u-unit-banner" class="unit-on-banner"></div>
    </div>

    <div class="logo-wrap" id="logoWrap">
      <img id="u-logo" class="logo-img" src="" alt="Logo" />
    </div>

    <div class="premium-header-row">
      <div class="p-avatar-box">
        <img id="u-img-premium" src="" class="avatar" alt="形象照" />
      </div>
      <div class="p-name-box">
        <h1 id="u-name-premium" class="name">載入中...</h1>
      </div>
    </div>

    <div class="avatar-wrap free-only">
      <div class="avatar-circle">
        <img id="u-img-free" src="" class="avatar" alt="形象照" />
      </div>
    </div>

    <div class="info-scroll">
      <div class="main-content-flow">
        
        <div class="identity-block">
          <h1 id="u-name-free" class="name free-only">載入中...</h1>
          <div id="u-unit-main" class="unit premium-only"></div>
          <div id="u-title" class="title"></div>
        </div>

        <div id="logo-mid-wrap" class="free-only logo-in-flow"></div>

        <div id="block-service" class="info-block"></div>

        <div id="block-exp" class="info-block"></div>

        <div id="photoWall" class="photo-wall">
          <div id="photoGrid" class="photo-grid"></div>
        </div>

        <div id="contactDock" class="contact-dock">
          <div id="socialButtons" class="dock-buttons"></div>
          <div id="contactButtons" class="dock-buttons" style="margin-top:10px;"></div>
          <div class="dock-buttons" style="margin-top:10px;">
            <button class="dock-btn share-btn" type="button" onclick="window.copyCardUrl && window.copyCardUrl()">
              <i class="fa-solid fa-share-nodes"></i>
              <span>分享名片</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="version-tag">v400</div>
  </div>

  <footer style="font-size:10px; color:#ccc; margin-top:12px; text-align:center;">
    Happiness Smart Card System v400
  </footer>

  <script src="app.js?v=400"></script>
</body>
</html>
