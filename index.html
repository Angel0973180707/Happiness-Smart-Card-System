  <!-- SAFE PATCH (HTML-only): guard CTA visibility + form mode helpers -->
  <style>
    /* ---- LINE / CTA visibility guard (in case CSS accidentally hides) ---- */
    #btnLineCta,
    #btnLineCtaPremium,
    #btnFormCta,
    #btnFormCtaPremium,
    #btnShare,
    #btnSharePremium {
      display: inline-flex !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* Avoid weird layout collapse if parent styles get altered */
    #free-controls,
    #premium-controls {
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* Form loader overlay (only used in form mode; inserted by SAFE script) */
    .safe-form-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 19, 24, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .safe-form-overlay .box {
      width: min(520px, 92vw);
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px 14px;
      color: rgba(255,255,255,0.92);
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .safe-form-overlay .spinner {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 3px solid rgba(255,255,255,0.18);
      border-top-color: rgba(255,255,255,0.75);
      margin: 0 auto 10px;
      animation: safeSpin 0.9s linear infinite;
    }
    @keyframes safeSpin { to { transform: rotate(360deg); } }
    .safe-form-overlay .hint {
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.76);
      line-height: 1.5;
    }
    .safe-form-overlay .row {
      display: flex;

      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .safe-form-overlay .btn {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.95);
      padding: 10px 12px;
      border-radius: 14px;

      cursor: pointer;

  <script src="./app.js?v=407"></script>

  <!-- ================= SAFE MODE SCRIPT (no app.js change) ================= -->
<script>
    (function () {
      "use strict";

      var VERSION = "407"; // unified

      // ---- helpers (scoped) ----
      function qs(id) { return document.getElementById(id); }

      function getParams_() {
        try { return new URLSearchParams(location.search || ""); }
        catch (e) { return new URLSearchParams(); }
      }

      function buildUrl_(mode, id) {
        var p = getParams_();
        if (id) p.set("id", id);
        if (mode) p.set("mode", mode);
        else p.delete("mode");

        var s = p.toString();
        return location.pathname + (s ? ("?" + s) : "");
      }

      function getId_() {
        var p = getParams_();
        return (p.get("id") || "").trim();
      }

      // ---- preserve original admin panel display ----
      var __adminPanelDisplay = null;

      function rememberAdminPanelDisplay_() {
        var adminPanel = qs("admin-panel");
        if (!adminPanel) return;
        if (__adminPanelDisplay === null) {
          // record computed display as baseline
          try {
            __adminPanelDisplay = getComputedStyle(adminPanel).display || "";
          } catch (e) {
            __adminPanelDisplay = "";
          }
        }
      }

      function restoreAdminPanelDisplay_() {
        var adminPanel = qs("admin-panel");
        if (!adminPanel) return;
        if (__adminPanelDisplay && __adminPanelDisplay !== "none") {
          adminPanel.style.display = __adminPanelDisplay;
        } else {
          adminPanel.style.display = "";
        }
      }

      // ---- form mount (created only once) ----
      var __formMounted = false;
      var __lastCardScrollTop = 0;

      function showOverlay_(on) {
        var ov = qs("safeFormOverlay");
        if (!ov) return;
        ov.style.display = on ? "flex" : "none";
        ov.setAttribute("aria-hidden", on ? "false" : "true");
      }

      function copyText_(t) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t);
            return true;
          }
        } catch (e) {}
        // fallback
        try {
          var ta = document.createElement("textarea");
          ta.value = t;
          ta.setAttribute("readonly", "readonly");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          ta.style.top = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch (e2) {}
        return false;
      }

      function mountFormOnce_() {
        if (__formMounted) return;

        var host = qs("form-container");
        if (!host) return;

        // Clear (just in case)
        host.innerHTML = "";

        // Sticky top bar (inline styles only; no CSS file changes)
        var bar = document.createElement("div");
        bar.setAttribute("role", "navigation");
        bar.style.position = "sticky";
        bar.style.top = "0";
        bar.style.zIndex = "999";
        bar.style.display = "flex";
        bar.style.alignItems = "center";
        bar.style.justifyContent = "space-between";
        bar.style.gap = "10px";
        bar.style.padding = "10px 12px";
        bar.style.background = "rgba(17, 19, 24, 0.92)";
        bar.style.backdropFilter = "blur(10px)";
        bar.style.webkitBackdropFilter = "blur(10px)";
        bar.style.borderBottom = "1px solid rgba(255,255,255,0.12)";

        var left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";
        left.style.gap = "10px";

        var btnBack = document.createElement("button");
        btnBack.type = "button";
        btnBack.textContent = "返回名片";
        btnBack.setAttribute("aria-label", "返回名片");
        btnBack.style.border = "1px solid rgba(255,255,255,0.18)";
        btnBack.style.background = "rgba(255,255,255,0.06)";
        btnBack.style.color = "#fff";
        btnBack.style.padding = "10px 12px";
        btnBack.style.borderRadius = "14px";
        btnBack.style.fontWeight = "800";
        btnBack.style.cursor = "pointer";
        btnBack.style.webkitTapHighlightColor = "transparent";
        btnBack.addEventListener("click", function () {
          setMode_("card");
        });

        var title = document.createElement("div");
        title.textContent = "填寫名片資料";
        title.style.color = "rgba(255,255,255,0.95)";
        title.style.fontWeight = "900";
        title.style.letterSpacing = "0.4px";

        left.appendChild(btnBack);
        left.appendChild(title);

        var right = document.createElement("div");
        right.style.display = "flex";
        right.style.alignItems = "center";
        right.style.gap = "10px";

        // Optional: show current id (non-invasive)
        var idNow = getId_();
        if (idNow) {
          var chip = document.createElement("div");
          chip.textContent = idNow;
          chip.style.color = "rgba(255,255,255,0.85)";
          chip.style.fontWeight = "800";
          chip.style.fontSize = "12px";
          chip.style.padding = "8px 10px";
          chip.style.borderRadius = "999px";
          chip.style.border = "1px solid rgba(255,255,255,0.14)";
          chip.style.background = "rgba(255,255,255,0.06)";
          right.appendChild(chip);
        }

        bar.appendChild(left);
        bar.appendChild(right);

        var frame = document.createElement("iframe");
        frame.setAttribute("title", "名片資料表單");
        frame.setAttribute("loading", "eager");
        frame.src = "./form.html?v=" + VERSION;
        frame.style.width = "100%";
        frame.style.height = "calc(100vh - 60px)";
        frame.style.border = "0";
        frame.style.display = "block";
        frame.style.background = "transparent";

        host.appendChild(bar);
        host.appendChild(frame);

        // overlay controls
        var retryBtn = qs("safeFormRetryBtn");
        if (retryBtn) {
          retryBtn.onclick = function () {
            try { frame.src = "./form.html?v=" + VERSION + "&ts=" + Date.now(); } catch (e) {}
            showOverlay_(true);
            // allow a short delay so WebView can start
            setTimeout(function(){ /* no-op */ }, 150);
          };
        }
        var copyBtn = qs("safeFormCopyBtn");
        if (copyBtn) {
          copyBtn.onclick = function () {
            copyText_(location.href);
            var hint = qs("safeFormHint");
            if (hint) hint.textContent = "已嘗試複製目前連結（若未成功，可長按網址列複製）。";
          };
        }

        // iframe load handling + fallback timeout
        var loaded = false;
        var t0 = Date.now();

        function markLoaded_() {
          if (loaded) return;
          loaded = true;
          showOverlay_(false);
        }

        frame.addEventListener("load", function () {
          markLoaded_();
        });

        // show overlay immediately for better webview stability
        showOverlay_(true);

        // If still not loaded after 8.5s, show fallback hint & buttons stay visible
        setTimeout(function () {
          if (loaded) return;
          var hint = qs("safeFormHint");
          if (hint) {
            var sec = Math.max(1, Math.round((Date.now() - t0) / 1000));
            hint.textContent = "載入較慢（" + sec + " 秒）— 可點「重新載入」或「複製連結」改用外部瀏覽器開啟。";
          }
          showOverlay_(true);
        }, 8500);

        __formMounted = true;
      }

      // ---- mode switch ----
      function applyMode_(mode) {
        var cardMain = qs("card-container");
        var adminPanel = qs("admin-panel");
        var formMain = qs("form-container");

        if (!cardMain || !adminPanel || !formMain) return;

        rememberAdminPanelDisplay_();

        if (mode === "form") {
          // save scroll so returning feels like an APP
          try { __lastCardScrollTop = (document.scrollingElement || document.documentElement).scrollTop || 0; } catch (e) {}
          mountFormOnce_();

          cardMain.style.display = "none";
          adminPanel.style.display = "none";
          formMain.style.display = "block";
          document.body.setAttribute("data-mode", "form");
          document.documentElement.classList.add("mode-form");
          document.documentElement.classList.remove("mode-card");
        } else {
          showOverlay_(false);

          formMain.style.display = "none";
          cardMain.style.display = "block";
          restoreAdminPanelDisplay_();
          document.body.setAttribute("data-mode", "card");
          document.documentElement.classList.add("mode-card");
          document.documentElement.classList.remove("mode-form");

          // restore scroll
          try {
            var se = (document.scrollingElement || document.documentElement);
            se.scrollTop = __lastCardScrollTop || 0;
          } catch (e2) {}
        }
      }

      function setMode_(mode) {
        var id = getId_();
        var nextMode = (mode === "form") ? "form" : ""; // "" means card mode (no mode param)
        var url = buildUrl_(nextMode, id);

        try {
          history.pushState({ mode: nextMode || "card" }, "", url);
        } catch (e) {
          // fallback: keep UI switch even if pushState fails
        }

        applyMode_(nextMode ? "form" : "card");
      }

      // ---- public hook (safe namespace-ish) ----
      window.__safeFormMode = window.__safeFormMode || {};
      window.__safeFormMode.setMode = setMode_;

      // ---- robust override goFillForm safely (no app.js edit) ----
      function safeGoFillForm_() {
        setMode_("form");
        return false;
      }

      // 1) attempt defineProperty lock (best)
      try {
        Object.defineProperty(window, "goFillForm", {
          configurable: true,
          enumerable: true,
          get: function () { return safeGoFillForm_; },
          set: function (_) {
            // swallow future overwrites to keep SAFE behavior stable
          }
        });
      } catch (e) {
        // 2) fallback: plain assignment
        window.goFillForm = safeGoFillForm_;
      }

      // 3) extra guard: after window load, re-apply once (in case app.js rewrote late)
      window.addEventListener("load", function () {
        try { window.goFillForm = safeGoFillForm_; } catch (e) {}
      });

      // keep reference if needed later
      window.__safeFormMode.__origGoFillForm = window.__safeFormMode.__origGoFillForm || null;

      // ---- ensure LINE CTA visible (in case runtime toggles it wrongly) ----
      function ensureLineCtaVisible_() {
        var a = qs("btnLineCta");
        if (a) { a.style.display = "inline-flex"; a.style.visibility = "visible"; a.style.opacity = "1"; }
        var b = qs("btnLineCtaPremium");
        if (b) { b.style.display = "inline-flex"; b.style.visibility = "visible"; b.style.opacity = "1"; }
      }

      // run early + after a short delay (some WebView apply CSS late)
      ensureLineCtaVisible_();
      setTimeout(ensureLineCtaVisible_, 300);
      setTimeout(ensureLineCtaVisible_, 1200);

      // ---- initial mode from URL ----
      function boot_() {
        var p = getParams_();
        var mode = (p.get("mode") || "").trim().toLowerCase();
        applyMode_(mode === "form" ? "form" : "card");
      }

      window.addEventListener("popstate", function () {
        // Back/forward should update UI
        var p = getParams_();
        var mode = (p.get("mode") || "").trim().toLowerCase();
        applyMode_(mode === "form" ? "form" : "card");
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot_, { once: true });
      } else {
        boot_();
      }
    })();
  </script>
