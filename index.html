<!-- ================================
 * Happiness Smart Card System
 * index.html v520 (COMPLETE OVERWRITE)
 *
 * Align:
 * - app.js v501 (your current)
 * - CTA split: Website CTA (top) + Private LINE CTA (bottom)
 * - Premium CTA reserved (placeholder)
 * - Paper names: 棉紙 / 象牙紙 / 霧灰  (replace old: 棉紙/顆粒/亞麻)
 * - Keep hidden admin hotspot (bottom-right triple tap)
 * - Keep ALL existing UI/feature behaviors (no feature removal)
 * ================================ -->
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Happiness Smart Card System｜智慧名片成品 v520</title>

  <!-- SEO / Share (basic) -->
  <meta name="description" content="Happiness Smart Card System｜智慧名片成品" />

  <!-- FontAwesome (icons) -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Your CSS (you said CSS already pasted) -->
  <link rel="stylesheet" href="style.css?v=520" />
</head>

<body class="mode-free color-1 style-arch paper-1">
  <!-- Top bar / Brand -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">智慧名片成品</div>
      <div class="brand-sub">HSC <span id="versionTag">v520</span></div>
    </div>

    <!-- ✅ CTA split (Facade actions) -->
    <div class="top-cta">
      <!-- Website CTA (NOT linked to LINE; separate) -->
      <button id="btnWebsiteCta" class="cta-btn cta-website" type="button">
        <i class="fa-solid fa-globe"></i>
        <span>官網</span>
      </button>

      <!-- Premium CTA reserved (placeholder, hidden by default) -->
      <button id="btnPremiumCta" class="cta-btn cta-premium" type="button" style="display:none;">
        <i class="fa-solid fa-crown"></i>
        <span>立即預約體驗</span>
      </button>
    </div>
  </header>

  <!-- Main card container -->
  <main class="wrap">
    <!-- Card -->
    <section class="card-shell">
      <!-- Banner (free mode only) -->
      <div id="banner" class="banner">
        <div class="banner-inner">
          <div class="banner-badge">Happiness Smart Card</div>
          <div class="banner-title">幸福智慧名片</div>
        </div>
      </div>

      <!-- Premium badge (optional, keep id for css hook) -->
      <div id="premiumBadge" class="premium-badge" style="display:none;">Premium</div>

      <!-- Paper overlay (free mode only) -->
      <div id="paperOverlay" class="paper-overlay" aria-hidden="true"></div>

      <!-- Profile row -->
      <div class="profile">
        <div class="avatar-wrap">
          <img id="u-img" class="avatar" alt="個人照" />
        </div>

        <div class="profile-meta">
          <div class="name-row">
            <div class="name" id="u-name">載入中...</div>

            <!-- Logo -->
            <div id="logoWrap" class="logo-wrap" style="display:none;">
              <img id="u-logo" class="logo" alt="Logo" />
            </div>
          </div>

          <div class="unit" id="u-unit"></div>
          <div class="title" id="u-title"></div>
          <div class="slogan" id="u-slogan" style="display:none;"></div>
        </div>
      </div>

      <!-- Content blocks -->
      <div id="block-service" class="info-block" style="display:none;"></div>
      <div id="block-exp" class="info-block" style="display:none;"></div>

      <!-- Media/Social dock (JS may mount/replace; keep ids) -->
      <div id="mediaDock" class="info-block" style="display:none;">
        <div class="block-title-row">
          <div class="block-title">影音 / 社群</div>
        </div>
        <div id="mediaButtons" class="dock"></div>
      </div>

      <!-- Contact dock -->
      <div id="contactDock" class="info-block" style="display:none;">
        <div class="block-title-row">
          <div class="block-title">聯繫方式</div>
        </div>
        <div id="contactButtons" class="dock"></div>
      </div>

      <!-- Photo wall -->
      <div id="photoWall" class="info-block" style="display:none;">
        <div class="block-title-row">
          <div class="block-title">照片牆</div>
        </div>
        <div id="photoGrid" class="photo-grid"></div>
      </div>

      <!-- ✅ Future modules mount -->
      <div id="modulesMount" class="modules-mount" style="display:none;"></div>
    </section>

    <!-- Controls (Facade: plan/theme/style/paper) -->
    <section class="controls">
      <!-- Plan -->
      <div class="ctrl-card">
        <div class="ctrl-title">方案</div>
        <div class="ctrl-row">
          <button id="btnPlanFree" class="ctrl-btn breathe active" data-group="plan" type="button"
            onclick="window.setPlan('free', this)">
            自由搭配
          </button>
          <button id="btnPlanPremium" class="ctrl-btn" data-group="plan" type="button"
            onclick="window.setPlan('premium', this)">
            精品設計
          </button>
        </div>
      </div>

      <!-- Theme / Color -->
      <div class="ctrl-card">
        <div class="ctrl-title">顏色</div>

        <!-- Free colors (c1~c5) -->
        <div id="free-controls" class="ctrl-stack">
          <div class="ctrl-row dots">
            <button class="dot dot-c1 active" data-group="theme" type="button" aria-label="c1 粉"
              onclick="window.setTheme('color-1', this)"></button>
            <button class="dot dot-c2" data-group="theme" type="button" aria-label="c2 藍"
              onclick="window.setTheme('color-2', this)"></button>
            <button class="dot dot-c3" data-group="theme" type="button" aria-label="c3 橘"
              onclick="window.setTheme('color-3', this)"></button>
            <button class="dot dot-c4" data-group="theme" type="button" aria-label="c4 紫"
              onclick="window.setTheme('color-4', this)"></button>
            <button class="dot dot-c5" data-group="theme" type="button" aria-label="c5 綠"
              onclick="window.setTheme('color-5', this)"></button>
          </div>

          <!-- Style -->
          <div class="ctrl-title small">版型</div>
          <div class="ctrl-row">
            <button class="ctrl-btn active" data-group="style" type="button"
              onclick="window.setStyle('arch', this)">正拱</button>
            <button class="ctrl-btn" data-group="style" type="button"
              onclick="window.setStyle('flat', this)">平直</button>
            <button class="ctrl-btn" data-group="style" type="button"
              onclick="window.setStyle('spot', this)">晨曦</button>
          </div>

          <!-- Paper (✅ renamed) -->
          <div class="ctrl-title small">紙感</div>
          <div class="ctrl-row">
            <button class="ctrl-btn active" data-group="paper" type="button"
              onclick="window.setPaper('paper-1', this)">棉紙</button>
            <button class="ctrl-btn" data-group="paper" type="button"
              onclick="window.setPaper('paper-2', this)">象牙紙</button>
            <button class="ctrl-btn" data-group="paper" type="button"
              onclick="window.setPaper('paper-3', this)">霧灰</button>
          </div>
        </div>

        <!-- Premium colors (p1~p7) -->
        <div id="premium-controls" class="ctrl-stack" style="display:none;">
          <div class="ctrl-row dots">
            <button class="dot dot-p1 active" data-group="theme" type="button" aria-label="p1 胭脂紅"
              onclick="window.setTheme('p1', this)"></button>
            <button class="dot dot-p2" data-group="theme" type="button" aria-label="p2 酒紅"
              onclick="window.setTheme('p2', this)"></button>
            <button class="dot dot-p3" data-group="theme" type="button" aria-label="p3 深藍"
              onclick="window.setTheme('p3', this)"></button>
            <button class="dot dot-p4" data-group="theme" type="button" aria-label="p4 霧紫"
              onclick="window.setTheme('p4', this)"></button>
            <button class="dot dot-p5" data-group="theme" type="button" aria-label="p5 藍灰"
              onclick="window.setTheme('p5', this)"></button>
            <button class="dot dot-p6" data-group="theme" type="button" aria-label="p6 金箔"
              onclick="window.setTheme('p6', this)"></button>
            <button class="dot dot-p7" data-group="theme" type="button" aria-label="p7 褐碳"
              onclick="window.setTheme('p7', this)"></button>
          </div>

          <div class="ctrl-hint">
            精品方案版型與紙感由設計統一控管（此處僅作色系預覽）
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom fixed CTA (✅ private LINE separate from website) -->
  <nav class="bottom-cta">
    <button id="btnPrivateLine" class="bottom-btn" type="button" onclick="window.goLineIntro()">
      <i class="fa-brands fa-line"></i>
      <span>私訊 LINE</span>
    </button>

    <!-- This is the "locked/open" CTA used by app.js showLockedUi_ -->
    <button id="btnContactOpen" class="bottom-btn alt" type="button" onclick="window.goFillForm()">
      <i class="fa-solid fa-headset"></i>
      <span>聯繫開通</span>
    </button>
  </nav>

  <!-- Hidden admin hotspot (bottom-right triple tap) -->
  <div id="adminHotspotBR" aria-label="admin hotspot" title=""
    style="position:fixed;right:0;bottom:0;width:54px;height:54px;opacity:0.001;z-index:999997;"></div>

  <!-- app.js (your v501) -->
  <script src="app.js?v=520"></script>

  <!-- small glue: website CTA uses payload if available; otherwise shows hint -->
  <script>
    (function(){
      const btn = document.getElementById("btnWebsiteCta");
      if(!btn) return;

      btn.addEventListener("click", function(){
        try{
          // currentRow is in app.js scope (not global); so we do a best-effort:
          // 1) try read from contact dock "官網" if rendered
          // 2) fallback: open homepage hub (optional) or alert
          const mediaBtns = document.getElementById("mediaButtons");
          if(mediaBtns){
            // find first "官網" button
            const candidates = Array.from(mediaBtns.querySelectorAll(".dock-btn"));
            const webBtn = candidates.find(b => (b.textContent || "").includes("官網"));
            if(webBtn){
              webBtn.click();
              return;
            }
          }
        }catch(e){}

        alert("⚠️ 這張名片尚未提供官網連結（或尚未載入完成）");
      });
    })();
  </script>
</body>
</html>
