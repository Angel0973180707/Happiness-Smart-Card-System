<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>幸福智慧名片 V385 旗艦版</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=385">
</head>
<body class="mode-free color-1 style-arch paper-1">

  <div id="admin-panel">
    <div class="dots-row">
      <div class="dot active" style="background:#ff5e5e" onclick="window.setV382('free', 'color-1', this)"></div>
      <div class="dot" style="background:#00a8ff" onclick="window.setV382('free', 'color-2', this)"></div>
      <div class="dot" style="background:#ffa502" onclick="window.setV382('free', 'color-3', this)"></div>
      <div class="dot" style="background:#7d5fff" onclick="window.setV382('free', 'color-4', this)"></div>
      <div class="dot" style="background:#2ecc71" onclick="window.setV382('free', 'color-5', this)"></div>
    </div>
    
    <div id="free-controls">
      <div class="control-row" style="display:flex; justify-content:center; gap:8px;">
        <button class="btn-neo active" onclick="window.setV382Style('arch', this)">優雅正拱</button>
        <button class="btn-neo" onclick="window.setV382Style('flat', this)">簡潔平直</button>
        <button class="btn-neo" onclick="window.setV382Style('spot', this)">晨曦款</button>
      </div>
      <div class="control-row" style="display:flex; justify-content:center; gap:8px; margin-top:8px;">
        <button class="btn-neo active" onclick="window.setV382Paper('paper-1', this)">棉紙</button>
        <button class="btn-neo" onclick="window.setV382Paper('paper-2', this)">顆粒</button>
        <button class="btn-neo" onclick="window.setV382Paper('paper-3', this)">亞麻</button>
      </div>
    </div>

    <div class="dots-row">
      <div class="p-dot" style="background:#722f37" onclick="window.setV382('premium', 'p1', this)"></div> 
      <div class="p-dot" style="background:#bf953f" onclick="window.setV382('premium', 'p4', this)"></div> 
      </div>
  </div>

  <div id="lock-mask" class="lock-mask" style="display:none;">
    <div class="lock-box">
      <h3 style="margin:0 0 15px">系統解鎖</h3>
      <input type="password" id="pass-input" placeholder="請輸入管理密碼">
      <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
        <button onclick="verifyLock()" class="btn-black">解鎖</button>
        <button onclick="closeLock()">取消</button>
      </div>
    </div>
  </div>

  <div id="delivery-bar" class="delivery-bar" style="display:none;">
    <input type="text" id="id-input" placeholder="輸入 ID 載入成品">
    <button onclick="loadV385Data()">載入</button>
    <button onclick="copyUrl()" style="background:#2ecc71; color:#fff;">複製交貨網址</button>
  </div>

  <div id="card-container" class="card">
    <div class="paper-overlay"></div>
    <div class="premium-fx-layer"></div>
    <div class="banner"><div class="dynamic-mask"></div></div>
    
    <div class="avatar-wrap">
      <div class="avatar-circle">
        <img id="u-img" src="" class="avatar" alt="形象照" />
      </div>
    </div>

    <div class="info-scroll">
      <h1 id="u-name" class="name">載入中...</h1>
      <div id="u-unit" class="unit">同步中...</div>
      <div id="u-slogan" style="font-size:12px; opacity:0.7; margin:10px 0;">您的理念標語</div>
      
      <div id="u-titles" style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; justify-content:inherit;"></div>

      <div id="u-service" class="content-box" style="font-size:13px; line-height:1.6;">正在讀取服務項目...</div>

      <div class="product-slider" id="u-slider"></div>

      <a id="u-line-oa" href="#" class="btn-main-line" target="_blank">LINE 官方帳號連結</a>
      <div class="action-grid">
        <a id="u-call" class="btn-icon"><i class="fa-solid fa-phone"></i></a>
        <a id="u-map" class="btn-icon" target="_blank"><i class="fa-solid fa-location-dot"></i></a>
        <a id="u-yt" class="btn-icon" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        <a id="u-fb" class="btn-icon" target="_blank"><i class="fa-brands fa-facebook"></i></a>
      </div>

      <div id="u-qa-area" style="margin-top:20px;"></div>
    </div>

    <div class="version-tag" onclick="triggerLock()">V385</div>
  </div>

  <footer style="font-size: 10px; color: #ccc; margin-top: 20px; text-align: center;">版權所有</footer>

  <script src="app.js?v=385"></script>
</body>
</html>
