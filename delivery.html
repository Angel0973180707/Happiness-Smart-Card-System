<!-- ==========================================
 * HSC Delivery Link Card — delivery.html v514 (COMPLETE OVERWRITE)
 * Purpose:
 * - A “shareable link card” page for delivery (customer-friendly)
 * - Shows name/unit/title preview + one big button to open the smart card
 * - Uses root og-card.png as OG image (you already uploaded it)
 *
 * URL:
 * - delivery.html?id=TW0001
 *
 * Notes:
 * - OG meta cannot be truly dynamic on GitHub Pages static hosting.
 * - Page content (name/unit/title) is fetched client-side from GAS.
 * ========================================== -->
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>智慧名片交付卡｜HSC</title>
  <meta name="description" content="點開即可查看你的智慧名片（交付卡）" />
  <meta name="theme-color" content="#0b1220" />

  <!-- OG (static preview image in repo root) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="智慧名片交付卡" />
  <meta property="og:description" content="點開即可查看你的智慧名片" />
  <meta property="og:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />

  <style>
    :root{
      --bg:#0b1220;
      --card:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.70);
      --soft:rgba(255,255,255,.08);
      --btn:rgba(255,255,255,.10);
      --btn2:rgba(255,255,255,.16);
      --accent:#7bdcff;
      --danger:#ff6b6b;

      --r:20px;
      --shadow:0 16px 46px rgba(0,0,0,.38);

      --fs: clamp(15px, 1.7vw, 18px);
      --fs2: clamp(18px, 2.6vw, 22px);
      --fs3: clamp(22px, 3.2vw, 30px);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(1200px 900px at 18% -10%, rgba(123,220,255,.16), transparent 60%),
        radial-gradient(1000px 800px at 85% 10%, rgba(255,170,90,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      font-family:"Noto Sans TC", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      font-size:var(--fs);
      letter-spacing:.2px;
      word-break: keep-all;
    }

    .wrap{
      width:min(860px, 100%);
      margin:0 auto;
      padding:16px 14px 90px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 14px;
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(11,18,32,.78);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
    }

    .brand{
      font-weight:900;
      letter-spacing:.6px;
      font-size: var(--fs2);
      line-height:1.15;
    }
    .sub{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .card{
      margin-top:14px;
      padding:16px;
      border-radius: var(--r);
      background: var(--card);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-weight:900;
      font-size:12px;
    }

    .hero{
      margin-top:12px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
    }

    .name{
      font-size: var(--fs3);
      font-weight: 1000;
      letter-spacing:.8px;
      line-height:1.15;
      margin: 0;
    }
    .title{
      margin-top:8px;
      font-weight: 900;
      font-size: 16px;
      color: rgba(255,255,255,.90);
    }
    .unit{
      margin-top:4px;
      font-weight: 800;
      font-size: 13px;
      color: rgba(255,255,255,.70);
    }

    .hint{
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .actions{
      margin-top: 14px;
      display:flex;
      gap:10px;
      flex-wrap: wrap;
      align-items:center;
    }

    .btn{
      all: unset;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--btn);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      font-weight: 1000;
      letter-spacing:.3px;
      transition: transform .12s ease, background .12s ease;
    }
    .btn:hover{ background: var(--btn2); transform: translateY(-1px); }
    .btn.primary{
      background: rgba(123,220,255,.20);
      border-color: rgba(123,220,255,.30);
      box-shadow: 0 0 0 6px rgba(123,220,255,.06);
    }
    .btn.primary:hover{
      background: rgba(123,220,255,.26);
      transform: translateY(-1px);
    }
    .btn.small{
      padding:10px 14px;
      font-weight:900;
      letter-spacing:.2px;
    }

    .divider{
      height:1px;
      background: rgba(255,255,255,.08);
      margin: 14px 0;
    }

    .kv{
      display:grid;
      grid-template-columns: 108px 1fr;
      gap: 8px 12px;
      padding-top: 2px;
    }
    .k{
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .v{
      font-weight: 900;
    }

    .status{
      margin-top: 10px;
      color: rgba(255,255,255,.75);
      font-weight: 900;
      font-size: 12px;
      min-height: 18px;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      font-weight: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .tiny{
      margin-top: 14px;
      color: rgba(255,255,255,.56);
      font-size: 12px;
      line-height: 1.7;
    }

    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    .spinner{
      width: 16px; height:16px;
      border-radius:999px;
      border: 2px solid rgba(255,255,255,.26);
      border-top-color: rgba(123,220,255,.95);
      animation: spin 1s linear infinite;
      display:inline-block;
      vertical-align: middle;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    .hide{ display:none !important; }
  </style>
</head>

<body>
  <div class="topbar">
    <div>
      <div class="brand">智慧名片交付卡</div>
      <div class="sub">點開即可查看智慧名片</div>
    </div>
    <div class="badge"><span class="spinner" id="spin"></span><span id="badgeText">載入中…</span></div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="badge">交付資訊</div>

      <div class="hero">
        <h1 class="name" id="name">—</h1>
        <div class="title" id="title">—</div>
        <div class="unit" id="unit">—</div>

        <div class="actions">
          <button class="btn primary" id="openCardBtn">開啟智慧名片</button>
          <button class="btn small" id="copyCardBtn">複製名片連結</button>
          <button class="btn small" id="copyDeliveryBtn">複製交付卡連結</button>
        </div>

        <div class="hint" id="hint">
          這張交付卡適合直接轉發給客戶（LINE / FB 會顯示預覽圖）。<br/>
          如需「微信長圖（加購）」請由客服開通。
        </div>

        <div class="status" id="statusLine"></div>
      </div>

      <div class="divider"></div>

      <div class="kv">
        <div class="k">卡片 ID</div><div class="v mono" id="kvId">—</div>
        <div class="k">狀態</div><div class="v" id="kvStatus">—</div>
        <div class="k">方案</div><div class="v" id="kvPlan">—</div>
        <div class="k">外觀</div><div class="v" id="kvTheme">—</div>
      </div>

      <div class="tiny">
        提醒：交付卡可安全公開分享；若名片狀態為 <span class="mono">inactive</span>，可能需要管理端開通後才能完整顯示。
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ===== delivery.js inline (v514) ===== */

    const CONFIG = {
      BASE_URL: "https://angel0973180707.github.io/Happiness-Smart-Card-System/",
      GAS_URL: "https://script.google.com/macros/s/AKfycbycjN-ooacgi-K-uGUTZeWUwfmjHFI_JeESbM2SEGnjFsk0TPBuUY71bW-1AYAMI-E/exec",
      DEFAULT_TENANT: "angel",
      FETCH_TIMEOUT_MS: 12000
    };

    const $ = (s)=>document.querySelector(s);

    function toast(msg){
      const el = $("#toast");
      if(!el) return alert(msg);
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(()=> el.classList.remove("show"), 2200);
    }

    function copyText(text){
      const t = (text||"").trim();
      if(!t) return toast("沒有可複製的內容");
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(()=>toast("已複製 ✅"), ()=>fallbackCopy(t));
      }else fallbackCopy(t);
    }

    function fallbackCopy(t){
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); toast("已複製 ✅"); }
      catch(_e){ alert("複製失敗，請手動複製：\n"+t); }
      document.body.removeChild(ta);
    }

    function getQS(){
      const u = new URL(location.href);
      return {
        id: (u.searchParams.get("id") || "").trim().toUpperCase(),
        tenant: (u.searchParams.get("tenant") || CONFIG.DEFAULT_TENANT).trim() || CONFIG.DEFAULT_TENANT,
        token: (u.searchParams.get("token") || "").trim()  // optional (if you want to pass)
      };
    }

    function buildUrl(path, params={}){
      const u = new URL(path, CONFIG.BASE_URL);
      Object.entries(params).forEach(([k,v])=>{
        if(v===undefined || v===null || v==="") return;
        u.searchParams.set(k, String(v));
      });
      return u.toString();
    }

    async function fetchWithTimeout(url){
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
      try{
        const res = await fetch(url, { method:"GET", mode:"cors", cache:"no-store", signal: ctrl.signal });
        return res;
      }finally{
        clearTimeout(t);
      }
    }

    async function gasGet(params){
      const u = new URL(CONFIG.GAS_URL);
      Object.entries(params).forEach(([k,v])=>{
        if(v===undefined || v===null || v==="") return;
        u.searchParams.set(k, String(v));
      });
      const res = await fetchWithTimeout(u.toString());
      const txt = await res.text();
      let json;
      try{ json = JSON.parse(txt); }
      catch(_e){ throw new Error("GAS 回傳不是 JSON：" + txt.slice(0, 180)); }
      if(!json || json.ok !== true) throw new Error(json.error || "GAS error");
      return json;
    }

    function setBadge(text, done=false){
      $("#badgeText").textContent = text;
      $("#spin").classList.toggle("hide", !!done);
    }

    function setStatus(msg){
      $("#statusLine").textContent = msg || "";
    }

    function renderCardMeta(item, id){
      const name = (item?.name || "").trim() || "智慧名片";
      const title = (item?.title || "").trim() || "點開即可查看";
      const unit  = (item?.unit  || "").trim() || "";

      $("#name").textContent = name;
      $("#title").textContent = title;
      $("#unit").textContent  = unit;

      $("#kvId").textContent = id || "-";
      $("#kvStatus").textContent = (item?.status || "-");
      $("#kvPlan").textContent = (item?.plan || "-");

      const theme = (() => {
        if((item?.plan||"") === "premium"){
          return (item?.premium_color || "premium");
        }
        const a = [item?.color, item?.style, item?.paper].map(v => (v||"").trim()).filter(Boolean);
        return a.length ? a.join("/") : "-";
      })();
      $("#kvTheme").textContent = theme;
    }

    async function boot(){
      const qs = getQS();
      if(!qs.id){
        setBadge("缺少 id", true);
        renderCardMeta(null, "-");
        setStatus("請用：delivery.html?id=TW0001");
        $("#openCardBtn").disabled = true;
        return;
      }

      const cardLink = buildUrl("index.html", { id: qs.id });
      const deliveryLink = buildUrl("delivery.html", { id: qs.id });

      $("#openCardBtn").addEventListener("click", ()=> window.location.href = cardLink);
      $("#copyCardBtn").addEventListener("click", ()=> copyText(cardLink));
      $("#copyDeliveryBtn").addEventListener("click", ()=> copyText(deliveryLink));

      // Load data
      try{
        setBadge("讀取名片資料…");
        setStatus("正在讀取名片資料…");

        // Try admin-like (token optional). If inactive requires token, passing token helps.
        const params = { action:"card", id: qs.id, tenant: qs.tenant };
        if(qs.token) params.token = qs.token;

        const r = await gasGet(params);
        const item = r.item || r.data || r.card || null;

        renderCardMeta(item, qs.id);

        const st = (item?.status || "").toLowerCase();
        if(st && st !== "active"){
          setStatus("狀態提醒：目前為 " + st + "（若顯示不完整，請由管理端開通）");
        }else{
          setStatus("就緒 ✅");
        }
        setBadge("就緒 ✅", true);
      }catch(e){
        // still render minimal
        renderCardMeta(null, qs.id);
        setBadge("讀取失敗", true);
        setStatus("讀取失敗：" + (e?.message || String(e)));
      }
    }

    boot();
  </script>
</body>
</html>
