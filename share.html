<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>天使幸福智慧名片</title>
  <meta name="description" content="一點，就看見彼此的價值" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="天使幸福智慧名片" />
  <meta property="og:description" content="一點，就看見彼此的價值" />
  <meta property="og:image" content="./og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="./og-card.png" />

  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#0b0b0b;color:#fff;}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;}
    .card{width:min(560px,100%);text-align:center}
    img{width:100%;height:auto;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.55);display:block}
    .hint{margin-top:12px;opacity:.85;font-weight:700}
    a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <a id="goLink" href="./index.html"><img src="./og-card.png" alt="名片預覽" /></a>
      <div class="hint">點圖進入名片</div>
    </div>
  </div>

  <script>
    (function(){
      try{
        var u = new URL(location.href);
        var id = (u.searchParams.get("id") || "").trim();
        var go = new URL("./index.html", u);
        if(id) go.searchParams.set("id", id);
        document.getElementById("goLink").href = go.toString();
      }catch(e){}
    })();
  </script>
</body>
</html>
