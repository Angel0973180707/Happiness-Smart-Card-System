<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幸福智慧名片｜交貨頁</title>
  <meta name="description" content="照片＋姓名，一鍵開啟名片工具。" />
  <meta name="theme-color" content="#ee5253" />

  <!-- OG (static) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="幸福智慧名片｜交貨頁" />
  <meta property="og:description" content="照片＋姓名，一鍵開啟名片工具。" />
  <!-- ✅ 你目前 og-card.png 在根目錄，所以用 ./og-card.png -->
  <meta property="og:image" content="./og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="./og-card.png" />

  <link rel="stylesheet" href="./style.css?v=388" />
</head>

<body class="share-page">
  <div class="share-wrap">
    <div class="share-card">
      <div class="share-title">幸福智慧名片｜交貨頁</div>
      <div class="share-sub">照片 + 姓名（由資料載入）</div>

      <div class="share-photo">
        <img id="s-img" alt="專業形象照" />
      </div>

      <div id="s-name" class="share-name">載入中...</div>

      <div class="share-actions">
        <button class="btn-cta" onclick="SharePage.openCard()">開啟名片工具 →</button>
        <button class="btn-cta ghost" onclick="SharePage.copyDeliveryLink()">複製交貨連結</button>
      </div>

      <div class="share-note">
        若你要「貼 LINE/FB 就顯示同一張交貨封面圖」，請用上面複製的交貨連結。<br/>
        （點進來後會看到這位客戶的姓名與大頭照）
      </div>
    </div>
  </div>

  <!-- ✅ 用同一支 app.js，裡面會自動判斷 share-page -->
  <script src="./app.js?v=388"></script>
</body>
</html>
