<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>智慧名片｜交付卡</title>
<meta name="theme-color" content="#f7f3ea"/>

<meta property="og:type" content="website"/>
<meta property="og:title" content="天使幸福智慧名片｜交付卡"/>

<meta property="og:image" content="./assets/og-default.jpg"/>

<style>
:root{
--bg:#f7f3ea;
--ink:#1e293b;
--muted:rgba(30,41,59,.70);
--line:rgba(30,41,59,.12);
--card:rgba(255,255,255,.58);
--shadow:0 22px 60px rgba(30,41,59,.12);
--btn:#1f7a66;
--radius:22px;
--max:980px;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,"Noto Sans TC",Segoe UI,Roboto;
color:var(--ink);
background:
radial-gradient(1200px 800px at 15% -10%,rgba(31,122,102,.10),transparent 58%),
radial-gradient(900px 700px at 90% 10%,rgba(245,158,11,.10),transparent 60%),
var(--bg);
}
.wrap{max-width:var(--max);margin:0 auto;padding:22px 16px 34px}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.badge{
padding:7px 10px;
border-radius:999px;
border:1px solid var(--line);
background:rgba(255,255,255,.42);
font-size:12px;
font-weight:800;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

@media(min-width:860px){
.grid{grid-template-columns:1.15fr .85fr}
}

.card{
border:1px solid var(--line);
background:var(--card);
border-radius:var(--radius);
box-shadow:var(--shadow);
overflow:hidden;
}

.hero{
padding:26px 18px 18px;
border-bottom:1px solid var(--line);
}

.heroRow{
display:flex;
align-items:center;
gap:14px;
}

.avatar{
width:78px;height:78px;
border-radius:999px;
overflow:hidden;
background:#fff;
}

.avatar img{
width:100%;height:100%;
object-fit:cover;
}

.name{
font-size:22px;
font-weight:1000;
}

.meta{
margin-top:8px;
color:var(--muted);
font-size:13px;
}

.ctaBox{
padding:18px;
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
border:1px solid rgba(31,122,102,.28);
background:linear-gradient(180deg,rgba(31,122,102,.98),rgba(31,122,102,.88));
color:#fff;
padding:12px 14px;
border-radius:999px;
text-decoration:none;
font-weight:1000;
text-align:center;
}

.hint{
color:var(--muted);
font-size:13px;
line-height:1.6;
}

.side{
padding:16px;
}

.h{
font-weight:1000;
margin-bottom:10px;
}

.step{
margin-bottom:10px;
font-size:14px;
line-height:1.6;
}

.toast{
position:fixed;
left:50%;
bottom:16px;
transform:translateX(-50%);
background:#111827;
color:#fff;
padding:10px 12px;
border-radius:999px;
font-size:12px;
opacity:0;
transition:.2s;
}

.toast.show{opacity:1}
</style>
</head>

<body>

<div class="wrap">

<div class="topbar">

<div class="grid">

<!-- 左：交付卡 -->
<section class="card">

<div class="hero">
<div class="heroRow">

<div class="avatar">
<img id="avatarImg" src="./assets/avatar-default.png">
</div>

<div>
<div class="name" id="nameText">—</div>
<div class="meta" id="metaText">—</div>
</div>

</div>
</div>

<div class="ctaBox">

<a class="btn" id="btnOpenCard" href="./index.html?id=">
打開我的智慧名片
</a>

<div class="hint">
點擊上方按鈕即可打開你的智慧名片。  
進入名片後，右下角有「一鍵分享」按鈕，可快速分享給朋友、客戶或社群。
</div>

</div>

</section>

<!-- 右：使用說明 -->
<aside class="card side">

<div class="h">
如何使用這張智慧名片？
</div>

<div class="step">
<b>查閱名片</b><br>
點擊「打開我的智慧名片」，即可查看完整名片內容。
</div>

<div class="step">
<b>分享名片</b><br>
進入名片後，右下角有「一鍵分享」按鈕，可快速將名片分享出去。
</div>

<div class="step">
<b>可分享的平台</b><br>
LINE ・ Facebook ・ Messenger ・ Email ・ 微信 ・ 社群個人頁 ・ 課程頁 ・ 作品集入口
</div>

</aside>

</div>

</div>

<div class="toast" id="toast"></div>

</body>
</html>
