<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Angel Card Share v401.1</title>

  <!-- OG meta（⚠️動態 JS 改不到爬蟲，但給人看/截圖/分享用） -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="幸福智慧名片｜交貨卡" />
  <meta property="og:description" content="一點，就看見彼此的價值" />
  <meta property="og:image" content="og-card.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root{
      --bg:#0f1218;
      --ink:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.70);
      --card:rgba(255,255,255,0.10);
      --line:rgba(255,255,255,0.14);
      --p:#bf953f;
      --s:#8f6b1c;
      --gold1:rgba(191,149,63,0.75);
      --gold2:rgba(255,233,168,0.55);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(1100px 700px at 20% 0%, rgba(255,255,255,0.12), transparent 55%),
        radial-gradient(900px 700px at 85% 10%, rgba(191,149,63,0.12), transparent 56%),
        var(--bg);
      color:var(--ink);
    }
    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 10px 10px;
      border-radius: 18px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
    }
    .title{
      font-weight: 1000;
      letter-spacing: 0.6px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .btn{
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(191,149,63,0.55);
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      font-weight: 1000;
      cursor:pointer;
      position: relative;
      box-shadow: 0 18px 38px rgba(0,0,0,0.55);
    }
    .btn::after{
      content:"";
      position:absolute; inset:-1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--gold2), var(--gold1), rgba(255,255,255,0.12));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events:none;
      opacity: 0.85;
    }
    .btn:active{ transform: scale(0.99); }

    .share-card{
      margin-top: 12px;
      border-radius: 26px;
      border:1px solid var(--line);
      background: var(--card);
      box-shadow: 0 26px 80px rgba(0,0,0,0.55);
      overflow:hidden;
      position:relative;
    }
    .hero{
      padding: 22px 16px 18px;
      background:
        radial-gradient(900px 520px at 20% 10%, rgba(255,255,255,0.14), transparent 60%),
        radial-gradient(700px 520px at 90% 0%, rgba(191,149,63,0.14), transparent 58%),
        linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.14));
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .ava{
      width: 116px;
      height: 116px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      padding: 7px;
      margin: 0 auto;
      box-shadow: 0 18px 44px rgba(0,0,0,0.45);
    }
    .ava img{
      width:100%; height:100%;
      border-radius: 999px;
      object-fit: cover;
      display:block;
    }
    .name{
      text-align:center;
      font-weight: 1000;
      font-size: 30px;
      margin-top: 14px;
      letter-spacing: 0.8px;
    }
    .sub{
      text-align:center;
      color: var(--muted);
      font-weight: 900;
      margin-top: 6px;
      white-space: pre-line;
    }
    .body{
      padding: 14px 16px 18px;
    }
    .linkbox{
      border-radius: 18px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.25);
      padding: 12px;
      color: rgba(255,255,255,0.90);
      font-weight: 800;
      word-break: break-word;
      line-height: 1.55;
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 12px;
    }
    .note{
      color: rgba(255,255,255,0.68);
      font-weight: 800;
      margin-top: 10px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title"><i class="fa-solid fa-box-open"></i> 交貨卡（Share）<span style="opacity:.7;font-weight:900;">v401.1</span></div>
      <button class="btn" id="btnBack" type="button"><i class="fa-solid fa-house"></i> 回名片</button>
    </div>
<div class="share-card">
      <div class="hero">
        <div class="ava"><img id="avaImg" alt="個人照" /></div>
        <div class="name" id="name">載入中</div>
        <div class="sub" id="sub"></div>
      </div>

      <div class="body">
        <div class="linkbox" id="cardUrlBox">名片連結載入中…</div>

        <div class="row">
          <button class="btn" id="btnCopyCard" type="button"><i class="fa-solid fa-link"></i> 複製名片連結</button>
          <button class="btn" id="btnOpenCard" type="button"><i class="fa-solid fa-arrow-up-right-from-square"></i> 打開名片</button>
          <button class="btn" id="btnCopyOg" type="button"><i class="fa-solid fa-image"></i> 複製 OG 圖網址</button>
        </div>

        <div class="note">
          ✅ 這張頁面可以直接給客戶：<br/>
          - 看到姓名/照片/連結，一鍵複製、直接打開<br/>
          - 若你要“社群抓 OG 圖”用固定 og-card.png：請把 OG 圖放在專案根目錄並確保可公開讀取
        </div>
      </div>
    </div>

    <script src="./share.js?v=4011"></script>
  </div>
</body>
</html>
<!--
share.html 設計定位：
- 給客戶看的「交貨卡」：顯示人像、姓名、單位/頭銜、名片連結
- 一鍵複製 + 一鍵打開
- OG meta 為靜態（爬蟲抓不到 JS 改動），未來若要 per-id OG，需要改成 server-side 或預生成圖片
-->
