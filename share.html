<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>幸福智慧名片｜交貨頁</title>
  <meta name="description" content="照片＋姓名，一鍵開啟名片工具。" />
  <meta name="theme-color" content="#ee5253" />

  <!-- ⚠️ GitHub Pages 的靜態頁無法依 query 動態生成 OG meta（社群爬蟲不跑 JS）。
       ✅ 正式交貨請用 GAS 的 share action（可動態 meta）。
       這個 share.html 主要給「人」使用（點進來→開名片工具）。 -->

  <meta property="og:type" content="website" />
  <meta property="og:title" content="幸福智慧名片｜交貨頁" />
  <meta property="og:description" content="照片＋姓名，一鍵開啟名片工具。" />
  <meta property="og:image" content="./og/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="./og/og-card.png" />

  <link rel="stylesheet" href="./style.css?v=386" />
</head>
<body class="share-page">

  <div class="share-wrap">
    <div class="share-card">
      <div class="share-title">幸福智慧名片｜交貨頁</div>
      <div class="share-sub">照片 + 姓名（由資料載入）</div>

      <div class="share-photo">
        <img id="s-img" alt="專業形象照" />
      </div>

      <div id="s-name" class="share-name">載入中...</div>

      <div class="share-actions">
        <button class="btn-cta" onclick="SharePage.openCard()">開啟名片工具 →</button>
        <button class="btn-cta ghost" onclick="SharePage.copyGasLink()">複製 OG 交貨連結（建議貼社群）</button>
      </div>

      <div class="share-note">
        若你要「貼 LINE/FB 就顯示個人預覽圖」，請用第二顆按鈕複製的 <b>GAS 交貨連結</b>。
      </div>
    </div>
  </div>

  <script src="./app.js?v=386"></script>
</body>
</html>
