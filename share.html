<!-- share.html (v399.x COMPLETE OVERWRITE) — PART 1/2 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OG 交貨卡｜Happiness Smart Card System</title>
  <meta name="description" content="一貼就是 OG 卡｜點擊查看名片" />

  <!-- ✅ OG：永遠固定用你的 og-card.png（一貼就是一張 OG 卡） -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="幸福智慧名片" />
  <meta property="og:description" content="點擊查看名片" />
  <meta property="og:image" content="og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="og-card.png" />

  <link rel="icon" href="./icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#0f1412;
      --card:#ffffff;
      --shadow: 0 18px 60px rgba(0,0,0,.28);
      --radius: 22px;
      --btn:#2d3436;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:'Noto Sans TC', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 500px at 50% 10%, rgba(255,255,255,.10), rgba(0,0,0,0)) , var(--bg);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px 14px;
    }

    .wrap{
      width:min(920px, 100%);
      display:grid;
      gap:14px;
      justify-items:center;
    }

    .og-shell{
      width:min(860px, 100%);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .stage{
      position:relative;
      width:100%;
      aspect-ratio: 1200 / 630;
      border-radius: calc(var(--radius) - 6px);
      overflow:hidden;
      background:#111;
    }

    #ogBase{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform: translateZ(0);
    }

    .overlay{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .avatar{
      position:absolute;
      left: 11%;
      top: 18%;
      width: 18%;
      aspect-ratio: 1/1;
      border-radius: 999px;
      overflow:hidden;
      background: rgba(255,255,255,.55);
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:999px;
      display:block;
    }

    .name{
      position:absolute;
      right: 10%;
      top: 22%;
      font-weight: 900;
      letter-spacing: .5px;
      font-size: clamp(18px, 4.0vw, 54px);
      color: #1d1d1d;
      text-shadow: 0 2px 0 rgba(255,255,255,.35);
      max-width: 44%;
      text-align:right;
      line-height:1.05;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .hint{
      text-align:center;
      opacity:.9;
      font-size: 13px;
      letter-spacing:.4px;
      margin-top: 8px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-top: 6px;
    }
    .btn{
      border:none;
      cursor:pointer;
      padding: 12px 16px;
      border-radius: 999px;
      font-weight: 900;
      letter-spacing:.2px;
      background: rgba(255,255,255,.92);
      color:#1f2d2a;
      box-shadow: 0 12px 28px rgba(0,0,0,.22);
      transition: transform .12s ease;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }

    .btn.primary{
      background: #1f2d2a;
      color:#fff;
    }

    .small{
      font-size:12px;
      opacity:.85;
      text-align:center;
      margin-top: 2px;
    }

    .loading{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      background: rgba(0,0,0,.35);
      font-weight:900;
      letter-spacing:.5px;
    }
  </style>
</head><body>
  <div class="wrap">
    <div class="og-shell">
      <div class="stage" aria-label="og-delivery-card">
        <img id="ogBase" src="og-card.png" alt="OG 卡底圖" />
        <div class="overlay">
          <div class="avatar" id="avatarBox" style="display:none;">
            <img id="avatarImg" src="" alt="個人照" />
          </div>
          <div class="name" id="nameText" style="display:none;"></div>
          <div class="loading" id="loadingLayer">載入交貨資料中…</div>
        </div>
      </div>

      <div class="hint">✅ 這張是交貨卡（貼出去會顯示 OG 預覽）｜點下方進入名片</div>

      <div class="actions">
        <button class="btn primary" id="btnOpenCard" type="button">查看名片 →</button>
        <button class="btn" id="btnCopyShare" type="button">一鍵複製交貨連結</button>
        <button class="btn" id="btnCopyCard" type="button">一鍵複製名片連結</button>
      </div>
      <div class="small" id="debugText"></div>
    </div>
  </div>

  <!-- ✅ 注意：share.js 必須是獨立檔案，不要貼在 share.html 下面 -->
  <script src="./share.js?v=3990"></script>
</body>
</html>
