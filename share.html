<!-- share.html — v495 (COMPLETE OVERWRITE)
 * Purpose:
 * - OG 交付連結（給客戶貼社群）：share.html?id=TW0001
 * - 自動導向乾淨成品（不含選樣版）：index.html?id=TW0001&view=1
 * - 讀 GAS 只為「人類預覽」：若 status=inactive，預覽不顯示個資，並停止自動跳轉
 * - OG 仍是 generic fallback（靜態頁限制）
 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Happiness Smart Card — Share</title>
  <meta name="description" content="點擊查看專屬智慧名片" />

  <!-- Generic OG fallback (static hosting limitation) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Happiness Smart Card" />
  <meta property="og:description" content="點擊查看專屬智慧名片" />
  <meta property="og:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://angel0973180707.github.io/Happiness-Smart-Card-System/og-card.png" />

  <style>
    :root{
      --bg:#0b0f14;
      --card:#111823;
      --text:#eaf0ff;
      --muted:rgba(234,240,255,.72);
      --line:rgba(234,240,255,.12);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial;
      background: radial-gradient(1200px 800px at 20% 10%, rgba(80,160,255,.20), transparent 60%),
                  radial-gradient(1000px 700px at 90% 30%, rgba(255,120,180,.18), transparent 55%),
                  linear-gradient(180deg, #070a0f, #0b0f14);
      color:var(--text);
      padding: 18px 14px 26px;
    }
    .wrap{max-width:520px;margin:0 auto}
    .top{
      display:flex;align-items:center;justify-content:space-between;
      margin-top:6px;margin-bottom:12px;
    }
    .brand{
      display:flex;gap:10px;align-items:center;
      font-weight:800;letter-spacing:.2px
    }
    .dot{
      width:12px;height:12px;border-radius:999px;
      background: linear-gradient(135deg, #7dd3fc, #fb7185);
      box-shadow: 0 0 0 6px rgba(125,211,252,.10);
    }
    .chip{
      font-size:12px;color:var(--muted);
      border:1px solid var(--line);
      padding:6px 10px;border-radius:999px;
      background: rgba(255,255,255,.03);
    }
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .hero{ padding: 18px 16px 12px; }
    .title{ font-size:18px;font-weight:900;margin:0 0 6px; }
    .sub{ color:var(--muted);font-size:13px;line-height:1.55;margin:0; }
    .status{
      display:inline-flex;align-items:center;gap:8px;
      margin-top:10px;color:var(--muted);font-size:12px;
    }
    .badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      color:var(--muted);font-weight:800;
    }
    .b-ok{border-color: rgba(101,214,166,.35); color: rgba(101,214,166,.95)}
    .b-warn{border-color: rgba(255,204,102,.35); color: rgba(255,204,102,.95)}
    .preview{
      padding: 0 16px 16px;
      display:flex;gap:12px;align-items:center;
    }
    .avatar{
      width:58px;height:58px;border-radius:16px;
      background: rgba(255,255,255,.06);
      border:1px solid var(--line);
      overflow:hidden;flex:none;
      display:flex;align-items:center;justify-content:center;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .meta{min-width:0}
    .name{
      font-size:16px;font-weight:900;margin:0 0 4px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .line2{
      font-size:12px;color:var(--muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .actions{
      display:grid;grid-template-columns:1fr;gap:10px;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,.18);
    }
    .btn{
      appearance:none;border:1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      color:var(--text);
      font-weight:800;
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .btn small{font-weight:700;color:var(--muted)}
    .row{
      display:flex;gap:8px;flex-wrap:wrap;
      padding: 0 16px 16px;
    }
    .mini{
      flex:1;min-width: 150px;
      border-radius: 14px;
      padding:10px 12px;
      border:1px dashed var(--line);
      background: rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .footer{
      text-align:center;color:rgba(234,240,255,.55);
      font-size:12px;margin-top:14px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="dot"></span>Happiness Smart Card</div>
      <div class="chip" id="chipId">ID：—</div>
    </div>

    <div class="panel">
      <div class="hero">
        <p class="title" id="heroTitle">正在開啟你的名片…</p>
        <p class="sub" id="heroSub">1～2 秒後會自動跳轉到「乾淨成品」（不含選樣版）。</p>
        <div class="status">
          <span class="badge b-warn" id="badge">Loading</span>
          <span id="hint">正在讀取資料…</span>
        </div>
      </div>

      <div class="preview">
        <div class="avatar" id="avatarBox">👤</div>
        <div class="meta">
          <p class="name" id="pName">—</p>
          <div class="line2" id="pLine2">—</div>
          <div class="line2" id="pLine3">—</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="btnOpenClean">
          <span>立即開啟乾淨成品</span>
          <small id="cleanUrlHint">index.html?view=1</small>
        </button>

        <button class="btn" id="btnCopyOg">
          <span>複製 OG 交付連結</span>
          <small id="ogUrlHint">share.html</small>
        </button>

        <button class="btn" id="btnCopyClean">
          <span>複製乾淨成品連結</span>
          <small>view=1</small>
        </button>

        <button class="btn" id="btnWeChat">
          <span>微信長圖交貨（Poster）</span>
          <small>wechat.html</small>
        </button>

        <button class="btn" id="btnCancel" title="取消自動跳轉">
          <span>取消自動跳轉</span>
          <small>Stop</small>
        </button>
      </div>

      <div class="row">
        <div class="mini">交付建議：客戶「貼社群」用 OG 交付連結；客戶「自己收藏」用乾淨成品連結。</div>
        <div class="mini">提醒：若名片狀態 inactive，將顯示「請聯繫客服開通」，且本頁不顯示個資預覽。</div>
      </div>
    </div>

    <div class="footer">v492 share · Powered by Angel · Mobile-first</div>
  </div>

  <script>
    // =========================
    // CONFIG
    // =========================
    const CONFIG = {
      VERSION: "v492",
      GAS: "https://script.google.com/macros/s/AKfycbycjN-ooacgi-K-uGUTZeWUwfmjHFI_JeESbM2SEGnjFsk0TPBuUY71bW-1AYAMI-E/exec",
      BASE: "https://angel0973180707.github.io/Happiness-Smart-Card-System/",
      INDEX: "index.html",
      WECHAT: "wechat.html",
      AUTO_REDIRECT_MS: 1400,
      FETCH_TIMEOUT_MS: 12000
    };

    // =========================
    // Helpers
    // =========================
    const $ = (id) => document.getElementById(id);
    const qs = (k) => new URLSearchParams(location.search).get(k);

    function normalizeId(raw){
      const s = String(raw||"").trim().toUpperCase();
      if (!s) return "";
      if (/^TW\d{4}$/.test(s)) return s;
      if (/^\d{1,4}$/.test(s)) return "TW" + s.padStart(4,"0");
      if (/^TW\d{1,4}$/.test(s)){
        const n = s.replace(/^TW/i,"");
        return "TW" + n.padStart(4,"0");
      }
      return s;
    }

    function base_(){
      return CONFIG.BASE.endsWith("/") ? CONFIG.BASE : (CONFIG.BASE + "/");
    }

    // OG 交付連結（給客戶貼社群）
    function buildOgUrl(id){
      return base_() + "share.html?id=" + encodeURIComponent(id);
    }

    // 乾淨成品（不含選樣版）：view=1
    function buildCleanUrl(id){
      return base_() + CONFIG.INDEX + "?id=" + encodeURIComponent(id) + "&view=1";
    }

    function buildWeChatUrl(id){
      return base_() + CONFIG.WECHAT + "?id=" + encodeURIComponent(id);
    }

    async function fetchJson(url){
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
      try{
        const res = await fetch(url, { cache:"no-store", signal: ctrl.signal });
        const txt = await res.text();
        let j = null;
        try{ j = JSON.parse(txt); } catch(_){}
        if (!res.ok) throw new Error("HTTP " + res.status);
        if (!j || typeof j !== "object") throw new Error("Invalid JSON");
        return j;
      } finally {
        clearTimeout(t);
      }
    }

    function pick(obj, keys, fallback=""){
      for (const k of keys){
        const v = obj && obj[k];
        if (v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
      }
      return fallback;
    }

    function setBadge(type, text){
      const b = $("badge");
      b.classList.remove("b-ok","b-warn");
      b.classList.add(type === "ok" ? "b-ok" : "b-warn");
      b.textContent = text;
    }

    async function copyText_(t){
      const s = String(t||"");
      try{
        await navigator.clipboard.writeText(s);
        return true;
      }catch(e){
        const ok = prompt("請手動複製：", s);
        return ok !== null;
      }
    }

    function setPreviewMasked_(statusText){
      $("pName").textContent = "（未開通）";
      $("pLine2").textContent = "請聯繫客服開通";
      $("pLine3").textContent = "狀態：" + (statusText || "inactive");
      const box = $("avatarBox");
      if (box) box.textContent = "🔒";
    }

    // =========================
    // Main
    // =========================
    (async function main(){
      const id = normalizeId(qs("id") || qs("card") || "TW0001") || "TW0001";
      $("chipId").textContent = "ID：" + id;

      const ogUrl = buildOgUrl(id);
      const cleanUrl = buildCleanUrl(id);
      const wechatUrl = buildWeChatUrl(id);

      $("ogUrlHint").textContent = ogUrl.replace(CONFIG.BASE, "");
      $("cleanUrlHint").textContent = cleanUrl.replace(CONFIG.BASE, "");

      let cancelled = false;
      let redirectTimer = null;

      function cancelRedirect_(msg){
        cancelled = true;
        if (redirectTimer) clearTimeout(redirectTimer);
        $("hint").textContent = msg || "已取消自動跳轉（你仍可手動開啟乾淨成品）。";
      }

      $("btnCancel").addEventListener("click", () => {
        cancelRedirect_("已取消自動跳轉（你仍可手動開啟乾淨成品）。");
        setBadge("ok", "Ready");
      });

      $("btnOpenClean").addEventListener("click", () => location.href = cleanUrl);
      $("btnWeChat").addEventListener("click", () => location.href = wechatUrl);

      $("btnCopyOg").addEventListener("click", async () => {
        const ok = await copyText_(ogUrl);
        $("hint").textContent = ok ? "已複製 OG 交付連結 ✅" : "已取消";
        setBadge("ok", ok ? "Copied" : "Copy");
      });

      $("btnCopyClean").addEventListener("click", async () => {
        const ok = await copyText_(cleanUrl);
        $("hint").textContent = ok ? "已複製乾淨成品連結 ✅" : "已取消";
        setBadge("ok", ok ? "Copied" : "Copy");
      });

      // Fetch card data (human preview only)
      let isInactive = false;
      try{
        const api = CONFIG.GAS + "?action=card&id=" + encodeURIComponent(id) + "&ts=" + Date.now();
        const json = await fetchJson(api);

        if (!json.ok) throw new Error(json.error || "API ok=false");
        const card = json.data || {};

        const status = (pick(card, ["status","狀態"], "") || "").toLowerCase();
        isInactive = (status === "inactive" || status === "locked" || status === "disabled");

        if (isInactive){
          $("heroTitle").textContent = "此名片尚未開通";
          $("heroSub").textContent = "你仍可複製交付連結，或聯繫客服開通後再觀看成品。";
          setBadge("warn", "Locked");
          setPreviewMasked_(status || "inactive");
          cancelRedirect_("已停止自動跳轉（名片狀態為 inactive）。");
        }else{
          const name = pick(card, ["name","姓名"], "（未填姓名）");
          const unit = pick(card, ["unit","單位"], "");
          const title = pick(card, ["title","頭銜"], "");

          $("heroTitle").textContent = "即將開啟乾淨成品";
          $("pName").textContent = name;
          $("pLine2").textContent = [unit, title].filter(Boolean).join("｜") || "（尚未填單位/頭銜）";
          $("pLine3").textContent = "狀態：" + (status || "active");

          // avatar (prefer *_fast then raw)
          const avatar = pick(card, ["avatar_fast","avatar_img_fast","個人照_fast","avatar_img","個人照"], "");
          if (avatar){
            const img = new Image();
            img.referrerPolicy = "no-referrer";
            img.onload = () => {
              const box = $("avatarBox");
              box.innerHTML = "";
              box.appendChild(img);
            };
            img.src = avatar;
          }

          document.title = name + "｜Happiness Smart Card";
          $("heroSub").textContent = "1～2 秒後自動跳轉（若在微信/Line 內開啟，請稍等一下）。";
          $("hint").textContent = "讀取成功 ✅";
          setBadge("ok","OK");
        }

      }catch(err){
        $("heroTitle").textContent = "讀取失敗，但仍可開啟";
        $("heroSub").textContent = "可能是資料不存在或權限/網路問題。你仍可直接開啟乾淨成品。";
        $("hint").textContent = String(err && err.message ? err.message : err);
        setBadge("warn","Error");
      }

      // Auto redirect to CLEAN (view=1) — only when not cancelled and not inactive
      redirectTimer = setTimeout(() => {
        if (cancelled) return;
        if (isInactive) return;
        location.href = cleanUrl;
      }, CONFIG.AUTO_REDIRECT_MS);
    })();
  </script>
</body>
</html>
