<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>智慧名片交付卡 v705.3</title>
<meta name="theme-color" content="#edf4ef" />

<style>

:root{
--bg1:#f7faf8;
--bg2:#eef4ef;
--bg3:#e6efe8;

--card:#ffffff;

--ink:#2d4838;
--line:#dce8df;

--brand:#5e9b78;
--brand-deep:#467f5d;

--shadow-card:0 18px 42px rgba(44,74,58,.08);
--shadow-soft:0 10px 22px rgba(44,74,58,.05);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
color:var(--ink);
display:flex;
justify-content:center;
background:
radial-gradient(1000px 560px at 50% -10%, rgba(106,157,126,.10), transparent 55%),
linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 58%,var(--bg3) 100%);
}

.wrap{
width:100%;
max-width:460px;
padding:24px 16px 56px;
}

.delivery-card{
background:linear-gradient(180deg,#ffffff 0%,#fbfdfb 100%);
border:1px solid var(--line);
border-radius:32px;
box-shadow:var(--shadow-card);
padding:16px;
position:relative;
overflow:hidden;
}

.delivery-card::before{
content:"";
position:absolute;
inset:0 0 auto 0;
height:110px;
background:linear-gradient(180deg, rgba(109,158,127,.08) 0%, rgba(109,158,127,0) 100%);
}

#posterCapture{
position:relative;
z-index:1;
}

.poster-brand{
text-align:center;
padding:4px 8px 12px;
}

/* ===== 品牌區 ===== */

.brand-row{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.brand-icon{
width:28px;
height:28px;
object-fit:cover;
border-radius:6px;
}

.poster-brand-title{
margin:0;
color:#3f6f57;
font-size:22px;
font-weight:800;
}

/* ===== 海報 ===== */

.poster{
background:linear-gradient(180deg,#ffffff 0%,#fcfefd 100%);
border-radius:28px;
padding:24px 18px 20px;
border:1px solid #e4eee7;
box-shadow:0 8px 20px rgba(55,92,72,.04);
text-align:center;
}

.avatar-wrap{
width:116px;
height:116px;
margin:0 auto 16px;
border-radius:50%;
overflow:hidden;
background:#f3f7f4;
border:1px solid #dce9e0;
display:grid;
place-items:center;
}

.avatar{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.avatar-fallback{
font-size:26px;
font-weight:800;
color:#6f8d7d;
}

.name{
font-size:28px;
font-weight:800;
color:#3d6b54;
margin-bottom:8px;
}

.unit{
font-size:16px;
font-weight:700;
color:#587b67;
}

.title{
font-size:16px;
font-weight:700;
color:#587b67;
margin-bottom:10px;
}

/* ===== QR ===== */

.qr-card{
margin-top:16px;
background:#fff;
border-radius:24px;
padding:18px 12px 16px;
border:1px solid #e5eee8;
}

.qr-box{
width:210px;
height:210px;
margin:0 auto;
border-radius:24px;
background:#fff;
border:1px solid #dfe9e2;
display:grid;
place-items:center;
}

#qrcode{
width:190px;
height:190px;
display:grid;
place-items:center;
}

#qrcode canvas,
#qrcode img{
width:190px!important;
height:190px!important;
}

.qr-text{
margin-top:12px;
font-size:14px;
color:#5d7f6c;
font-weight:700;
}

/* ===== 按鈕區 ===== */

.actions{
margin-top:14px;
background:#fff;
border:1px solid #e1ebe4;
border-radius:26px;
padding:14px;
box-shadow:var(--shadow-soft);
}

.btn{
width:100%;
min-height:56px;
padding:14px 16px;
border-radius:22px;
font-size:15px;
font-weight:800;
margin-top:12px;
cursor:pointer;
border:none;
}

.btn:first-child{margin-top:0}

.btn-primary{
color:#fff;
background:linear-gradient(180deg,var(--brand) 0%,var(--brand-deep) 100%);
}

.btn-secondary{
color:#3e6853;
background:#eef4ef;
border:1px solid #c9dbcf;
}

/* 修復按鈕變形 */

.tool-grid{
display:flex;
flex-direction:column;
gap:10px;
margin-top:12px;
}

.btn-utility{
min-height:56px;
background:#f4f8f5;
border:1px solid #d9e6dd;
}

/* ===== status ===== */

.status{
margin-top:12px;
background:#f4f8f5;
border:1px solid #dbe8df;
border-radius:18px;
padding:12px 14px;
text-align:center;
color:#4d7962;
font-size:13px;
display:flex;
align-items:center;
justify-content:center;
}

</style>
</head>

<body>

<div class="wrap">

<div class="delivery-card">

<div id="posterCapture">

<div class="poster-brand">
<div class="brand-row">
<img src="icon.png" class="brand-icon" alt="logo">
<h1 class="poster-brand-title">天使幸福智慧名片</h1>
</div>
</div>

<div id="poster" class="poster">

<div class="avatar-wrap">
<img id="avatar" class="avatar" alt="頭像"/>
<div id="avatarFallback" class="avatar-fallback">名片</div>
</div>

<div id="name" class="name">載入中...</div>
<div id="unit" class="unit"></div>
<div id="title" class="title"></div>

<div class="qr-card">
<div class="qr-box">
<div id="qrcode"></div>
</div>
<div id="qrTip" class="qr-text">掃描 QRCode 打開智慧名片</div>
</div>

</div>
</div>

<div class="actions">

<button id="btnShare" class="btn btn-primary">分享我的智慧名片</button>

<button id="btnCopyCard" class="btn btn-secondary">複製我的智慧名片連結</button>
<button id="btnDownload" class="btn btn-secondary">下載名片海報</button>
<button id="btnOpenCard" class="btn btn-secondary">打開我的智慧名片</button>

<div class="tool-grid">
<button id="btnShareGuide" class="btn btn-utility">分享說明</button>
<button id="btnRecommend" class="btn btn-utility">推薦智慧名片</button>
<button id="btnConsult" class="btn btn-utility">LINE 官方帳號</button>
</div>

<div id="status" class="status">
交付卡載入中...
</div>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="./imageResolver.js?v=7034"></script>
<script src="./poster.js?v=7050"></script>

</body>
</html>
