<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v534</title>
  <meta name="theme-color" content="#f7f1ea" />

  <style>
    :root{
      --bg:#f7f1ea;
      --card:#fffaf5;
      --ink:#2d241d;
      --muted:#7d7065;
      --line:rgba(75,52,31,.10);
      --accent:#be7d47;
      --accent-2:#9a6030;
      --shadow:0 18px 48px rgba(91,61,33,.12);
      --shadow-soft:0 10px 28px rgba(91,61,33,.08);
      --radius-xl:30px;
      --radius-lg:22px;
      --radius-md:18px;
      --max:820px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      min-height:100vh;
      background:
        radial-gradient(900px 540px at 0% 0%, rgba(255,224,191,.36), transparent 54%),
        radial-gradient(900px 540px at 100% 0%, rgba(250,235,219,.72), transparent 54%),
        linear-gradient(180deg,#fdfaf6, var(--bg));
    }

    img{ display:block; max-width:100%; }

    .wrap{
      width:min(var(--max), calc(100% - 24px));
      margin:0 auto;
      padding:22px 0 34px;
    }

    .top{
      text-align:center;
      margin-bottom:16px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(75,52,31,.08);
      box-shadow:var(--shadow-soft);
      font-size:14px;
      font-weight:900;
      color:var(--accent-2);
    }

    .brand-mark{
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#efc18c,#fff2df 62%,#d78d48);
      font-size:18px;
      box-shadow:var(--shadow-soft);
    }

    .panel{
      background:rgba(255,255,255,.76);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.72);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .poster-wrap{
      padding:18px;
    }

    .poster-paper{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      padding:18px;
      background:
        radial-gradient(110% 110% at 0% 0%, rgba(255,255,255,.95), rgba(255,250,244,.96) 46%, rgba(252,243,232,.98) 100%);
      border:1px solid rgba(160,108,58,.10);
      box-shadow:
        0 24px 60px rgba(93,62,34,.14),
        inset 0 1px 0 rgba(255,255,255,.92);
      isolation:isolate;
    }

    .poster-paper::before{
      content:"";
      position:absolute;
      inset:-26% auto auto -12%;
      width:70%;
      height:48%;
      background:radial-gradient(circle, rgba(255,222,186,.42), transparent 64%);
      z-index:0;
      pointer-events:none;
    }

    .poster-paper::after{
      content:"";
      position:absolute;
      right:-8%;
      bottom:-12%;
      width:48%;
      height:34%;
      background:radial-gradient(circle, rgba(210,155,102,.18), transparent 66%);
      z-index:0;
      pointer-events:none;
    }

    .poster-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .mini-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .mini-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .mini-mark{
      width:40px;
      height:40px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#efc18c,#fff2df 62%,#d78d48);
      font-size:18px;
      box-shadow:var(--shadow-soft);
      flex:0 0 auto;
    }

    .mini-text{ min-width:0; }
    .mini-title{
      font-size:15px;
      font-weight:900;
      line-height:1.2;
    }
    .mini-sub{
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
      line-height:1.4;
    }

    .badge{
      white-space:nowrap;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(160,108,58,.12);
      box-shadow:var(--shadow-soft);
      font-size:12px;
      font-weight:900;
      color:var(--accent-2);
    }

    .profile-card{
      display:grid;
      grid-template-columns:104px 1fr;
      gap:14px;
      align-items:center;
      padding:16px;
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,247,238,.96));
      border:1px solid rgba(160,108,58,.10);
      box-shadow:var(--shadow-soft);
    }

    .avatar-wrap{
      position:relative;
      width:104px;
      height:104px;
      border-radius:28px;
      overflow:hidden;
      background:linear-gradient(135deg,#f2d3b3,#fbf3e9);
      border:1px solid rgba(160,108,58,.12);
      box-shadow:0 10px 22px rgba(93,62,34,.10);
      display:grid;
      place-items:center;
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:none;
    }

    .avatar-fallback{
      font-size:30px;
      font-weight:900;
      color:#8f6b4e;
      letter-spacing:.06em;
      user-select:none;
    }

    .profile-meta{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .name{
      font-size:30px;
      line-height:1.15;
      font-weight:900;
      word-break:break-word;
    }

    .unit{
      font-size:15px;
      color:var(--muted);
      line-height:1.5;
      font-weight:700;
      word-break:break-word;
    }

    .title{
      font-size:17px;
      color:#534338;
      line-height:1.5;
      font-weight:800;
      word-break:break-word;
    }

    .slogan{
      font-size:14px;
      color:var(--accent-2);
      line-height:1.65;
      font-weight:800;
      word-break:break-word;
      min-height:22px;
    }

    .middle{
      display:grid;
      grid-template-columns:1fr 188px;
      gap:14px;
      align-items:stretch;
    }

    .left-card,
    .qr-card{
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,248,240,.95));
      border:1px solid rgba(160,108,58,.10);
      box-shadow:var(--shadow-soft);
    }

    .left-card{
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .left-title{
      font-size:16px;
      font-weight:900;
      line-height:1.45;
      margin:0;
    }

    .left-desc{
      font-size:14px;
      line-height:1.8;
      color:var(--muted);
      margin:0;
    }

    .tag-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      min-height:34px;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      line-height:1.3;
      font-weight:800;
      color:#5b4b40;
      background:#fff;
      border:1px solid rgba(64,44,24,.08);
      box-shadow:0 6px 16px rgba(93,62,34,.05);
    }

    .qr-card{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .qr-title{
      font-size:12px;
      font-weight:900;
      color:var(--accent-2);
      line-height:1.4;
      text-align:center;
      margin:0;
    }

    .qr-box{
      position:relative;
      width:148px;
      height:148px;
      border-radius:20px;
      background:#fff;
      border:1px solid rgba(64,44,24,.10);
      box-shadow:0 10px 22px rgba(93,62,34,.09);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    #qrcode{
      width:136px;
      height:136px;
      display:grid;
      place-items:center;
    }

    .qr-box canvas,
    .qr-box img{
      width:136px !important;
      height:136px !important;
      image-rendering:pixelated;
    }

    .qr-center{
      position:absolute;
      inset:50% auto auto 50%;
      transform:translate(-50%,-50%);
      width:36px;
      height:36px;
      border-radius:12px;
      background:#fff;
      border:1px solid rgba(64,44,24,.08);
      box-shadow:0 6px 16px rgba(93,62,34,.15);
      display:none;
      overflow:hidden;
      z-index:2;
    }

    .qr-center img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .qr-tip{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      text-align:center;
      margin:0;
    }

    .footer-card{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:center;
      padding:14px 16px;
      border-radius:22px;
      background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,248,240,.95));
      border:1px solid rgba(160,108,58,.10);
      box-shadow:var(--shadow-soft);
    }

    .footer-title{
      font-size:15px;
      font-weight:900;
      margin:0 0 4px;
      line-height:1.4;
    }

    .footer-desc{
      margin:0;
      font-size:13px;
      line-height:1.7;
      color:var(--muted);
    }

    .footer-id{
      white-space:nowrap;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(64,44,24,.08);
      box-shadow:0 6px 16px rgba(93,62,34,.05);
      font-size:12px;
      color:#6e5c50;
      font-weight:900;
    }

    .action-panel{
      margin-top:16px;
      padding:16px;
    }

    .action-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius:16px;
      padding:14px 16px;
      min-height:50px;
      font-size:15px;
      font-weight:900;
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease, background .16s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:100%;
    }

    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,#c88749,#9f6234);
      box-shadow:0 14px 28px rgba(158,98,52,.24);
    }

    .btn-soft{
      color:var(--ink);
      background:linear-gradient(180deg,#fffdfa,#fff6ee);
      border:1px solid rgba(64,44,24,.10);
      box-shadow:var(--shadow-soft);
    }

    .btn-ghost{
      color:var(--accent-2);
      background:rgba(255,255,255,.72);
      border:1px dashed rgba(186,126,70,.26);
      box-shadow:var(--shadow-soft);
    }

    .status{
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(64,44,24,.08);
      color:#6f6258;
      font-size:14px;
      line-height:1.7;
      box-shadow:var(--shadow-soft);
      word-break:break-word;
    }

    .status[data-type="error"]{
      background:#fff1f0;
      border-color:rgba(194,58,43,.14);
      color:#a14139;
    }

    .status[data-type="success"]{
      background:#f4fbf6;
      border-color:rgba(44,131,76,.12);
      color:#2f7b49;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:999px;
      background:#c98749;
      animation:pop 1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes pop{
      0%,80%,100%{ transform:scale(.75); opacity:.42; }
      40%{ transform:scale(1); opacity:1; }
    }

    @media (max-width: 720px){
      .wrap{
        width:min(100%, calc(100% - 16px));
        padding:16px 0 24px;
      }
      .poster-wrap,
      .action-panel{ padding:14px; }
      .poster-paper{ padding:14px; border-radius:24px; }
      .profile-card{
        grid-template-columns:88px 1fr;
        gap:12px;
        padding:14px;
      }
      .avatar-wrap{
        width:88px;
        height:88px;
        border-radius:22px;
      }
      .name{ font-size:25px; }
      .unit{ font-size:14px; }
      .title{ font-size:16px; }
      .middle{ grid-template-columns:1fr; }
      .footer-card{ grid-template-columns:1fr; }
      .action-grid{ grid-template-columns:1fr; }
      .btn{ width:100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">💳</div>
        <span>智慧名片交付卡</span>
      </div>
    </div>

    <section class="panel poster-wrap">
      <div id="poster" class="poster-paper">
        <div class="poster-inner">
          <div class="mini-top">
            <div class="mini-left">
              <div class="mini-mark">✨</div>
              <div class="mini-text">
                <div class="mini-title">天使幸福智慧名片</div>
                <div class="mini-sub">可分享的專屬名片入口</div>
              </div>
            </div>
            <div class="badge">交付卡</div>
          </div>

          <div class="profile-card">
            <div class="avatar-wrap">
              <img id="avatar" class="avatar" alt="頭像" />
              <div id="avatarFallback" class="avatar-fallback">名片</div>
            </div>

            <div class="profile-meta">
              <div id="name" class="name">載入中...</div>
              <div id="unit" class="unit">請稍候</div>
              <div id="title" class="title">正在整理你的名片資訊</div>
              <div id="slogan" class="slogan"></div>
            </div>
          </div>

          <div class="middle">
            <div class="left-card">
              <h3 class="left-title">這是一張可以直接分享的智慧名片</h3>
              <div class="tag-row">
                <div class="tag">一鍵開啟名片</div>
                <div class="tag">手機掃碼直達</div>
                <div class="tag">可下載名片海報</div>
                <div class="tag">適合轉傳與收藏</div>
              </div>
              <p class="left-desc">
                建議先收藏這張交付卡；需要分享給朋友、客戶或合作夥伴時，
                可直接傳送海報，或使用下方按鈕快速分享智慧名片連結。
              </p>
            </div>

            <div class="qr-card">
              <h3 class="qr-title">掃描 QRCode<br>立即查看智慧名片</h3>
              <div class="qr-box">
                <div id="qrcode"></div>
                <div id="qrCenter" class="qr-center">
                  <img id="qrCenterImg" alt="中心頭像" />
                </div>
              </div>
              <p id="qrTip" class="qr-tip">QR 產生中...</p>
            </div>
          </div>

          <div class="footer-card">
            <div>
              <div class="footer-title">打開名片後，可直接查看完整內容與聯絡入口</div>
              <p class="footer-desc">
                這張交付卡專門用來下載海報、打開智慧名片、快速分享，
                也可以進一步前往智慧名片館或洽詢名片訂製服務。
              </p>
            </div>
            <div id="footerId" class="footer-id">ID：--</div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel action-panel">
      <div class="action-grid">
        <button id="btnDownload" class="btn btn-primary" type="button">下載名片海報</button>
        <button id="btnOpenCard" class="btn btn-soft" type="button">打開我的智慧名片</button>
        <button id="btnCopyCard" class="btn btn-soft" type="button">複製我的智慧名片連結</button>
        <button id="btnShareLine" class="btn btn-soft" type="button">分享到LINE</button>
        <button id="btnShareWechat" class="btn btn-soft" type="button">分享到微信</button>
        <button id="btnShareHall" class="btn btn-ghost" type="button">分享智慧名片館</button>
        <button id="btnConsult" class="btn btn-ghost" type="button">名片諮詢服務</button>
      </div>

      <div id="status" class="status">
        <span class="loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        正在載入交付卡資料...
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./imageResolver.js?v=534"></script>
  <script src="./poster.js?v=534"></script>
</body>
</html>
