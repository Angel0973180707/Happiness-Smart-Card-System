<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  />
  <title>天使幸福智慧名片｜名片交付卡</title>
  <meta name="theme-color" content="#f6efe7" />

  <style>
    :root{
      --bg:#f6efe7;
      --card:#fffaf6;
      --ink:#2c221c;
      --muted:#7a6c60;
      --line:rgba(74,53,36,.10);
      --accent:#b67a47;
      --accent-2:#8d5c32;
      --line-green-1:#1ec95d;
      --line-green-2:#08ad45;
      --shadow:0 18px 40px rgba(87,61,33,.10);
      --shadow-soft:0 10px 24px rgba(87,61,33,.08);
      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-pill:999px;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,.78), transparent 56%),
        var(--bg);
      color:var(--ink);
      font-family:
        "Noto Sans TC","PingFang TC","Microsoft JhengHei",
        system-ui,-apple-system,sans-serif;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      min-height:100vh;
    }

    .page{
      width:min(100%, 620px);
      margin:0 auto;
      padding:18px 14px 34px;
    }

    .hero-card{
      background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,250,246,.99));
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hero-head{
      padding:24px 20px 10px;
      text-align:center;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:0 auto;
      flex-wrap:nowrap;
    }

    .brand-icon{
      width:30px;
      height:30px;
      border-radius:8px;
      flex:0 0 auto;
      display:block;
      box-shadow:0 4px 10px rgba(0,0,0,.08);
      background:#fff;
      object-fit:cover;
    }

    .brand-title{
      margin:0;
      font-size:24px;
      line-height:1.25;
      font-weight:900;
      letter-spacing:.02em;
      word-break:keep-all;
    }

    .delivery-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:14px;
      padding:10px 24px;
      min-height:44px;
      border-radius:var(--radius-pill);
      border:1px solid rgba(182,122,71,.18);
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(249,241,232,1));
      color:#8d5c32;
      font-size:15px;
      line-height:1;
      font-weight:900;
      letter-spacing:.08em;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.7),
        0 8px 16px rgba(182,122,71,.08);
    }

    .hero-body{
      padding:18px;
    }

    .poster-canvas{
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,251,247,1));
      border:1px solid rgba(84,59,36,.09);
      border-radius:28px;
      padding:28px 18px 24px;
      text-align:center;
      box-shadow:var(--shadow-soft);
    }

    .avatar-wrap{
      width:100px;
      height:100px;
      margin:0 auto 14px;
      border-radius:50%;
      overflow:hidden;
      background:#ede1d6;
      border:3px solid rgba(255,255,255,.95);
      box-shadow:0 10px 22px rgba(87,61,33,.12);
    }

    .avatar-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .name{
      margin:0;
      font-size:28px;
      line-height:1.25;
      font-weight:900;
      letter-spacing:.04em;
      word-break:break-word;
    }

    .title{
      margin:10px auto 0;
      max-width:18em;
      font-size:16px;
      line-height:1.7;
      color:#6f6054;
      word-break:break-word;
      min-height:1.7em;
    }

    .qr-zone{
      margin:24px auto 0;
      display:flex;
      justify-content:center;
    }

    .qr-frame{
      width:420px;
      max-width:100%;
      background:#fff;
      border-radius:28px;
      padding:40px;
      border:1px solid rgba(0,0,0,.05);
      box-shadow:0 10px 24px rgba(0,0,0,.06);
    }

    .qr-box{
      width:100%;
      aspect-ratio:1/1;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius:12px;
    }

    .qr-box img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
    }

    .status{
      margin-top:14px;
      text-align:center;
      font-size:14px;
      line-height:1.8;
      color:var(--muted);
      min-height:1.8em;
    }

    .status.error{
      color:#b42318;
    }

    .action-group{
      margin-top:16px;
      background:rgba(255,255,255,.64);
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px;
    }

    .group-title{
      margin:0 0 10px;
      font-size:14px;
      font-weight:900;
      letter-spacing:.04em;
      color:#6d5a4c;
    }

    .actions{
      display:grid;
      gap:12px;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:16px 18px;
      font-size:17px;
      line-height:1.2;
      font-weight:900;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .btn:active{
      transform:scale(.986);
    }

    .btn-primary{
      color:#fff;
      background:linear-gradient(180deg, #c68b57, #a86b3d);
      box-shadow:0 12px 24px rgba(169,107,61,.26);
    }

    .btn-soft{
      color:var(--ink);
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 8px 18px rgba(87,61,33,.06);
    }

    .btn-line{
      color:#fff;
      background:linear-gradient(180deg, var(--line-green-1), var(--line-green-2));
      box-shadow:0 12px 24px rgba(8,173,69,.22);
    }

    .dialog-mask{
      position:fixed;
      inset:0;
      background:rgba(24,18,14,.44);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }

    .dialog-mask.show{
      display:flex;
    }

    .dialog{
      width:min(100%, 500px);
      background:#fffaf7;
      border:1px solid rgba(74,53,36,.10);
      border-radius:24px;
      box-shadow:0 24px 50px rgba(0,0,0,.18);
      padding:22px 18px 18px;
    }

    .dialog-title{
      margin:0 0 10px;
      font-size:22px;
      line-height:1.35;
      font-weight:900;
      color:var(--ink);
    }

    .dialog-body{
      color:#5d4e42;
      font-size:15px;
      line-height:1.9;
    }

    .dialog-body p{
      margin:0 0 10px;
    }

    .dialog-actions{
      margin-top:14px;
      display:flex;
      justify-content:flex-end;
    }

    .dialog-close{
      min-width:112px;
    }

    @media (max-width:520px){
      .page{ padding:16px 12px 28px; }
      .hero-head{ padding:22px 16px 10px; }
      .brand-title{ font-size:21px; }
      .brand-icon{ width:28px; height:28px; }
      .delivery-pill{ font-size:14px; padding:9px 20px; }
      .hero-body{ padding:14px; }
      .poster-canvas{ padding:22px 14px 20px; }
      .avatar-wrap{ width:88px; height:88px; }
      .name{ font-size:24px; }
      .title{ font-size:15px; }
      .qr-frame{ padding:28px; border-radius:22px; }
      .btn{ padding:15px 16px; font-size:16px; }
      .action-group{ padding:12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero-card">
      <div class="hero-head">
        <div class="brand-row">
          <img class="brand-icon" src="./icon-192.png" alt="天使幸福智慧名片 icon" onerror="this.src='./icon-512.png'">
          <h1 class="brand-title">天使幸福智慧名片</h1>
        </div>
        <div class="delivery-pill">名片交付卡</div>
      </div>

      <div class="hero-body">
        <section id="posterCapture" class="poster-canvas" aria-label="海報內容">
          <div class="avatar-wrap">
            <img id="avatarImg" alt="頭像" />
          </div>

          <h2 id="cardName" class="name">載入中...</h2>
          <div id="cardTitle" class="title"></div>

          <div class="qr-zone">
            <div class="qr-frame">
              <div id="qrBox" class="qr-box"></div>
            </div>
          </div>
        </section>

        <div id="statusText" class="status"></div>

        <section class="action-group">
          <h3 class="group-title">主要操作</h3>
          <div class="actions">
            <button id="downloadBtn" class="btn btn-primary" type="button">下載我的名片海報</button>
            <button id="openCardBtn" class="btn btn-soft" type="button">查看我的智慧名片</button>
          </div>
        </section>

        <section class="action-group">
          <h3 class="group-title">分享名片</h3>
          <div class="actions">
            <button id="copyLinkBtn" class="btn btn-soft" type="button">複製我的名片連結</button>
            <button id="shareCardBtn" class="btn btn-soft" type="button">分享我的智慧名片</button>
          </div>
        </section>

        <section class="action-group">
          <h3 class="group-title">推薦與客服</h3>
          <div class="actions">
            <button id="recommendBtn" class="btn btn-soft" type="button">推薦智慧名片館</button>
            <button id="helpBtn" class="btn btn-soft" type="button">分享說明</button>
            <button id="lineOABtn" class="btn btn-line" type="button">LINE 官方帳號</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="shareDialog" class="dialog-mask" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h3 id="dialogTitle" class="dialog-title">分享說明</h3>
      <div class="dialog-body">
        <p>1. 建議先下載名片海報，再把海報圖片傳給對方。</p>
        <p>2. 對方可用微信、LINE、手機相機或掃碼工具，直接掃描 QR code 開啟智慧名片。</p>
        <p>3. 不建議把名片網址直接貼進微信聊天視窗，較容易出現排版異常。</p>
        <p>4. 若想推薦智慧名片服務，請使用「推薦智慧名片館」。</p>
        <p>5. 若需要聯絡客服、開通或訂製，請點「LINE 官方帳號」。</p>
      </div>
      <div class="dialog-actions">
        <button id="dialogCloseBtn" class="btn btn-primary dialog-close" type="button">我知道了</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./poster.js?v=7050"></script>
</body>
</html>
