<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v705.3</title>
  <meta name="theme-color" content="#eef6f0" />

  <style>
    :root{
      --bg1:#f4f8f5;
      --bg2:#e8f2eb;
      --card:#fffefd;
      --paper:#fbfdfb;
      --ink:#355f4d;
      --ink-soft:#628271;
      --muted:#7e978b;
      --line:#dbe7df;
      --line-strong:#cfddd3;
      --accent:#3f6f57;
      --accent-2:#547764;
      --accent-3:#6d8f7f;
      --shadow:0 22px 60px rgba(51,80,66,.10);
      --shadow-soft:0 10px 28px rgba(51,80,66,.06);
      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-sm:14px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1100px 680px at 50% -10%, rgba(255,255,255,.88), transparent 55%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      padding:18px 12px 28px;
      overflow-x:hidden;
    }

    .page{
      width:100%;
      display:flex;
      justify-content:center;
    }

    /* 修正手機並排 */
    .shell{
      width:100%;
      max-width:430px;
    }

    /* 海報截圖區 */
    #posterCapture{
      width:100%;
    }

    .poster-card{
      width:100%;
      background:linear-gradient(180deg,#fff 0%,#fbfdfb 100%);
      border:1px solid var(--line);
      border-radius:32px;
      overflow:hidden;
      box-shadow:var(--shadow);
      position:relative;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:18px 18px 14px;
      border-bottom:1px solid rgba(219,231,223,.75);
      background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(247,251,248,.95));
    }

    .topbar-mark{
      width:36px;
      height:36px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:linear-gradient(180deg,#f7fbf8 0%,#edf5ef 100%);
      border:1px solid var(--line);
      color:var(--accent);
      font-size:15px;
      font-weight:800;
      box-shadow:0 4px 12px rgba(54,82,68,.06);
      flex:0 0 36px;
    }

    .topbar-title{
      margin:0;
      font-size:18px;
      line-height:1.1;
      letter-spacing:.4px;
      font-weight:800;
      color:var(--accent);
    }

    .card-body{
      padding:20px 16px 18px;
    }

    .hero{
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg,#ffffff 0%,#fbfcfb 100%);
      padding:22px 14px 16px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.88);
    }

    .avatar-wrap{
      width:132px;
      height:132px;
      margin:0 auto 16px;
      border-radius:50%;
      padding:5px;
      background:linear-gradient(180deg,#f8fcf9 0%,#edf5ef 100%);
      border:1px solid var(--line);
      box-shadow:0 8px 20px rgba(54,82,68,.08);
      position:relative;
    }

    #avatar,
    #avatarFallback{
      width:100%;
      height:100%;
      border-radius:50%;
      display:block;
    }

    #avatar{
      object-fit:cover;
      background:#f1f5f2;
      border:1px solid #dfe8e1;
    }

    #avatarFallback{
      display:none;
      place-items:center;
      background:linear-gradient(180deg,#eef6f0 0%,#e4f0e7 100%);
      border:1px solid #d9e4dc;
      color:var(--accent);
      font-size:30px;
      font-weight:900;
      letter-spacing:1px;
      user-select:none;
    }

    #name{
      margin:0;
      text-align:center;
      font-size:28px;
      line-height:1.22;
      font-weight:900;
      letter-spacing:.4px;
      color:var(--accent);
      word-break:break-word;
    }

    #unit{
      margin:10px auto 0;
      text-align:center;
      max-width:95%;
      font-size:16px;
      line-height:1.55;
      font-weight:700;
      color:var(--accent-2);
      word-break:break-word;
      white-space:pre-line;
    }

    #title{
      margin:8px auto 0;
      text-align:center;
      max-width:95%;
      font-size:15px;
      line-height:1.5;
      font-weight:700;
      color:var(--accent-3);
      word-break:break-word;
      white-space:pre-line;
    }

    .qr-panel{
      margin:18px 0 0;
      border-radius:24px;
      padding:14px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff 0%,#fbfdfb 100%);
      box-shadow:var(--shadow-soft);
    }

    .qr-core{
      width:min(100%,240px);
      margin:0 auto;
      padding:12px;
      background:#fff;
      border:1px solid var(--line-strong);
      border-radius:20px;
    }

    #qrcode{
      width:100%;
      aspect-ratio:1/1;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:14px;
      background:#fff;
    }

    #qrcode img,
    #qrcode canvas{
      max-width:100%;
      height:auto;
      display:block;
    }

    #qrTip{
      margin:12px 0 0;
      text-align:center;
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.2px;
    }

    .actions{
      display:grid;
      gap:10px;
      margin-top:16px;
    }

    .btn-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    button{
      appearance:none;
      -webkit-appearance:none;
      border:none;
      outline:none;
      font:inherit;
      cursor:pointer;
    }

    .btn{
      min-height:48px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid var(--line-strong);
      background:linear-gradient(180deg,#ffffff 0%,#f7fbf8 100%);
      color:var(--accent);
      font-size:15px;
      line-height:1.3;
      font-weight:800;
      text-align:center;
      box-shadow:
        0 8px 16px rgba(53,81,67,.06),
        inset 0 1px 0 rgba(255,255,255,.9);
    }

    .btn:active{
      transform:translateY(1px);
    }

    .btn-primary{
      background:linear-gradient(180deg,#577d69 0%,#3f6f57 100%);
      color:#fff;
      border:1px solid #4c725f;
      box-shadow:
        0 10px 20px rgba(56,91,73,.16),
        inset 0 1px 0 rgba(255,255,255,.14);
    }

    .status-wrap{
      margin-top:14px;
    }

    #status{
      min-height:22px;
      padding:0 4px;
      text-align:center;
      font-size:13px;
      line-height:1.5;
      color:var(--muted);
      font-weight:700;
    }

    #status[data-type="success"]{ color:#4d7b65; }
    #status[data-type="error"]{ color:#b45454; }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:5px;
      margin-right:6px;
      vertical-align:middle;
    }

    .loading .dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:currentColor;
      display:inline-block;
      opacity:.7;
      animation:blink 1s infinite ease-in-out;
    }

    .loading .dot:nth-child(2){ animation-delay:.15s; }
    .loading .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes blink{
      0%,80%,100%{ transform:scale(.7); opacity:.35; }
      40%{ transform:scale(1); opacity:1; }
    }

    /* 分享說明彈窗 */
    .dialog{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .dialog.is-open{
      display:flex;
    }

    .dialog-backdrop{
      position:absolute;
      inset:0;
      background:rgba(34,48,40,.34);
      backdrop-filter:blur(4px);
    }

    .dialog-panel{
      position:relative;
      z-index:1;
      width:min(100%,360px);
      border-radius:24px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 24px 60px rgba(38,60,48,.18);
      padding:20px 18px 16px;
    }

    .dialog-title{
      margin:0 0 10px;
      text-align:center;
      font-size:18px;
      font-weight:900;
      color:var(--accent);
    }

    .dialog-text{
      margin:0;
      font-size:14px;
      line-height:1.75;
      color:#5f7d6d;
      text-align:left;
      white-space:pre-line;
    }

    .dialog-actions{
      margin-top:14px;
      display:flex;
      justify-content:center;
    }

    .dialog-close{
      min-width:110px;
    }

    @media (max-width: 420px){
      body{ padding:14px 10px 24px; }
      .topbar{ padding:16px 14px 12px; }
      .topbar-title{ font-size:17px; }
      .card-body{ padding:16px 12px 14px; }
      .hero{ padding:18px 12px 14px; }
      .avatar-wrap{ width:122px; height:122px; }
      #name{ font-size:25px; }
      #unit{ font-size:15px; }
      #title{ font-size:14px; }
      .btn-row{ grid-template-columns:1fr; }
      .btn{ font-size:15px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">

      <section id="posterCapture">
        <div class="poster-card">
          <div class="topbar">
            <div class="topbar-mark">天</div>
            <h1 class="topbar-title">天使幸福智慧名片</h1>
          </div>

          <div class="card-body">
            <div class="hero">
              <div class="avatar-wrap">
                <img id="avatar" alt="頭像">
                <div id="avatarFallback" aria-hidden="true"></div>
              </div>

              <h2 id="name">載入中</h2>
              <div id="unit"></div>
              <div id="title"></div>

              <div class="qr-panel">
                <div class="qr-core">
                  <div id="qrcode"></div>
                </div>
                <div id="qrTip">掃描 QRCode 打開智慧名片</div>
              </div>
            </div>

            <div class="actions">
              <button id="btnOpenCard" class="btn btn-primary" type="button">打開我的智慧名片</button>

              <div class="btn-row">
                <button id="btnCopyCard" class="btn" type="button">複製名片連結</button>
                <button id="btnDownload" class="btn" type="button">下載名片海報</button>
              </div>

              <div class="btn-row">
                <button id="btnRecommend" class="btn" type="button">複製推薦連結</button>
                <button id="btnConsult" class="btn" type="button">LINE 官方帳號</button>
              </div>

              <div class="btn-row">
                <button id="btnShare" class="btn" type="button">分享名片</button>
                <button id="btnShareGuide" class="btn" type="button">分享說明</button>
              </div>
            </div>

            <div class="status-wrap">
              <div id="status"></div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div id="shareDialog" class="dialog" aria-hidden="true">
    <div class="dialog-backdrop" data-close-dialog="1"></div>
    <div class="dialog-panel">
      <h3 class="dialog-title">分享建議</h3>
      <p class="dialog-text">若要分享到微信，建議先點「下載名片海報」，再以海報圖片轉傳，呈現會更穩定也更完整。</p>
      <div class="dialog-actions">
        <button id="btnCloseDialog" class="btn dialog-close" type="button">我知道了</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="poster.js?v=7053"></script>
</body>
</html>
