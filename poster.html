<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v702.5</title>
  <meta name="theme-color" content="#f7f1ea" />

  <style>
    :root{
      --bg:#f7f1ea;
      --paper:#fffaf5;
      --card:#fffdf9;
      --ink:#2d241d;
      --muted:#7b6f64;
      --muted-2:#8d8176;
      --line:rgba(92,68,45,.10);
      --accent:#bb7b47;
      --accent-2:#995f32;
      --accent-3:#e8c6a3;
      --gold-soft:#d9b28c;
      --green:#17b655;
      --green-2:#0da94c;
      --shadow:0 20px 55px rgba(91,61,33,.12);
      --shadow-soft:0 10px 28px rgba(91,61,33,.08);
      --shadow-card:0 18px 44px rgba(97,69,44,.09);
      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --max:760px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 560px at 0% 0%, rgba(255,227,196,.28), transparent 54%),
        radial-gradient(860px 520px at 100% 0%, rgba(246,234,220,.72), transparent 56%),
        linear-gradient(180deg,#fdfbf8 0%, #f7f1ea 100%);
    }

    img{ display:block; max-width:100%; }

    .wrap{
      width:min(var(--max), calc(100% - 20px));
      margin:0 auto;
      padding:18px 0 28px;
    }

    .brand-head{
      margin-bottom:14px;
      text-align:center;
    }

    .brand-chip{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(92,68,45,.07);
      box-shadow:var(--shadow-soft);
    }

    .brand-dot{
      width:12px;
      height:12px;
      border-radius:999px;
      background:linear-gradient(135deg,#d89a5b,#f3d7b8);
      box-shadow:0 0 0 6px rgba(216,154,91,.10);
      flex:0 0 auto;
    }

    .brand-chip-text{
      font-size:14px;
      font-weight:800;
      color:var(--accent-2);
      letter-spacing:.03em;
      white-space:nowrap;
    }

    .panel{
      background:rgba(255,255,255,.80);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.72);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .poster-wrap{
      padding:16px;
    }

    .poster-paper{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      padding:24px 22px 22px;
      background:
        radial-gradient(100% 100% at 0% 0%, rgba(255,255,255,.97), rgba(255,251,246,.97) 48%, rgba(251,243,233,.99) 100%);
      border:1px solid rgba(160,108,58,.09);
      box-shadow:
        0 24px 60px rgba(93,62,34,.10),
        inset 0 1px 0 rgba(255,255,255,.94);
      isolation:isolate;
    }

    .poster-paper::before{
      content:"";
      position:absolute;
      left:-14%;
      top:-16%;
      width:62%;
      height:42%;
      background:radial-gradient(circle, rgba(255,225,191,.16), transparent 66%);
      pointer-events:none;
      z-index:0;
    }

    .poster-paper::after{
      content:"";
      position:absolute;
      right:-10%;
      bottom:-12%;
      width:42%;
      height:30%;
      background:radial-gradient(circle, rgba(210,155,102,.12), transparent 68%);
      pointer-events:none;
      z-index:0;
    }

    .poster-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .poster-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .poster-brand{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .poster-brand-kicker{
      font-size:12px;
      color:var(--accent-2);
      font-weight:800;
      letter-spacing:.14em;
    }

    .poster-brand-title{
      font-size:clamp(22px,4.7vw,30px);
      line-height:1.16;
      font-weight:800;
      color:var(--ink);
      white-space:nowrap;
      letter-spacing:.015em;
      word-break:keep-all;
    }

    .poster-brand-sub{
      font-size:13px;
      line-height:1.55;
      color:var(--muted-2);
      font-weight:600;
      letter-spacing:.02em;
      word-break:keep-all;
    }

    .poster-tag{
      flex:0 0 auto;
      padding:9px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(160,108,58,.10);
      box-shadow:0 10px 22px rgba(93,62,34,.06);
      font-size:12px;
      font-weight:800;
      color:var(--accent-2);
      white-space:nowrap;
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      gap:16px;
    }

    .hero-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:18px;
      padding:26px 20px 20px;
      border-radius:28px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,249,242,.98));
      border:1px solid rgba(160,108,58,.08);
      box-shadow:var(--shadow-card);
    }

    .avatar-wrap{
      position:relative;
      width:152px;
      height:152px;
      border-radius:42px;
      overflow:hidden;
      background:
        linear-gradient(135deg, rgba(255,247,238,.94), rgba(243,222,196,.92));
      border:1px solid rgba(188,138,88,.16);
      box-shadow:
        0 16px 30px rgba(93,62,34,.10),
        inset 0 1px 0 rgba(255,255,255,.72);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .avatar-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 42%);
      pointer-events:none;
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:none;
    }

    .avatar-fallback{
      font-size:34px;
      font-weight:800;
      color:#8f6b4e;
      letter-spacing:.05em;
      user-select:none;
    }

    .profile-meta{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .name,
    .unit,
    .title{
      width:100%;
      max-width:100%;
      text-align:center;
      word-break:keep-all;
      overflow-wrap:break-word;
      line-break:strict;
      text-wrap:balance;
      white-space:normal;
    }

    .name{
      font-size:44px;
      line-height:1.12;
      font-weight:800;
      letter-spacing:.02em;
      color:#2f251e;
    }

    .unit{
      font-size:24px;
      line-height:1.42;
      font-weight:600;
      color:var(--muted);
      letter-spacing:.03em;
    }

    .title{
      font-size:28px;
      line-height:1.38;
      font-weight:700;
      color:#56463a;
      letter-spacing:.02em;
    }

    .qr-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:22px 16px 18px;
      border-radius:28px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,250,244,.98));
      border:1px solid rgba(160,108,58,.08);
      box-shadow:var(--shadow-card);
    }

    .qr-box{
      position:relative;
      width:214px;
      height:214px;
      border-radius:26px;
      background:
        linear-gradient(180deg,#ffffff,#fffaf4);
      border:1px solid rgba(64,44,24,.08);
      box-shadow:
        0 14px 30px rgba(93,62,34,.08),
        inset 0 1px 0 rgba(255,255,255,.86);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .qr-box::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:20px;
      border:1px solid rgba(217,178,140,.18);
      pointer-events:none;
    }

    #qrcode{
      width:190px;
      height:190px;
      display:grid;
      place-items:center;
      position:relative;
      z-index:1;
    }

    .qr-box canvas,
    .qr-box img{
      width:190px !important;
      height:190px !important;
      image-rendering:pixelated;
    }

    .qr-badge{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:52px;
      height:52px;
      border-radius:999px;
      background:linear-gradient(135deg,#efc18c,#fff2df 62%,#d78d48);
      border:4px solid #fff;
      box-shadow:0 8px 18px rgba(93,62,34,.14);
      display:grid;
      place-items:center;
      z-index:2;
      font-size:21px;
      line-height:1;
    }

    .qr-tip{
      margin:0;
      font-size:16px;
      line-height:1.7;
      font-weight:700;
      color:var(--accent-2);
      text-align:center;
      letter-spacing:.02em;
      word-break:keep-all;
    }

    .action-panel{
      margin-top:14px;
      padding:14px;
    }

    .action-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius:16px;
      min-height:54px;
      width:100%;
      padding:14px 16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-align:center;
      font-size:15px;
      font-weight:800;
      line-height:1.45;
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease, background .16s ease;
    }

    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,#c88749,#9f6234);
      box-shadow:0 14px 28px rgba(158,98,52,.22);
    }

    .btn-soft{
      color:var(--ink);
      background:linear-gradient(180deg,#fffdfa,#fff6ee);
      border:1px solid rgba(64,44,24,.08);
      box-shadow:var(--shadow-soft);
    }

    .btn-ghost{
      color:var(--accent-2);
      background:rgba(255,255,255,.74);
      border:1px dashed rgba(186,126,70,.22);
      box-shadow:var(--shadow-soft);
    }

    .btn-line{
      color:#fff;
      background:linear-gradient(135deg,#17b655,#0da94c);
      box-shadow:0 14px 28px rgba(13,169,76,.20);
    }

    .status{
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.74);
      border:1px solid rgba(64,44,24,.07);
      color:#6f6258;
      font-size:14px;
      line-height:1.7;
      box-shadow:var(--shadow-soft);
      word-break:break-word;
    }

    .status[data-type="error"]{
      background:#fff1f0;
      border-color:rgba(194,58,43,.14);
      color:#a14139;
    }

    .status[data-type="success"]{
      background:#f4fbf6;
      border-color:rgba(44,131,76,.12);
      color:#2f7b49;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:999px;
      background:#c98749;
      animation:pop 1s infinite ease-in-out;
    }

    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes pop{
      0%,80%,100%{ transform:scale(.75); opacity:.42; }
      40%{ transform:scale(1); opacity:1; }
    }

    @media (max-width: 720px){
      .wrap{
        width:min(100%, calc(100% - 14px));
        padding:14px 0 22px;
      }

      .poster-wrap,
      .action-panel{
        padding:12px;
      }

      .poster-paper{
        padding:18px 16px 16px;
        border-radius:24px;
      }

      .poster-top{
        flex-direction:column;
        align-items:flex-start;
      }

      .poster-brand-title{
        white-space:normal;
      }

      .avatar-wrap{
        width:132px;
        height:132px;
        border-radius:36px;
      }

      .name{ font-size:35px; }
      .unit{ font-size:20px; }
      .title{ font-size:23px; }

      .qr-box{
        width:198px;
        height:198px;
      }

      #qrcode{
        width:176px;
        height:176px;
      }

      .qr-box canvas,
      .qr-box img{
        width:176px !important;
        height:176px !important;
      }

      .action-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-head">
      <div class="brand-chip">
        <div class="brand-dot"></div>
        <div class="brand-chip-text">智慧名片交付卡</div>
      </div>
    </div>

    <section class="panel poster-wrap">
      <div id="poster" class="poster-paper">
        <div class="poster-inner">
          <div class="poster-top">
            <div class="poster-brand">
              <div class="poster-brand-kicker">HAPPINESS SMART CARD</div>
              <div class="poster-brand-title">天使幸福智慧名片</div>
              <div class="poster-brand-sub">可分享的專屬名片入口</div>
            </div>
            <div class="poster-tag">交付卡</div>
          </div>

          <div class="hero">
            <div class="hero-card">
              <div class="avatar-wrap">
                <img id="avatar" class="avatar" alt="頭像" />
                <div id="avatarFallback" class="avatar-fallback">名片</div>
              </div>

              <div class="profile-meta">
                <div id="name" class="name">載入中...</div>
                <div id="unit" class="unit">　</div>
                <div id="title" class="title">　</div>
              </div>
            </div>

            <div class="qr-card">
              <div class="qr-box">
                <div id="qrcode"></div>
                <div class="qr-badge" aria-hidden="true">✨</div>
              </div>
              <p id="qrTip" class="qr-tip">掃描 QRCode 打開智慧名片</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel action-panel">
      <div class="action-grid">
        <button id="btnDownload" class="btn btn-primary" type="button">下載名片海報</button>
        <button id="btnOpenCard" class="btn btn-soft" type="button">打開我的智慧名片</button>
        <button id="btnCopyCard" class="btn btn-soft" type="button">複製我的智慧名片連結</button>
        <button id="btnRecommend" class="btn btn-ghost" type="button">推薦智慧名片</button>
        <button id="btnConsult" class="btn btn-line" type="button">聯繫 LINE 官方帳號</button>
      </div>

      <div id="status" class="status">
        <span class="loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        正在載入交付卡資料...
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./imageResolver.js?v=5342"></script>
  <script src="./poster.js?v=7024"></script>
</body>
</html>
