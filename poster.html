<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微信名片海報</title>

<style>

body{
font-family:system-ui;
background:#f6f1e8;
margin:0;
padding:20px;
}

.container{
max-width:760px;
margin:auto;
}

.poster{
background:white;
border-radius:20px;
padding:24px;
box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.header{
display:flex;
gap:16px;
align-items:center;
}

.avatar{
width:100px;
height:100px;
border-radius:100px;
object-fit:cover;
background:#eee;
}

.name{
font-size:32px;
font-weight:900;
}

.unit{
font-size:18px;
opacity:.8;
}

.title{
font-size:20px;
font-weight:700;
}

.section{
margin-top:20px;
}

.qr{
margin-top:20px;
text-align:center;
}

.qr canvas{
width:220px !important;
height:220px !important;
}

.buttons{
margin-top:24px;
display:flex;
flex-direction:column;
gap:10px;
}

button,a{
padding:14px;
border-radius:12px;
font-weight:700;
border:none;
cursor:pointer;
text-align:center;
text-decoration:none;
}

.primary{
background:#1f7a66;
color:white;
}

.secondary{
background:white;
border:1px solid #ddd;
color:#333;
}

.status{
margin-top:10px;
font-size:13px;
opacity:.7;
}

</style>

</head>
<body>

<div class="container">

<div class="poster" id="poster">

<div class="header">
<img id="avatar" class="avatar">
<div>
<div id="name" class="name">載入中...</div>
<div id="unit" class="unit"></div>
<div id="title" class="title"></div>
</div>
</div>

<div id="slogan" class="section"></div>

<div id="services" class="section"></div>

<div id="exp" class="section"></div>

<div class="qr">
<div id="qrcode"></div>
<div>掃碼查看完整智慧名片</div>
</div>

</div>

<div class="buttons">

<button id="download" class="primary">下載名片海報</button>

<a id="openCard" class="secondary">查看智慧名片</a>

<button id="copyLink" class="secondary">複製名片連結</button>

<a href="https://angel0973180707.github.io/Happiness-Smart-Card-System/" class="secondary">
智慧名片首頁
</a>

</div>

<div id="status" class="status"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="poster.js?v=5231"></script>

</body>
</html>
