<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v703.4</title>
  <meta name="theme-color" content="#e7f1ea" />

  <style>
    *{ box-sizing:border-box; }

    html,body{ margin:0; padding:0; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:linear-gradient(180deg,#f7fbf8 0%,#e8f3ec 60%,#d9eadf 100%);
      color:#2e4a3a;
      display:flex;
      justify-content:center;
    }

    img{ display:block; max-width:100%; }

    .wrap{
      width:100%;
      max-width:460px;
      padding:28px 20px 60px;
    }

    .brand-head{
      margin-bottom:22px;
    }

    .brand-en{
      font-size:14px;
      letter-spacing:2px;
      color:#6c8f7c;
      margin-bottom:8px;
      font-weight:700;
    }

    .brand-title{
      font-size:26px;
      font-weight:700;
      color:#3e6f57;
      line-height:1.22;
      margin:0;
    }

    .brand-sub{
      font-size:14px;
      color:#7a9a89;
      margin-top:8px;
      line-height:1.5;
    }

    .brand-tag{
      display:inline-block;
      margin-top:14px;
      padding:7px 14px;
      border-radius:999px;
      background:#edf6f0;
      color:#4f7a63;
      font-size:13px;
      font-weight:700;
      border:1px solid #e4eee8;
    }

    .poster{
      background:#fff;
      border-radius:26px;
      padding:28px 24px;
      box-shadow:0 20px 40px rgba(0,0,0,.05);
      margin-bottom:22px;
      text-align:center;
    }

    .avatar-wrap{
      width:120px;
      height:120px;
      margin:0 auto 16px;
      border-radius:26px;
      overflow:hidden;
      background:#f4f7f5;
      border:1px solid #e7ece9;
      display:grid;
      place-items:center;
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:none;
    }

    .avatar-fallback{
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      font-size:30px;
      font-weight:700;
      color:#6c8f7c;
      letter-spacing:.06em;
      user-select:none;
    }

    .name,
    .unit,
    .title{
      width:100%;
      max-width:100%;
      text-align:center;
      word-break:keep-all;
      overflow-wrap:break-word;
      white-space:normal;
      line-height:1.28;
    }

    .name{
      font-size:32px;
      font-weight:700;
      margin:0 0 12px;
      color:#3f6d57;
    }

    .unit{
      font-size:18px;
      margin:0 0 8px;
      color:#537e67;
    }

    .title{
      font-size:18px;
      margin:0;
      color:#537e67;
    }

    .qr-card{
      background:#fff;
      border-radius:26px;
      padding:24px 20px;
      box-shadow:0 20px 40px rgba(0,0,0,.05);
      text-align:center;
      margin-bottom:22px;
    }

    .qr-box{
      width:220px;
      height:220px;
      margin:0 auto;
      border-radius:24px;
      background:#fff;
      border:1px solid #e6ece8;
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    #qrcode{
      width:200px;
      height:200px;
      display:grid;
      place-items:center;
    }

    #qrcode canvas,
    #qrcode img{
      width:200px !important;
      height:200px !important;
      image-rendering:pixelated;
    }

    .qr-text{
      margin-top:14px;
      color:#547e68;
      font-size:16px;
      line-height:1.55;
      font-weight:700;
    }

    .actions{
      background:rgba(255,255,255,.58);
      border:1px solid rgba(255,255,255,.7);
      border-radius:26px;
      padding:14px;
      box-shadow:0 16px 34px rgba(0,0,0,.04);
      backdrop-filter:blur(8px);
    }

    .btn{
      appearance:none;
      border:none;
      display:block;
      width:100%;
      padding:15px 16px;
      border-radius:22px;
      text-align:center;
      font-size:16px;
      font-weight:700;
      margin-top:12px;
      text-decoration:none;
      cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .btn:first-child{ margin-top:0; }

    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-main{
      background:linear-gradient(135deg,#5da57e,#3f8762);
      color:#fff;
      box-shadow:0 10px 22px rgba(63,135,98,.18);
    }

    .btn-soft{
      background:#f3f8f5;
      border:1px solid #cfe2d6;
      color:#3f6d57;
      box-shadow:0 6px 14px rgba(0,0,0,.03);
    }

    .btn-soft:hover{
      background:#e9f3ed;
    }

    .btn-dash{
      background:#f7fbf8;
      border:1.5px dashed #bcd6c7;
      color:#4c7b63;
      box-shadow:0 6px 14px rgba(0,0,0,.02);
    }

    .status{
      margin-top:14px;
      background:#eef6f1;
      border:1px solid #dbe9e0;
      border-radius:20px;
      padding:14px 16px;
      text-align:center;
      color:#4c7b63;
      font-size:15px;
      line-height:1.6;
      min-height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      word-break:break-word;
    }

    .status[data-type="error"]{
      background:#fff1f0;
      border-color:rgba(194,58,43,.14);
      color:#a14139;
    }

    .status[data-type="success"]{
      background:#f4fbf6;
      border-color:rgba(44,131,76,.12);
      color:#2f7b49;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#5aa97c;
      animation:pop 1s infinite ease-in-out;
    }

    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes pop{
      0%,80%,100%{ transform:scale(.75); opacity:.42; }
      40%{ transform:scale(1); opacity:1; }
    }

    @media (max-width: 520px){
      .wrap{
        padding:24px 16px 52px;
      }

      .poster,
      .qr-card{
        padding:24px 18px;
      }

      .avatar-wrap{
        width:112px;
        height:112px;
        border-radius:24px;
      }

      .name{ font-size:28px; }
      .unit{ font-size:17px; }
      .title{ font-size:17px; }

      .qr-box{
        width:204px;
        height:204px;
      }

      #qrcode{
        width:184px;
        height:184px;
      }

      #qrcode canvas,
      #qrcode img{
        width:184px !important;
        height:184px !important;
      }

      .btn{
        font-size:15px;
        padding:14px 15px;
        border-radius:20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="brand-head">
      <div class="brand-en">HAPPINESS SMART CARD</div>
      <h1 class="brand-title">天使幸福智慧名片</h1>
      <div class="brand-sub">可分享的專屬名片入口</div>
      <div class="brand-tag">交付卡</div>
    </div>

    <div id="poster" class="poster">
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" alt="頭像" />
        <div id="avatarFallback" class="avatar-fallback">名片</div>
      </div>

      <div id="name" class="name">載入中...</div>
      <div id="unit" class="unit">　</div>
      <div id="title" class="title">　</div>
    </div>

    <div class="qr-card">
      <div class="qr-box">
        <div id="qrcode"></div>
      </div>
      <div id="qrTip" class="qr-text">掃描 QRCode 打開智慧名片</div>
    </div>

    <div class="actions">
      <button id="btnDownload" class="btn btn-main" type="button">下載名片海報</button>
      <button id="btnOpenCard" class="btn btn-soft" type="button">打開我的智慧名片</button>
      <button id="btnCopyCard" class="btn btn-soft" type="button">複製我的智慧名片連結</button>
      <button id="btnRecommend" class="btn btn-dash" type="button">推薦智慧名片</button>
      <button id="btnConsult" class="btn btn-main" type="button">聯繫 LINE 官方帳號</button>

      <div id="status" class="status">
        <span class="loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        正在載入交付卡資料...
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./imageResolver.js?v=7034"></script>
  <script src="./poster.js?v=7034"></script>
</body>
</html>
