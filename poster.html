<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v534.2</title>
  <meta name="theme-color" content="#f7f1ea" />

  <style>
    :root{
      --bg:#f7f1ea;
      --card:#fffaf5;
      --ink:#2d241d;
      --muted:#7d7065;
      --line:rgba(75,52,31,.10);
      --accent:#be7d47;
      --accent-2:#9a6030;
      --shadow:0 18px 48px rgba(91,61,33,.12);
      --shadow-soft:0 10px 28px rgba(91,61,33,.08);
      --radius-xl:30px;
      --radius-lg:22px;
      --radius-md:18px;
      --max:760px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      min-height:100vh;
      background:
        radial-gradient(900px 540px at 0% 0%, rgba(255,224,191,.36), transparent 54%),
        radial-gradient(900px 540px at 100% 0%, rgba(250,235,219,.72), transparent 54%),
        linear-gradient(180deg,#fdfaf6, var(--bg));
    }

    img{ display:block; max-width:100%; }

    .wrap{
      width:min(var(--max), calc(100% - 20px));
      margin:0 auto;
      padding:18px 0 28px;
    }

    .top{
      text-align:center;
      margin-bottom:14px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(75,52,31,.08);
      box-shadow:var(--shadow-soft);
      font-size:14px;
      font-weight:900;
      color:var(--accent-2);
    }

    .brand-mark{
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#efc18c,#fff2df 62%,#d78d48);
      font-size:18px;
      box-shadow:var(--shadow-soft);
    }

    .panel{
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.72);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .poster-wrap{
      padding:16px;
    }

    .poster-paper{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      padding:18px;
      background:
        radial-gradient(110% 110% at 0% 0%, rgba(255,255,255,.95), rgba(255,250,244,.96) 46%, rgba(252,243,232,.98) 100%);
      border:1px solid rgba(160,108,58,.10);
      box-shadow:
        0 24px 60px rgba(93,62,34,.14),
        inset 0 1px 0 rgba(255,255,255,.92);
      isolation:isolate;
    }

    .poster-paper::before{
      content:"";
      position:absolute;
      inset:-26% auto auto -12%;
      width:70%;
      height:48%;
      background:radial-gradient(circle, rgba(255,222,186,.42), transparent 64%);
      z-index:0;
      pointer-events:none;
    }

    .poster-paper::after{
      content:"";
      position:absolute;
      right:-8%;
      bottom:-12%;
      width:48%;
      height:34%;
      background:radial-gradient(circle, rgba(210,155,102,.18), transparent 66%);
      z-index:0;
      pointer-events:none;
    }

    .poster-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .mini-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .mini-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .mini-mark{
      width:40px;
      height:40px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#efc18c,#fff2df 62%,#d78d48);
      font-size:18px;
      box-shadow:var(--shadow-soft);
      flex:0 0 auto;
    }

    .mini-text{ min-width:0; }
    .mini-title{
      font-size:15px;
      font-weight:900;
      line-height:1.2;
    }
    .mini-sub{
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
      line-height:1.4;
    }

    .badge{
      white-space:nowrap;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(160,108,58,.12);
      box-shadow:var(--shadow-soft);
      font-size:12px;
      font-weight:900;
      color:var(--accent-2);
    }

    .profile-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:12px;
      padding:18px 16px;
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,247,238,.96));
      border:1px solid rgba(160,108,58,.10);
      box-shadow:var(--shadow-soft);
    }

    .avatar-wrap{
      width:116px;
      height:116px;
      border-radius:30px;
      overflow:hidden;
      background:linear-gradient(135deg,#f2d3b3,#fbf3e9);
      border:1px solid rgba(160,108,58,.12);
      box-shadow:0 10px 22px rgba(93,62,34,.10);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:none;
    }

    .avatar-fallback{
      font-size:30px;
      font-weight:900;
      color:#8f6b4e;
      letter-spacing:.06em;
      user-select:none;
    }

    .profile-meta{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      min-width:0;
    }

    .name{
      font-size:30px;
      line-height:1.18;
      font-weight:900;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .unit{
      font-size:16px;
      color:var(--muted);
      line-height:1.5;
      font-weight:800;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .title{
      font-size:18px;
      color:#534338;
      line-height:1.5;
      font-weight:900;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .qr-card{
      padding:16px;
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,248,240,.95));
      border:1px solid rgba(160,108,58,.10);
      box-shadow:var(--shadow-soft);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }

    .qr-box{
      position:relative;
      width:164px;
      height:164px;
      border-radius:22px;
      background:#fff;
      border:1px solid rgba(64,44,24,.10);
      box-shadow:0 10px 22px rgba(93,62,34,.09);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    #qrcode{
      width:150px;
      height:150px;
      display:grid;
      place-items:center;
    }

    .qr-box canvas,
    .qr-box img{
      width:150px !important;
      height:150px !important;
      image-rendering:pixelated;
    }

    .qr-badge{
      position:absolute;
      inset:50% auto auto 50%;
      transform:translate(-50%,-50%);
      width:42px;
      height:42px;
      border-radius:999px;
      background:linear-gradient(135deg,#efc18c,#fff2df 62%,#d78d48);
      border:3px solid #fff;
      box-shadow:0 8px 18px rgba(93,62,34,.18);
      display:grid;
      place-items:center;
      z-index:2;
      font-size:20px;
      line-height:1;
    }

    .qr-tip{
      font-size:15px;
      color:var(--accent-2);
      line-height:1.6;
      text-align:center;
      margin:0;
      font-weight:900;
      word-break:keep-all;
    }

    .footer-id{
      margin-top:2px;
      white-space:nowrap;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(64,44,24,.08);
      box-shadow:0 6px 16px rgba(93,62,34,.05);
      font-size:12px;
      color:#6e5c50;
      font-weight:900;
    }

    .action-panel{
      margin-top:14px;
      padding:14px;
    }

    .action-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius:16px;
      padding:14px 16px;
      min-height:50px;
      font-size:15px;
      font-weight:900;
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease, background .16s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:100%;
      text-align:center;
      line-height:1.4;
    }

    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,#c88749,#9f6234);
      box-shadow:0 14px 28px rgba(158,98,52,.24);
    }

    .btn-soft{
      color:var(--ink);
      background:linear-gradient(180deg,#fffdfa,#fff6ee);
      border:1px solid rgba(64,44,24,.10);
      box-shadow:var(--shadow-soft);
    }

    .btn-ghost{
      color:var(--accent-2);
      background:rgba(255,255,255,.72);
      border:1px dashed rgba(186,126,70,.26);
      box-shadow:var(--shadow-soft);
    }

    .status{
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(64,44,24,.08);
      color:#6f6258;
      font-size:14px;
      line-height:1.7;
      box-shadow:var(--shadow-soft);
      word-break:break-word;
    }

    .status[data-type="error"]{
      background:#fff1f0;
      border-color:rgba(194,58,43,.14);
      color:#a14139;
    }

    .status[data-type="success"]{
      background:#f4fbf6;
      border-color:rgba(44,131,76,.12);
      color:#2f7b49;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:999px;
      background:#c98749;
      animation:pop 1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes pop{
      0%,80%,100%{ transform:scale(.75); opacity:.42; }
      40%{ transform:scale(1); opacity:1; }
    }

    @media (max-width: 720px){
      .wrap{
        width:min(100%, calc(100% - 14px));
        padding:14px 0 22px;
      }

      .poster-wrap,
      .action-panel{
        padding:12px;
      }

      .poster-paper{
        padding:14px;
        border-radius:24px;
      }

      .avatar-wrap{
        width:100px;
        height:100px;
        border-radius:26px;
      }

      .name{ font-size:26px; }
      .unit{ font-size:15px; }
      .title{ font-size:17px; }

      .action-grid{
        grid-template-columns:1fr;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="brand-mark">💳</div>
        <span>智慧名片交付卡</span>
      </div>
    </div>

    <section class="panel poster-wrap">
      <div id="poster" class="poster-paper">
        <div class="poster-inner">
          <div class="mini-top">
            <div class="mini-left">
              <div class="mini-mark">✨</div>
              <div class="mini-text">
                <div class="mini-title">天使幸福智慧名片</div>
                <div class="mini-sub">可分享的專屬名片入口</div>
              </div>
            </div>
            <div class="badge">交付卡</div>
          </div>

          <div class="profile-card">
            <div class="avatar-wrap">
              <img id="avatar" class="avatar" alt="頭像" />
              <div id="avatarFallback" class="avatar-fallback">名片</div>
            </div>

            <div class="profile-meta">
              <div id="name" class="name">載入中...</div>
              <div id="unit" class="unit">　</div>
              <div id="title" class="title">　</div>
            </div>
          </div>

          <div class="qr-card">
            <div class="qr-box">
              <div id="qrcode"></div>
              <div class="qr-badge" aria-hidden="true">✨</div>
            </div>
            <p id="qrTip" class="qr-tip">掃描QRCode查閱智慧名片</p>
            <div id="footerId" class="footer-id">ID：--</div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel action-panel">
      <div class="action-grid">
        <button id="btnDownload" class="btn btn-primary" type="button">下載名片海報</button>
        <button id="btnOpenCard" class="btn btn-soft" type="button">打開我的智慧名片</button>
        <button id="btnCopyCard" class="btn btn-soft" type="button">複製我的智慧名片連結</button>
        <button id="btnShareLine" class="btn btn-soft" type="button">分享到LINE</button>
        <button id="btnCopyWechat" class="btn btn-soft" type="button">複製連結到微信</button>
        <button id="btnShareHall" class="btn btn-ghost" type="button">分享智慧名片館</button>
        <button id="btnConsult" class="btn btn-ghost" type="button">名片諮詢服務</button>
      </div>

      <div id="status" class="status">
        <span class="loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        正在載入交付卡資料...
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./imageResolver.js?v=5341"></script>
  <script src="./poster.js?v=5342"></script>
</body>
</html>
