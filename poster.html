<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>微信名片海報</title>

  <style>
    body{
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:#f6f1e8;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:760px;
      margin:auto;
    }

    .poster{
      background:#fff;
      border-radius:20px;
      padding:28px 24px 24px;
      box-shadow:0 20px 60px rgba(0,0,0,.15);
    }

    .header{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
    }

    .avatar{
      width:120px;
      height:120px;
      border-radius:999px;
      object-fit:cover;
      background:#eee;
      display:block;
    }

    .name{
      font-size:34px;
      font-weight:900;
      line-height:1.15;
      word-break:keep-all;
      line-break:strict;
    }

    .unit{
      font-size:18px;
      opacity:.82;
      line-height:1.45;
      word-break:keep-all;
      line-break:strict;
    }

    .title{
      font-size:22px;
      font-weight:800;
      line-height:1.35;
      word-break:keep-all;
      line-break:strict;
      max-width:100%;
    }

    .section{
      margin-top:22px;
      white-space:pre-wrap;
      word-break:break-word;
      line-height:1.7;
      text-align:center;
      font-size:18px;
    }

    .qr{
      margin-top:26px;
      text-align:center;
    }

    #qrcode{
      display:block;
      margin:0 auto 10px;
      width:220px !important;
      height:220px !important;
      max-width:100%;
      background:#fff;
      border-radius:12px;
    }

    .qr-note{
      font-size:16px;
      line-height:1.5;
    }

    .buttons{
      margin-top:24px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    button,a{
      padding:16px 14px;
      border-radius:16px;
      font-weight:800;
      border:none;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      font-size:18px;
      box-sizing:border-box;
    }

    .primary{
      background:#1f7a66;
      color:#fff;
    }

    .secondary{
      background:#fff;
      border:1px solid #ddd;
      color:#333;
    }

    .status{
      margin-top:10px;
      font-size:13px;
      opacity:.7;
      min-height:18px;
    }

    @media (max-width:640px){
      body{
        padding:14px;
      }

      .poster{
        padding:22px 18px 18px;
      }

      .avatar{
        width:108px;
        height:108px;
      }

      .name{
        font-size:30px;
      }

      .unit{
        font-size:16px;
      }

      .title{
        font-size:20px;
      }

      .section{
        font-size:16px;
        line-height:1.65;
      }

      button,a{
        font-size:17px;
        padding:15px 12px;
      }

      #qrcode{
        width:200px !important;
        height:200px !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="poster" id="poster">

      <div class="header">
        <img id="avatar" class="avatar" alt="avatar">
        <div id="name" class="name">載入中...</div>
        <div id="unit" class="unit"></div>
        <div id="title" class="title"></div>
      </div>

      <div id="slogan" class="section" style="display:none;"></div>
      <div id="services" class="section" style="display:none;"></div>
      <div id="exp" class="section" style="display:none;"></div>

      <div class="qr">
        <canvas id="qrcode"></canvas>
        <div class="qr-note">掃碼查看完整智慧名片</div>
      </div>

    </div>

    <div class="buttons">
      <button id="download" class="primary" type="button">下載名片海報</button>

      <a id="openCard" class="secondary" href="javascript:void(0)">查看智慧名片</a>

      <button id="copyLink" class="secondary" type="button">複製名片連結</button>

      <a href="https://angel0973180707.github.io/Happiness-Smart-Card-System/" class="secondary">
        智慧名片首頁
      </a>
    </div>

    <div id="status" class="status"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="poster.js?v=5236"></script>

</body>
</html>
