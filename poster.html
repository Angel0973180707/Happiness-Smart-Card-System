<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v703.1</title>
  <meta name="theme-color" content="#eaf5ec" />

  <style>
    :root{
      --bg:#eaf5ec;
      --bg-2:#dff1e3;
      --bg-3:#f7fcf8;
      --paper:#f9fffa;
      --paper-2:#eef8f0;
      --card:#ffffff;
      --ink:#264c3a;
      --name-ink:#2f5e47;
      --muted:#6f8579;
      --muted-2:#83978c;
      --line:rgba(47,94,71,.10);
      --accent:#67a37f;
      --accent-2:#3f7759;
      --accent-3:#cfe9d4;
      --green:#58a97d;
      --green-2:#3f8d66;
      --glass:rgba(255,255,255,.60);
      --glass-2:rgba(255,255,255,.78);
      --shadow:0 20px 55px rgba(39,82,60,.11);
      --shadow-soft:0 10px 28px rgba(39,82,60,.07);
      --shadow-card:0 20px 48px rgba(39,82,60,.09);
      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --max:760px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }

    body{
      min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 500px at 0% 0%, rgba(230,247,236,.95), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(214,238,222,.75), transparent 60%),
        linear-gradient(180deg,#f8fcf9 0%,#eaf5ec 100%);
    }

    img{ display:block; max-width:100%; }

    .wrap{
      width:min(var(--max), calc(100% - 20px));
      margin:0 auto;
      padding:18px 0 28px;
    }

    .brand-head{
      margin-bottom:14px;
      text-align:center;
    }

    .brand-chip{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(246,252,247,.76));
      border:1px solid rgba(255,255,255,.70);
      box-shadow:
        0 12px 24px rgba(39,82,60,.07),
        inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter:blur(10px);
    }

    .brand-dot{
      width:12px;
      height:12px;
      border-radius:999px;
      background:linear-gradient(135deg,#70b48a,#d9f1e0);
      box-shadow:0 0 0 6px rgba(112,180,138,.10);
      flex:0 0 auto;
    }

    .brand-chip-text{
      font-size:14px;
      font-weight:800;
      color:var(--accent-2);
      letter-spacing:.03em;
      white-space:nowrap;
    }

    .panel{
      background:
        linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.45));
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.72);
      border-radius:var(--radius-xl);
      box-shadow:
        0 30px 60px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.92),
        inset 0 -6px 10px rgba(0,0,0,.03);
      overflow:hidden;
    }

    .poster-wrap{
      padding:16px;
    }

    .poster-paper{
      position:relative;
      overflow:hidden;
      border-radius:28px;
      padding:24px 22px 22px;
      background:
        radial-gradient(120% 110% at 0% 0%, rgba(255,255,255,.99), rgba(246,252,247,.98) 46%, rgba(228,245,232,.98) 100%);
      border:1px solid rgba(118,177,141,.16);
      box-shadow:
        0 28px 66px rgba(39,82,60,.10),
        inset 0 1px 0 rgba(255,255,255,.98),
        inset 0 -18px 30px rgba(214,239,221,.18);
      isolation:isolate;
    }

    .poster-paper::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(221,242,227,.22), rgba(255,255,255,0) 28%);
      pointer-events:none;
      z-index:0;
    }

    .poster-paper::after{
      content:"";
      position:absolute;
      right:-10%;
      bottom:-12%;
      width:46%;
      height:34%;
      background:radial-gradient(circle, rgba(124,193,154,.14), transparent 68%);
      pointer-events:none;
      z-index:0;
    }

    .poster-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .poster-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .poster-brand{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .poster-brand-kicker{
      font-size:11px;
      color:var(--accent-2);
      font-weight:700;
      letter-spacing:.16em;
      opacity:.88;
    }

    .poster-brand-title{
      font-size:clamp(20px,4.1vw,27px);
      line-height:1.16;
      font-weight:700;
      color:var(--name-ink);
      white-space:nowrap;
      letter-spacing:.02em;
      word-break:keep-all;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    }

    .poster-brand-sub{
      font-size:13px;
      line-height:1.55;
      color:var(--muted-2);
      font-weight:600;
      letter-spacing:.02em;
      word-break:keep-all;
    }

    .poster-tag{
      flex:0 0 auto;
      padding:9px 14px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(242,250,244,.82));
      border:1px solid rgba(255,255,255,.74);
      box-shadow:
        0 10px 24px rgba(39,82,60,.06),
        inset 0 1px 0 rgba(255,255,255,.94);
      font-size:12px;
      font-weight:800;
      color:var(--accent-2);
      white-space:nowrap;
      backdrop-filter:blur(8px);
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      gap:16px;
    }

    .hero-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:18px;
      padding:26px 20px 20px;
      border-radius:28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.86), rgba(244,251,245,.76));
      border:1px solid rgba(255,255,255,.74);
      box-shadow:
        0 20px 48px rgba(39,82,60,.08),
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -10px 18px rgba(214,239,221,.10);
      backdrop-filter:blur(12px);
    }

    .avatar-wrap{
      position:relative;
      width:152px;
      height:152px;
      border-radius:42px;
      overflow:hidden;
      background:
        linear-gradient(135deg, rgba(249,255,250,.98), rgba(225,243,231,.92));
      border:1px solid rgba(117,177,141,.18);
      box-shadow:
        0 18px 34px rgba(39,82,60,.10),
        inset 0 1px 0 rgba(255,255,255,.82),
        0 0 0 8px rgba(255,255,255,.22);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .avatar-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 42%);
      pointer-events:none;
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:none;
    }

    .avatar-fallback{
      font-size:34px;
      font-weight:800;
      color:#5c8a71;
      letter-spacing:.05em;
      user-select:none;
    }

    .profile-meta{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .name,
    .unit,
    .title{
      width:100%;
      max-width:100%;
      text-align:center;
      word-break:keep-all;
      overflow-wrap:break-word;
      line-break:strict;
      text-wrap:balance;
      white-space:normal;
    }

    .name{
      font-size:44px;
      line-height:1.12;
      font-weight:700;
      letter-spacing:.02em;
      color:var(--name-ink);
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
      text-shadow:0 1px 0 rgba(255,255,255,.30);
    }

    .unit{
      font-size:24px;
      line-height:1.42;
      font-weight:600;
      color:var(--muted);
      letter-spacing:.03em;
    }

    .title{
      font-size:28px;
      line-height:1.38;
      font-weight:700;
      color:#3f6a54;
      letter-spacing:.02em;
    }

    .qr-card{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:22px 16px 18px;
      border-radius:28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(244,251,245,.78));
      border:1px solid rgba(255,255,255,.74);
      box-shadow:
        0 20px 48px rgba(39,82,60,.08),
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -10px 18px rgba(214,239,221,.10);
      backdrop-filter:blur(12px);
    }

    .qr-box{
      position:relative;
      width:214px;
      height:214px;
      border-radius:26px;
      background:
        linear-gradient(180deg,#ffffff,#f4fbf5);
      border:1px solid rgba(255,255,255,.80);
      box-shadow:
        0 16px 34px rgba(39,82,60,.08),
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 -8px 12px rgba(214,239,221,.10);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .qr-box::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:20px;
      border:1px solid rgba(134,196,160,.18);
      pointer-events:none;
    }

    #qrcode{
      width:190px;
      height:190px;
      display:grid;
      place-items:center;
      position:relative;
      z-index:1;
    }

    .qr-box canvas,
    .qr-box img{
      width:190px !important;
      height:190px !important;
      image-rendering:pixelated;
    }

    .qr-badge{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:52px;
      height:52px;
      border-radius:999px;
      background:linear-gradient(135deg,#8ac6a0,#f2fff6 62%,#4fa777);
      border:4px solid #fff;
      box-shadow:0 8px 18px rgba(39,82,60,.12);
      display:grid;
      place-items:center;
      z-index:2;
      font-size:21px;
      line-height:1;
    }

    .qr-tip{
      margin:0;
      font-size:16px;
      line-height:1.7;
      font-weight:700;
      color:var(--accent-2);
      text-align:center;
      letter-spacing:.02em;
      word-break:keep-all;
    }

    .action-panel{
      margin-top:14px;
      padding:14px;
    }

    .action-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      border-radius:16px;
      min-height:54px;
      width:100%;
      padding:14px 16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-align:center;
      font-size:15px;
      font-weight:800;
      line-height:1.45;
      transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease, background .16s ease;
    }

    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-primary{
      color:#fff;
      background:linear-gradient(135deg,#58a97d,#3f8d66);
      box-shadow:
        0 12px 24px rgba(63,141,102,.22),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .btn-soft{
      color:#2f5e47;
      background:linear-gradient(180deg,#f7fcf8,#eef7f1);
      border:1px solid rgba(255,255,255,.78);
      box-shadow:
        0 8px 18px rgba(39,82,60,.06),
        inset 0 1px 0 rgba(255,255,255,.94);
    }

    .btn-ghost{
      color:#4b7b62;
      background:linear-gradient(180deg,#fbfefd,#f3faf5);
      border:1px dashed rgba(86,149,112,.24);
      box-shadow:
        0 8px 18px rgba(39,82,60,.05),
        inset 0 1px 0 rgba(255,255,255,.92);
    }

    .btn-line{
      color:#fff;
      background:linear-gradient(135deg,#58a97d,#3f8d66);
      box-shadow:
        0 12px 24px rgba(63,141,102,.22),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    .status{
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.84), rgba(244,251,245,.74));
      border:1px solid rgba(255,255,255,.74);
      color:#5f7669;
      font-size:14px;
      line-height:1.7;
      box-shadow:
        0 10px 24px rgba(39,82,60,.06),
        inset 0 1px 0 rgba(255,255,255,.94);
      word-break:break-word;
      backdrop-filter:blur(10px);
    }

    .status[data-type="error"]{
      background:#fff1f0;
      border-color:rgba(194,58,43,.14);
      color:#a14139;
    }

    .status[data-type="success"]{
      background:#f4fbf6;
      border-color:rgba(44,131,76,.12);
      color:#2f7b49;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:999px;
      background:#5aa97c;
      animation:pop 1s infinite ease-in-out;
    }

    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes pop{
      0%,80%,100%{ transform:scale(.75); opacity:.42; }
      40%{ transform:scale(1); opacity:1; }
    }

    @media (max-width: 720px){
      .wrap{
        width:min(100%, calc(100% - 14px));
        padding:14px 0 22px;
      }

      .poster-wrap,
      .action-panel{
        padding:12px;
      }

      .poster-paper{
        padding:18px 16px 16px;
        border-radius:24px;
      }

      .poster-top{
        flex-direction:column;
        align-items:flex-start;
      }

      .poster-brand-title{
        white-space:normal;
        font-size:22px;
      }

      .avatar-wrap{
        width:132px;
        height:132px;
        border-radius:36px;
      }

      .name{ font-size:35px; }
      .unit{ font-size:20px; }
      .title{ font-size:23px; }

      .qr-box{
        width:198px;
        height:198px;
      }

      #qrcode{
        width:176px;
        height:176px;
      }

      .qr-box canvas,
      .qr-box img{
        width:176px !important;
        height:176px !important;
      }

      .action-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-head">
      <div class="brand-chip">
        <div class="brand-dot"></div>
        <div class="brand-chip-text">智慧名片交付卡</div>
      </div>
    </div>

    <section class="panel poster-wrap">
      <div id="poster" class="poster-paper">
        <div class="poster-inner">
          <div class="poster-top">
            <div class="poster-brand">
              <div class="poster-brand-kicker">HAPPINESS SMART CARD</div>
              <div class="poster-brand-title">天使幸福智慧名片</div>
              <div class="poster-brand-sub">可分享的專屬名片入口</div>
            </div>
            <div class="poster-tag">交付卡</div>
          </div>

          <div class="hero">
            <div class="hero-card">
              <div class="avatar-wrap">
                <img id="avatar" class="avatar" alt="頭像" />
                <div id="avatarFallback" class="avatar-fallback">名片</div>
              </div>

              <div class="profile-meta">
                <div id="name" class="name">載入中...</div>
                <div id="unit" class="unit">　</div>
                <div id="title" class="title">　</div>
              </div>
            </div>

            <div class="qr-card">
              <div class="qr-box">
                <div id="qrcode"></div>
                <div class="qr-badge" aria-hidden="true">✨</div>
              </div>
              <p id="qrTip" class="qr-tip">掃描 QRCode 打開智慧名片</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel action-panel">
      <div class="action-grid">
        <button id="btnDownload" class="btn btn-primary" type="button">下載名片海報</button>
        <button id="btnOpenCard" class="btn btn-soft" type="button">打開我的智慧名片</button>
        <button id="btnCopyCard" class="btn btn-soft" type="button">複製我的智慧名片連結</button>
        <button id="btnRecommend" class="btn btn-ghost" type="button">推薦智慧名片</button>
        <button id="btnConsult" class="btn btn-line" type="button">聯繫 LINE 官方帳號</button>
      </div>

      <div id="status" class="status">
        <span class="loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        正在載入交付卡資料...
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./imageResolver.js?v=7031"></script>
  <script src="./poster.js?v=7031"></script>
</body>
</html>
