<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <title>天使幸福智慧名片｜名片交付卡</title>
  <meta name="theme-color" content="#f8f4ee" />

  <style>
    :root{
      --bg:#f8f4ee;
      --bg-2:#f3ece3;
      --card:#fffdfa;
      --card-2:#fff8f1;
      --ink:#453429;
      --ink-soft:#705d50;
      --muted:#8b7a6d;
      --line:rgba(102,78,57,.10);
      --gold:#bf8757;
      --gold-deep:#9d6d45;
      --gold-soft:#f6ebdf;
      --line-green:#18b65a;
      --shadow:0 18px 42px rgba(83,62,45,.08);
      --shadow-soft:0 10px 24px rgba(83,62,45,.06);
      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-pill:999px;
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      background:
        radial-gradient(1200px 760px at 50% -10%, rgba(255,255,255,.95), transparent 58%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color:var(--ink);
      font-family:
        "Noto Sans TC","PingFang TC","Microsoft JhengHei",
        system-ui,-apple-system,sans-serif;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      min-height:100vh;
    }

    .page{
      width:min(100%, 640px);
      margin:0 auto;
      padding:18px 14px 38px;
    }

    .hero-card{
      background:linear-gradient(180deg, rgba(255,253,250,.98), rgba(255,248,241,.98));
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .hero-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:132px;
      background:linear-gradient(180deg, rgba(255,255,255,.76), transparent);
      pointer-events:none;
    }

    .hero-head{
      position:relative;
      padding:24px 20px 12px;
      text-align:center;
      z-index:1;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:0 auto;
    }

    .brand-icon{
      width:32px;
      height:32px;
      border-radius:10px;
      flex:0 0 auto;
      display:block;
      object-fit:cover;
      background:#fff;
      padding:2px;
      box-shadow:0 4px 10px rgba(0,0,0,.06);
    }

    .brand-title{
      margin:0;
      font-size:24px;
      line-height:1.25;
      font-weight:900;
      letter-spacing:.01em;
      color:var(--ink);
    }

    .delivery-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:14px;
      padding:11px 28px;
      min-height:46px;
      border-radius:999px;
      border:1px solid rgba(191,135,87,.16);
      background:linear-gradient(180deg, #fffefb 0%, #fbf2e8 100%);
      color:var(--gold-deep);
      font-size:15px;
      line-height:1;
      font-weight:900;
      letter-spacing:.08em;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85),
        0 8px 18px rgba(191,135,87,.10);
    }

    .hero-body{
      position:relative;
      padding:18px;
      z-index:1;
    }

    .poster-canvas{
      background:linear-gradient(180deg, #fffefd 0%, #fffaf5 100%);
      border:1px solid rgba(102,78,57,.08);
      border-radius:28px;
      padding:28px 18px 24px;
      text-align:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8), var(--shadow-soft);
      position:relative;
    }

    .avatar-wrap{
      width:102px;
      height:102px;
      margin:0 auto 14px;
      border-radius:50%;
      overflow:hidden;
      background:#eee4d8;
      border:3px solid rgba(255,255,255,.97);
      box-shadow:0 10px 22px rgba(88,67,48,.09);
      position:relative;
      z-index:1;
    }

    .avatar-wrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .name{
      margin:0;
      font-size:28px;
      line-height:1.25;
      font-weight:900;
      letter-spacing:.04em;
      word-break:break-word;
      color:var(--ink);
    }

    .title{
      margin:10px auto 0;
      max-width:18em;
      font-size:16px;
      line-height:1.7;
      color:var(--ink-soft);
      word-break:break-word;
      min-height:1.7em;
    }

    .qr-zone{
      margin:24px auto 0;
      display:flex;
      justify-content:center;
    }

    .qr-frame{
      width:426px;
      max-width:100%;
      background:linear-gradient(180deg, #ffffff, #fffdfa);
      border-radius:30px;
      padding:24px 24px 18px;
      border:1px solid rgba(0,0,0,.04);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.82),
        0 10px 22px rgba(0,0,0,.05);
    }

    .qr-box{
      width:100%;
      aspect-ratio:1/1;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius:22px;
      border:1px solid rgba(0,0,0,.04);
      position:relative;
    }

    .qr-img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      background:#fff;
    }

    .qr-link-fallback{
      width:100%;
      padding:20px 16px;
      text-align:center;
      color:var(--ink-soft);
      font-size:13px;
      line-height:1.7;
      word-break:break-all;
      display:none;
    }

    .qr-caption{
      margin-top:14px;
      font-size:14px;
      line-height:1.7;
      color:var(--ink-soft);
      font-weight:800;
      letter-spacing:.01em;
    }

    .status{
      margin-top:14px;
      text-align:center;
      font-size:14px;
      line-height:1.8;
      color:var(--muted);
      min-height:1.8em;
    }

    .status.error{
      color:#b05a3d;
    }

    .action-group{
      margin-top:16px;
      background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,249,242,.74));
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px;
      box-shadow:0 5px 14px rgba(88,67,48,.035);
    }

    .group-title{
      margin:0 0 10px;
      font-size:14px;
      font-weight:900;
      letter-spacing:.04em;
      color:var(--ink-soft);
    }

    .actions{
      display:grid;
      gap:12px;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:16px 18px;
      font-size:17px;
      line-height:1.2;
      font-weight:900;
      cursor:pointer;
      transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
      color:var(--ink);
    }

    .btn:active{
      transform:translateY(1px);
    }

    .btn-primary{
      color:#fffaf6;
      background:linear-gradient(180deg, #c98a57 0%, #b6784a 100%);
      border:1px solid rgba(159,109,69,.18);
      box-shadow:0 5px 12px rgba(88,67,48,.08), inset 0 1px 0 rgba(255,255,255,.18);
    }

    .btn-soft{
      color:var(--ink);
      background:linear-gradient(180deg, #ffffff 0%, #fcf7f1 100%);
      border:1px solid rgba(98,76,56,.10);
      box-shadow:0 5px 12px rgba(88,67,48,.06), inset 0 1px 0 rgba(255,255,255,.75);
    }

    .btn-line{
      color:#fbfffc;
      background:linear-gradient(180deg, #22c462 0%, #15ac53 100%);
      border:1px solid rgba(12,138,59,.16);
      box-shadow:0 5px 12px rgba(20,180,84,.16), inset 0 1px 0 rgba(255,255,255,.16);
    }

    .dialog-mask{
      position:fixed;
      inset:0;
      background:rgba(24,18,14,.34);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:9999;
    }

    .dialog-mask.show{
      display:flex;
    }

    .dialog{
      width:min(100%, 520px);
      background:linear-gradient(180deg, #fffdfa, #fff9f2);
      border:1px solid rgba(74,53,36,.10);
      border-radius:24px;
      box-shadow:0 20px 44px rgba(0,0,0,.14);
      padding:22px 18px 18px;
    }

    .dialog-title{
      margin:0 0 10px;
      font-size:22px;
      line-height:1.35;
      font-weight:900;
      color:var(--ink);
    }

    .dialog-body{
      color:var(--ink-soft);
      font-size:15px;
      line-height:1.9;
    }

    .dialog-body p{
      margin:0 0 10px;
    }

    .dialog-actions{
      margin-top:14px;
      display:flex;
      justify-content:flex-end;
    }

    .dialog-close{
      min-width:112px;
    }

    @media (max-width:520px){
      .page{ padding:16px 12px 28px; }
      .hero-head{ padding:22px 16px 10px; }
      .brand-title{ font-size:21px; }
      .brand-icon{ width:28px; height:28px; }
      .delivery-pill{ font-size:14px; padding:10px 22px; }
      .hero-body{ padding:14px; }
      .poster-canvas{ padding:22px 14px 20px; }
      .avatar-wrap{ width:88px; height:88px; }
      .name{ font-size:24px; }
      .title{ font-size:15px; }
      .qr-frame{ padding:20px 20px 16px; border-radius:24px; }
      .qr-caption{ font-size:13px; }
      .btn{ padding:15px 16px; font-size:16px; }
      .action-group{ padding:12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero-card">
      <div class="hero-head">
        <div class="brand-row">
          <img class="brand-icon" src="./icon-192.png" alt="天使幸福智慧名片 icon" onerror="this.src='./icon-512.png'">
          <h1 class="brand-title">天使幸福智慧名片</h1>
        </div>
        <div class="delivery-pill">名片交付卡</div>
      </div>

      <div class="hero-body">
        <section id="posterCapture" class="poster-canvas" aria-label="海報內容">
          <div class="avatar-wrap">
            <img id="avatarImg" alt="頭像" />
          </div>

          <h2 id="cardName" class="name">載入中...</h2>
          <div id="cardTitle" class="title"></div>

          <div class="qr-zone">
            <div class="qr-frame">
              <div id="qrBox" class="qr-box">
                <img id="qrImg" class="qr-img" alt="QR Code" />
                <div id="qrLinkFallback" class="qr-link-fallback"></div>
              </div>
              <div class="qr-caption">掃描QRcode查閱完整名片</div>
            </div>
          </div>
        </section>

        <div id="statusText" class="status"></div>

        <section class="action-group">
          <h3 class="group-title">主要操作</h3>
          <div class="actions">
            <button id="downloadBtn" class="btn btn-primary" type="button">下載我的名片海報</button>
            <button id="openCardBtn" class="btn btn-soft" type="button">查看我的智慧名片</button>
          </div>
        </section>

        <section class="action-group">
          <h3 class="group-title">分享名片</h3>
          <div class="actions">
            <button id="copyLinkBtn" class="btn btn-soft" type="button">複製我的名片連結</button>
            <button id="shareCardBtn" class="btn btn-soft" type="button">分享我的智慧名片</button>
          </div>
        </section>

        <section class="action-group">
          <h3 class="group-title">推薦與客服</h3>
          <div class="actions">
            <button id="recommendBtn" class="btn btn-soft" type="button">推薦智慧名片館</button>
            <button id="helpBtn" class="btn btn-soft" type="button">分享說明</button>
            <button id="lineOABtn" class="btn btn-line" type="button">LINE 官方帳號</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="shareDialog" class="dialog-mask" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h3 id="dialogTitle" class="dialog-title">分享說明</h3>
      <div class="dialog-body">
        <p>1. 分享自己的智慧名片，建議優先使用「複製我的名片連結」或「分享我的智慧名片」。</p>
        <p>2. 名片海報適合傳圖片給對方，讓對方直接掃描 QRcode 查閱完整名片。</p>
        <p>3. 若在微信分享，建議優先傳送名片海報圖片，比直接貼網址更穩定。</p>
        <p>4. 若想推薦智慧名片服務，請使用「推薦智慧名片館」。</p>
        <p>5. 若需要聯絡客服、開通或訂製，請點「LINE 官方帳號」。</p>
      </div>
      <div class="dialog-actions">
        <button id="dialogCloseBtn" class="btn btn-primary dialog-close" type="button">我知道了</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./poster.js?v=7066"></script>
</body>
</html>
