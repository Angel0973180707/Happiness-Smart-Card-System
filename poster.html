<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>智慧名片交付卡 v704</title>
  <meta name="theme-color" content="#eef4ef" />

  <style>
    :root{
      --bg-1:#f6faf7;
      --bg-2:#edf4ef;
      --bg-3:#e4eee7;

      --card:#ffffff;
      --card-soft:#fbfdfb;

      --ink:#2f493a;
      --ink-2:#446452;
      --muted:#73907f;

      --line:#dfe9e2;
      --line-2:#cfded4;
      --line-soft:#edf3ef;

      --brand:#5f9c78;
      --brand-deep:#447c5b;
      --brand-pale:#f2f7f3;

      --shadow-card:0 20px 44px rgba(46,74,58,.08);
      --shadow-soft:0 10px 24px rgba(46,74,58,.05);
      --shadow-btn:0 10px 22px rgba(68,124,91,.16);

      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:20px;
      --radius-sm:18px;
      --radius-pill:999px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      display:flex;
      justify-content:center;
      background:
        radial-gradient(1100px 600px at 50% -10%, rgba(103,156,122,.10), transparent 55%),
        linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 58%,var(--bg-3) 100%);
    }

    img{ display:block; max-width:100%; }

    .wrap{
      width:100%;
      max-width:460px;
      padding:28px 18px 60px;
    }

    .brand-head{
      margin-bottom:18px;
      padding:0 4px;
    }

    .brand-en{
      font-size:13px;
      letter-spacing:2.2px;
      color:#769582;
      margin-bottom:8px;
      font-weight:800;
    }

    .brand-title{
      font-size:26px;
      font-weight:800;
      color:#3f6f57;
      line-height:1.22;
      margin:0;
      letter-spacing:.01em;
    }

    .brand-sub{
      font-size:14px;
      color:#7d9888;
      margin-top:8px;
      line-height:1.5;
    }

    .brand-tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:14px;
      padding:8px 15px;
      border-radius:var(--radius-pill);
      background:#f4f8f5;
      color:#537764;
      font-size:13px;
      font-weight:800;
      border:1px solid #e2ece5;
      box-shadow:0 4px 10px rgba(65,103,81,.04);
    }

    .delivery-card{
      background:linear-gradient(180deg,#ffffff 0%,#fbfdfb 100%);
      border:1px solid var(--line);
      border-radius:32px;
      box-shadow:var(--shadow-card);
      padding:16px;
      position:relative;
      overflow:hidden;
    }

    .delivery-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:110px;
      background:linear-gradient(180deg, rgba(109,158,127,.08) 0%, rgba(109,158,127,0) 100%);
      pointer-events:none;
    }

    /* 可作為海報主體的區域 */
    #posterCapture{
      position:relative;
      z-index:1;
    }

    .poster{
      background:linear-gradient(180deg,#ffffff 0%,#fcfefd 100%);
      border-radius:26px;
      padding:24px 20px 22px;
      border:1px solid #e5eee8;
      box-shadow:0 8px 20px rgba(55,92,72,.04);
      text-align:center;
      margin-bottom:14px;
      position:relative;
      overflow:hidden;
    }

    .avatar-wrap{
      width:118px;
      height:118px;
      margin:0 auto 16px;
      border-radius:50%;
      overflow:hidden;
      background:linear-gradient(180deg,#f8fbf8 0%,#eef5f0 100%);
      border:1px solid #dfeae3;
      display:grid;
      place-items:center;
      box-shadow:
        0 10px 22px rgba(60,101,78,.08),
        inset 0 1px 0 rgba(255,255,255,.95);
      position:relative;
      z-index:1;
    }

    .avatar{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:none;
    }

    .avatar-fallback{
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      font-size:28px;
      font-weight:800;
      color:#6d8e7d;
      letter-spacing:.06em;
      user-select:none;
    }

    .name,
    .unit,
    .title,
    .qr-text{
      width:100%;
      max-width:100%;
      text-align:center;
      word-break:keep-all;
      overflow-wrap:break-word;
      white-space:normal;
      line-height:1.26;
      text-wrap:balance;
    }

    .name{
      font-size:31px;
      font-weight:800;
      margin:0 0 12px;
      color:#3d6b54;
      letter-spacing:.01em;
      min-height:1.26em;
    }

    .unit{
      font-size:18px;
      margin:0 0 8px;
      color:#557b66;
      font-weight:700;
      min-height:1.26em;
    }

    .title{
      font-size:18px;
      margin:0;
      color:#557b66;
      font-weight:700;
      min-height:1.26em;
    }

    .qr-card{
      background:linear-gradient(180deg,#ffffff 0%,#fcfefd 100%);
      border-radius:26px;
      padding:22px 16px 20px;
      border:1px solid #e5eee8;
      box-shadow:0 8px 20px rgba(55,92,72,.04);
      text-align:center;
      margin-bottom:12px;
    }

    .qr-box{
      width:220px;
      height:220px;
      margin:0 auto;
      border-radius:24px;
      background:#fff;
      border:1px solid #dfe9e2;
      display:grid;
      place-items:center;
      overflow:hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.98),
        0 8px 18px rgba(55,92,72,.04);
    }

    #qrcode{
      width:200px;
      height:200px;
      display:grid;
      place-items:center;
    }

    #qrcode canvas,
    #qrcode img{
      width:200px !important;
      height:200px !important;
      image-rendering:pixelated;
    }

    .qr-text{
      margin-top:14px;
      color:#557b66;
      font-size:16px;
      line-height:1.52;
      font-weight:800;
      letter-spacing:.01em;
      padding:0 10px;
      max-width:320px;
      margin-left:auto;
      margin-right:auto;
    }

    .actions{
      position:relative;
      z-index:5;
      margin-top:6px;
      background:linear-gradient(180deg,#ffffff 0%,#fbfdfb 100%);
      border:1px solid #e1ebe4;
      border-radius:26px;
      padding:14px;
      box-shadow:var(--shadow-soft);
      backdrop-filter:none;
    }

    .btn{
      appearance:none;
      border:none;
      display:block;
      width:100%;
      padding:15px 16px;
      border-radius:22px;
      text-align:center;
      font-size:16px;
      font-weight:800;
      margin-top:12px;
      text-decoration:none;
      cursor:pointer;
      transition:
        transform .15s ease,
        box-shadow .15s ease,
        background-color .15s ease,
        border-color .15s ease,
        opacity .15s ease;
      -webkit-tap-highlight-color:transparent;
      position:relative;
    }

    .btn:first-child{ margin-top:0; }
    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-main{
      background:linear-gradient(180deg,#6cac88 0%,#4b8a67 100%);
      color:#fff;
      border:1px solid rgba(62,118,86,.92);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 10px 20px rgba(63,118,88,.18);
    }

    .btn-main::before{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      top:11px;
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      pointer-events:none;
    }

    .btn-main:hover{
      background:linear-gradient(180deg,#73b38f 0%,#49825f 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 12px 22px rgba(63,118,88,.20);
    }

    .btn-soft{
      background:linear-gradient(180deg,#ffffff 0%,#f8fbf9 100%);
      border:2px solid #c8dbce;
      color:#3f6d57;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.98),
        0 6px 14px rgba(0,0,0,.03);
    }

    .btn-soft::before{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      top:11px;
      height:10px;
      border-radius:999px;
      background:rgba(91,153,118,.04);
      pointer-events:none;
    }

    .btn-soft:hover{
      background:linear-gradient(180deg,#fbfdfc 0%,#f1f7f3 100%);
      border-color:#b8d1c0;
    }

    .btn-dash{
      background:linear-gradient(180deg,#fbfdfc 0%,#f6faf7 100%);
      border:2px dashed #b7d0c1;
      color:#4b7962;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.98),
        0 6px 14px rgba(0,0,0,.02);
    }

    .btn-dash::before{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      top:11px;
      height:10px;
      border-radius:999px;
      background:rgba(91,153,118,.03);
      pointer-events:none;
    }

    .btn-dash:hover{
      background:linear-gradient(180deg,#f8fcf9 0%,#eef6f1 100%);
      border-color:#a7c5b2;
    }

    .status{
      margin-top:14px;
      background:#f4f8f5;
      border:1px solid #dbe8df;
      border-radius:22px;
      padding:14px 16px;
      text-align:center;
      color:#4c7b63;
      font-size:15px;
      line-height:1.6;
      min-height:56px;
      display:flex;
      align-items:center;
      justify-content:center;
      word-break:break-word;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
    }

    .status[data-type="error"]{
      background:#fff3f1;
      border-color:rgba(194,58,43,.14);
      color:#a14139;
    }

    .status[data-type="success"]{
      background:#f4fbf6;
      border-color:rgba(44,131,76,.12);
      color:#2f7b49;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#5aa97c;
      animation:pop 1s infinite ease-in-out;
    }

    .dot:nth-child(2){ animation-delay:.15s; }
    .dot:nth-child(3){ animation-delay:.3s; }

    @keyframes pop{
      0%,80%,100%{ transform:scale(.75); opacity:.42; }
      40%{ transform:scale(1); opacity:1; }
    }

    @media (max-width: 520px){
      .wrap{
        padding:24px 16px 52px;
      }

      .delivery-card{
        padding:14px;
        border-radius:28px;
      }

      .poster{
        padding:22px 16px 20px;
      }

      .qr-card{
        padding:20px 14px 18px;
      }

      .avatar-wrap{
        width:108px;
        height:108px;
      }

      .name{ font-size:28px; }
      .unit{ font-size:17px; }
      .title{ font-size:17px; }

      .qr-box{
        width:204px;
        height:204px;
      }

      #qrcode{
        width:184px;
        height:184px;
      }

      #qrcode canvas,
      #qrcode img{
        width:184px !important;
        height:184px !important;
      }

      .qr-text{
        font-size:15px;
        max-width:270px;
      }

      .btn{
        font-size:15px;
        padding:14px 15px;
        border-radius:20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="brand-head">
      <div class="brand-en">HAPPINESS SMART CARD</div>
      <h1 class="brand-title">天使幸福智慧名片</h1>
      <div class="brand-sub">可分享的專屬名片入口</div>
      <div class="brand-tag">交付卡</div>
    </div>

    <div class="delivery-card">
      <div id="posterCapture">
        <div id="poster" class="poster">
          <div class="avatar-wrap">
            <img id="avatar" class="avatar" alt="頭像" />
            <div id="avatarFallback" class="avatar-fallback">名片</div>
          </div>

          <div id="name" class="name">載入中...</div>
          <div id="unit" class="unit">　</div>
          <div id="title" class="title">　</div>
        </div>

        <div class="qr-card">
          <div class="qr-box">
            <div id="qrcode"></div>
          </div>
          <div id="qrTip" class="qr-text">掃描 QRCode 打開智慧名片</div>
        </div>
      </div>

      <div class="actions">
        <button id="btnDownload" class="btn btn-main" type="button">下載名片海報</button>
        <button id="btnOpenCard" class="btn btn-soft" type="button">打開我的智慧名片</button>
        <button id="btnCopyCard" class="btn btn-soft" type="button">複製我的智慧名片連結</button>
        <button id="btnRecommend" class="btn btn-dash" type="button">推薦智慧名片</button>
        <button id="btnConsult" class="btn btn-main" type="button">聯繫 LINE 官方帳號</button>

        <div id="status" class="status">
          <span class="loading">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </span>
          正在載入交付卡資料...
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./imageResolver.js?v=7034"></script>
  <script src="./poster.js?v=7034"></script>
</body>
</html>
