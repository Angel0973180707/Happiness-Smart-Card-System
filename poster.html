<!doctype html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>智慧名片交付卡</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
background:#f5f6fa;
display:flex;
justify-content:center;
}

.wrap{
width:420px;
max-width:100%;
padding:20px;
}

.card{
background:white;
border-radius:18px;
padding:24px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.avatar{
width:120px;
height:120px;
border-radius:60px;
object-fit:cover;
margin-bottom:12px;
}

.name{
font-size:26px;
font-weight:700;
}

.unit{
color:#666;
margin-top:4px;
margin-bottom:18px;
}

.btn{
display:block;
width:100%;
padding:14px;
border-radius:12px;
margin-top:10px;
font-size:16px;
border:none;
cursor:pointer;
}

.btn1{
background:#111;
color:white;
}

.btn2{
background:#ddd;
}

.btn3{
background:#ff8a00;
color:white;
}

.note{
margin-top:16px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<div class="wrap">

<div class="card" id="poster">

<img id="avatar" class="avatar">

<div id="name" class="name"></div>

<div id="unit" class="unit"></div>

</div>

<button id="btnView" class="btn btn1">
打開我的智慧名片
</button>

<button id="btnCopy" class="btn btn2">
複製我的名片連結
</button>

<button id="btnPoster" class="btn btn3">
下載我的名片海報
</button>

<div class="note">
可以分享智慧名片給朋友
</div>

</div>

<script src="poster.js"></script>

</body>
</html>
