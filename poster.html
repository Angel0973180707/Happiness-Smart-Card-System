<!doctype html>
<html lang="zh-Hant">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>智慧名片交付卡</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:

system-ui,
-apple-system,
"Noto Sans TC",
sans-serif;

background:

linear-gradient(
180deg,
#f7fbf8 0%,
#e8f3ec 60%,
#d9eadf 100%
);

color:#2e4a3a;

display:flex;
justify-content:center;

}

.wrap{

width:100%;
max-width:460px;

padding:28px 20px 60px;

}

/* ---------- header ---------- */

.header{

margin-bottom:24px;

}

.brand-en{

font-size:14px;
letter-spacing:2px;
color:#6c8f7c;

margin-bottom:6px;

}

.brand-title{

font-size:26px;
font-weight:700;

color:#3e6f57;

}

.brand-sub{

font-size:14px;
color:#7a9a89;

margin-top:4px;

}

.tag{

display:inline-block;

margin-top:14px;

padding:6px 14px;

border-radius:20px;

background:#edf6f0;

color:#4f7a63;

font-size:13px;

}

/* ---------- main card ---------- */

.card{

background:white;

border-radius:26px;

padding:28px 24px;

box-shadow:

0 20px 40px rgba(0,0,0,.05);

margin-bottom:22px;

text-align:center;

}

.avatar{

width:120px;
height:120px;

border-radius:26px;

object-fit:cover;

margin-bottom:14px;

}

.name{

font-size:32px;
font-weight:700;

margin-bottom:10px;

color:#3f6d57;

}

.unit{

font-size:18px;

margin-bottom:6px;

color:#537e67;

}

.title{

font-size:18px;

color:#537e67;

}

/* ---------- qr card ---------- */

.qr-card{

background:white;

border-radius:26px;

padding:26px 24px;

box-shadow:

0 20px 40px rgba(0,0,0,.05);

text-align:center;

margin-bottom:22px;

}

.qr{

width:220px;

margin:10px auto;

display:block;

}

.qr-text{

margin-top:12px;

color:#547e68;

font-size:16px;

}

/* ---------- buttons ---------- */

.btn{

display:block;

width:100%;

padding:18px;

border-radius:26px;

text-align:center;

font-size:18px;

margin-top:14px;

text-decoration:none;

}

.btn-main{

background:

linear-gradient(
135deg,
#5da57e,
#3f8762
);

color:white;

}

.btn-soft{

background:#f3f8f5;

border:1px solid #cfe2d6;

color:#3f6d57;

}

.btn-soft:hover{

background:#e9f3ed;

}

.btn-dash{

background:#f7fbf8;

border:2px dashed #bcd6c7;

color:#4c7b63;

}

/* ---------- footer ---------- */

.status{

margin-top:18px;

background:#eef6f1;

border-radius:20px;

padding:16px;

text-align:center;

color:#4c7b63;

}

</style>

</head>

<body>

<div class="wrap">

<div class="header">

<div class="brand-en">
HAPPINESS SMART CARD
</div>

<div class="brand-title">
天使幸福智慧名片
</div>

<div class="brand-sub">
可分享的專屬名片入口
</div>

<div class="tag">
交付卡
</div>

</div>

<!-- 主卡 -->

<div class="card">

<img id="avatar" class="avatar">

<div id="name" class="name"></div>

<div id="unit" class="unit"></div>

<div id="title" class="title"></div>

</div>

<!-- QR -->

<div class="qr-card">

<img id="qr" class="qr">

<div class="qr-text">
掃描 QRCode 打開智慧名片
</div>

</div>

<!-- buttons -->

<a id="downloadPoster" class="btn btn-main">
下載名片海報
</a>

<a id="openCard" class="btn btn-soft">
打開我的智慧名片
</a>

<a id="copyLink" class="btn btn-soft">
複製我的智慧名片連結
</a>

<a id="recommend" class="btn btn-dash">
推薦智慧名片
</a>

<a id="lineOA" class="btn btn-main">
聯繫 LINE 官方帳號
</a>

<div id="status" class="status">
海報已下載完成。
</div>

</div>

<script src="poster.js?v=7033"></script>

</body>
</html>
