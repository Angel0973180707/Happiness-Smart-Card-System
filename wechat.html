<!-- ================================
     wechat.html — v497 (COMPLETE OVERWRITE)
     - Fix: include QRCode lib (avoid "QRCode is not defined")
     - Include html2canvas
     - DOM ids aligned with wechat.js v497:
       #wId #wName #wUnit #wTitle #wSlogan #wServices
       #wAvatar #wLogo #wPhotos #wQR #wCleanUrl
       #btnCopyLink #btnOpenLink #btnRender #btnBack
       #capture #resultImg #toast
================================== -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WeChat Poster | v497</title>
  <meta name="description" content="WeChat Poster | Happiness Smart Card System" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root{
      --bg1:#07121f;
      --bg2:#0b2a3d;
      --glass: rgba(255,255,255,.10);
      --glass2: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 26px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Heiti TC",Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(900px 480px at 25% 10%, rgba(86,162,255,.30), transparent 60%),
        radial-gradient(900px 520px at 75% 25%, rgba(186,120,255,.22), transparent 60%),
        radial-gradient(900px 560px at 45% 85%, rgba(53,211,255,.12), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      padding: 18px 14px 28px;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin: 4px 2px 16px;
    }
    .title{
      font-weight: 800;
      letter-spacing:.4px;
      font-size: 22px;
      opacity:.95;
    }
    .idPill{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0,0,0,.25);
      font-weight: 700;
      color: rgba(255,255,255,.82);
      font-size: 14px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .wrap{
      max-width: 520px;
      margin: 0 auto;
    }

    .poster{
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .header{
      display:flex;
      gap:14px;
      padding: 18px 18px 14px;
      align-items:center;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .avatarBox{
      width: 86px;
      height: 86px;
      border-radius: 22px;
      overflow:hidden;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .avatarBox img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .headerText{
      min-width:0;
      flex:1;
    }
    .name{
      font-weight: 900;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: .5px;
      margin: 0 0 6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .subline{
      font-size: 14px;
      color: var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .subline span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    .section{
      padding: 14px 18px;
      display:grid;
      gap:12px;
    }
    .card{
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(0,0,0,.10);
      border: 1px solid rgba(255,255,255,.10);
    }
    .label{
      font-weight: 800;
      font-size: 14px;
      color: rgba(255,255,255,.82);
      margin: 0 0 8px;
      letter-spacing:.3px;
    }
    .value{
      font-size: 15px;
      color: rgba(255,255,255,.86);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .value.muted{ color: rgba(255,255,255,.55); }

    .miniRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .logoMini{
      width: 42px; height: 42px;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.08);
      flex: 0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logoMini img{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
    }

    .qrWrap{
      display:flex;
      gap:14px;
      align-items:center;
    }
    .qrBox{
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,.92);
      border-radius: 18px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }
    .qrHint{
      flex:1;
      min-width:0;
    }
    .cleanUrl{
      font-size: 12px;
      color: rgba(255,255,255,.70);
      word-break: break-all;
      line-height: 1.35;
      margin-top: 8px;
    }

    .photos{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
    }
    .photos img{
      width:100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
    }

    .actions{
      display:flex;
      gap:10px;
      margin: 14px 0 0;
      flex-wrap:wrap;
    }
    .btn{
      appearance:none;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 800;
      letter-spacing:.2px;
      cursor:pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.30);
      transition: transform .12s ease, background .12s ease;
    }
    .btn:active{ transform: scale(.98); }
    .btn.primary{
      background: rgba(59,130,246,.22);
      border-color: rgba(59,130,246,.35);
    }

    .result{
      margin-top: 14px;
      display:none;
    }
    .result img{
      width:100%;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      display:block;
      background: rgba(255,255,255,.06);
    }

    #toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.72);
      color: rgba(255,255,255,.92);
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      transform-origin: center;
      z-index: 9999;
    }
    #toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">WeChat Poster</div>
      <div class="idPill"><span>ID :</span><span id="wId">—</span></div>
    </div>

    <div id="capture" class="poster">
      <div class="header">
        <div class="avatarBox">
          <img id="wAvatar" alt="avatar" style="display:none;" />
          <div id="wAvatarFallback" style="opacity:.55;font-weight:900;">👤</div>
        </div>

        <div class="headerText">
          <div id="wName" class="name">(未填姓名)</div>
          <div class="subline">
            <span id="wUnit">—</span>
            <span id="wTitle">—</span>
          </div>
          <div class="miniRow" style="margin-top:10px;">
            <div style="font-size:12px;color:rgba(255,255,255,.62);font-weight:800;">Happiness Smart Card</div>
            <div class="logoMini">
              <img id="wLogo" alt="logo" style="display:none;" />
              <div id="wLogoFallback" style="opacity:.55;font-weight:900;">◎</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="card">
          <div class="label">理念標語</div>
          <div id="wSlogan" class="value muted">—</div>
        </div>

        <div class="card">
          <div class="label">服務項目</div>
          <div id="wServices" class="value muted">—</div>
        </div>

        <div class="card" id="photosCard">
          <div class="label">照片</div>
          <div id="wPhotos" class="photos" style="display:none;"></div>
          <div id="wPhotosEmpty" class="value muted">—</div>
        </div>

        <div class="card">
          <div class="label">掃碼查詢完整名片</div>
          <div class="qrWrap">
            <div id="wQR" class="qrBox"></div>
            <div class="qrHint">
              <div style="font-weight:900;letter-spacing:.2px;">Clean Card URL</div>
              <div id="wCleanUrl" class="cleanUrl">—</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btnCopyLink" class="btn primary">複製連結</button>
      <button id="btnOpenLink" class="btn">開啟成品</button>
      <button id="btnRender" class="btn">產生 PNG</button>
      <button id="btnBack" class="btn">返回</button>
    </div>

    <div class="result" id="resultBox">
      <div style="margin:10px 0 8px; font-weight:900; letter-spacing:.2px;">PNG 預覽</div>
      <img id="resultImg" alt="poster png" style="display:none;" />
    </div>
  </div>

  <div id="toast">—</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="./wechat.js?v=4970"></script>

  <script>
    (function(){
      const av = document.getElementById("wAvatar");
      const avFb = document.getElementById("wAvatarFallback");
      if (av) {
        av.addEventListener("load", () => { if (avFb) avFb.style.display="none"; });
        av.addEventListener("error", () => { if (avFb) avFb.style.display=""; });
      }
      const lg = document.getElementById("wLogo");
      const lgFb = document.getElementById("wLogoFallback");
      if (lg) {
        lg.addEventListener("load", () => { if (lgFb) lgFb.style.display="none"; });
        lg.addEventListener("error", () => { if (lgFb) lgFb.style.display=""; });
      }

      const resultImg = document.getElementById("resultImg");
      const resultBox = document.getElementById("resultBox");
      if (resultImg && resultBox) {
        const obs = new MutationObserver(() => {
          const show = (resultImg.style.display !== "none" && !!resultImg.src);
          resultBox.style.display = show ? "" : "none";
        });
        obs.observe(resultImg, { attributes:true, attributeFilter:["style","src"] });
      }

      const photos = document.getElementById("wPhotos");
      const empty = document.getElementById("wPhotosEmpty");
      if (photos && empty) {
        const obs2 = new MutationObserver(() => {
          const has = photos.children && photos.children.length > 0 && photos.style.display !== "none";
          empty.style.display = has ? "none" : "";
          const card = document.getElementById("photosCard");
          if (card) card.style.display = "";
        });
        obs2.observe(photos, { childList:true, attributes:true, attributeFilter:["style"] });
      }
    })();
  </script>
</body>
</html>
