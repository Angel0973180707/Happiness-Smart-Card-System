<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Angel WeChat Card｜v406.2</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg1:#3E2F6F;  /* default = p4 霧紫 */
      --bg2:#5E4B8B;
      --text:#ffffff;
      --sub:#e7e1ff;
      --glass: rgba(255,255,255,.14);
      --glass2: rgba(255,255,255,.10);
      --line: rgba(255,255,255,.18);
      --shadow: 0 18px 46px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      min-height:100vh;
      display:flex;
      justify-content:center;
    }
    .wrapper{
      width:100%;
      max-width:720px;
      padding:56px 22px 80px;
      text-align:center;
    }
    .topBadge{
      display:inline-flex; gap:8px; align-items:center; justify-content:center;
      padding:7px 12px; border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.10);
      color:rgba(255,255,255,.9);
      font-size:12px;
      margin:0 auto 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.08));
      border:1px solid var(--line);
      border-radius:22px;
      padding:22px 18px 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow:hidden;
    }
    .avatar{
      width:168px;
      height:168px;
      border-radius:50%;
      background:rgba(255,255,255,0.15);
      margin:6px auto 18px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,255,255,.20);
    }
    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .name{
      font-size:40px;
      font-weight:800;
      letter-spacing:.3px;
      margin:6px 0 8px;
      text-shadow: 0 10px 30px rgba(0,0,0,.22);
    }
    .title{
      font-size:20px;
      color:var(--sub);
      margin-bottom:14px;
      line-height:1.35;
      opacity:.95;
    }
    .meta{
      display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
      margin:10px 0 6px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.10);
      font-size:12px;
      color:rgba(255,255,255,.9);
    }
    .section{
      margin-top:18px;
      text-align:left;
      background:rgba(0,0,0,.10);
      border:1px solid rgba(255,255,255,.16);
      border-radius:18px;
      padding:14px 14px 10px;
    }
    .section h3{
      font-size:15px;
      margin-bottom:10px;
      opacity:.9;
      letter-spacing:.2px;
    }
    .list p{
      font-size:16px;
      line-height:1.65;
      margin:0 0 8px;
      color:rgba(255,255,255,.95);
      word-break:break-word;
    }
    .muted{
      color:rgba(255,255,255,.78);
      font-size:14px;
      line-height:1.6;
    }
    .actions{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      margin-top:18px;
    }
    .button{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      padding:16px 14px;
      border-radius:16px;
      font-size:18px;
      font-weight:800;
      border:none;
      cursor:pointer;
      text-decoration:none;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .primary{
      background:#ffffff;
      color:#1b102f;
      box-shadow: 0 12px 32px rgba(0,0,0,.18);
    }
    .secondary{
      background:rgba(255,255,255,0.16);
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
    }
    .button[aria-disabled="true"]{
      opacity:.55;
      pointer-events:none;
    }
    .footer{
      margin-top:18px;
      font-size:12px;
      opacity:.75;
      text-align:center;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      max-width:min(720px, calc(100% - 28px));
      background:rgba(0,0,0,.55);
      color:#fff;
      border:1px solid rgba(255,255,255,.18);
      padding:10px 12px;
      border-radius:14px;
      font-size:13px;
      line-height:1.5;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display:none;
      z-index:50;
    }
    .toast.show{ display:block; }

    @media (min-width:520px){
      .wrapper{ padding:64px 28px 88px; }
      .actions{ grid-template-columns: 1fr 1fr; }
      .button{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="topBadge" id="badge">WeChat Long Card</div>

    <div class="card">
      <div class="avatar" id="avatarBox" aria-label="avatar"></div>

      <div class="name" id="name">幸福智慧名片</div>
      <div class="title" id="title">Angel Smart Card</div>

      <div class="meta" id="meta"></div>

      <div class="section" id="serviceSection" style="display:none;">
        <h3>服務項目</h3>
        <div class="list" id="serviceContent"></div>
      </div>

      <div class="section" id="expSection" style="display:none;">
        <h3>經歷</h3>
        <div class="list" id="expContent"></div>
      </div>

      <div class="section" id="contactSection" style="display:none;">
        <h3>聯繫</h3>
        <div class="muted" id="contactContent"></div>
      </div>

      <div class="actions">
        <!-- ✅ 你要：提高打開機率 → 指向 GitHub open.html（裡面再打 GAS 判斷） -->
        <a id="btnOpen" class="button primary" href="#" rel="noreferrer">
          開啟名片
        </a>

        <button id="btnCopy" class="button secondary" type="button">
          複製名片網址
        </button>

        <a id="btnContact" class="button secondary" href="#" target="_blank" rel="noopener,noreferrer" style="display:none;">
          聯繫開通
        </a>
      </div>

      <div class="footer">
        © Angel0973180707 / Happiness Smart Card System
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./wechat.js?v=4062"></script>
</body>
</html>
