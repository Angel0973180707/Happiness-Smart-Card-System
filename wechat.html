<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>WeChat Card</title>

  <style>
    :root{
      --bg:#0b1220;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --line:rgba(255,255,255,.10);
      --shadow: 0 20px 70px rgba(0,0,0,.55);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height:100vh;
    }
    .wrap{
      width:min(980px, 94vw);
      margin: 14px auto 26px;
    }
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 6px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .dot{width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.7)}
    .ttl{display:flex; flex-direction:column; gap:2px; line-height:1.1}
    .ttl .t1{font-weight:900; font-size:14px}
    .ttl .t2{font-weight:800; font-size:12px; color:rgba(255,255,255,.55)}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding: 10px 12px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      font-weight:950;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .panel{
      border-radius: calc(var(--r) + 10px);
      border:1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      overflow:hidden;
      background: rgba(255,255,255,.05);
    }

    .loading{
      padding: 26px 16px;
      text-align:center;
    }
    .loading .big{font-weight:950; font-size:16px; margin-bottom:8px}
    .loading .small{font-weight:800; color:var(--muted); line-height:1.6}

    .card{
      padding: 18px 16px 16px;
      display:none;
    }
    .head{
      display:flex; align-items:center; gap:12px;
      margin-bottom: 12px;
    }
    .av{
      width:74px;height:74px;border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      overflow:hidden;
      flex:0 0 74px;
      position:relative;
    }
    .av img{width:100%;height:100%;object-fit:cover;display:none}
    .av .ph{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-weight:950; color:rgba(255,255,255,.75);
      font-size:18px;
    }
    .nm{font-weight:950; font-size:20px; margin:0}
    .meta{margin-top:4px; font-weight:800; color:var(--muted); white-space:pre-line; line-height:1.4}

    .sec{
      margin-top: 10px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      background: rgba(0,0,0,.18);
      padding: 12px 12px 10px;
    }
    .sec h3{
      margin:0 0 8px;
      font-size:13px;
      font-weight:950;
      letter-spacing:.4px;
    }
    ul{margin:0; padding-left:18px; color:var(--muted); font-weight:800; line-height:1.65}
    .para{white-space:pre-line; color:var(--muted); font-weight:800; line-height:1.7}

    .hint{
      margin-top: 10px;
      color: rgba(255,255,255,.70);
      font-weight:850;
      font-size:12px;
      line-height:1.6;
      text-align:center;
      padding: 8px 10px;
    }

    /* Debug */
    .dbgMask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:9998;}
    .dbg{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:16px; width:min(920px, 92vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(15,23,42,.92);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      padding: 12px;
      display:none; z-index:9999;
      backdrop-filter: blur(10px);
    }
    .dbgTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
    .dbgTop .ttl{font-weight:950; font-size:13px;}
    .dbgTop .x{padding: 8px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-weight:950;}
    .dbg pre{
      margin:0; padding:10px; border-radius:14px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      overflow:auto; max-height: 42vh;
      color: rgba(255,255,255,.86);
      font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand" id="brand">
        <div class="dot"></div>
        <div class="ttl">
          <div class="t1">WeChat Long Card</div>
          <div class="t2">v407</div>
        </div>
      </div>
      <button class="btn" id="btnZoom">放大</button>
    </div>

    <div class="panel" id="panel">
      <div class="loading" id="loading">
        <div class="big">載入中...</div>
        <div class="small">微信環境可能較慢，請稍候<br/>若仍空白，返回再重開一次通常會好。</div>
      </div>

      <div class="card" id="card">
        <div class="head">
          <div class="av" id="av">
            <img id="avImg" alt="avatar" />
            <div class="ph" id="avPh">🙂</div>
          </div>
          <div>
            <h1 class="nm" id="name">—</h1>
            <div class="meta" id="meta"></div>
          </div>
        </div>

        <div class="sec" id="secService" style="display:none">
          <h3>服務項目</h3>
          <ul id="service"></ul>
        </div>

        <div class="sec" id="secExp" style="display:none">
          <h3>經歷</h3>
          <div class="para" id="exp"></div>
        </div>

        <div class="hint" id="hint"></div>
      </div>
    </div>
  </div>

  <div class="dbgMask" id="dbgMask"></div>
  <div class="dbg" id="dbg">
    <div class="dbgTop">
      <div class="ttl">Debug</div>
      <div class="x" id="dbgClose">關閉</div>
    </div>
    <pre id="dbgPre"></pre>
  </div>

  <script src="./wechat.js?v=407"></script>
</body>
</html>
