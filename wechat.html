<!-- wechat.html — v491 (COMPLETE OVERWRITE)
 * Purpose:
 * - Generate a WeChat-friendly long poster (image-like) for delivery
 * - Uses DOM layout + "Render to image" via html2canvas for download/save
 * - Fetch data from GAS: {ok:true, id, data:{...}}
 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WeChat Poster · Happiness Smart Card</title>
  <meta name="description" content="微信長圖交貨｜長按保存" />

  <style>
    :root{
      --bg:#0b0f14;
      --text:#eef3ff;
      --muted:rgba(238,243,255,.72);
      --line:rgba(238,243,255,.14);
      --card:#101a26;
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial;
      background: radial-gradient(1100px 780px at 15% 10%, rgba(0,168,255,.18), transparent 60%),
                  radial-gradient(900px 650px at 90% 25%, rgba(255,94,94,.16), transparent 55%),
                  linear-gradient(180deg, #070a0f, #0b0f14);
      color:var(--text);
      padding: 16px 12px 28px;
    }
    .wrap{max-width:520px;margin:0 auto}
    .top{
      display:flex;align-items:center;justify-content:space-between;
      margin: 6px 2px 12px;
    }
    .brand{font-weight:900;letter-spacing:.2px}
    .chip{
      font-size:12px;color:var(--muted);
      border:1px solid var(--line);
      padding:6px 10px;border-radius:999px;
      background: rgba(255,255,255,.03);
    }

    /* Poster Canvas (DOM) */
    .poster{
      border-radius: var(--radius);
      overflow:hidden;
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: 0 22px 60px rgba(0,0,0,.35);
    }
    .p-hero{
      padding: 18px 16px 14px;
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(125,211,252,.20), transparent 58%),
        radial-gradient(800px 380px at 95% 10%, rgba(251,113,133,.18), transparent 55%),
        rgba(0,0,0,.18);
      border-bottom:1px solid var(--line);
    }
    .p-row{display:flex;gap:12px;align-items:center}
    .avatar{
      width:76px;height:76px;border-radius:20px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      overflow:hidden;flex:none;
      display:flex;align-items:center;justify-content:center;
      box-shadow: 0 14px 30px rgba(0,0,0,.28);
    }
    .avatar img{width:100%;height:100%;object-fit:cover}
    .meta{min-width:0}
    .name{
      font-size:20px;font-weight:1000;margin:0 0 6px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .line2,.line3{
      font-size:13px;color:var(--muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .line3{margin-top:4px}

    .p-body{padding: 14px 16px 16px}
    .block{
      border:1px solid var(--line);
      border-radius:18px;
      background: rgba(0,0,0,.14);
      padding: 12px 12px;
      margin-bottom: 10px;
    }
    .label{
      font-size:12px;color:rgba(238,243,255,.6);
      letter-spacing:.6px;
      margin-bottom:6px;
      font-weight:900;
    }
    .txt{
      font-size:14px;line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .kv{
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px 10px;
      background: rgba(255,255,255,.03);
    }
    .kv .k{font-size:12px;color:rgba(238,243,255,.58);font-weight:900}
    .kv .v{font-size:13px;margin-top:4px;word-break:break-word}

    .p-footer{
      display:flex;gap:12px;align-items:center;justify-content:space-between;
      padding: 14px 16px;
      border-top:1px solid var(--line);
      background: rgba(0,0,0,.18);
    }
    .qrcode{
      width:110px;height:110px;border-radius:16px;
      background:#fff;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
      border:1px solid rgba(0,0,0,.08);
      flex:none;
    }
    .qrcode canvas, .qrcode img{width:100% !important;height:100% !important}
    .footmeta{min-width:0}
    .footmeta .t{font-weight:1000}
    .footmeta .s{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.55}

    /* Controls */
    .controls{
      display:grid;grid-template-columns:1fr;gap:10px;
      margin-top:12px;
    }
    .btn{
      appearance:none;border:1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      color:var(--text);
      font-weight:900;
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .btn small{font-weight:800;color:var(--muted)}

    .note{
      text-align:center;
      color:rgba(238,243,255,.58);
      font-size:12px;margin-top:10px;line-height:1.6;
    }
    .outImg{
      margin-top:12px;
      border-radius: 18px;
      border:1px dashed var(--line);
      padding: 12px;
      background: rgba(0,0,0,.12);
    }
    .outImg img{width:100%;height:auto;border-radius:14px;display:block}
    .hidden{display:none !important}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">WeChat Poster</div>
      <div class="chip" id="chipId">ID：—</div>
    </div>

    <!-- Poster DOM (we will render this) -->
    <div class="poster" id="poster">
      <div class="p-hero">
        <div class="p-row">
          <div class="avatar" id="avatarBox">👤</div>
          <div class="meta">
            <p class="name" id="uName">（未填姓名）</p>
            <div class="line2" id="uLine2">—</div>
            <div class="line3" id="uLine3">—</div>
          </div>
        </div>
      </div>

      <div class="p-body">
        <div class="block" id="blkSlogan">
          <div class="label">理念標語</div>
          <div class="txt" id="uSlogan">—</div>
        </div>

        <div class="block" id="blkService">
          <div class="label">服務項目</div>
          <div class="txt" id="uService">—</div>
        </div>

        <div class="block" id="blkExp">
          <div class="label">經歷</div>
          <div class="txt" id="uExp">—</div>
        </div>

        <div class="grid">
          <div class="kv"><div class="k">電話</div><div class="v" id="uPhone">—</div></div>
          <div class="kv"><div class="k">Email</div><div class="v" id="uEmail">—</div></div>
          <div class="kv"><div class="k">LINE</div><div class="v" id="uLine">—</div></div>
          <div class="kv"><div class="k">微信ID</div><div class="v" id="uWeChat">—</div></div>
        </div>
      </div>

      <div class="p-footer">
        <div class="qrcode" id="qrBox"></div>
        <div class="footmeta">
          <div class="t" id="qrTitle">掃描開啟名片</div>
          <div class="s" id="qrSub">建議：長按保存此圖，或分享給對方。</div>
          <div class="s" id="qrLink" style="margin-top:8px;opacity:.85;word-break:break-all;font-size:11px;">—</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnMake">
        <span>產生可保存圖片（Render）</span>
        <small>PNG</small>
      </button>
      <button class="btn" id="btnOpenCard">
        <span>開啟名片（index）</span>
        <small>Open</small>
      </button>
      <button class="btn" id="btnCopy">
        <span>複製名片連結</span>
        <small>Copy</small>
      </button>
    </div>

    <div class="note">
      交貨小技巧：在微信內「長按圖片」可直接保存。<br/>
      若你先點「產生可保存圖片」，下方會出現一張真正的 PNG，最適合交付。
    </div>

    <div class="outImg hidden" id="outImg">
      <img id="outPng" alt="Poster PNG" />
    </div>
  </div>

  <!-- libs (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <script src="./wechat.js?v=491"></script>
</body>
</html>
