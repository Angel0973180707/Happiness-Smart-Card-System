<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>HSC Form v503</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./form.css" />
  <style>
    body{ font-family: system-ui,-apple-system,"Noto Sans TC",Arial; padding:18px; }
    .box{ max-width:720px; margin:0 auto; }
    label{ display:block; margin:10px 0 6px; font-weight:700; }
    input,select,button{ width:100%; padding:10px; border-radius:10px; border:1px solid rgba(0,0,0,.15); }
    button{ font-weight:900; margin-top:14px; }
    .row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:720px){ .row{ grid-template-columns:1fr; } }
    .mono{ font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; white-space:pre-wrap; }
    .pill{ display:inline-block; padding:6px 10px; border-radius:999px; background:#eef; margin:6px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>HSC 自建表單 <span class="pill" id="status">Ready</span></h2>
    <div>版本：<b id="ver">-</b></div>
    <div>cardId：<b id="cardId">-</b></div>

    <form>
      <div class="row">
        <div>
          <label>姓名</label>
          <input id="name" placeholder="例如：小天使" />
        </div>
        <div>
          <label>職稱</label>
          <input id="title" placeholder="例如：館長" />
        </div>
      </div>

      <label>單位</label>
      <input id="unit" placeholder="例如：幸福智慧名片館" />

      <div class="row">
        <div>
          <label>電話</label>
          <input id="phone" inputmode="tel" placeholder="09xx..." />
        </div>
        <div>
          <label>Email</label>
          <input id="email" inputmode="email" placeholder="xxx@gmail.com" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>LINE 連結</label>
          <input id="line_url" placeholder="https://line.me/ti/p/..." />
        </div>
        <div>
          <label>官網</label>
          <input id="website" placeholder="https://..." />
        </div>
      </div>

      <label>微信ID</label>
      <input id="wechat_id" placeholder="a0973..." />

      <div class="row">
        <div>
          <label>方案</label>
          <select id="plan">
            <option value="">（可略）</option>
            <option value="free">自由搭配</option>
            <option value="premium">精品設計</option>
          </select>
        </div>
        <div>
          <label>主題/顏色代碼</label>
          <input id="theme" placeholder="例如：c1 / p3" />
        </div>
      </div>

      <label>頭像（會壓縮到 512px）</label>
      <input id="avatar" type="file" accept="image/*" />

      <label>封面（會壓縮到 1200px）</label>
      <input id="cover" type="file" accept="image/*" />

      <button id="btnSubmit">送出（reserve → upload → create）</button>
    </form>

    <div style="margin-top:14px;">
      <div>avatarURL：</div>
      <div class="mono" id="avatarURL">-</div>
      <div style="margin-top:10px;">coverURL：</div>
      <div class="mono" id="coverURL">-</div>
    </div>

    <div style="margin-top:14px; font-weight:800;" id="result"></div>

    <div style="margin-top:14px;">
      <div class="mono" id="log">（log）</div>
    </div>
  </div>

  <script type="module" src="./form.js"></script>
</body>
</html>
