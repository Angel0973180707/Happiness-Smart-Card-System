<!doctype html>

<meta name="theme-color" content="#0b1220"/>

<style>

/* 原本CSS全部保留 */

.previewCard{

}

.previewHead{
font-weight:900;

margin-bottom:12px;
}

.previewTop{
display:flex;
gap:12px;
align-items:center;
margin-bottom:10px;
}

.previewAvatar{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
background:#222;
}

.previewLogo{
width:60px;
height:60px;

background:#222;
}

.previewName{

}

.previewUnit{

}

.previewTitle{

.previewSlogan{

.previewServices{

.previewExpTitle{

}

.previewExp{

}

</style>

<body>

<div class="wrap">

<!-- 原本 top / flow / card 都保留 -->

<!-- STEP7 -->

<section class="page" data-page="6">

<div class="subnote">
確認資料後再送出。送出完成後畫面會停留在此頁。
</div>

<div class="summary" id="summaryBox"></div>


<!-- 新增：名片預覽 -->

<div class="previewCard" id="previewCard">

<div class="previewHead">
名片預覽
</div>

<div class="previewBody">

<div class="previewTop">
<img id="previewAvatar" class="previewAvatar"/>
<img id="previewLogo" class="previewLogo"/>
</div>

<div class="previewName" id="previewName">姓名</div>

<div class="previewUnit" id="previewUnit">單位</div>

<div class="previewTitle" id="previewTitle">職稱</div>

<div class="previewSlogan" id="previewSlogan"></div>

<div class="previewServices" id="previewServices"></div>

<div class="previewExpTitle">
經歷／產品特色
</div>

<div class="previewExp" id="previewExp"></div>

</div>
</div>


<div class="btns" style="margin-top:14px;">

<button id="btnSubmit" type="button">
送出資料
</button>

<button id="btnReset" class="ghost" type="button">
重設表單
</button>

</div>


<div class="submit-progress-wrap" id="submitProgressWrap">

<div class="submit-progress-head">
<strong id="submitProgressTitle">送出中</strong>

</div>

<div class="submit-progress">
<div class="submit-progress-fill" id="submitProgressFill"></div>
</div>

<div class="submit-progress-text" id="submitProgressText">
準備中…
</div>

</div>


<div class="successCard" id="successCard">

<div class="successTitle">
已送出成功
</div>

<p class="successText">
你可以直接複製下面的序號訊息回傳客服。
</p>

<div class="successIdBox">

<div class="successIdLabel">
本次名片序號
</div>

<div class="successIdValue" id="successIdValue">
-
</div>

<div class="copyHint">
請將此序號回傳客服
</div>

</div>

<div class="btns">
<button type="button" class="okBtn" id="btnCopyCustomerText">
複製序號回傳客服
</button>
</div>

<div class="copyFeedback" id="copyFeedback">

</div>
