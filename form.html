<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>天使幸福智慧名片｜資料填寫 v4.8-preview-fixed</title>
  <meta name="theme-color" content="#0b1220" />

  <style>
    /* ============================================================
       天使幸福智慧名片館 style.css (完整整合版)
       v527.2-stable-preview-fix — 包含所有 #livePreviewCard 樣式
    ============================================================ */

    :root {
      --bg: #f7f5f1;
      --ink: #2a241e;
      --muted: rgba(42, 36, 30, .64);
      --radius: 26px;
      --shadow: 0 24px 64px rgba(0,0,0,.12);
      --shadow-soft: 0 14px 36px rgba(0,0,0,.10);
      --card-white: rgba(255,255,255,.94);
      --line: rgba(0,0,0,.07);

      --p: #ff6b81;
      --s: #ff4757;

      --free-sat: 1.18;
      --free-contrast: 1.03;

      --prem-ink: rgba(255,255,255,0.94);
      --prem-muted: rgba(255,255,255,0.76);
      --prem-soft: rgba(255,255,255,0.15);

      --bgTint: rgba(255,255,255,0.0);
      --accentText: rgba(42,36,30,0.92);

      --dotFree: 36px;
      --dotPrem: 32px;

      --paper-strength: 0.26;
      --paper-grain: 0.12;
      --paper-fiber: 0.10;

      --panel-blur: 14px;
      --panel-bg: rgba(255,255,255,.84);

      --card-glow-top: rgba(255,255,255,.80);
      --card-glow-bot: rgba(0,0,0,.05);

      --expand-bg: rgba(255,255,255,.92);
      --expand-ink: rgba(92,56,32,.96);
      --expand-line: rgba(145,102,69,.20);

      /* 表單專用變數 */
      --bg-form: #0b1220;
      --bg-2-form: #0f172a;
      --card-form: #111a2b;
      --card-2-form: #142038;
      --line-form: rgba(255,255,255,.12);
      --line2-form: rgba(255,255,255,.08);
      --text-form: rgba(255,255,255,.95);
      --muted-form: rgba(255,255,255,.72);
      --muted-2-form: rgba(255,255,255,.56);
      --accent-form: #7bdcff;
      --ok-form: #6ee7b7;
      --bad-form: #fb7185;
      --warn-form: #fbbf24;
      --radius-form: 18px;
      --shadow-form: 0 16px 34px rgba(0,0,0,.28);
      --shadow-soft-form: 0 8px 20px rgba(0,0,0,.18);
      --fs: 14px;
      --fs2: 16px;
      --fs3: 19px;
      --fs4: 23px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* 表單頁面背景 */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(1000px 720px at 16% -10%, rgba(123,220,255,.15), transparent 62%),
        radial-gradient(820px 680px at 100% 0%, rgba(255,191,36,.08), transparent 56%),
        linear-gradient(180deg, #0b1220 0%, #0d1628 100%);
      color: var(--text-form);
      font-family: system-ui, -apple-system, "Noto Sans TC", Segoe UI, Roboto, Arial, sans-serif;
      font-size: var(--fs);
      line-height: 1.75;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    body {
      padding-bottom: 88px;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* 表單容器樣式 */
    .wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 14px 12px 40px;
    }

    .header {
      padding: 10px 2px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: var(--fs4);
      line-height: 1.28;
      letter-spacing: .01em;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted-form);
      font-size: 13px;
      line-height: 1.8;
    }

    .headerActions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .page {
      display: none;
      padding: 0;
    }

    .page.active {
      display: block;
    }

    .pageHead {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line2-form);
    }

    .pageStep {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 7px 11px;
      border: 1px solid var(--line-form);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: var(--muted-form);
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .pageHead h2 {
      margin: 0;
      font-size: var(--fs3);
      line-height: 1.3;
    }

    .subnote {
      margin: 8px 0 0;
      color: var(--muted-form);
      font-size: 12px;
      line-height: 1.85;
      white-space: pre-line;
    }

    .card {
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),
        rgba(255,255,255,.02);
      border: 1px solid var(--line-form);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow-form);
      margin-bottom: 14px;
    }

    .helperCard {
      border: 1px solid rgba(123,220,255,.22);
      background: linear-gradient(180deg, rgba(123,220,255,.08), rgba(255,255,255,.02));
    }

    .helperTitle {
      font-size: 13px;
      font-weight: 900;
      margin: 0 0 8px;
      line-height: 1.6;
    }

    .helperText {
      color: var(--muted-form);
      font-size: 12px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .topAssist {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-form);
      margin: 0 0 8px;
      font-weight: 900;
      line-height: 1.5;
    }

    .labelHint {
      display: block;
      margin-top: 4px;
      color: var(--muted-form);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.8;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(255,255,255,.04);
      color: var(--text-form);
      border: 1px solid var(--line-form);
      border-radius: 14px;
      padding: 13px 13px;
      outline: none;
      font-size: 14px;
      line-height: 1.7;
      min-height: 48px;
      transition: border-color .18s ease, box-shadow .18s ease;
      margin-top: 0;
    }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(123,220,255,.46);
      box-shadow: 0 0 0 3px rgba(123,220,255,.10);
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,.34);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 14px;
      padding: 11px 15px;
      font-weight: 900;
      font-size: 14px;
      background: rgba(123,220,255,.16);
      color: var(--text-form);
      border: 1px solid rgba(123,220,255,.35);
      min-height: 44px;
      line-height: 1.3;
      transition: .18s ease;
    }

    button.secondary {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line-form);
      color: #fff;
    }

    button.ghost {
      background: transparent;
      border: 1px solid var(--line-form);
      color: var(--muted-form);
    }

    button.warn {
      background: rgba(251,191,36,.10);
      border: 1px solid rgba(251,191,36,.28);
      color: #ffe8a3;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .pageNav {
      position: sticky;
      bottom: 0;
      z-index: 50;
      padding: 12px;
      background: rgba(11,18,32,.94);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line-form);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .navDots {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
    }

    .navDots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line-form);
      opacity: .9;
    }

    .navDots span.active {
      background: var(--accent-form);
      box-shadow: 0 0 0 4px rgba(123,220,255,.12);
    }

    .status {
      margin-top: 14px;
      border: 1px dashed var(--line-form);
      border-radius: 14px;
      padding: 13px 14px;
      color: var(--muted-form);
      font-size: 12px;
      line-height: 1.95;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(255,255,255,.02);
    }

    .submit-progress-wrap {
      margin-top: 14px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      display: none;
    }

    .submit-progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 11px;
      color: rgba(255,255,255,.85);
      font-weight: 900;
    }

    .submit-progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.10);
      overflow: hidden;
    }

    .submit-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(123,220,255,.95), rgba(255,170,90,.95));
      box-shadow: 0 0 18px rgba(123,220,255,.18);
      transition: width .28s ease;
    }

    .submit-progress-text {
      margin-top: 8px;
      color: var(--muted-form);
      font-size: 11px;
      line-height: 1.8;
      min-height: 18px;
    }

    .successBox {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(110,231,183,.08);
      border: 1px solid rgba(110,231,183,.25);
      display: none;
    }

    .successTitle {
      font-size: 16px;
      font-weight: 900;
      color: #6ee7b7;
    }

    .successCopy {
      margin-top: 10px;
      width: 100%;
      height: 130px;
      border-radius: 10px;
      border: 1px solid var(--line-form);
      background: #020617;
      color: #fff;
      padding: 10px;
      font-size: 13px;
      line-height: 1.8;
    }

    .lineBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #22c55e;
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.08);
      min-height: 44px;
    }

    .copyBtn {
      background: #0ea5e9;
      color: #fff;
    }

    .footNote {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted-2-form);
      line-height: 1.8;
      white-space: pre-line;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .uploadGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    @media(min-width:760px) {
      .uploadGrid { grid-template-columns: 1fr 1fr; }
    }

    .uItem {
      border: 1px solid var(--line-form);
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,.02);
    }

    .uItemHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .uItemHead strong {
      font-size: 14px;
      line-height: 1.45;
    }

    .uItemHead small {
      color: var(--muted-form);
      font-size: 11px;
      line-height: 1.7;
    }

    .thumb {
      margin-top: 10px;
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 14px;
      border: 1px solid var(--line-form);
      overflow: hidden;
      background: rgba(0,0,0,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,.38);
      font-size: 11px;
      text-align: center;
      padding: 12px;
      line-height: 1.8;
    }

    .thumb.square {
      aspect-ratio: 1 / 1;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: rgba(255,255,255,.02);
    }

    .miniRow {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .miniRow input[type="file"] {
      padding: 10px;
      font-size: 12px;
      min-height: auto;
      flex: 1 1 180px;
    }

    .previewWrap {
      margin-top: 14px;
      border: 1px solid rgba(123,220,255,.18);
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(123,220,255,.05), rgba(255,255,255,.02));
    }

    .previewHead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .previewHead h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
    }

    .previewHead p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted-form);
      line-height: 1.8;
    }

    .pageBadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line-form);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: var(--text-form);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .previewStage {
      display: flex;
      justify-content: center;
    }

    /* ============================================================
       預覽卡片完整樣式 (來自 style.css，包含所有 #livePreviewCard 規則)
    ============================================================ */

    .hsc-preview {
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 40px rgba(0,0,0,.26);
      background: #fffaf5;
      color: #3e2f25;
      transition: all 0.2s ease;
    }

    /* 基礎背景色 (fallback) */
    .hsc-preview[data-plan="free"][data-color="c1"] { background: linear-gradient(180deg,#fff7fb 0%,#fff3f7 100%); }
    .hsc-preview[data-plan="free"][data-color="c2"] { background: linear-gradient(180deg,#f7fbff 0%,#eef7ff 100%); }
    .hsc-preview[data-plan="free"][data-color="c3"] { background: linear-gradient(180deg,#fff9f3 0%,#fff2e6 100%); }
    .hsc-preview[data-plan="free"][data-color="c4"] { background: linear-gradient(180deg,#faf7ff 0%,#f2ecff 100%); }
    .hsc-preview[data-plan="free"][data-color="c5"] { background: linear-gradient(180deg,#f7fff9 0%,#edf9f0 100%); }

    .hsc-preview[data-plan="premium"][data-premium="p1"] { background: linear-gradient(180deg,#7d3041 0%,#5c2230 100%); color:#fff7f7; }
    .hsc-preview[data-plan="premium"][data-premium="p2"] { background: linear-gradient(180deg,#6c1f2b 0%,#4c1520 100%); color:#fff7f7; }
    .hsc-preview[data-plan="premium"][data-premium="p3"] { background: linear-gradient(180deg,#243a5b 0%,#17263d 100%); color:#f6f8ff; }
    .hsc-preview[data-plan="premium"][data-premium="p4"] { background: linear-gradient(180deg,#705c86 0%,#534166 100%); color:#fbf8ff; }
    .hsc-preview[data-plan="premium"][data-premium="p5"] { background: linear-gradient(180deg,#5f7181 0%,#44515d 100%); color:#f8fbff; }
    .hsc-preview[data-plan="premium"][data-premium="p6"] { background: linear-gradient(180deg,#d6bc74 0%,#b18b3f 100%); color:#fffaf1; }
    .hsc-preview[data-plan="premium"][data-premium="p7"] { background: linear-gradient(180deg,#5b463c 0%,#403028 100%); color:#fff8f3; }

    .hsc-preview-banner {
      height: 132px;
      position: relative;
      background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.06));
    }

    .hsc-preview[data-style="s1"] .hsc-preview-banner {
      border-bottom-left-radius: 42% 34%;
      border-bottom-right-radius: 42% 34%;
    }

    .hsc-preview[data-style="s2"] .hsc-preview-banner {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .hsc-preview[data-style="s3"] .hsc-preview-banner {
      background: radial-gradient(circle at 50% 18%, rgba(255,255,255,.62), rgba(255,255,255,.10) 48%, transparent 72%), linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.06));
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
    }

    .hsc-preview-avatarWrap {
      margin-top: -52px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .hsc-preview-avatar {
      width: 108px;
      height: 108px;
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
      border: 5px solid rgba(255,255,255,.92);
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hsc-preview-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hsc-preview-logoWrap {
      display: flex;
      justify-content: center;
      margin-top: 12px;
    }

    .hsc-preview-logo {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,.80);
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hsc-preview-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
    }

    .hsc-preview-main {
      padding: 14px 16px 18px;
    }

    .hsc-preview-name {
      font-size: 24px;
      line-height: 1.3;
      font-weight: 1000;
      text-align: center;
      margin-top: 10px;
      word-break: break-word;
    }

    .hsc-preview-unit,
    .hsc-preview-title,
    .hsc-preview-slogan {
      text-align: center;
      margin-top: 6px;
      white-space: pre-line;
      word-break: break-word;
    }

    .hsc-preview-unit { font-size: 13px; opacity: .84; font-weight: 900; }
    .hsc-preview-title { font-size: 14px; opacity: .88; font-weight: 900; }
    .hsc-preview-slogan { font-size: 13px; opacity: .9; line-height: 1.8; }

    .hsc-preview-block {
      margin-top: 14px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,.50);
      border: 1px solid rgba(0,0,0,.05);
    }

    .hsc-preview[data-plan="premium"] .hsc-preview-block {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.16);
    }

    .hsc-preview-blockTitle {
      font-size: 12px;
      font-weight: 1000;
      margin-bottom: 6px;
      opacity: .92;
    }

    .hsc-preview-blockBody {
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-line;
      word-break: break-word;
    }

    .hsc-preview-photoWall {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .hsc-preview-photoItem {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(0,0,0,.05);
    }

    .hsc-preview-photoItem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hsc-preview-empty {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--muted-form);
      line-height: 1.8;
      border: 1px dashed rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      margin-top: 12px;
    }

    /* ============================================================
       主題顏色 (自由搭配款)
    ============================================================ */
    #livePreviewCard.color-1 { --p:#e57d84; --s:#b23d46; --bgTint: rgba(229,125,132,.15); --accentText: rgba(109,42,48,.94); }
    #livePreviewCard.color-2 { --p:#7daed7; --s:#3e6e9a; --bgTint: rgba(125,174,215,.16); --accentText: rgba(37,67,92,.94); }
    #livePreviewCard.color-3 { --p:#e7a860; --s:#ba6f2e; --bgTint: rgba(231,168,96,.16); --accentText: rgba(101,60,25,.94); }
    #livePreviewCard.color-4 { --p:#a48bd8; --s:#6c58a7; --bgTint: rgba(164,139,216,.16); --accentText: rgba(66,51,105,.94); }
    #livePreviewCard.color-5 { --p:#7fc89a; --s:#3a8a60; --bgTint: rgba(127,200,154,.16); --accentText: rgba(29,88,58,.94); }

    /* 精品配色 */
    #livePreviewCard.p1 { --p: #e8909a; --s: #c04a58; --prem-soft: rgba(255,255,255,.16); }
    #livePreviewCard.p2 { --p: #9b5566; --s: #6b2d3e; --prem-soft: rgba(255,255,255,.14); }
