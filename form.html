<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happiness Smart Card｜建立智慧名片 v498</title>
<link rel="stylesheet" href="form.css?v=498" />
</head>

<body>

<div class="wrap">

<h1>建立智慧名片</h1>

<div id="statusBox" class="status"></div>

<form id="cardForm">

<!-- ===================== -->
<!-- 方案切換 -->
<!-- ===================== -->
<div class="segBox">
  <button type="button" id="segFree" class="seg on">自由搭配</button>
  <button type="button" id="segPremium" class="seg">精品設計</button>
  <input type="hidden" id="plan" value="free" />
</div>

<div id="planHint" class="planHint"></div>

<!-- ===================== -->
<!-- 自由款選項 -->
<!-- ===================== -->
<div id="freeOptions" class="styleBox">
  <h3>自由搭配設定</h3>

  <label>顏色
    <select id="color">
      <option value="c1">粉</option>
      <option value="c2">藍</option>
      <option value="c3">橘</option>
      <option value="c4">紫</option>
      <option value="c5">綠</option>
    </select>
  </label>

  <label>版型
    <select id="style">
      <option value="s1">正拱</option>
      <option value="s2">平直</option>
      <option value="s3">晨曦</option>
    </select>
  </label>

  <label>紙感
    <select id="paper">
      <option value="f1">棉紙</option>
      <option value="f2">顆粒</option>
      <option value="f3">亞麻</option>
    </select>
  </label>
</div>

<!-- ===================== -->
<!-- 精品款選項 -->
<!-- ===================== -->
<div id="premiumOptions" class="styleBox" style="display:none;">
  <h3>精品底色</h3>
  <select id="premium_color">
    <option value="p1">胭脂紅</option>
    <option value="p2">酒紅</option>
    <option value="p3">深藍</option>
    <option value="p4">霧紫</option>
    <option value="p5">藍灰</option>
    <option value="p6">金箔</option>
    <option value="p7">褐碳</option>
  </select>
</div>

<hr/>

<!-- ===================== -->
<!-- 基本資料 -->
<!-- ===================== -->

<label>姓名
  <input type="text" id="name" required />
</label>

<label>單位
  <input type="text" id="unit" />
</label>

<label>職稱
  <input type="text" id="title" />
</label>

<label>電話
  <input type="text" id="phone" />
</label>

<label>Email
  <input type="text" id="email" />
</label>

<label>網站
  <input type="text" id="website" />
</label>

<label>地址
  <input type="text" id="address" />
</label>

<label>標語
  <input type="text" id="slogan" />
</label>

<label>服務項目
  <textarea id="services"></textarea>
</label>

<label>經歷
  <textarea id="experience"></textarea>
</label>

<label>LINE 連結或 @ID
  <input type="text" id="line_url" />
</label>

<label>LINE 官方帳號
  <input type="text" id="line_oa" />
</label>

<hr/>

<!-- ===================== -->
<!-- 圖片區 -->
<!-- ===================== -->

<h3>頭像</h3>
<input type="file" id="avatar_file" accept="image/*" />
<img id="avatarPreview" class="preview" />

<h3>Logo</h3>
<input type="file" id="logo_file" accept="image/*" />
<img id="logoPreview" class="preview" />

<h3>照片牆</h3>

<input type="file" id="photo1_file" accept="image/*" />
<img id="photo1Preview" class="preview" />

<input type="file" id="photo2_file" accept="image/*" />
<img id="photo2Preview" class="preview" />

<div class="morePhotos">
<input type="file" id="photo3_file" accept="image/*" />
<img id="photo3Preview" class="preview" />

<input type="file" id="photo4_file" accept="image/*" />
<img id="photo4Preview" class="preview" />

<input type="file" id="photo5_file" accept="image/*" />
<img id="photo5Preview" class="preview" />
</div>

<hr/>

<!-- ===================== -->
<!-- 操作按鈕 -->
<!-- ===================== -->

<div class="btnRow">
  <button type="submit" id="btnSubmit">建立名片</button>
  <button type="button" id="btnFillDemo">示範資料</button>
  <button type="button" id="btnTestPing">測試連線</button>
  <button type="button" id="btnReset">清空</button>
</div>

</form>

<!-- ===================== -->
<!-- 結果區 -->
<!-- ===================== -->

<div id="resultBox" class="result" style="display:none;">

<h2>建立完成</h2>

<p>名片 ID：<span id="r_id"></span></p>
<p>Token：<span id="r_token"></span></p>

<p>智慧名片成品：</p>
<p id="r_card" class="linkBox"></p>
<button id="btnCopyCard">複製成品連結</button>

<p>OG 交付頁：</p>
<p id="r_og" class="linkBox"></p>
<button id="btnCopyOg">複製 OG 連結</button>

</div>

</div>

<script src="form.js?v=498"></script>

</body>
</html>
