<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HSC v6.8.3</title><link rel="stylesheet" href="./form.css"></head><body><main class="wrap"><header class="hero"><div><p class="eyebrow">天使幸福智慧名片</p><h1>智慧名片申請表</h1><p class="sub">v6.8.3 完整覆蓋版</p></div><button type="button" id="btn-open-showcase" class="ghost-btn">參考門面頁</button></header><section id="form-status-strip" class="status"></section><form id="smart-card-form"><input type="hidden" id="invite_code"><input type="hidden" id="ref"><section class="card"><div class="head"><div><p class="kicker">STEP 1</p><h2>先選方案與加購</h2></div><div class="pills"><span class="pill" id="summary-plan-pill">請先選擇方案</span><span class="pill" id="summary-photo-pill">照片上限：-</span><span class="pill" id="summary-cta-pill">CTA 上限：-</span></div></div><div class="grid2"><label class="plan"><input type="radio" name="plan" value="free"><span class="plan-box"><strong>自由搭配</strong><em>NT$ 1500</em><small>基礎 2 照片 / 1 CTA</small></span></label><label class="plan"><input type="radio" name="plan" value="premium"><span class="plan-box premium"><strong>精品設計</strong><em>NT$ 2000</em><small>基礎 5 照片 / 3 CTA</small></span></label></div><div class="stack"><label class="addon"><input type="checkbox" name="addons" value="addon_marquee"><span>跑馬燈功能</span><b>300</b></label><label class="addon"><input type="checkbox" id="addon_photo_enabled" name="addons" value="addon_photo"><span>照片加購 <small id="addon-photo-tip">先選方案後可輸入張數</small></span><input type="number" id="addon_photo_qty" value="0" min="0" max="0" disabled><b>100/張</b></label><label class="addon"><input type="checkbox" id="addon_cta_enabled" name="addons" value="addon_cta"><span>CTA 加購</span><input type="number" id="addon_cta_qty" value="0" min="0" max="10" disabled><b>100/個</b></label><label class="addon"><input type="checkbox" name="addons" value="addon_update_unlimited"><span>無限更新</span><b>300</b></label><label class="addon"><input type="checkbox" name="addons" value="addon_bundle"><span>跑馬燈＋更新組合</span><b>500</b></label><label class="addon gold"><input type="checkbox" name="addons" value="addon_gold_member"><span>金牌級會員 <small>特別加購</small></span><div class="gold-actions"><button type="button" id="btn-gold-info" class="ghost-btn mini">瞭解金牌會員權益</button><button type="button" id="btn-gold-copy" class="ghost-btn mini">複製詢問文案</button><button type="button" id="btn-gold-contact" class="line-btn mini">聯繫客服</button></div><b>10000</b></label></div><div class="summary"><div>主方案：<strong id="summary-plan-name">請先選擇方案</strong></div><div>照片可上傳：<strong id="summary-photo-count">-</strong> 張</div><div>CTA 可填寫：<strong id="summary-cta-count">-</strong> 組</div><div>跑馬燈：<strong id="summary-marquee-status">未開啟</strong></div></div><div class="quote"><div class="quote-row"><span>主方案</span><strong id="quote-plan-amount">-</strong></div><div class="quote-row"><span>加購小計</span><strong id="quote-addon-amount">NT$ 0</strong></div><div id="quote-addon-breakdown" class="breakdown">尚未選擇加購</div><div class="quote-row total"><span>總價</span><strong id="quote-total-amount">-</strong></div></div></section><section class="card"><p class="kicker">STEP 2</p><h2>名片樣式</h2><div class="grid2"><div id="free-theme-group" class="field hidden"><label>自由搭配顏色</label><select id="free_color"><option value="c1">粉</option><option value="c2">藍</option><option value="c3">橘</option><option value="c4">紫</option><option value="c5">綠</option></select><label>自由搭配版型</label><select id="free_style"><option value="s1">正拱</option><option value="s2">平直</option><option value="s3">晨曦</option></select><label>自由搭配紙感</label><select id="free_paper"><option value="f1">棉紙</option><option value="f2">象牙紙</option><option value="f3">霧灰</option></select></div><div id="premium-theme-group" class="field hidden"><label>精品設計底色</label><select id="premium_color"><option value="p1">胭脂紅</option><option value="p2">酒紅</option><option value="p3">深藍</option><option value="p4">霧紫</option><option value="p5">藍灰</option><option value="p6">金箔</option><option value="p7">褐碳</option></select></div></div></section><section class="card"><p class="kicker">STEP 3</p><h2>基本資料</h2><div class="grid2"><div class="field"><label>姓名 / 品牌名稱</label><input id="display_name" required></div><div class="field"><label>職稱 / 副標</label><input id="title"></div><div class="field"><label>電話</label><input id="phone" required></div><div class="field"><label>Email</label><input id="email"></div><div class="field full"><label>地址</label><input id="address"></div><div class="field full"><label>簡介</label><textarea id="intro" rows="4"></textarea></div></div></section><section class="card"><p class="kicker">STEP 4</p><h2>照片上傳</h2><div id="photo-slots" class="grid2"></div></section><section class="card"><p class="kicker">STEP 5</p><h2>CTA 連結</h2><div id="cta-slots" class="stack"></div></section><section id="marquee-section" class="card hidden"><p class="kicker">STEP 6</p><h2>跑馬燈訊息</h2><div class="stack"><input id="marquee_1" placeholder="跑馬燈 1"><input id="marquee_2" placeholder="跑馬燈 2"><input id="marquee_3" placeholder="跑馬燈 3"></div></section><section class="card"><div class="actions"><button type="button" id="btn-save-draft" class="ghost-btn">暫存草稿</button><button type="button" id="btn-clear-draft" class="ghost-btn">清除暫存</button><button type="button" id="btn-contact-service" class="line-btn">聯繫客服</button><button type="submit" id="btn-submit-form" class="primary-btn">送出申請</button></div></section></form><template id="photo-slot-template"><div class="photo-card"><div class="photo-head"><strong class="photo-title"></strong><span class="badge">尚未上傳</span></div><div class="preview-frame"><img class="preview-image hidden" alt="預覽圖"><div class="preview-empty">尚未選擇圖片</div></div><input type="file" class="photo-file-input" accept="image/*"><div class="photo-tools hidden"><div class="actions"><button type="button" class="ghost-btn mini rotate-left">左轉</button><button type="button" class="ghost-btn mini rotate-right">右轉</button><button type="button" class="ghost-btn mini reset-photo">重設</button></div><input type="range" class="zoom-range" min="1" max="2" step="0.01" value="1"></div></div></template><template id="cta-slot-template"><div class="field cta-slot-card"><label class="cta-title-label"></label><input type="text" class="cta-label-input" placeholder="按鈕文字"><input type="url" class="cta-url-input" placeholder="https://"></div></template><script src="./form.js"></script></main></body></html>
