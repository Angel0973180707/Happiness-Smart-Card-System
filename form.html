<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>Fill Card Form</title>

  <link rel="stylesheet" href="./form.css?v=491" />
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="title">填寫名片資料</div>
      <button class="btn ghost" type="button" id="btnBack">返回名片</button>
    </header>

    <!-- PLAN -->
    <section class="card">
      <div class="section-title">方案（必選）</div>
      <div class="seg">
        <button type="button" class="seg-btn active" data-plan="free" id="planFree">自由搭配</button>
        <button type="button" class="seg-btn" data-plan="premium" id="planPremium">精品設計</button>
      </div>

      <!-- FREE REQUIRED -->
      <div id="freeBox" class="subbox">
        <div class="row-title">自由款樣式（顏色／版型／紙感 皆必選）</div>

        <div class="field">
          <div class="label">顏色（必選）</div>
          <div class="dotrow" id="freeColors" role="group" aria-label="free colors">
            <button type="button" class="dot dot-1" data-color="color-1" aria-label="粉"></button>
            <button type="button" class="dot dot-2" data-color="color-2" aria-label="藍"></button>
            <button type="button" class="dot dot-3" data-color="color-3" aria-label="橘"></button>
            <button type="button" class="dot dot-4" data-color="color-4" aria-label="紫"></button>
            <button type="button" class="dot dot-5" data-color="color-5" aria-label="綠"></button>
          </div>
        </div>

        <div class="field">
          <div class="label">版型（必選）</div>
          <div class="btnrow" id="freeStyles">
            <button type="button" class="btn pill" data-style="arch">正拱</button>
            <button type="button" class="btn pill" data-style="flat">平直</button>
            <button type="button" class="btn pill" data-style="spot">晨曦</button>
          </div>
        </div>

        <div class="field">
          <div class="label">紙感（必選）</div>
          <div class="btnrow" id="freePapers">
            <button type="button" class="btn pill" data-paper="paper-1">霧面棉紙</button>
            <button type="button" class="btn pill" data-paper="paper-2">細顆粒紙</button>
            <button type="button" class="btn pill" data-paper="paper-3">亞麻紋</button>
          </div>
        </div>
      </div>

      <!-- PREMIUM REQUIRED -->
      <div id="premiumBox" class="subbox" style="display:none;">
        <div class="row-title">精品款底色（必選）</div>
        <div class="dotrow prem" id="premiumThemes" role="group" aria-label="premium themes">
          <button type="button" class="p-dot p1" data-premium="p1" aria-label="p1"></button>
          <button type="button" class="p-dot p2" data-premium="p2" aria-label="p2"></button>
          <button type="button" class="p-dot p3" data-premium="p3" aria-label="p3"></button>
          <button type="button" class="p-dot p4" data-premium="p4" aria-label="p4"></button>
          <button type="button" class="p-dot p5" data-premium="p5" aria-label="p5"></button>
          <button type="button" class="p-dot p6" data-premium="p6" aria-label="p6"></button>
          <button type="button" class="p-dot p7" data-premium="p7" aria-label="p7"></button>
        </div>
      </div>

      <div class="hint" id="styleHint">請先完成必選樣式，才能送出。</div>
    </section>

    <!-- BASIC INFO -->
    <section class="card">
      <div class="section-title">基本資料</div>

      <div class="field">
        <div class="label">姓名</div>
        <input id="name" class="input" placeholder="例：王小明" autocomplete="name" />
      </div>

      <div class="field">
        <div class="label">單位／公司</div>
        <input id="unit" class="input" placeholder="例：幸福緣 / Angel" />
      </div>

      <div class="field">
        <div class="label">頭銜</div>
        <input id="title" class="input" placeholder="例：創辦人 / 顧問" />
      </div>

      <div class="field">
        <div class="label">一句話／簡介</div>
        <textarea id="slogan" class="textarea" placeholder="例：一點，就看見彼此的價值"></textarea>
      </div>
    </section>

    <!-- AVATAR UPLOAD (ONLY) -->
    <section class="card">
      <div class="section-title">個人照（只保留上傳）</div>

      <label class="upload-btn" for="avatarFile">
        <span>上傳個人照</span>
        <input id="avatarFile" type="file" accept="image/*" />
      </label>

      <div class="preview">
        <img id="avatarPreview" alt="個人照預覽" style="display:none;" />
        <div class="mini" id="avatarMeta" style="display:none;"></div>
      </div>

      <div class="hint">
        送出前會自動壓縮：<b>最長邊 1200px</b>、目標 <b>≤ 350KB</b>（避免 Failed to fetch）。
      </div>
    </section>

    <!-- CONTACT -->
    <section class="card">
      <div class="section-title">聯繫方式</div>

      <div class="field">
        <div class="label">電話</div>
        <input id="phone" class="input" inputmode="tel" placeholder="例：0912xxxxxx" autocomplete="tel" />
      </div>

      <div class="field">
        <div class="label">Email</div>
        <input id="email" class="input" inputmode="email" placeholder="例：abc@gmail.com" autocomplete="email" />
      </div>

      <div class="field">
        <div class="label">地址</div>
        <input id="address" class="input" placeholder="例：高雄市..." />
      </div>

      <div class="field">
        <div class="label">微信ID</div>
        <input id="wechatId" class="input" placeholder="例：a0973180707" />
      </div>

      <div class="field">
        <div class="label">LINE（連結或 @ID）</div>
        <input id="lineAny" class="input" placeholder="例：https://lin.ee/xxx 或 @yourid" />
      </div>
    </section>

    <!-- ACTIONS -->
    <section class="actions">
      <button class="btn danger" type="button" id="btnClear">清除草稿</button>
      <button class="btn primary" type="button" id="btnSubmit">✅ 送出資料</button>
    </section>

    <div class="status" id="statusBox" aria-live="polite"></div>
  </div>

  <script src="./form.js?v=491"></script>
</body>
</html>
