<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>天使幸福智慧名片｜自建表單 v498</title>

  <link rel="stylesheet" href="./form.css?v=498" />
</head>

<body>
  <main class="wrap">
    <header class="top">
      <div class="brand">
        <div class="dot"></div>
        <div class="titleBox">
          <div class="t1">天使幸福智慧名片</div>
          <div class="t2">自建表單（v498）</div>
        </div>
      </div>
      <button class="btn ghost" id="btnTestPing" type="button">測試連線</button>
    </header>

    <section class="card">

      <!-- 方案切換 -->
      <div class="seg">
        <button class="segBtn on" id="segFree" type="button">自由搭配</button>
        <button class="segBtn" id="segPremium" type="button">精品設計</button>
        <input type="hidden" id="plan" name="plan" value="free" />
      </div>

      <!-- ⭐ v498 新增版型設定區 -->
      <div id="freeOptions">
        <div class="grid2">
          <label class="field">
            <span class="lbl">顏色（free）</span>
            <select id="color" name="color">
              <option value="c1">c1 粉</option>
              <option value="c2">c2 藍</option>
              <option value="c3">c3 橘</option>
              <option value="c4">c4 紫</option>
              <option value="c5">c5 綠</option>
            </select>
          </label>

          <label class="field">
            <span class="lbl">版型</span>
            <select id="style" name="style">
              <option value="s1">s1 正拱</option>
              <option value="s2">s2 平直</option>
              <option value="s3">s3 晨曦</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span class="lbl">紙感</span>
          <select id="paper" name="paper">
            <option value="f1">f1 棉紙</option>
            <option value="f2">f2 顆粒</option>
            <option value="f3">f3 亞麻</option>
          </select>
        </label>
      </div>

      <div id="premiumOptions" style="display:none;">
        <label class="field">
          <span class="lbl">精品底色</span>
          <select id="premium_color" name="premium_color">
            <option value="p1">p1 胭脂紅</option>
            <option value="p2">p2 酒紅</option>
            <option value="p3">p3 深藍</option>
            <option value="p4">p4 霧紫</option>
            <option value="p5">p5 藍灰</option>
            <option value="p6">p6 金箔</option>
            <option value="p7">p7 褐碳</option>
          </select>
        </label>
      </div>

      <div class="divider"></div>

      <!-- 表單 -->
      <form id="cardForm" class="form" autocomplete="on">

        <!-- 原本所有基本資料欄位保留 -->
        <!-- 以下與你 v497 相同 -->

        <div class="grid2">
          <label class="field">
            <span class="lbl">姓名</span>
            <input id="name" name="name" type="text" />
          </label>
          <label class="field">
            <span class="lbl">單位</span>
            <input id="unit" name="unit" type="text" />
          </label>
        </div>

        <div class="grid2">
          <label class="field">
            <span class="lbl">頭銜</span>
            <input id="title" name="title" type="text" />
          </label>
          <label class="field">
            <span class="lbl">手機</span>
            <input id="phone" name="phone" type="tel" />
          </label>
        </div>

        <div class="grid2">
          <label class="field">
            <span class="lbl">Email</span>
            <input id="email" name="email" type="email" />
          </label>
          <label class="field">
            <span class="lbl">官網</span>
            <input id="website" name="website" type="url" />
          </label>
        </div>

        <label class="field">
          <span class="lbl">地址</span>
          <input id="address" name="address" type="text" />
        </label>

        <label class="field">
          <span class="lbl">理念標語</span>
          <input id="slogan" name="slogan" type="text" />
        </label>

        <label class="field">
          <span class="lbl">服務項目</span>
          <textarea id="services" name="services" rows="3"></textarea>
        </label>

        <label class="field">
          <span class="lbl">經歷</span>
          <textarea id="experience" name="experience" rows="3"></textarea>
        </label>

        <div class="divider"></div>

        <!-- 圖片區：完全保留 -->
        <!-- 你原本 v497 的圖片區 그대로 유지 -->
        <!-- 不刪減，不簡化 -->

        <div class="actions">
          <button class="btn" type="submit">送出表單</button>
          <button class="btn ghost" id="btnFillDemo" type="button">一鍵填入示範</button>
          <button class="btn danger" id="btnReset" type="button">清空</button>
        </div>

      </form>
    </section>

    <!-- 結果區（保留） -->
    <section class="card result" id="resultBox" style="display:none;">
      <div class="resultTitle">已建立名片 ✅</div>

      <div class="kv">
        <div class="k">ID</div>
        <div class="v" id="r_id">—</div>
      </div>

      <div class="kv">
        <div class="k">TOKEN</div>
        <div class="v" id="r_token">—</div>
      </div>

      <div class="kv">
        <div class="k">智慧名片成品連結</div>
        <div class="v" id="r_card">—</div>
        <button class="btn mini" id="btnCopyCard" type="button">複製</button>
      </div>

      <div class="kv">
        <div class="k">OG 交付連結</div>
        <div class="v" id="r_og">—</div>
        <button class="btn mini" id="btnCopyOg" type="button">複製</button>
      </div>
    </section>

    <footer class="foot">
      Powered by Angel · Mobile-first · v498
    </footer>
  </main>

  <script src="./form.js?v=498"></script>
</body>
</html>
