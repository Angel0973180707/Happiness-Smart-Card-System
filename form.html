<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Card Form</title>

  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1b33;
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --shadow: 0 18px 45px rgba(0,0,0,.40);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 25% -10%, rgba(96,165,250,.22), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(34,197,94,.14), transparent 55%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{width:min(980px, 92vw); margin: 18px auto 30px;}
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 6px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .dot{width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.7)}
    .ttl{display:flex; flex-direction:column; gap:2px; line-height:1.1}
    .ttl .t1{font-weight:900; font-size:14px}
    .ttl .t2{font-weight:800; font-size:12px; color:rgba(255,255,255,.55)}
    .card{
      border:1px solid var(--line);
      border-radius: calc(var(--r) + 8px);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .pad{padding: 16px;}
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    label{display:block; font-weight:900; font-size:12px; color: rgba(255,255,255,.86); margin-bottom:6px;}
    input, textarea, select{
      width:100%;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.92);
      outline:none;
      font-weight:800;
    }
    textarea{min-height: 96px; resize: vertical;}
    .row2{display:grid; grid-template-columns: 1fr 1fr; gap:10px;}
    .btn{
      width:100%;
      margin-top: 10px;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      font-weight:950;
      letter-spacing:.3px;
      box-shadow: 0 14px 30px rgba(0,0,0,.30);
    }
    .btn:disabled{
      opacity:.55;
      transform:none;
      box-shadow:none;
    }
    .hint{
      margin-top: 8px;
      color: var(--muted);
      font-weight:800;
      font-size:12px;
      line-height:1.6;
    }
    .result{
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      padding-top: 12px;
      display:none;
    }
    .kv{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.16);
      border-radius: 14px;
      padding: 10px 10px;
      margin-top: 8px;
    }
    .kv .k{font-weight:950; font-size:12px; color: rgba(255,255,255,.86)}
    .kv .v{
      margin-top: 4px;
      font-weight:800;
      font-size:12px;
      color: rgba(255,255,255,.78);
      word-break:break-all;
    }
    .copyRow{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .miniBtn{
      padding: 11px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.92);
      font-weight:950;
    }

    /* Debug */
    .dbgMask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:9998;}
    .dbg{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:16px; width:min(920px, 92vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(15,23,42,.92);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      padding: 12px;
      display:none; z-index:9999;
      backdrop-filter: blur(10px);
    }
    .dbgTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
    .dbgTop .ttl{font-weight:950; font-size:13px;}
    .dbgTop .x{padding: 8px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-weight:950;}
    .dbg pre{
      margin:0; padding:10px; border-radius:14px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      overflow:auto; max-height: 42vh;
      color: rgba(255,255,255,.86);
      font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand" id="brand">
        <div class="dot"></div>
        <div class="ttl">
          <div class="t1">Card Form</div>
          <div class="t2">v407</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="pad">
        <div class="grid">
          <div class="row2">
            <div>
              <label>姓名</label>
              <input id="name" placeholder="例如：王小明" />
            </div>
            <div>
              <label>方案</label>
              <select id="plan">
                <option value="free">free</option>
                <option value="premium">premium</option>
              </select>
            </div>
          </div>

          <div class="row2">
            <div>
              <label>單位</label>
              <input id="unit" placeholder="例如：幸福緣" />
            </div>
            <div>
              <label>頭銜</label>
              <input id="title" placeholder="例如：創辦人 / 顧問" />
            </div>
          </div>

          <div>
            <label>頭像圖片（URL）</label>
            <input id="avatar" placeholder="https://..." />
          </div>

          <div>
            <label>服務項目（可用換行/逗號分隔）</label>
            <textarea id="service" placeholder="例：品牌策略\n客戶諮詢\n..." ></textarea>
          </div>

          <div>
            <label>經歷（保留換行）</label>
            <textarea id="exp" placeholder="例：\n2020-2024 ...\n2015-2020 ..."></textarea>
          </div>

          <div class="row2">
            <div>
              <label>電話</label>
              <input id="phone" placeholder="0912-345-678" />
            </div>
            <div>
              <label>Email</label>
              <input id="email" placeholder="name@example.com" />
            </div>
          </div>

          <div class="row2">
            <div>
              <label>LINE OA（未填會自動補）</label>
              <input id="line_oa" placeholder="https://lin.ee/..." />
              <div class="hint">若沒有填 line_oa，會自動補：https://lin.ee/G3VJoRm</div>
            </div>
            <div>
              <label>地址（會轉導航）</label>
              <input id="address" placeholder="高雄市..." />
            </div>
          </div>

          <button class="btn" id="btnSubmit">建立</button>
          <div class="hint" id="submitHint"></div>

          <div class="result" id="result">
            <div class="kv">
              <div class="k">ID</div>
              <div class="v" id="rid">—</div>
            </div>
            <div class="kv">
              <div class="k">card_url</div>
              <div class="v" id="rcard">—</div>
            </div>
            <div class="kv">
              <div class="k">wechat_url</div>
              <div class="v" id="rwechat">—</div>
            </div>
            <div class="kv">
              <div class="k">open_url</div>
              <div class="v" id="ropen">—</div>
            </div>

            <div class="copyRow">
              <button class="miniBtn" id="copyAll">一鍵複製三條連結</button>
              <button class="miniBtn" id="openOpen">開啟 open_url</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dbgMask" id="dbgMask"></div>
  <div class="dbg" id="dbg">
    <div class="dbgTop">
      <div class="ttl">Debug</div>
      <div class="x" id="dbgClose">關閉</div>
    </div>
    <pre id="dbgPre"></pre>
  </div>

  <script src="./form.js?v=407"></script>
</body>
</html>
