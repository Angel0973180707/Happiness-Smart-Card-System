<!-- card.html (COMPLETE OVERWRITE)
  Purpose: Card viewer (LINE/Browser friendly)
  URL: card.html?id=TW0001
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happiness Smart Card</title>
  <meta name="description" content="點擊查看專屬名片" />
  <style>
    :root{
      --bg:#0b0f14;
      --bg2:#0f141d;
      --card: rgba(255,255,255,.07);
      --line: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.70);
      --muted2: rgba(255,255,255,.56);
      --radius: 20px;

      --freeAccent:#ff6b8a;
      --premiumAccent:#e5c178;

      --btnBg: rgba(255,255,255,.08);
      --btnLine: rgba(255,255,255,.14);
    }
    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Noto Sans TC","PingFang TC","Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 600px at 20% -10%, rgba(229,193,120,.10), transparent 60%),
        radial-gradient(900px 650px at 90% 10%, rgba(255,107,138,.10), transparent 60%),
        linear-gradient(180deg, var(--bg2), var(--bg));
      -webkit-font-smoothing: antialiased;
    }
    .wrap{ max-width: 860px; margin:0 auto; padding: 14px 14px 34px; }
    .top{
      position: sticky; top:0; z-index: 50;
      padding: 10px 0 12px;
      background: linear-gradient(180deg, rgba(11,15,20,.92), rgba(11,15,20,.70), rgba(11,15,20,0));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .topRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .brand{
      display:flex; flex-direction:column; gap:2px; min-width:0;
    }
    .brand .t{ font-weight: 900; letter-spacing:.4px; font-size: 16px; }
    .brand .s{ font-size: 12px; color: var(--muted2); }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.90);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 900;
      user-select:none;
      white-space:nowrap;
    }
    .card{
      margin-top: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 18px 70px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .hero{
      display:grid;
      grid-template-columns: 96px 1fr;
      gap: 12px;
      align-items:center;
    }
    .avatar{
      width:96px; height:96px; border-radius: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      position:relative;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .logo{
      position:absolute; right:-10px; bottom:-10px;
      width:52px; height:52px; border-radius: 999px;
      border: 2px solid rgba(255,255,255,.70);
      background: rgba(0,0,0,.18);
      overflow:hidden;
      box-shadow: 0 12px 25px rgba(0,0,0,.28);
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .hTxt{ min-width:0; }
    .name{
      font-weight: 1000;
      font-size: 22px;
      letter-spacing:.3px;
      line-height: 1.15;
      word-break: break-word;
    }
    .meta{
      margin-top: 6px;
      display:flex; flex-wrap:wrap; gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.88);
      font-weight: 850;
      font-size: 12px;
    }
    .slogan{
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.14);
      color: rgba(255,255,255,.88);
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-line;
    }

    .section{ margin-top: 12px; }
    .section h3{
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .3px;
      color: rgba(255,255,255,.92);
      display:flex; align-items:center; gap:8px;
    }
    .box{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      border-radius: 16px;
      padding: 12px;
      color: rgba(255,255,255,.86);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .gridBtn{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 760px){
      .gridBtn{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .btn{
      appearance:none;
      border: 1px solid var(--btnLine);
      background: var(--btnBg);
      color: rgba(255,255,255,.92);
      border-radius: 16px;
      padding: 12px 12px;
      font-weight: 950;
      letter-spacing:.2px;
      font-size: 14px;
      display:flex; align-items:center; justify-content:center;
      gap: 8px;
      text-decoration:none;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      border: none;
      background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,255,255,.80));
      color: #0b0f14;
      box-shadow: 0 18px 40px rgba(0,0,0,.30);
    }

    .photos{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (min-width: 760px){
      .photos{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .ph{
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.12);
      position:relative;
      aspect-ratio: 1 / 1;
      display:flex; align-items:center; justify-content:center;
    }
    .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
    .ph a{
      position:absolute; inset:0;
      display:block;
      text-indent:-9999px;
    }

    /* Overlay (inactive/pending) */
    .gate{
      position: fixed;
      inset: 0;
      z-index: 999;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .gate.show{ display:flex; }
    .gateCard{
      width: min(520px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(15,18,24,.86);
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
      padding: 16px;
    }
    .gateTitle{
      font-weight: 1000;
      font-size: 18px;
      letter-spacing:.3px;
    }
    .gateSub{
      margin-top: 10px;
      color: rgba(255,255,255,.78);
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-line;
    }
    .gateBtns{ display:flex; gap:10px; margin-top: 14px; }
    .gateBtns .btn{ flex:1; }
    .foot{
      margin-top: 14px;
      color: rgba(255,255,255,.52);
      font-size: 12px;
      text-align:center;
      padding: 6px 0 0;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="top">
      <div class="topRow">
        <div class="brand">
          <div class="t">Happiness Smart Card</div>
          <div class="s" id="subLine">讀取中…</div>
        </div>
        <div class="pill" id="planPill">—</div>
      </div>
    </div>

    <div class="card">
      <div class="hero">
        <div class="avatar">
          <img id="avatarImg" alt="" style="display:none;">
          <div id="avatarFallback" style="font-weight:1000;color:rgba(255,255,255,.65);">No Image</div>
          <div class="logo" id="logoWrap" style="display:none;">
            <img id="logoImg" alt="">
          </div>
        </div>
        <div class="hTxt">
          <div class="name" id="name">—</div>
          <div class="meta" id="meta"></div>
          <div class="slogan" id="slogan" style="display:none;"></div>
        </div>
      </div>

      <div class="section" id="platformSection" style="display:none;">
        <h3>🔗 影音／社群／官網</h3>
        <div class="gridBtn" id="platformBtns"></div>
      </div>

      <div class="section" id="contactSection" style="display:none;">
        <h3>📞 聯絡方式</h3>
        <div class="gridBtn" id="contactBtns"></div>
      </div>

      <div class="section" id="serviceSection" style="display:none;">
        <h3>✨ 服務項目</h3>
        <div class="box" id="services"></div>
      </div>

      <div class="section" id="expSection" style="display:none;">
        <h3>📚 經歷</h3>
        <div class="box" id="experience"></div>
      </div>

      <div class="section" id="photoSection" style="display:none;">
        <h3>🖼️ 照片</h3>
        <div class="photos" id="photoGrid"></div>
      </div>

      <div class="foot" id="foot">v1 card</div>
    </div>

  </div>

  <div class="gate" id="gate">
    <div class="gateCard">
      <div class="gateTitle">請聯繫客服開通</div>
      <div class="gateSub" id="gateMsg">此名片目前未開通。\n如需開通請聯繫客服。</div>
      <div class="gateBtns">
        <a class="btn primary" id="gateContact" href="#" rel="noopener">聯繫開通</a>
        <button class="btn" id="gateClose" type="button">我知道了</button>
      </div>
      <div class="foot">（未開通時，系統會以門面保護內容）</div>
    </div>
  </div>

  <script src="./card.js?v=1"></script>
</body>
</html>
