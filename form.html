<!-- form.html — v407-UI (COMPLETE OVERWRITE) -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>天使智慧名片系統｜表單 v407-UI</title>

  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="./form.css?v=407" />
</head>

<body>
  <header class="top">
    <div class="top-inner">
      <button class="back-btn" type="button" onclick="location.href='./index.html'">返回名片</button>

      <div class="brand">
        <div class="brand-title">天使智慧名片系統</div>
        <div class="brand-sub">v407-UI｜極簡精品表單</div>
      </div>

      <div class="top-spacer"></div>
    </div>
  </header>

  <main class="wrap">
    <!-- 方案 -->
    <section class="card">
      <div class="card-head">
        <h2>選方案</h2>
        <div class="chipline">
          <span class="tag">必選</span>
        </div>
      </div>

      <div class="seg" role="tablist" aria-label="Plan">
        <button class="seg-btn active" id="btnPlan1" type="button" data-plan="1">自由搭配款</button>
        <button class="seg-btn" id="btnPlan2" type="button" data-plan="2">精品設計款</button>
      </div>
    </section>

    <!-- 自由 -->
    <section class="card" id="freeBox">
      <div class="card-head">
        <h2>自由搭配</h2>
        <div class="chipline">
          <span class="tag subtle">c / s / f</span>
        </div>
      </div>

      <div class="sub">
        <div class="sub-title">顏色（c）</div>
        <div class="chips">
          <button type="button" class="chip active" data-group="c" data-val="c1">c1 粉</button>
          <button type="button" class="chip" data-group="c" data-val="c2">c2 藍</button>
          <button type="button" class="chip" data-group="c" data-val="c3">c3 橘</button>
          <button type="button" class="chip" data-group="c" data-val="c4">c4 紫</button>
          <button type="button" class="chip" data-group="c" data-val="c5">c5 綠</button>
        </div>
      </div>

      <div class="sub">
        <div class="sub-title">版型（s）</div>
        <div class="chips">
          <button type="button" class="chip active" data-group="s" data-val="s1">s1 正拱</button>
          <button type="button" class="chip" data-group="s" data-val="s2">s2 平直</button>
          <button type="button" class="chip" data-group="s" data-val="s3">s3 晨曦</button>
        </div>
      </div>

      <div class="sub">
        <div class="sub-title">紙感（f）</div>
        <div class="chips">
          <button type="button" class="chip active" data-group="f" data-val="f1">f1 棉紙</button>
          <button type="button" class="chip" data-group="f" data-val="f2">f2 顆粒</button>
          <button type="button" class="chip" data-group="f" data-val="f3">f3 亞麻</button>
        </div>
      </div>
    </section>

    <!-- 精品 -->
    <section class="card" id="premiumBox" style="display:none;">
      <div class="card-head">
        <h2>精品設計</h2>
        <div class="chipline">
          <span class="tag subtle">p1～p7</span>
        </div>
      </div>

      <div class="sub">
        <div class="sub-title">精品底色（p）</div>
        <div class="chips">
          <button type="button" class="chip active" data-group="p" data-val="p1">p1 胭脂紅</button>
          <button type="button" class="chip" data-group="p" data-val="p2">p2 酒紅</button>
          <button type="button" class="chip" data-group="p" data-val="p3">p3 深藍</button>
          <button type="button" class="chip" data-group="p" data-val="p4">p4 霧紫</button>
          <button type="button" class="chip" data-group="p" data-val="p5">p5 藍灰</button>
          <button type="button" class="chip" data-group="p" data-val="p6">p6 金箔</button>
          <button type="button" class="chip" data-group="p" data-val="p7">p7 褐碳</button>
        </div>
      </div>
    </section>

    <!-- 客戶資料 -->
    <section class="card">
      <div class="card-head">
        <h2>名片資料</h2>
        <div class="chipline">
          <span class="tag">姓名必填</span>
        </div>
      </div>

      <div class="grid2">
        <div class="row">
          <label>姓名 *</label>
          <input id="name" type="text" placeholder="必填" />
        </div>
        <div class="row">
          <label>單位</label>
          <input id="unit" type="text" />
        </div>
        <div class="row">
          <label>頭銜</label>
          <input id="title" type="text" />
        </div>
        <div class="row">
          <label>理念標語</label>
          <input id="slogan" type="text" />
        </div>
      </div>

      <div class="row">
        <label>服務項目</label>
        <textarea id="service" rows="3" placeholder="可換行"></textarea>
      </div>

      <div class="row">
        <label>經歷</label>
        <textarea id="exp" rows="4" placeholder="可換行"></textarea>
      </div>
    </section>

    <!-- 聯繫與平台 -->
    <section class="card">
      <div class="card-head">
        <h2>聯繫方式</h2>
        <div class="chipline">
          <span class="tag subtle">可留白</span>
        </div>
      </div>

      <div class="grid2">
        <div class="row">
          <label>微信ID</label>
          <input id="wechat" type="text" />
        </div>
        <div class="row">
          <label>LINE 連結</label>
          <input id="lineLink" type="url" placeholder="https://lin.ee/..." />
        </div>
        <div class="row">
          <label>LINE 官方帳號</label>
          <input id="lineOA" type="url" placeholder="https://lin.ee/..." />
        </div>
        <div class="row">
          <label>Email</label>
          <input id="email" type="email" />
        </div>
        <div class="row">
          <label>電話</label>
          <input id="phone" type="tel" />
        </div>
        <div class="row">
          <label>地址</label>
          <input id="addr" type="text" />
        </div>
      </div>

      <div class="grid2">
        <div class="row">
          <label>影音平台1</label>
          <input id="media1" type="url" />
        </div>
        <div class="row">
          <label>影音平台2</label>
          <input id="media2" type="url" />
        </div>
        <div class="row">
          <label>影音平台3</label>
          <input id="media3" type="url" />
        </div>
        <div class="row">
          <label>社群平台1</label>
          <input id="social1" type="url" />
        </div>
        <div class="row">
          <label>社群平台2</label>
          <input id="social2" type="url" />
        </div>
        <div class="row">
          <label>社群平台3</label>
          <input id="social3" type="url" />
        </div>
      </div>
    </section>

    <!-- 照片（保留欄位，不影響你現有 form.js；要啟用再接 v407.1） -->
    <section class="card">
      <div class="card-head">
        <h2>照片上傳</h2>
        <div class="chipline">
          <span class="tag subtle">選填</span>
        </div>
      </div>

      <div class="row">
        <label>個人照</label>
        <input id="avatarFile" type="file" accept="image/*" />
      </div>

      <div class="row">
        <label>Logo</label>
        <input id="logoFile" type="file" accept="image/*" />
      </div>

      <div class="row">
        <label>多張照片（最多 5 張）</label>
        <input id="photosFile" type="file" accept="image/*" multiple />
      </div>

      <div class="hint minimal">
        系統會自動壓縮（等比例不裁切）。
      </div>
    </section>

    <!-- 送出與交貨 -->
    <section class="card">
      <div class="card-head">
        <h2>送出與交貨</h2>
        <div class="chipline">
          <span class="tag gold">精品交付</span>
        </div>
      </div>

      <div class="actions">
        <button id="btnSubmit" class="btn primary" type="button">送出建立名片</button>
        <button id="btnCopyCard" class="btn" type="button" disabled>複製名片網址</button>
        <button id="btnShareCard" class="btn" type="button" disabled>分享名片網址</button>
      </div>

      <div class="result" id="resultBox" style="display:none;">
        <div class="kvs">
          <div class="kv">
            <span class="k">名片</span>
            <a class="v link" id="rCardUrl" href="#" target="_blank" rel="noreferrer">-</a>
          </div>

          <!-- 你的 v406.2 form.js 會用到這兩個 id（若你有加），這裡先保留 -->
          <div class="kv">
            <span class="k">微信長圖</span>
            <a class="v link" id="rWechatUrl" href="#" target="_blank" rel="noreferrer">-</a>
          </div>
          <div class="kv">
            <span class="k">開啟頁</span>
            <a class="v link" id="rOpenUrl" href="#" target="_blank" rel="noreferrer">-</a>
          </div>
        </div>

        <div class="hint minimal">
          交貨方式：把「名片 / 微信長圖 / 開啟頁」任一連結貼給客戶即可。
        </div>
      </div>

      <div class="msg" id="msg"></div>
    </section>

    <footer class="foot">
      <div class="foot-inner">
        <div class="foot-left">© Angel0973180707 / Happiness Smart Card System</div>
        <div class="foot-right">v407-UI</div>
      </div>
    </footer>
  </main>

  <!-- ✅ 沿用你既有 form.js（功能版） -->
  <script src="./form.js?v=4062"></script>
</body>
</html>
