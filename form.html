<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智慧名片訂製表單 v499</title>

  <style>
    body{
      font-family: "Noto Sans TC", sans-serif;
      background:#f7f9fc;
      margin:0;
      padding:24px;
    }
    .card{
      max-width:560px;
      margin:auto;
      background:white;
      padding:24px;
      border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.08);
    }
    h1{
      font-size:20px;
      margin-bottom:18px;
    }
    input, textarea{
      width:100%;
      padding:12px;
      margin-bottom:14px;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:14px;
    }
    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      font-weight:900;
      background:#111;
      color:white;
      cursor:pointer;
    }
    .hint{
      font-size:13px;
      color:#666;
      margin-bottom:12px;
    }
    .error{
      color:#c00;
      font-weight:700;
      margin-bottom:12px;
    }
    .success{
      color:#090;
      font-weight:700;
      margin-bottom:12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>智慧名片訂製資料填寫</h1>

    <div id="msg"></div>

    <input id="name" placeholder="姓名（必填）" />
    <input id="unit" placeholder="單位" />
    <input id="title" placeholder="職稱" />
    <textarea id="slogan" placeholder="一句話介紹 / 理念標語"></textarea>

    <div class="hint">
      ※ 圖片請先上傳到 Firebase Storage，貼上 downloadURL（不可使用 base64）
    </div>

    <input id="avatar" placeholder="個人照 downloadURL" />
    <input id="photo1" placeholder="照片1 downloadURL" />
    <input id="photo2" placeholder="照片2 downloadURL" />

    <button id="btnSubmit">送出資料</button>
  </div>

  <script src="./form.js?v=499"></script>
</body>
</html>
