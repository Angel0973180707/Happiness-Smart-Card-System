<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>填寫名片資料</title>
<meta name="theme-color" content="#0f1115" />

<style>
:root{
  --bg:#0f1115;
  --card:rgba(255,255,255,0.06);
  --bd:rgba(255,255,255,0.12);
  --tx:rgba(255,255,255,0.92);
  --btn:linear-gradient(135deg,#ff5e5e,#ff7aa6);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
.wrap{
  width:min(600px,92vw);
  margin:60px auto;
}
.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  backdrop-filter:blur(12px);
}
h1{
  margin:0 0 16px;
  font-size:20px;
  font-weight:900;
}
p{
  opacity:.75;
  font-size:14px;
  line-height:1.6;
}
.btn{
  margin-top:24px;
  width:100%;
  height:52px;
  border-radius:18px;
  border:none;
  background:var(--btn);
  color:white;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}
.back{
  margin-top:18px;
  background:transparent;
  border:1px solid var(--bd);
  color:var(--tx);
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>填寫專屬智慧名片資料</h1>
    <p>
      請依序填寫資料並上傳照片。<br>
      提交後將由系統處理與設計確認。<br><br>
      ※ 提交完成不代表立即開通
    </p>

    <button class="btn" onclick="openForm()">
      前往填寫 Google 表單
    </button>

    <button class="btn back" onclick="history.back()">
      返回名片
    </button>
  </div>
</div>

<script>
function openForm(){
  window.open(
    "https://docs.google.com/forms/d/e/1FAIpQLSeCKY_oLKUMgnQUaJmCUfxIBRv0JdwQO7t3KAi5tJvLMKUGSQ/viewform",
    "_blank"
  );
}
</script>

</body>
</html>
