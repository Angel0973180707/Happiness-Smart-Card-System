<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>天使幸福智慧名片｜資料填寫 v521.7</title>

<style>

:root{
--bg:#0b1220;
--card:rgba(255,255,255,.06);
--line:rgba(255,255,255,.12);
--text:rgba(255,255,255,.94);
--muted:rgba(255,255,255,.72);

--accent:#7bdcff;
--ok:#6ee7b7;
--bad:#fb7185;
--warn:#fbbf24;

--radius:18px;

--fs:clamp(16px,1.7vw,18px);
--fs2:clamp(20px,2.3vw,24px);
--fs3:clamp(24px,3vw,30px);
}

*{box-sizing:border-box;}

body{
margin:0;
background:radial-gradient(1200px 800px at 20% -10%,rgba(123,220,255,.18),transparent 60%),var(--bg);
color:var(--text);
font-family:"Noto Sans TC",system-ui;
font-size:var(--fs);
word-break:keep-all;
}

.wrap{
max-width:900px;
margin:auto;
padding:16px 14px 90px;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:var(--radius);
padding:16px;
margin-bottom:12px;
}

h1{
font-size:var(--fs3);
margin:0 0 8px;
}

h2{
font-size:var(--fs2);
margin:0 0 10px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

@media(max-width:760px){
.row{grid-template-columns:1fr;}
}

input,textarea{
width:100%;
background:rgba(255,255,255,.04);
border:1px solid var(--line);
border-radius:12px;
padding:12px;
font-size:var(--fs);
color:white;
}

textarea{resize:vertical;}

.chips{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.chip{
padding:10px 14px;
border-radius:999px;
border:1px solid var(--line);
background:rgba(255,255,255,.05);
cursor:pointer;
font-weight:800;
}

.chip[data-on="1"]{
border-color:var(--accent);
background:rgba(123,220,255,.15);
}

.step{
display:none;
}

.step.active{
display:block;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(11,18,32,.92);
backdrop-filter:blur(10px);
border-top:1px solid var(--line);
padding:10px;
display:flex;
gap:10px;
}

button{
flex:1;
border:none;
border-radius:12px;
padding:12px;
font-size:16px;
font-weight:800;
cursor:pointer;
background:rgba(123,220,255,.2);
color:white;
}

button.secondary{
background:rgba(255,255,255,.08);
}

.status{
margin-top:10px;
border:1px dashed var(--line);
padding:10px;
border-radius:10px;
color:var(--muted);
white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="wrap">

<h1>天使幸福智慧名片</h1>

<div id="step1" class="step active card">
<h2>1. 選擇方案</h2>
<div class="chips" id="planChips"></div>
</div>

<div id="step2" class="step card">
<h2>2. 基本資料</h2>

<div class="row">
<input id="name" placeholder="姓名">
<input id="unit" placeholder="單位">
</div>

<div class="row">
<input id="title" placeholder="職稱">
<input id="website" placeholder="網站">
</div>

<input id="slogan" placeholder="一句話介紹">

</div>

<div id="step3" class="step card">
<h2>3. 聯絡方式</h2>

<div class="row">
<input id="phone" placeholder="電話">
<input id="email" placeholder="Email">
</div>

<div class="row">
<input id="line_url" placeholder="LINE">
<input id="line_oa" placeholder="LINE OA">
</div>

<input id="wechat_id" placeholder="微信 ID">

</div>

<div id="step4" class="step card">
<h2>4. 內容</h2>

<input id="services" placeholder="服務項目">

<textarea id="experience" placeholder="經歷"></textarea>

</div>

<div id="step5" class="step card">
<h2>5. 圖片</h2>

<input type="file" id="photo1">
<input type="file" id="photo2">
<input type="file" id="photo3">

</div>

<div id="step6" class="step card">
<h2>6. 送出</h2>

<button id="btnSubmit">送出資料</button>

<div class="status" id="status">
尚未操作
</div>

</div>

</div>

<div class="nav">
<button id="prevBtn" class="secondary">上一頁</button>
<button id="nextBtn">下一頁</button>
</div>

<script type="module" src="./form.js?v=5217"></script>

</body>
</html>
