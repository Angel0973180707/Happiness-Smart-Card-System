<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <title>天使幸福智慧名片｜表單 v7.3 共享 renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./style.css?v=v7.3-shared-renderer" />
  <style>
    body{ padding:20px 14px 48px; }
    .form-shell{ max-width:1120px; margin:0 auto; display:grid; grid-template-columns:minmax(320px, 1fr) minmax(320px, 520px); gap:20px; align-items:start; }
    .form-panel,.preview-panel{ background:rgba(255,255,255,.72); border:1px solid rgba(0,0,0,.06); border-radius:24px; box-shadow:0 16px 36px rgba(0,0,0,.08); padding:18px; }
    .preview-panel{ position:sticky; top:16px; }
    .sec{ display:grid; gap:12px; margin-bottom:18px; }
    .sec h2{ margin:0; font-size:16px; }
    .field{ display:grid; gap:6px; }
    .field label{ font-weight:800; font-size:13px; }
    .field input,.field textarea,.field select{ width:100%; border:1px solid rgba(0,0,0,.12); border-radius:14px; padding:12px 14px; font:inherit; background:#fff; }
    .field textarea{ min-height:96px; resize:vertical; }
    .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .tips{ font-size:12px; color:rgba(42,36,30,.68); line-height:1.7; }
    .preview-title{ font-size:15px; font-weight:900; margin:0 0 12px; }
    .mini-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .mini-btn{ border:none; border-radius:999px; padding:10px 14px; font:inherit; font-weight:800; cursor:pointer; background:#fff; box-shadow:0 8px 18px rgba(0,0,0,.08); }
    @media (max-width: 920px){ .form-shell{ grid-template-columns:1fr; } .preview-panel{ position:static; } }
  </style>
</head>
<body class="mode-free color-1 style-arch paper-1">
  <main class="form-shell">
    <section class="form-panel">
      <div class="sec">
        <h2>基本資料</h2>
        <div class="field"><label for="display_name">姓名</label><input id="display_name" placeholder="例如：王小明"></div>
        <div class="field"><label for="unit">單位 / 公司</label><textarea id="unit" placeholder="例如：幸福品牌工作室"></textarea></div>
        <div class="field"><label for="title">職稱</label><input id="title" placeholder="例如：品牌顧問"></div>
        <div class="field"><label for="intro">一句話介紹</label><textarea id="intro" placeholder="例如：陪你把品牌說清楚、被記住。"></textarea></div>
        <div class="field"><label for="services">服務項目</label><textarea id="services"></textarea></div>
        <div class="field"><label for="experience">經歷 / 品牌故事</label><textarea id="experience"></textarea></div>
      </div>

      <div class="sec">
        <h2>聯絡資料</h2>
        <div class="grid-2">
          <div class="field"><label for="phone">電話</label><input id="phone"></div>
          <div class="field"><label for="email">Email</label><input id="email"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="website">網站</label><input id="website"></div>
          <div class="field"><label for="line_url">LINE 連結</label><input id="line_url"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="wechat_id">微信 ID</label><input id="wechat_id"></div>
          <div class="field"><label for="address">地址</label><input id="address"></div>
        </div>
      </div>

      <div class="sec">
        <h2>方案設定</h2>
        <div class="grid-2">
          <div class="field">
            <label for="plan">方案</label>
            <select id="plan">
              <option value="free">自由搭配</option>
              <option value="premium">精品設計</option>
            </select>
          </div>
          <div class="field">
            <label for="marquee_text">跑馬燈文字</label>
            <input id="marquee_text" placeholder="例如：歡迎預約洽詢｜每週更新內容">
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="free_color">自由色系</label>
            <select id="free_color">
              <option value="c1">粉</option><option value="c2">藍</option><option value="c3">橘</option><option value="c4">紫</option><option value="c5">綠</option>
            </select>
          </div>
          <div class="field">
            <label for="premium_color">精品底色</label>
            <select id="premium_color">
              <option value="p1">p1 胭脂紅</option><option value="p2">p2 酒紅</option><option value="p3">p3 深藍</option><option value="p4">p4 霧紫</option><option value="p5">p5 藍灰</option><option value="p6">p6 金箔</option><option value="p7">p7 褐碳</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="free_style">自由版型</label>
            <select id="free_style">
              <option value="s1">正拱</option><option value="s2">平直</option><option value="s3">晨曦</option>
            </select>
          </div>
          <div class="field">
            <label for="free_paper">自由紙感</label>
            <select id="free_paper">
              <option value="f1">棉紙</option><option value="f2">象牙紙</option><option value="f3">霧灰</option>
            </select>
          </div>
        </div>
      </div>

      <div class="sec">
        <h2>圖片 / CTA</h2>
        <div class="tips">這份示範版用網址即時預覽。若你原本表單已經有 Firebase 上傳與裁切，保留原流程即可，只要把最終預覽網址塞回 photo1_url ~ photo5_url 就能共用 renderer。</div>
        <div class="field"><label for="avatar_url">個人照 URL</label><input id="avatar_url"></div>
        <div class="field"><label for="logo_url">Logo URL</label><input id="logo_url"></div>
        <div class="grid-2">
          <div class="field"><label for="photo1_url">照片 1 URL</label><input id="photo1_url"></div>
          <div class="field"><label for="photo2_url">照片 2 URL</label><input id="photo2_url"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="photo3_url">照片 3 URL</label><input id="photo3_url"></div>
          <div class="field"><label for="photo4_url">照片 4 URL</label><input id="photo4_url"></div>
        </div>
        <div class="field"><label for="photo5_url">照片 5 URL</label><input id="photo5_url"></div>

        <div class="grid-2">
          <div class="field"><label for="cta_text_1">CTA 1 文字</label><input id="cta_text_1"></div>
          <div class="field"><label for="cta_link_1">CTA 1 連結</label><input id="cta_link_1"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="cta_text_2">CTA 2 文字</label><input id="cta_text_2"></div>
          <div class="field"><label for="cta_link_2">CTA 2 連結</label><input id="cta_link_2"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="cta_text_3">CTA 3 文字</label><input id="cta_text_3"></div>
          <div class="field"><label for="cta_link_3">CTA 3 連結</label><input id="cta_link_3"></div>
        </div>
      </div>

      <div class="mini-actions">
        <button class="mini-btn" type="button" id="btnDemoFill">載入示範資料</button>
        <button class="mini-btn" type="button" id="btnClearForm">清空</button>
      </div>
    </section>

    <aside class="preview-panel">
      <p class="preview-title">成品預覽（和主程式共用同一套 renderer）</p>

      <div id="livePreviewCard" class="mode-free color-1 style-arch paper-1">
        <section class="card" id="card">
          <div class="premium-fx-layer"></div>
          <div class="banner" id="banner"><div class="dynamic-mask"></div></div>
          <div class="paper-overlay" id="paperOverlay"></div>
          <div class="avatar-wrap"><div class="avatar-circle"><img class="avatar" id="u-img" alt="個人照" /></div></div>
          <div class="premium-badge" id="premiumBadge" style="display:none;"><span class="badge-dot"></span><span class="badge-text">精品設計</span></div>
          <div class="logo-wrap" id="logoWrap" style="display:none;"><img id="u-logo" class="logo-img" alt="Logo" /></div>
          <div class="info-scroll">
            <div class="name" id="u-name">預覽中…</div>
            <div class="text-toggle-wrap unit-wrap" id="u-unit-wrap" style="display:none;"><div class="unit expandable-text is-collapsed preline" id="u-unit" style="--max-lines:2;"></div><button class="expand-toggle" id="u-unit-toggle" type="button" style="display:none;">看更多</button></div>
            <div class="title" id="u-title"></div>
            <div class="text-toggle-wrap slogan-wrap" id="u-slogan-wrap" style="display:none;"><div class="slogan expandable-text is-collapsed preline" id="u-slogan" style="--max-lines:3;"></div><button class="expand-toggle" id="u-slogan-toggle" type="button" style="display:none;">看更多</button></div>
            <div class="info-block" id="block-service" style="display:none;"></div>
            <div class="info-block" id="block-exp" style="display:none;"></div>
            <div class="contact-dock" id="contactDock" style="display:none;"><div class="dock-title"><i class="fa-solid fa-address-card"></i> 聯繫方式</div><div class="dock-buttons" id="contactButtons"></div></div>
            <div class="contact-dock marquee-dock" id="marqueeDock" style="display:none;"><div class="dock-title"><i class="fa-solid fa-bullhorn"></i> 重要訊息</div><div class="marquee-shell" id="marqueeShell"><div class="marquee-track" id="marqueeTrack"><span class="marquee-text" id="marqueeText">載入中…</span></div></div></div>
            <div class="contact-dock primary-link-dock" id="primaryLinkDock" style="display:none;"><div class="dock-title"><i class="fa-solid fa-globe"></i> 主網站</div><div class="dock-buttons" id="primaryLinkButtons"></div></div>
            <div class="contact-dock" id="mediaDock" style="display:none;"><div class="dock-title"><i class="fa-solid fa-clapperboard"></i> 影音／社群</div><div class="dock-buttons" id="mediaButtons"></div></div>
            <div class="contact-dock cta-dock" id="ctaDock" style="display:none;"><div class="dock-title"><i class="fa-solid fa-bolt"></i> 立即行動</div><div class="dock-buttons" id="ctaButtons"></div></div>
            <div class="photo-wall" id="photoWall" style="display:none;"><div class="dock-title"><i class="fa-regular fa-images"></i> 照片</div><div class="photo-grid" id="photoGrid"></div></div>
            <div class="card-expiry" id="cardExpiry" style="display:none;"></div>
          </div>
        </section>
      </div>
    </aside>
  </main>

  <script src="./card-renderer.js?v=v7.3-shared-renderer"></script>
  <script src="./form.js?v=v7.3-shared-renderer"></script>
</body>
</html>
