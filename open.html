<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Open</title>

  <style>
    :root{
      --bg:#0b1220;
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --shadow: 0 18px 45px rgba(0,0,0,.40);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 25% -10%, rgba(96,165,250,.22), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(34,197,94,.14), transparent 55%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{width:min(820px, 92vw); margin: 18px auto 30px;}
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 6px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .dot{width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.7)}
    .ttl{display:flex; flex-direction:column; gap:2px; line-height:1.1}
    .ttl .t1{font-weight:900; font-size:14px}
    .ttl .t2{font-weight:800; font-size:12px; color:rgba(255,255,255,.55)}

    .card{
      border:1px solid var(--line);
      border-radius: calc(var(--r) + 10px);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow);
      padding: 18px 16px 16px;
    }
    h1{
      margin:0 0 8px;
      font-size:18px;
      font-weight:950;
    }
    p{
      margin:0 0 14px;
      color: var(--muted);
      font-weight:800;
      line-height:1.6;
      white-space:pre-line;
    }
    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.92);
      font-weight:950;
      letter-spacing:.3px;
      box-shadow: 0 14px 30px rgba(0,0,0,.30);
      cursor:pointer;
    }
    .kv{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.16);
      border-radius: 14px;
      padding: 10px 10px;
      margin-top: 10px;
      display:none;
    }
    .kv .k{font-weight:950; font-size:12px; color: rgba(255,255,255,.86)}
    .kv .v{margin-top: 4px; font-weight:800; font-size:12px; color: rgba(255,255,255,.78); word-break:break-all}

    /* Debug */
    .dbgMask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:9998;}
    .dbg{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:16px; width:min(920px, 92vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(15,23,42,.92);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      padding: 12px;
      display:none; z-index:9999;
      backdrop-filter: blur(10px);
    }
    .dbgTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
    .dbgTop .ttl{font-weight:950; font-size:13px;}
    .dbgTop .x{padding: 8px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-weight:950;}
    .dbg pre{
      margin:0; padding:10px; border-radius:14px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      overflow:auto; max-height: 42vh;
      color: rgba(255,255,255,.86);
      font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand" id="brand">
        <div class="dot"></div>
        <div class="ttl">
          <div class="t1">Open</div>
          <div class="t2">v407</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h1 id="title">開啟中...</h1>
      <p id="msg">正在確認狀態，請稍候。</p>

      <div class="row" id="actions" style="display:none">
        <button class="btn" id="btnRetry">重新嘗試</button>
        <button class="btn" id="btnCopy">複製連結</button>
        <button class="btn" id="btnGoCard">前往名片（card）</button>
        <button class="btn" id="btnGoWeChat">前往微信長圖（wechat）</button>
      </div>

      <div class="kv" id="kv">
        <div class="k">open_url</div>
        <div class="v" id="openUrl"></div>
      </div>
    </div>
  </div>

  <div class="dbgMask" id="dbgMask"></div>
  <div class="dbg" id="dbg">
    <div class="dbgTop">
      <div class="ttl">Debug</div>
      <div class="x" id="dbgClose">關閉</div>
    </div>
    <pre id="dbgPre"></pre>
  </div>

  <script>
    /* ================================
     * open.html (v407 COMPLETE OVERWRITE)
     * - 1) ping GAS
     * - 2) if active -> route to card/wechat
     * - 3) if inactive -> show "此名片尚未啟用 / 請聯繫客服開通"
     * - 4) fallback: copy link / retry
     * - Unified Debug: long press brand 1.2s
     * - Compatibility: try action=ping or action=status
     * ================================ */

    (function(){
      const VERSION = 407;

      const DEFAULT_GAS =
        "https://script.google.com/macros/s/AKfycbwALQLscdoompGvO3iphBgcgn3nYIhVfYghirifzu2PYBaeCZWWzSkw3SaGoJZRbKU/exec";

      const CONFIG = {
        GAS: DEFAULT_GAS,
        DEFAULT_ID: "TW0001",
        LONGPRESS_MS: 1200
      };

      const el = (id) => document.getElementById(id);

      const brand = el("brand");
      const title = el("title");
      const msg = el("msg");
      const actions = el("actions");
      const kv = el("kv");
      const openUrlEl = el("openUrl");

      const btnRetry = el("btnRetry");
      const btnCopy = el("btnCopy");
      const btnGoCard = el("btnGoCard");
      const btnGoWeChat = el("btnGoWeChat");

      // Debug
      const dbg = el("dbg");
      const dbgMask = el("dbgMask");
      const dbgPre = el("dbgPre");
      const dbgClose = el("dbgClose");

      const state = {
        id: "",
        plan: "",
        gasUrl: "",
        fetchStatus: "loading",
        pingRespMini: null
      };

      function qs(key){
        const v = new URLSearchParams(location.search).get(key);
        return v ? String(v).trim() : "";
      }
      function normalizeId(s){
        if(!s) return "";
        return String(s).trim().toUpperCase();
      }
      function isWeChat(){
        return navigator.userAgent.includes("MicroMessenger");
      }
      function buildBase(){
        return location.origin + location.pathname.replace(/\/[^/]*$/, "/");
      }
      function urlCard(id){ return `${buildBase()}card.html?id=${encodeURIComponent(id)}&v=${VERSION}`; }
      function urlWeChat(id){ return `${buildBase()}wechat.html?id=${encodeURIComponent(id)}&v=${VERSION}`; }
      function urlOpen(id){ return `${buildBase()}open.html?id=${encodeURIComponent(id)}&v=${VERSION}`; }

      async function fetchJson(url){
        const res = await fetch(url, { cache:"no-store" });
        const text = await res.text();
        try{ return JSON.parse(text); }
        catch{
          const m = text.match(/\{[\s\S]*\}$/);
          if(m) return JSON.parse(m[0]);
          throw new Error("Invalid JSON");
        }
      }

      async function ping(id){
        // Compatibility: try ping/status without changing backend
        const acts = ["ping", "status"];
        let lastErr = null;

        for(const a of acts){
          const url = `${CONFIG.GAS}?action=${encodeURIComponent(a)}&id=${encodeURIComponent(id)}&v=${VERSION}&ts=${Date.now()}`;
          state.gasUrl = url;
          try{
            const resp = await fetchJson(url);
            if(resp && (resp.ok === true || resp.active === true || resp.status)) return resp;
          }catch(e){ lastErr = e; }
        }
        throw lastErr || new Error("ping failed");
      }

      function miniPing(resp){
        if(!resp) return null;
        return {
          ok: resp.ok,
          active: resp.active,
          status: resp.status,
          id: resp.id
        };
      }

      function showFallback(text){
        title.textContent = "開啟失敗";
        msg.textContent = text || "可能是網路 / 微信限制 / 快取造成。你可以重新嘗試，或先複製連結再貼到瀏覽器開啟。";
        actions.style.display = "grid";
        kv.style.display = "block";
        openUrlEl.textContent = urlOpen(state.id);
      }

      function showInactive(){
        title.textContent = "此名片尚未啟用";
        msg.textContent = "請聯繫客服開通";
        actions.style.display = "grid";
        kv.style.display = "block";
        openUrlEl.textContent = urlOpen(state.id);
      }

      function routeToBest(){
        const target = isWeChat() ? urlWeChat(state.id) : urlCard(state.id);
        location.replace(target);
      }

      // Debug
      function openDebug(){
        const info = {
          id: state.id,
          fetch: state.fetchStatus,
          gas_url: state.gasUrl,
          ping: state.pingRespMini,
          target: isWeChat() ? "wechat" : "card"
        };
        dbgPre.textContent = JSON.stringify(info, null, 2);
        dbgMask.style.display = "block";
        dbg.style.display = "block";
      }
      function closeDebug(){
        dbg.style.display = "none";
        dbgMask.style.display = "none";
      }
      function bindLongPress(node, ms, fn){
        let t=null;
        const start=()=>{ clearTimeout(t); t=setTimeout(fn, ms); };
        const end=()=>clearTimeout(t);
        node.addEventListener("touchstart", start, {passive:true});
        node.addEventListener("touchend", end);
        node.addEventListener("touchcancel", end);
        node.addEventListener("mousedown", start);
        node.addEventListener("mouseup", end);
        node.addEventListener("mouseleave", end);
      }

      async function boot(){
        state.id = normalizeId(qs("id")) || CONFIG.DEFAULT_ID;

        bindLongPress(brand, CONFIG.LONGPRESS_MS, openDebug);
        dbgClose.addEventListener("click", closeDebug);
        dbgMask.addEventListener("click", closeDebug);

        // Bind buttons
        btnRetry.addEventListener("click", () => location.reload());
        btnGoCard.addEventListener("click", () => location.href = urlCard(state.id));
        btnGoWeChat.addEventListener("click", () => location.href = urlWeChat(state.id));
        btnCopy.addEventListener("click", async () => {
          const txt = `card_url: ${urlCard(state.id)}\nwechat_url: ${urlWeChat(state.id)}\nopen_url: ${urlOpen(state.id)}`;
          try{
            await navigator.clipboard.writeText(txt);
            btnCopy.textContent = "已複製";
            setTimeout(()=>btnCopy.textContent="複製連結", 900);
          }catch{
            prompt("複製這段：", txt);
          }
        });

        title.textContent = "開啟中...";
        msg.textContent = "正在確認狀態，請稍候。";

        try{
          state.fetchStatus = "loading";
          const resp = await ping(state.id);
          state.pingRespMini = miniPing(resp);

          // Interpret active
          const active = resp && (resp.active === true || resp.ok === true || String(resp.status||"").toLowerCase()==="active");
          const inactive = resp && (resp.active === false || String(resp.status||"").toLowerCase()==="inactive");

          state.fetchStatus = "ok";

          if(active){
            routeToBest();
            return;
          }
          if(inactive){
            showInactive();
            return;
          }

          // Unknown -> still route, but keep a fallback possibility
          routeToBest();
        }catch(err){
          state.fetchStatus = "error";
          state.pingRespMini = { error: String(err && err.message ? err.message : err) };
          showFallback("開啟失敗：請檢查網路 / GAS 狀態，或稍後再試。");
        }
      }

      boot();
    })();
  </script>
</body>
</html>
