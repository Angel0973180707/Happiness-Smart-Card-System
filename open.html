<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Open</title>

  <style>
    :root{
      --bg:#0b1220;
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --shadow: 0 18px 45px rgba(0,0,0,.40);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 25% -10%, rgba(96,165,250,.22), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(34,197,94,.14), transparent 55%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{width:min(820px, 92vw); margin: 18px auto 30px;}
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 6px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .dot{width:12px;height:12px;border-radius:99px;background:rgba(255,255,255,.7)}
    .ttl{display:flex; flex-direction:column; gap:2px; line-height:1.1}
    .ttl .t1{font-weight:900; font-size:14px}
    .ttl .t2{font-weight:800; font-size:12px; color:rgba(255,255,255,.55)}

    .card{
      border:1px solid var(--line);
      border-radius: calc(var(--r) + 10px);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow);
      padding: 18px 16px 16px;
    }
    h1{
      margin:0 0 8px;
      font-size:18px;
      font-weight:950;
    }
    p{
      margin:0 0 14px;
      color: var(--muted);
      font-weight:800;
      line-height:1.6;
      white-space:pre-line;
    }
    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.92);
      font-weight:950;
      letter-spacing:.3px;
      box-shadow: 0 14px 30px rgba(0,0,0,.30);
      cursor:pointer;
    }
    .kv{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.16);
      border-radius: 14px;
      padding: 10px 10px;
      margin-top: 10px;
      display:none;
    }
    .kv .k{font-weight:950; font-size:12px; color: rgba(255,255,255,.86)}
    .kv .v{margin-top: 4px; font-weight:800; font-size:12px; color: rgba(255,255,255,.78); word-break:break-all}

    .dbgMask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:9998;}
    .dbg{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:16px; width:min(920px, 92vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(15,23,42,.92);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      padding: 12px;
      display:none; z-index:9999;
      backdrop-filter: blur(10px);
    }
    .dbgTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
    .dbgTop .ttl{font-weight:950; font-size:13px;}
    .dbgTop .x{padding: 8px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-weight:950;}
    .dbg pre{
      margin:0; padding:10px; border-radius:14px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      overflow:auto; max-height: 42vh;
      color: rgba(255,255,255,.86);
      font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand" id="brand">
        <div class="dot"></div>
        <div class="ttl">
          <div class="t1">Open</div>
          <div class="t2">v497</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h1 id="title">開啟中...</h1>
      <p id="msg">正在確認狀態，請稍候。</p>

      <div class="row" id="actions" style="display:none">
        <button class="btn" id="btnRetry">重新嘗試</button>
        <button class="btn" id="btnCopy">複製連結</button>
        <button class="btn" id="btnGoCard">前往名片（index）</button>
        <button class="btn" id="btnGoWeChat">前往微信長圖（wechat）</button>
      </div>

      <div class="kv" id="kv">
        <div class="k">open_url</div>
        <div class="v" id="openUrl"></div>
      </div>
    </div>
  </div>

  <div class="dbgMask" id="dbgMask"></div>
  <div class="dbg" id="dbg">
    <div class="dbgTop">
      <div class="ttl">Debug</div>
      <div class="x" id="dbgClose">關閉</div>
    </div>
    <pre id="dbgPre"></pre>
  </div>

  <script>
    (function(){
      const VERSION = "v497";

      const CONFIG = {
        GAS: "https://angel-namecard.letssyncus.com/gas-proxy/exec",
        DEFAULT_ID: "TW0001",
        LONGPRESS_MS: 1200,
        FETCH_TIMEOUT_MS: 12000
      };

      const el = (id) => document.getElementById(id);

      const brand = el("brand");
      const title = el("title");
      const msg = el("msg");
      const actions = el("actions");
      const kv = el("kv");
      const openUrlEl = el("openUrl");

      const btnRetry = el("btnRetry");
      const btnCopy = el("btnCopy");
      const btnGoCard = el("btnGoCard");
      const btnGoWeChat = el("btnGoWeChat");

      const dbg = el("dbg");
      const dbgMask = el("dbgMask");
      const dbgPre = el("dbgPre");
      const dbgClose = el("dbgClose");

      const state = {
        id: "",
        gasUrl: "",
        fetchStatus: "loading",
        respMini: null
      };

      function qs(key){
        const v = new URLSearchParams(location.search).get(key);
        return v ? String(v).trim() : "";
      }
      function normalizeId(raw){
        const s = String(raw||"").trim().toUpperCase();
        if (!s) return "";
        if (/^TW\d{4}$/.test(s)) return s;
        if (/^\d{1,4}$/.test(s)) return "TW" + s.padStart(4,"0");
        if (/^TW\d{1,4}$/.test(s)){
          const n = s.replace(/^TW/i,"");
          return "TW" + n.padStart(4,"0");
        }
        return s;
      }
      function isWeChat(){
        return /MicroMessenger/i.test(navigator.userAgent || "");
      }
      function base_(){
        return location.origin + location.pathname.replace(/\/[^/]*$/, "/");
      }

      // ✅ 你的正式名片入口：index.html（或直接 /?id=）
      function urlIndex(id){ return `${base_()}index.html?id=${encodeURIComponent(id)}&ts=${Date.now()}`; }
      function urlWeChat(id){ return `${base_()}wechat.html?id=${encodeURIComponent(id)}&ts=${Date.now()}`; }
      function urlOpen(id){ return `${base_()}open.html?id=${encodeURIComponent(id)}&ts=${Date.now()}`; }

      async function fetchJson(url){
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT_MS);
        try{
          const res = await fetch(url, { cache:"no-store", signal: ctrl.signal });
          const text = await res.text();
          let j = null;
          try{ j = JSON.parse(text); }
          catch{
            const m = text.match(/\{[\s\S]*\}$/);
            if(m) j = JSON.parse(m[0]);
          }
          if (!res.ok) throw new Error("HTTP " + res.status);
          if (!j || typeof j !== "object") throw new Error("Invalid JSON");
          return j;
        } finally {
          clearTimeout(t);
        }
      }

      // ✅ 最穩：直接用 action=card 拿 status
      async function getStatusByCard(id){
        const url = `${CONFIG.GAS}?action=card&id=${encodeURIComponent(id)}&ts=${Date.now()}`;
        state.gasUrl = url;
        const json = await fetchJson(url);
        if (!json.ok) throw new Error(json.error || "ok=false");
        const card = json.item || json.data || {};
        const status = String(card.status || card["狀態"] || "").trim().toLowerCase();
        return { ok:true, id, status, cardMini:{ name: card.name || "", plan: card.plan || "" } };
      }

      function showFallback(text){
        title.textContent = "開啟失敗";
        msg.textContent = text || "可能是網路 / 快取 / GAS 狀態造成。你可以重新嘗試，或先複製連結再貼到瀏覽器開啟。";
        actions.style.display = "grid";
        kv.style.display = "block";
        openUrlEl.textContent = urlOpen(state.id);
      }

      function showInactive(){
        title.textContent = "此名片尚未啟用";
        msg.textContent = "請聯繫客服開通";
        actions.style.display = "grid";
        kv.style.display = "block";
        openUrlEl.textContent = urlOpen(state.id);
      }

      function routeToBest(){
        const target = isWeChat() ? urlWeChat(state.id) : urlIndex(state.id);
        location.replace(target);
      }

      function openDebug(){
        const info = {
          version: VERSION,
          id: state.id,
          fetch: state.fetchStatus,
          gas_url: state.gasUrl,
          resp: state.respMini,
          target: isWeChat() ? "wechat.html" : "index.html"
        };
        dbgPre.textContent = JSON.stringify(info, null, 2);
        dbgMask.style.display = "block";
        dbg.style.display = "block";
      }
      function closeDebug(){
        dbg.style.display = "none";
        dbgMask.style.display = "none";
      }
      function bindLongPress(node, ms, fn){
        let t=null;
        const start=()=>{ clearTimeout(t); t=setTimeout(fn, ms); };
        const end=()=>clearTimeout(t);
        node.addEventListener("touchstart", start, {passive:true});
        node.addEventListener("touchend", end);
        node.addEventListener("touchcancel", end);
        node.addEventListener("mousedown", start);
        node.addEventListener("mouseup", end);
        node.addEventListener("mouseleave", end);
      }

      async function boot(){
        state.id = normalizeId(qs("id")) || CONFIG.DEFAULT_ID;

        bindLongPress(brand, CONFIG.LONGPRESS_MS, openDebug);
        dbgClose.addEventListener("click", closeDebug);
        dbgMask.addEventListener("click", closeDebug);

        btnRetry.addEventListener("click", () => location.reload());
        btnGoCard.addEventListener("click", () => location.href = urlIndex(state.id));
        btnGoWeChat.addEventListener("click", () => location.href = urlWeChat(state.id));
        btnCopy.addEventListener("click", async () => {
          const txt = `index_url: ${urlIndex(state.id)}\nwechat_url: ${urlWeChat(state.id)}\nopen_url: ${urlOpen(state.id)}`;
          try{
            await navigator.clipboard.writeText(txt);
            btnCopy.textContent = "已複製";
            setTimeout(()=>btnCopy.textContent="複製連結", 900);
          }catch{
            prompt("複製這段：", txt);
          }
        });

        title.textContent = "開啟中...";
        msg.textContent = "正在確認狀態，請稍候。";

        try{
          state.fetchStatus = "loading";
          const s = await getStatusByCard(state.id);
          state.respMini = s;

          const status = String(s.status || "").toLowerCase();
          const inactive = (status === "inactive" || status === "locked" || status === "disabled");
          const active = (status === "active" || status === "");

          state.fetchStatus = "ok";

          if (inactive){
            showInactive();
            return;
          }
          if (active){
            routeToBest();
            return;
          }

          // Unknown => still go best
          routeToBest();
        }catch(err){
          state.fetchStatus = "error";
          state.respMini = { error: String(err && err.message ? err.message : err) };
          showFallback("開啟失敗：請檢查網路 / GAS action=card 是否可用，或稍後再試。");
        }
      }

      boot();
    })();
  </script>
</body>
</html>
