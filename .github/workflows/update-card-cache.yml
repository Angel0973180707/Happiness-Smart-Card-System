name: Update Card Cache

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch card data from GAS
        run: |
          mkdir -p api/cards
          curl -L --max-time 30 \
            "https://script.google.com/macros/s/AKfycbycjN-ooacgi-K-uGUTZeWUwfmjHFI_JeESbM2SEGnjFsk0TPBuUY71bW-1AYAMI-E/exec?action=getCardPublicShell&id=TW0001&tenant=angel" \
            -o api/cards/TW0001-shell.json
          curl -L --max-time 30 \
            "https://script.google.com/macros/s/AKfycbycjN-ooacgi-K-uGUTZeWUwfmjHFI_JeESbM2SEGnjFsk0TPBuUY71bW-1AYAMI-E/exec?action=getCardPublicLite&id=TW0001&tenant=angel" \
            -o api/cards/TW0001.json
          echo "Done: $(date)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/cards/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update card cache $(date -u '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
