<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>Admin｜Happiness Smart Card System v491</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="./admin.css?v=491" />
</head>

<body>
  <header class="topbar">
    <div class="topbar__left">
      <div class="brand">
        <div class="brand__title">隱形後臺｜交貨工作臺</div>
        <div class="brand__sub">v491</div>
      </div>
    </div>

    <div class="topbar__right">
      <button class="btn btn--ghost" id="btnBackHome" type="button">
        <i class="fa-solid fa-house"></i><span>回名片首頁</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <!-- 控制區 -->
    <section class="card">
      <div class="row">
        <label class="label">序號 / 姓名</label>
        <div class="inputRow">
          <input id="adminInput" class="input" placeholder="TW0001 / 0001 / 小天使（目前以序號為主）" />
          <button class="btn" id="btnApply" type="button"><i class="fa-solid fa-check"></i><span>套用</span></button>
        </div>
        <div class="hint" id="adminHint"></div>
      </div>

      <div class="grid2">
        <button class="btn" id="btnPreview" type="button">
          <i class="fa-solid fa-up-right-from-square"></i><span>乾淨成品預覽</span>
        </button>

        <button class="btn" id="btnCopyCard" type="button">
          <i class="fa-solid fa-link"></i><span>一鍵複製名片連結</span>
        </button>

        <button class="btn" id="btnCopyShare" type="button">
          <i class="fa-solid fa-share-nodes"></i><span>一鍵複製分享卡連結</span>
        </button>

        <button class="btn" id="btnCopyDelivery" type="button">
          <i class="fa-solid fa-box"></i><span>一鍵交貨（只給這段）</span>
        </button>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="label">微信長圖（1080×1920）</div>
        <div class="grid2">
          <button class="btn btn--primary" id="btnWeChatPoster" type="button">
            <i class="fa-solid fa-image"></i><span>一鍵生成微信長圖</span>
          </button>

          <button class="btn" id="btnOpenPoster" type="button" disabled>
            <i class="fa-solid fa-up-right-from-square"></i><span>開啟長圖（長按存圖）</span>
          </button>
        </div>
        <div class="hint">
          生成後：Android 通常會直接下載；iPhone 若未自動存檔，請點「開啟長圖」→ 長按圖片 → 儲存到相簿。
        </div>
      </div>
    </section>

    <!-- 成品小預覽（乾淨卡面） -->
    <section class="preview">
      <div class="preview__title">成品預覽（乾淨版）</div>
      <div class="previewCard">
        <div class="avatarBox">
          <img id="pvAvatar" alt="avatar" />
        </div>
        <div class="pvInfo">
          <div class="pvName" id="pvName">—</div>
          <div class="pvUnit" id="pvUnit"></div>
          <div class="pvTitle" id="pvTitle"></div>
          <div class="pvSlogan" id="pvSlogan" style="display:none;"></div>
        </div>
      </div>

      <div class="miniLinks">
        <div class="miniLinks__row">
          <span class="tag">Card（乾淨）</span>
          <code id="txtCardUrl">—</code>
          <button class="btn btn--tiny" id="btnCopyCard2" type="button"><i class="fa-regular fa-copy"></i></button>
        </div>
        <div class="miniLinks__row">
          <span class="tag">Share（分享卡）</span>
          <code id="txtShareUrl">—</code>
          <button class="btn btn--tiny" id="btnCopyShare2" type="button"><i class="fa-regular fa-copy"></i></button>
        </div>
      </div>
    </section>

    <!-- Poster overlay -->
    <div class="overlay" id="posterOverlay" aria-hidden="true">
      <div class="overlay__box">
        <div class="spinner" aria-hidden="true"></div>
        <div class="overlay__title" id="posterStatus">正在生成微信長圖…</div>
        <div class="overlay__hint" id="posterHint">請稍候（照片多時會慢一點）。</div>
        <div class="overlay__row">
          <button class="btn" id="btnCancelOverlay" type="button">關閉</button>
        </div>
      </div>
    </div>
  </main>

  <!-- QR lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="./admin.js?v=491"></script>
</body>
</html>
