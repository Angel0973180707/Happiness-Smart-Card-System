<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HSC Admin Workspace v521.5</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./admin.css?v=5215" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="h1">HSC Admin Workspace <span class="pill">v521.5</span></div>
        <div class="sub">
          功能：貼客戶訊息 → 查找名片 → 一鍵複製交付 / 成品 / 微信 / 邀請碼<br/>
          已對齊：<b>share.html 為唯一主交付連結</b>；可切換微信長圖加購（wechat_poster=0/1）
        </div>
      </div>
      <div class="pill mono" id="statusPill">ready</div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div class="card">
        <label>GAS Exec URL</label>
        <input id="gasUrl" class="mono" placeholder="貼上你的 GAS /exec" />

        <div style="height:10px"></div>

        <label>BASE URL</label>
        <input id="baseUrl" class="mono" placeholder="https://angel0973180707.github.io/Happiness-Smart-Card-System/" />

        <div style="height:10px"></div>

        <label>ADMIN_SECRET</label>
        <input id="adminSecret" class="mono" placeholder="輸入 ADMIN_SECRET" />

        <div style="height:12px"></div>

        <div class="row">
          <button class="btn" id="btnStats">刷新統計</button>
          <button class="btn" id="btnMakeFill">產生 7 天可填表連結（並複製）</button>
        </div>

        <div class="statGrid" aria-label="stats">
          <div class="stat"><div class="k">總名片數</div><div class="v mono" id="stTotal">—</div></div>
          <div class="stat"><div class="k">本月新增</div><div class="v mono" id="stMonthNew">—</div></div>
          <div class="stat"><div class="k">活躍名片</div><div class="v mono" id="stActive">—</div></div>
          <div class="stat"><div class="k">過期名片</div><div class="v mono" id="stExpired">—</div></div>
        </div>

        <div style="height:12px"></div>

        <label>新客戶填表連結（7 天有效）</label>
        <input id="fillLink" class="mono" readonly placeholder="按上方按鈕產生，這裡會出現連結" />

        <div style="height:14px"></div>

        <label>客戶訊息（貼一行即可）</label>
        <textarea id="customerMsg" placeholder="例：王小明 123｜王小明 館長｜王小明 幸福智慧名片館"></textarea>

        <div style="height:10px"></div>

        <div class="row">
          <button class="btn" id="btnFind">查找名片</button>
          <button class="btn primary" id="btnMakeUpdate" disabled>產生 7 天更新連結（並複製）</button>
          <button class="btn" id="btnCopyUpdate" disabled>只複製更新連結</button>
        </div>

        <div style="height:12px"></div>

        <label>更新連結（7 天有效）</label>
        <input id="updateLink" class="mono" readonly placeholder="查找到名片後，這裡會出現更新連結" />

        <div style="height:10px"></div>
        <div class="sub">
          ※ 更新連結請勿轉傳（7 天有效）。<br/>
          ※ 客戶交付請使用右側的 <b>交付卡連結（share.html）</b>。
        </div>
      </div>

      <!-- RIGHT -->
      <div class="card">
        <div class="pill">查找結果</div>
        <div class="list" id="resultList"></div>

        <div style="height:12px"></div>

        <div class="metaBox">
          <div class="metaHead">已選名片</div>
          <div class="metaGrid">
            <div class="k">ID</div><div class="v mono" id="selectedId">—</div>
            <div class="k">姓名</div><div class="v" id="selectedName">—</div>
            <div class="k">狀態</div><div class="v" id="selectedStatus">—</div>
            <div class="k">邀請碼</div><div class="v mono" id="selectedInviteCode">—</div>
          </div>

          <div class="row" style="margin-top:10px;">
            <button class="btn" id="btnCopyInvite" disabled>複製邀請碼</button>
            <button class="btn" id="btnSetActive" disabled>設為 active</button>
            <button class="btn" id="btnSetInactive" disabled>設為 inactive</button>
          </div>
        </div>

        <div style="height:12px"></div>

        <div class="metaBox">
          <div class="metaHead">微信長圖加購</div>
          <div class="sub" style="margin:0 0 10px;">欄位：<span class="mono">wechat_poster</span>，這輪定義為 <span class="mono">0 / 1</span></div>

          <div class="wxState" id="wxStateText">目前：—</div>

          <div class="row" style="margin-top:10px;">
            <button class="btn" id="btnWechatOff" disabled>未加購（0）</button>
            <button class="btn primary" id="btnWechatOn" disabled>已加購（1）</button>
          </div>
        </div>

        <div style="height:12px"></div>

        <label>交付與預覽連結（選到名片後可複製）</label>
        <input id="shareLink" class="mono" readonly placeholder="share.html?id=..." />
        <div style="height:8px"></div>
        <input id="cardLink" class="mono" readonly placeholder="index.html?id=...&view=1" />
        <div style="height:8px"></div>
        <input id="wechatLink" class="mono" readonly placeholder="wechat.html?id=..." />

        <div style="height:10px"></div>
        <div class="row">
          <button class="btn" id="btnCopyShare" disabled>複製交付卡連結</button>
          <button class="btn" id="btnCopyCard" disabled>複製智慧名片連結</button>
          <button class="btn" id="btnCopyWeChat" disabled>複製微信連結</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script defer src="./admin.js?v=5215"></script>
</body>
</html>
