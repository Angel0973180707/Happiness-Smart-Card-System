<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>HSC Admin v522.2</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{
      --bg:#0b1220;
      --bg2:#0f172a;
      --card:#111827;
      --card2:#172033;
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.16);
      --text:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.72);
      --soft:rgba(255,255,255,.06);
      --soft2:rgba(255,255,255,.08);
      --accent:#7bdcff;
      --ok:#34d399;
      --warn:#fbbf24;
      --danger:#fb7185;
      --shadow:0 18px 50px rgba(0,0,0,.28);
      --radius:22px;
      --radius-sm:16px;
      --max:1280px;
    }

    *{ box-sizing:border-box; }
    html,body{ min-height:100%; }
    body{
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:
        radial-gradient(900px 600px at 12% -10%, rgba(123,220,255,.14), transparent 55%),
        radial-gradient(1000px 700px at 120% 0%, rgba(56,189,248,.10), transparent 48%),
        linear-gradient(180deg, #08101d 0%, #0b1220 100%);
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:20px 14px 64px;
    }

    .hero{
      display:grid;
      gap:14px;
      margin-bottom:18px;
    }

    .hero-card{
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.035));
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:20px 18px;
    }

    .title{
      font-size:32px;
      line-height:1.18;
      font-weight:900;
      letter-spacing:.02em;
      margin:0 0 8px;
    }

    .subtitle{
      color:var(--muted);
      font-size:16px;
      line-height:1.7;
      margin:0;
    }

    .grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:16px;
      align-items:start;
    }

    .panel{
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px 12px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .panel-title{
      font-size:22px;
      font-weight:900;
      letter-spacing:.02em;
      margin:0;
    }

    .panel-sub{
      font-size:13px;
      color:var(--muted);
      line-height:1.6;
      margin:4px 0 0;
    }

    .panel-body{
      padding:16px 18px 18px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .row + .row{ margin-top:12px; }

    .field{
      display:grid;
      gap:7px;
      min-width:0;
      flex:1 1 220px;
    }

    .field.sm{ flex:0 1 140px; }
    .field.md{ flex:0 1 220px; }
    .field.lg{ flex:1 1 320px; }

    label{
      font-size:13px;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.02em;
    }

    input, select, textarea{
      width:100%;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.05);
      color:var(--text);
      border-radius:16px;
      padding:14px 14px;
      font-size:17px;
      line-height:1.4;
      outline:none;
      transition:.18s ease;
    }

    textarea{
      min-height:96px;
      resize:vertical;
    }

    input:focus, select:focus, textarea:focus{
      border-color:rgba(123,220,255,.55);
      box-shadow:0 0 0 4px rgba(123,220,255,.10);
      background:rgba(255,255,255,.07);
    }

    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    button{
      appearance:none;
      border:1px solid var(--line2);
      background:rgba(255,255,255,.08);
      color:var(--text);
      border-radius:16px;
      padding:13px 16px;
      font-size:16px;
      font-weight:900;
      line-height:1.2;
      cursor:pointer;
      transition:transform .04s ease, background .18s ease, border-color .18s ease, opacity .18s ease;
    }

    button:hover{ background:rgba(255,255,255,.11); }
    button:active{ transform:translateY(1px); }
    button.primary{
      background:linear-gradient(180deg, rgba(123,220,255,.24), rgba(123,220,255,.14));
      border-color:rgba(123,220,255,.35);
    }
    button.ok{
      background:linear-gradient(180deg, rgba(52,211,153,.22), rgba(52,211,153,.12));
      border-color:rgba(52,211,153,.34);
    }
    button.warn{
      background:linear-gradient(180deg, rgba(251,191,36,.22), rgba(251,191,36,.12));
      border-color:rgba(251,191,36,.34);
    }
    button.danger{
      background:linear-gradient(180deg, rgba(251,113,133,.22), rgba(251,113,133,.12));
      border-color:rgba(251,113,133,.34);
    }
    button.ghost{
      background:transparent;
    }
    button[disabled]{
      opacity:.45;
      cursor:not-allowed;
    }

    .hint{
      margin-top:10px;
      font-size:13px;
      line-height:1.6;
      color:var(--muted);
    }

    .statusbox{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      padding:14px 14px;
      font-size:15px;
      line-height:1.7;
      white-space:pre-wrap;
      word-break:break-word;
      min-height:72px;
    }

    .statusbox.ok{ border-color:rgba(52,211,153,.35); }
    .statusbox.warn{ border-color:rgba(251,191,36,.35); }
    .statusbox.err{ border-color:rgba(251,113,133,.35); }

    .result-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .count-badge{
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      color:#dff6ff;
      background:rgba(123,220,255,.12);
      border:1px solid rgba(123,220,255,.20);
    }

    .result-list{
      display:grid;
      gap:12px;
    }

    .card{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.03));
      border-radius:20px;
      padding:16px;
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:10px;
    }

    .name{
      font-size:24px;
      line-height:1.2;
      font-weight:900;
      word-break:break-word;
      margin:0 0 6px;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 11px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#f5fbff;
      max-width:100%;
      word-break:break-all;
    }

    .chip.active{
      background:rgba(52,211,153,.13);
      border-color:rgba(52,211,153,.28);
    }

    .chip.inactive{
      background:rgba(251,113,133,.12);
      border-color:rgba(251,113,133,.26);
    }

    .data{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
      margin:12px 0;
    }

    .kv{
      padding:12px 13px;
      border-radius:15px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      min-width:0;
    }

    .kv b{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      letter-spacing:.02em;
    }

    .kv span{
      display:block;
      font-size:16px;
      line-height:1.45;
      word-break:break-word;
    }

    .card-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .card-actions button{
      padding:11px 13px;
      border-radius:14px;
      font-size:14px;
    }

    .empty{
      border:1px dashed rgba(255,255,255,.18);
      border-radius:18px;
      padding:20px 16px;
      color:var(--muted);
      font-size:16px;
      line-height:1.7;
      text-align:center;
      background:rgba(255,255,255,.025);
    }

    .detail-box{
      display:grid;
      gap:14px;
    }

    .quick-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }

    .mini-note{
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }

    .footer-space{
      height:24px;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns:1fr; }
    }

    @media (max-width: 680px){
      .wrap{ padding:14px 10px 50px; }
      .title{ font-size:28px; }
      .panel-title{ font-size:20px; }
      .name{ font-size:22px; }
      .data{ grid-template-columns:1fr; }
      .quick-grid{ grid-template-columns:1fr; }
      input, select, textarea{ font-size:16px; }
      button{ font-size:15px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-card">
        <h1 class="title">HSC Admin 後臺 v522.2</h1>
        <p class="subtitle">
          可搜尋姓名、電話、單位、職稱、ID。已接上後臺完整功能：搜尋、讀卡、啟用停用、建邀請碼、更新連結、欄位更新。
        </p>
      </div>
    </section>

    <div class="grid">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">後臺控制區</h2>
            <p class="panel-sub">先確認 GAS，再搜尋卡片，再做操作。</p>
          </div>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="field lg">
              <label for="gasUrl">GAS Exec URL</label>
              <input id="gasUrl" type="text" />
            </div>
          </div>

          <div class="row">
            <div class="field md">
              <label for="tenant">Tenant</label>
              <input id="tenant" type="text" value="angel" />
            </div>
            <div class="field md">
              <label for="adminSecret">ADMIN_SECRET</label>
              <input id="adminSecret" type="password" />
            </div>
          </div>

          <div class="row btns">
            <button id="btnSaveConfig" class="primary">儲存設定</button>
            <button id="btnPing">測試連線</button>
            <button id="btnStats">讀統計</button>
          </div>

          <div class="row" style="margin-top:18px;">
            <div class="field lg">
              <label for="searchInput">搜尋卡片</label>
              <input id="searchInput" type="text" placeholder="可輸入：TW0001 / 小天使 / 973180707 / 天使幸福智慧名片館 / 幸福智慧名片館館長" />
            </div>
          </div>

          <div class="row btns">
            <button id="btnSearch" class="primary">搜尋</button>
            <button id="btnSearchId">ID 直讀</button>
            <button id="btnClearSearch" class="ghost">清空</button>
          </div>

          <div class="hint">
            搜尋支援：ID、姓名、電話、單位、職稱。若輸入完整卡號如 TW0001，可先用「ID 直讀」。
          </div>

          <div class="row" style="margin-top:18px;">
            <div class="field md">
              <label for="invitePlan">建邀請碼方案</label>
              <select id="invitePlan">
                <option value="free">free</option>
                <option value="premium">premium</option>
              </select>
            </div>
            <div class="field sm">
              <label for="inviteDays">有效天數</label>
              <input id="inviteDays" type="number" value="7" min="1" />
            </div>
            <div class="field sm">
              <label for="inviteCount">數量</label>
              <input id="inviteCount" type="number" value="1" min="1" />
            </div>
          </div>

          <div class="row">
            <div class="field lg">
              <label for="inviteNote">備註（可空白）</label>
              <input id="inviteNote" type="text" placeholder="例如：自由搭配測試用" />
            </div>
          </div>

          <div class="row btns">
            <button id="btnCreateInvite" class="warn">建立邀請碼</button>
          </div>

          <div class="row" style="margin-top:18px;">
            <div class="field">
              <label>狀態訊息</label>
              <div id="statusBox" class="statusbox">準備就緒。</div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">詳細操作區</h2>
            <p class="panel-sub">先從搜尋結果載入一筆卡片，再做快速編修。</p>
          </div>
        </div>
        <div class="panel-body">
          <div class="detail-box">
            <div class="row">
              <div class="field md">
                <label for="currentId">目前卡號</label>
                <input id="currentId" type="text" placeholder="請先從搜尋結果載入" />
              </div>
              <div class="field md">
                <label for="currentName">目前姓名</label>
                <input id="currentName" type="text" placeholder="載入後自動帶入" />
              </div>
            </div>

            <div class="quick-grid">
              <div class="field">
                <label for="quickField">快速更新欄位</label>
                <select id="quickField">
                  <option value="name">name 姓名</option>
                  <option value="unit">unit 單位</option>
                  <option value="title">title 職稱</option>
                  <option value="phone">phone 電話</option>
                  <option value="email">email Email</option>
                  <option value="line_oa">line_oa LINE OA</option>
                  <option value="wechat_id">wechat_id 微信ID</option>
                  <option value="address">address 地址</option>
                  <option value="slogan">slogan 標語</option>
                  <option value="services">services 服務</option>
                  <option value="experience">experience 經歷</option>
                  <option value="status">status 狀態</option>
                </select>
              </div>

              <div class="field">
                <label for="quickValue">快速更新值</label>
                <input id="quickValue" type="text" placeholder="輸入新值" />
              </div>
            </div>

            <div class="row btns">
              <button id="btnQuickUpdate" class="ok">快速更新</button>
              <button id="btnLoadCurrent">重新載入此卡</button>
              <button id="btnOpenCard">開智慧名片</button>
              <button id="btnOpenShare">開交付卡</button>
            </div>

            <div class="row">
              <div class="field">
                <label for="detailJson">目前卡片資料</label>
                <textarea id="detailJson" placeholder="載入後顯示 JSON"></textarea>
              </div>
            </div>

            <div class="mini-note">
              提醒：快速更新是單欄位更新。若後面要做完整多欄位編輯，再往 v522.3 擴充。
            </div>
          </div>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top:16px;">
      <div class="panel-head">
        <div class="result-head" style="width:100%;">
          <div>
            <h2 class="panel-title">搜尋結果</h2>
            <p class="panel-sub">可點載入、啟用停用、複製資料、產生更新連結。</p>
          </div>
          <div id="resultCount" class="count-badge">0 筆</div>
        </div>
      </div>
      <div class="panel-body">
        <div id="resultList" class="result-list">
          <div class="empty">尚未搜尋資料。</div>
        </div>
      </div>
    </section>

    <div class="footer-space"></div>
  </div>

  <script src="./admin.js?v=5222"></script>
</body>
</html>
