<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸福智慧名片｜後台</title>
  <link rel="stylesheet" href="./style.css?v=389" />

  <style>
    body {
      font-family: sans-serif;
      background: #f5f6fa;
      padding: 30px 20px;
      text-align: center;
    }

    .admin-box {
      max-width: 420px;
      margin: auto;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    .primary { background: #ee5253; color: white; }
    .ghost   { background: #dfe6e9; }
  </style>
</head>

<body>

  <div class="admin-box">
    <h2>幸福智慧名片｜後台</h2>

    <input id="admin-input" placeholder="輸入序號或姓名" />

    <button class="primary" onclick="Admin.preview()">成品預覽</button>
    <button class="ghost" onclick="Admin.goHome()">回首頁</button>
    <button class="primary" onclick="Admin.delivery()">一鍵交貨</button>

    <div id="admin-msg" style="margin-top:15px;color:#999;font-size:13px;"></div>
  </div>

  <script src="./app.js?v=388"></script>

  <script>
    const Admin = {

      resolveId() {
        const val = document.getElementById("admin-input").value.trim();
        if (!val) return null;

        if (val.toUpperCase().startsWith("TW")) return val.toUpperCase();

        return val; // 當姓名處理
      },

      async preview() {
        const val = this.resolveId();
        if (!val) return alert("請輸入資料");

        if (val.startsWith("TW")) {
          location.href = `./index.html?id=${val}`;
          return;
        }

        // 姓名 → 查 GAS
        try {
          const res = await fetch(`${CONFIG.GAS}?action=search&name=${val}`);
          const data = await res.json();

          if (!data.ok || !data.id) {
            document.getElementById("admin-msg").textContent = "找不到資料";
            return;
          }

          location.href = `./index.html?id=${data.id}`;

        } catch (err) {
          alert("搜尋失敗");
        }
      },

      goHome() {
        location.href = "./index.html";
      },

      delivery() {
        const val = this.resolveId();
        if (!val) return alert("請輸入序號");

        const id = val.startsWith("TW") ? val : null;
        if (!id) return alert("交貨請輸入序號");

        const link = `${location.origin}/angel-card/share.html?id=${id}`;

        navigator.clipboard.writeText(link);
        alert("交貨連結已複製");
      }
    };
  </script>

</body>
</html>
