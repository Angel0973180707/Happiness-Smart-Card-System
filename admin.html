<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HSC Admin v517</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{ --bg:#0b1220; --card:#121a2b; --line:rgba(255,255,255,.10); --text:rgba(255,255,255,.92); --muted:rgba(255,255,255,.68); --accent:#7bdcff; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,-apple-system,"Noto Sans TC",Segoe UI,Roboto; background:radial-gradient(1200px 800px at 20% -10%, rgba(123,220,255,.18), transparent 60%), var(--bg); color:var(--text); }
    .wrap{ max-width:980px; margin:0 auto; padding:18px; }
    .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .h1{ font-size:20px; font-weight:800; letter-spacing:.5px; }
    .sub{ font-size:12px; color:var(--muted); margin-top:6px; }
    .card{ background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .grid{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media(min-width:860px){ .grid{ grid-template-columns:1.2fr .8fr; } }
    label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
    input, textarea, select{
      width:100%; padding:10px 12px; border-radius:12px;
      background:rgba(0,0,0,.25); border:1px solid var(--line);
      color:var(--text); outline:none;
    }
    textarea{ min-height:88px; resize:vertical; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{
      appearance:none; border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      color:var(--text); padding:10px 12px; border-radius:12px;
      cursor:pointer; font-weight:700;
    }
    .btn.primary{ border-color:rgba(123,220,255,.35); background:rgba(123,220,255,.12); }
    .btn:active{ transform:translateY(1px); }
    .pill{ display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12px; }
    .list{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
    .item{ padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.18); }
    .item strong{ display:block; font-size:14px; }
    .item small{ display:block; color:var(--muted); margin-top:4px; }
    .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .ok{ color:#8cffc1; }
    .err{ color:#ff9aa2; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="h1">HSC Admin Workspace <span class="pill">v517</span></div>
        <div class="sub">功能：貼客戶訊息 → 自動查找 → 一鍵複製「7 天更新連結」</div>
      </div>
      <div class="pill mono" id="statusPill">ready</div>
    </div>

    <div class="grid">
      <div class="card">
        <label>GAS Exec URL</label>
        <input id="gasUrl" class="mono" placeholder="貼上你的 GAS /exec" />

        <div style="height:10px"></div>

        <label>ADMIN_SECRET</label>
        <input id="adminSecret" class="mono" placeholder="輸入 ADMIN_SECRET" />

        <div style="height:12px"></div>

        <label>客戶訊息（貼一行即可）</label>
        <textarea id="customerMsg" placeholder="例：王小明 123  或  王小明 館長  或  王小明 幸福智慧名片館"></textarea>

        <div style="height:10px"></div>

        <div class="row">
          <button class="btn" id="btnFind">查找名片</button>
          <button class="btn primary" id="btnMakeUpdate" disabled>產生 7 天更新連結（並複製）</button>
          <button class="btn" id="btnCopy" disabled>只複製連結</button>
        </div>

        <div style="height:12px"></div>

        <label>更新連結（7 天有效）</label>
        <input id="updateLink" class="mono" readonly placeholder="查找到名片後，這裡會出現更新連結" />

        <div style="height:12px"></div>
        <div class="sub">
          ※ 你給客戶的更新引導文案，就用你剛剛那段：<br/>
          「A) 姓名 + 手機末三碼 / B) 姓名 + 單位或頭銜 / 不方便就回覆客服」<br/>
          ※ 更新連結請勿轉傳（7 天有效）。
        </div>
      </div>

      <div class="card">
        <div class="pill">查找結果</div>
        <div class="list" id="resultList"></div>
      </div>
    </div>
  </div>

  <script defer src="./admin.js?v=5170"></script>
</body>
</html>
