<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Happiness Smart Card</title>

  <!-- PWA (keep if you already have; safe if absent) -->
  <link rel="manifest" href="./manifest.json?v=407" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1b33;
      --card2:#0c1730;
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --dim:rgba(255,255,255,.45);
      --accent:#60a5fa;
      --ok:#22c55e;
      --warn:#f59e0b;
      --err:#ef4444;
      --shadow: 0 18px 45px rgba(0,0,0,.40);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 25% -10%, rgba(96,165,250,.22), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(34,197,94,.14), transparent 55%),
        radial-gradient(1200px 900px at 30% 120%, rgba(245,158,11,.10), transparent 60%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    a{color:inherit; text-decoration:none}
    .wrap{
      width:min(980px, 92vw);
      margin: 18px auto 30px;
      padding-bottom: 28px;
    }

    /* Top brand */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 6px 6px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      cursor:default;
    }
    .dot{
      width:12px;height:12px;border-radius:999px;
      background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.25));
      box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 8px 18px rgba(0,0,0,.35);
    }
    .brand-title{
      display:flex; flex-direction:column; gap:2px;
      line-height:1.1;
    }
    .brand-title .t1{font-weight:800; letter-spacing:.3px; font-size:14px}
    .brand-title .t2{font-weight:700; color:var(--dim); font-size:12px}

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius:999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-weight:700;
      font-size:12px;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }
    .pill strong{color:var(--text)}
    .pill .mini{
      width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.35)
    }

    /* Main card */
    .card{
      margin-top:10px;
      border: 1px solid var(--line);
      border-radius: calc(var(--r) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .hero{
      padding: 18px 18px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 65%);
      display:flex;
      gap:14px;
      align-items:flex-start;
    }
    .avatar-wrap{
      position:relative;
      width:88px; height:88px;
      flex:0 0 88px;
      border-radius: 22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05);
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    .avatar-wrap.premiumHalo::before{
      content:"";
      position:absolute; inset:-18px;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(96,165,250,.18), transparent 60%);
      filter: blur(10px);
      opacity:.85;
      animation: halo 3.2s ease-in-out infinite;
    }
    @keyframes halo{
      0%,100%{transform:scale(1); opacity:.72}
      50%{transform:scale(1.06); opacity:.95}
    }
    .avatar{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      display:none;
    }
    .avatar-ph{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      color: rgba(255,255,255,.55);
      font-weight:900;
      letter-spacing:.5px;
      font-size:20px;
    }

    .hero-right{flex:1; min-width:0}
    .name{
      font-size:22px;
      font-weight:900;
      margin: 2px 0 6px;
      letter-spacing:.3px;
    }
    .meta{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom: 10px;
    }
    .meta .line{
      color: var(--muted);
      font-weight:700;
      font-size:13px;
      line-height:1.35;
      white-space:pre-line;
    }
    .badges{
      display:flex; flex-wrap:wrap; gap:8px;
      margin-top: 10px;
    }
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding: 7px 10px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-weight:800;
      font-size:12px;
    }
    .badge .bDot{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.35)}

    /* Sections */
    .sections{
      padding: 6px 14px 16px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .section{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--r);
      background: rgba(0,0,0,.18);
      padding: 12px 12px 10px;
    }
    .section h3{
      margin:0 0 8px;
      font-size:13px;
      font-weight:900;
      letter-spacing:.4px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color: rgba(255,255,255,.88);
    }
    .section h3 span{
      color: var(--dim);
      font-weight:900;
      font-size:11px;
      letter-spacing:.6px;
    }
    .bullet{
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-weight:700;
      font-size:14px;
      line-height:1.6;
    }
    .para{
      color: var(--muted);
      font-weight:700;
      font-size:14px;
      line-height:1.7;
      white-space:pre-line;
    }

    /* Contacts */
    .contacts{
      display:grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .contact{
      display:flex; align-items:center; gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
    }
    .ico{
      width:34px; height:34px;
      border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      flex:0 0 34px;
      font-weight:900;
      color: rgba(255,255,255,.75);
    }
    .cBody{min-width:0; flex:1}
    .cTitle{font-weight:900; font-size:12px; color: rgba(255,255,255,.86)}
    .cVal{
      margin-top:2px;
      font-weight:800;
      font-size:13px;
      color: var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .cGo{
      flex:0 0 auto;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: rgba(255,255,255,.85);
      font-weight:900;
      font-size:12px;
    }

    /* Skeleton */
    .skeleton .sk{
      background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.14), rgba(255,255,255,.06));
      background-size: 240% 100%;
      animation: sk 1.2s ease-in-out infinite;
      border-radius: 10px;
    }
    @keyframes sk{0%{background-position:0% 0} 100%{background-position:100% 0}}
    .sk.h18{height:18px}
    .sk.h14{height:14px}
    .sk.h12{height:12px}
    .sk.w60{width:60%}
    .sk.w85{width:85%}
    .sk.w40{width:40%}
    .sk.mt8{margin-top:8px}
    .sk.mt10{margin-top:10px}

    /* Fade in */
    .fade-in{
      animation: fadein .22s ease-out both;
    }
    @keyframes fadein{from{opacity:0; transform: translateY(6px)} to{opacity:1; transform:none}}

    /* Empty / Inactive */
    .empty{
      padding: 22px 18px 20px;
      text-align:center;
    }
    .empty h2{
      margin: 0 0 10px;
      font-size:18px;
      font-weight:950;
      letter-spacing:.3px;
    }
    .empty p{
      margin: 0 0 16px;
      color: var(--muted);
      font-weight:800;
      line-height:1.6;
      white-space:pre-line;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      font-weight:950;
      letter-spacing:.3px;
      box-shadow: 0 14px 30px rgba(0,0,0,.30);
    }

    /* Debug sheet */
    .dbgMask{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      z-index: 9998;
    }
    .dbg{
      position:fixed;
      left:50%;
      transform: translateX(-50%);
      bottom: 16px;
      width:min(920px, 92vw);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(15, 23, 42, .92);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      padding: 12px 12px 10px;
      display:none;
      z-index: 9999;
      backdrop-filter: blur(10px);
    }
    .dbgTop{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom: 8px;
    }
    .dbgTop .ttl{
      font-weight:950; letter-spacing:.3px;
      font-size:13px;
    }
    .dbgTop .x{
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      font-weight:950;
    }
    .dbg pre{
      margin:0;
      padding: 10px;
      border-radius: 14px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      overflow:auto;
      max-height: 42vh;
      color: rgba(255,255,255,.86);
      font-size:12px;
      line-height:1.5;
      white-space:pre-wrap;
      word-break:break-word;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand" id="brand">
        <div class="dot"></div>
        <div class="brand-title">
          <div class="t1">Happiness Smart Card</div>
          <div class="t2">v407</div>
        </div>
      </div>
      <div class="pill" id="status-pill">
        <span class="mini"></span>
        <span id="pill-text">Loading skeleton</span>
      </div>
    </div>

    <div class="card" id="main-card">
      <!-- Skeleton state (initial) -->
      <div class="hero skeleton" id="hero-skeleton">
        <div class="avatar-wrap">
          <div class="avatar-ph sk h18 w40"></div>
        </div>
        <div class="hero-right">
          <div class="sk h18 w60"></div>
          <div class="sk h12 w85 mt10"></div>
          <div class="sk h12 w60 mt8"></div>
          <div class="sk h12 w40 mt8"></div>
          <div class="badges">
            <div class="badge"><span class="bDot"></span><span class="sk h12 w40"></span></div>
            <div class="badge"><span class="bDot"></span><span class="sk h12 w40"></span></div>
          </div>
        </div>
      </div>

      <!-- Real hero -->
      <div class="hero" id="hero" style="display:none">
        <div class="avatar-wrap" id="avatarWrap">
          <img class="avatar" id="avatar" alt="avatar" />
          <div class="avatar-ph" id="avatarPh">🙂</div>
        </div>
        <div class="hero-right">
          <div class="name" id="u-name">—</div>
          <div class="meta">
            <div class="line" id="u-unit"> </div>
            <div class="line" id="u-title"> </div>
          </div>
          <div class="badges">
            <div class="badge" id="badge-plan"><span class="bDot"></span><span id="plan-text">—</span></div>
            <div class="badge" id="badge-id"><span class="bDot"></span><span id="id-text">—</span></div>
          </div>
        </div>
      </div>

      <div class="sections" id="sections" style="display:none">
        <div class="section" id="sec-service" style="display:none">
          <h3>服務項目 <span>Service</span></h3>
          <ul class="bullet" id="u-service"></ul>
        </div>

        <div class="section" id="sec-exp" style="display:none">
          <h3>經歷 <span>Experience</span></h3>
          <div class="para" id="u-exp"></div>
        </div>

        <div class="section" id="sec-contact" style="display:none">
          <h3>聯繫方式 <span>Contact</span></h3>
          <div class="contacts" id="u-contact"></div>
        </div>
      </div>

      <!-- Empty / inactive -->
      <div class="empty" id="empty" style="display:none">
        <h2>此名片尚未啟用</h2>
        <p>請聯繫客服開通</p>
        <a class="btn" id="btn-open-support" href="#" rel="noopener">聯繫開通</a>
      </div>
    </div>
  </div>

  <!-- Debug -->
  <div class="dbgMask" id="dbgMask"></div>
  <div class="dbg" id="dbg">
    <div class="dbgTop">
      <div class="ttl">Debug</div>
      <div class="x" id="dbgClose">關閉</div>
    </div>
    <pre id="dbgPre"></pre>
  </div>

  <script src="./card.js?v=407"></script>
</body>
</html>
