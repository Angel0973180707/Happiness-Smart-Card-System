<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>智慧名片資料更新 v804</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{
      --bg:#0b1220;
      --card:#111827;
      --card2:#0f172a;
      --line:rgba(255,255,255,.10);
      --line-strong:rgba(125,211,252,.28);
      --text:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.66);
      --brand:#7dd3fc;
      --ok:#34d399;
      --warn:#fbbf24;
      --bad:#fb7185;
      --radius:20px;
      --shadow:0 16px 40px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:linear-gradient(180deg,#0b1220 0%,#111827 100%);
      color:var(--text);
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    }

    body{min-height:100vh}
    body.modal-open{overflow:hidden}

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:20px 14px 56px;
    }

    .hero{
      padding:20px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(125,211,252,.10),rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }

    .hero h1{
      margin:0 0 8px;
      font-size:28px;
    }

    .hero p{
      margin:0;
      color:var(--muted);
      line-height:1.7;
    }

    .card{
      background:rgba(17,24,39,.92);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }

    .section-title{
      margin:0 0 12px;
      font-size:18px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .section-title small{
      color:var(--muted);
      font-size:12px;
      font-weight:500;
    }

    .grid{display:grid;gap:12px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .field label{
      font-size:13px;
      color:var(--muted);
    }

    .input,.textarea{
      width:100%;
      border:1px solid var(--line);
      background:#0b1220;
      color:var(--text);
      border-radius:14px;
      padding:12px 14px;
      outline:none;
      font-size:15px;
    }

    .input:focus,.textarea:focus{
      border-color:rgba(125,211,252,.55);
      box-shadow:0 0 0 3px rgba(125,211,252,.12);
    }

    .textarea{
      min-height:110px;
      resize:vertical;
      line-height:1.7;
    }

    .status{
      display:none;
      margin-bottom:16px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      line-height:1.7;
      white-space:pre-wrap;
    }

    .status.show{display:block}
    .status.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.34)}
    .status.warn{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.34)}
    .status.bad{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.34)}

    .toolbar{
      position:sticky;
      bottom:0;
      z-index:20;
      padding-top:8px;
    }

    .toolbar-inner{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      padding:12px;
      border:1px solid var(--line);
      background:rgba(11,18,32,.92);
      backdrop-filter:blur(14px);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      border-radius:14px;
      padding:12px 16px;
      font-size:15px;
      font-weight:700;
      transition:.18s ease;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn-primary{
      background:var(--brand);
      color:#082032;
    }

    .btn-secondary{
      background:#1f2937;
      color:var(--text);
      border:1px solid var(--line);
    }

    .btn-danger{
      background:rgba(251,113,133,.14);
      color:#ffd7df;
      border:1px solid rgba(251,113,133,.28);
    }

    .hidden{display:none !important}

    .image-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
      margin-top:12px;
    }

    .image-card{
      border:1px solid var(--line);
      background:#0b1220;
      border-radius:18px;
      padding:12px;
    }

    .image-card-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      margin-bottom:10px;
    }

    .image-card-title{
      font-size:14px;
      font-weight:700;
    }

    .image-card-status{
      font-size:12px;
      color:var(--muted);
    }

    .thumb-box{
      width:100%;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#111827;
      position:relative;
      margin-bottom:10px;
    }

    .thumb-box.square{aspect-ratio:1/1}
    .thumb-box.wide{aspect-ratio:16/10}

    .thumb-image{
      width:100%;
      height:100%;
      background:
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01)),
        #0f172a center/cover no-repeat;
    }

    .image-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .image-actions .btn{
      padding:10px 12px;
      font-size:13px;
      border-radius:12px;
    }

    .sys-field,
    .file-input{
      display:none;
    }

    .crop-modal{
      position:fixed;
      inset:0;
      background:rgba(3,7,18,.72);
      backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:80;
      padding:18px;
    }

    .crop-modal.show{
      display:flex;
    }

    .crop-panel{
      width:min(960px,100%);
      max-height:92vh;
      overflow:auto;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,#101827,#0b1220);
      box-shadow:0 24px 60px rgba(0,0,0,.4);
      padding:16px;
    }

    .crop-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .crop-head h3{
      margin:0;
      font-size:18px;
    }

    .crop-stage{
      border:1px solid var(--line);
      border-radius:20px;
      background:#09111f;
      padding:16px;
      margin-bottom:14px;
    }

    .crop-viewport{
      width:min(100%, 760px);
      margin:0 auto;
      position:relative;
      overflow:hidden;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:
        linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%, rgba(255,255,255,.03)),
        linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%, rgba(255,255,255,.03));
      background-position:0 0, 14px 14px;
      background-size:28px 28px;
      touch-action:none;
      user-select:none;
      cursor:grab;
    }

    .crop-viewport:active{
      cursor:grabbing;
    }

    .crop-viewport.is-square{
      aspect-ratio:1/1;
      max-width:460px;
    }

    .crop-viewport.is-wide{
      aspect-ratio:16/10;
      max-width:760px;
    }

    .crop-image{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      transform-origin:center center;
      pointer-events:none;
      max-width:none;
      max-height:none;
      will-change:transform,width,height;
    }

    .crop-controls{
      display:grid;
      gap:12px;
    }

    .zoom-row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .zoom-row input[type="range"]{
      flex:1 1 220px;
    }

    .control-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .hint{
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
    }

    @media (max-width: 900px){
      .grid-2,.grid-3,.image-grid{grid-template-columns:1fr}
    }

    @media (max-width: 820px){
      .hero h1{font-size:24px}
      .crop-panel{padding:14px}
      .crop-stage{padding:12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>智慧名片資料更新</h1>
      <p>
        這個更新連結僅限本次使用，並有時效限制。<br>
        若資料沒有正常載入，請聯繫客服重新取得更新連結。
      </p>
    </section>

    <div id="statusBox" class="status"></div>

    <form id="updateForm" class="hidden" novalidate>
      <section class="card">
        <h2 class="section-title">基本資料 <small>可修改顯示文字</small></h2>
        <div class="grid grid-2">
          <div class="field"><label for="name">姓名 / 品牌名稱</label><input id="name" name="name" class="input" /></div>
          <div class="field"><label for="unit">單位</label><input id="unit" name="unit" class="input" /></div>
          <div class="field"><label for="title">職稱</label><input id="title" name="title" class="input" /></div>
          <div class="field"><label for="slogan">一句話介紹</label><input id="slogan" name="slogan" class="input" /></div>
        </div>
        <div class="grid">
          <div class="field"><label for="services">服務項目</label><textarea id="services" name="services" class="textarea"></textarea></div>
          <div class="field"><label for="experience">經歷 / 品牌故事</label><textarea id="experience" name="experience" class="textarea"></textarea></div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">聯絡方式 <small>會顯示在名片聯繫區</small></h2>
        <div class="grid grid-2">
          <div class="field"><label for="phone">電話</label><input id="phone" name="phone" class="input" /></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" class="input" /></div>
          <div class="field"><label for="line_url">LINE 連結</label><input id="line_url" name="line_url" class="input" /></div>
          <div class="field"><label for="line_oa">LINE 官方帳號</label><input id="line_oa" name="line_oa" class="input" /></div>
          <div class="field"><label for="wechat_id">WeChat ID</label><input id="wechat_id" name="wechat_id" class="input" /></div>
          <div class="field"><label for="website">網站</label><input id="website" name="website" class="input" /></div>
        </div>
        <div class="grid">
          <div class="field"><label for="address">地址</label><input id="address" name="address" class="input" /></div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">影音與社群</h2>
        <div class="grid grid-3">
          <div class="field"><label for="video1">影片 1</label><input id="video1" name="video1" class="input" /></div>
          <div class="field"><label for="video2">影片 2</label><input id="video2" name="video2" class="input" /></div>
          <div class="field"><label for="video3">影片 3</label><input id="video3" name="video3" class="input" /></div>
          <div class="field"><label for="social1">社群 1</label><input id="social1" name="social1" class="input" /></div>
          <div class="field"><label for="social2">社群 2</label><input id="social2" name="social2" class="input" /></div>
          <div class="field"><label for="social3">社群 3</label><input id="social3" name="social3" class="input" /></div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">行動按鈕 CTA</h2>
        <div class="grid grid-2">
          <div class="field"><label for="cta_text_1">按鈕 1 文字</label><input id="cta_text_1" name="cta_text_1" class="input" /></div>
          <div class="field"><label for="cta_link_1">按鈕 1 連結</label><input id="cta_link_1" name="cta_link_1" class="input" /></div>
          <div class="field"><label for="cta_text_2">按鈕 2 文字</label><input id="cta_text_2" name="cta_text_2" class="input" /></div>
          <div class="field"><label for="cta_link_2">按鈕 2 連結</label><input id="cta_link_2" name="cta_link_2" class="input" /></div>
          <div class="field"><label for="cta_text_3">按鈕 3 文字</label><input id="cta_text_3" name="cta_text_3" class="input" /></div>
          <div class="field"><label for="cta_link_3">按鈕 3 連結</label><input id="cta_link_3" name="cta_link_3" class="input" /></div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">圖片更新 <small>選圖後可裁切，再直接上傳 Firebase</small></h2>

        <div class="image-grid">
          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">頭像</div>
              <div class="image-card-status" id="status_avatar">未設定</div>
            </div>
            <div class="thumb-box square"><div id="preview_avatar" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="avatar">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="avatar">重選</button>
              <button type="button" class="btn btn-danger" data-clear="avatar">清除</button>
            </div>
            <input id="avatar_url" name="avatar_url" class="input sys-field" />
            <input id="file_avatar" class="file-input" type="file" accept="image/*" />
          </div>

          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">Logo</div>
              <div class="image-card-status" id="status_logo">未設定</div>
            </div>
            <div class="thumb-box square"><div id="preview_logo" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="logo">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="logo">重選</button>
              <button type="button" class="btn btn-danger" data-clear="logo">清除</button>
            </div>
            <input id="logo_url" name="logo_url" class="input sys-field" />
            <input id="file_logo" class="file-input" type="file" accept="image/*" />
          </div>

          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">照片 1</div>
              <div class="image-card-status" id="status_photo1">未設定</div>
            </div>
            <div class="thumb-box wide"><div id="preview_photo1" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="photo1">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="photo1">重選</button>
              <button type="button" class="btn btn-danger" data-clear="photo1">清除</button>
            </div>
            <input id="photo1_url" name="photo1_url" class="input sys-field" />
            <input id="file_photo1" class="file-input" type="file" accept="image/*" />
          </div>

          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">照片 2</div>
              <div class="image-card-status" id="status_photo2">未設定</div>
            </div>
            <div class="thumb-box wide"><div id="preview_photo2" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="photo2">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="photo2">重選</button>
              <button type="button" class="btn btn-danger" data-clear="photo2">清除</button>
            </div>
            <input id="photo2_url" name="photo2_url" class="input sys-field" />
            <input id="file_photo2" class="file-input" type="file" accept="image/*" />
          </div>

          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">照片 3</div>
              <div class="image-card-status" id="status_photo3">未設定</div>
            </div>
            <div class="thumb-box wide"><div id="preview_photo3" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="photo3">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="photo3">重選</button>
              <button type="button" class="btn btn-danger" data-clear="photo3">清除</button>
            </div>
            <input id="photo3_url" name="photo3_url" class="input sys-field" />
            <input id="file_photo3" class="file-input" type="file" accept="image/*" />
          </div>

          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">照片 4</div>
              <div class="image-card-status" id="status_photo4">未設定</div>
            </div>
            <div class="thumb-box wide"><div id="preview_photo4" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="photo4">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="photo4">重選</button>
              <button type="button" class="btn btn-danger" data-clear="photo4">清除</button>
            </div>
            <input id="photo4_url" name="photo4_url" class="input sys-field" />
            <input id="file_photo4" class="file-input" type="file" accept="image/*" />
          </div>

          <div class="image-card">
            <div class="image-card-head">
              <div class="image-card-title">照片 5</div>
              <div class="image-card-status" id="status_photo5">未設定</div>
            </div>
            <div class="thumb-box wide"><div id="preview_photo5" class="thumb-image"></div></div>
            <div class="image-actions">
              <button type="button" class="btn btn-secondary" data-pick="photo5">選圖</button>
              <button type="button" class="btn btn-secondary" data-edit="photo5">重選</button>
              <button type="button" class="btn btn-danger" data-clear="photo5">清除</button>
            </div>
            <input id="photo5_url" name="photo5_url" class="input sys-field" />
            <input id="file_photo5" class="file-input" type="file" accept="image/*" />
          </div>
        </div>
      </section>

      <div class="toolbar">
        <div class="toolbar-inner">
          <button id="btnSubmit" type="submit" class="btn btn-primary">送出更新</button>
          <button id="btnReload" type="button" class="btn btn-secondary">重新載入資料</button>
          <button id="btnTop" type="button" class="btn btn-secondary">回到上方</button>
        </div>
      </div>
    </form>
  </div>

  <div id="cropModal" class="crop-modal" aria-hidden="true">
    <div class="crop-panel">
      <div class="crop-head">
        <h3 id="cropTitle">裁切圖片</h3>
        <div class="hint">拖曳可移動圖片，使用縮放調整構圖，按「套用並上傳」即會直接寫入 Firebase。</div>
      </div>

      <div id="cropStage" class="crop-stage">
        <div id="cropViewport" class="crop-viewport is-square">
          <img id="cropImage" class="crop-image" alt="crop preview" />
        </div>
      </div>

      <div class="crop-controls">
        <div class="zoom-row">
          <button id="btnZoomOut" type="button" class="btn btn-secondary">縮小</button>
          <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" />
          <button id="btnZoomIn" type="button" class="btn btn-secondary">放大</button>
        </div>

        <div class="control-row">
          <button id="btnCenter" type="button" class="btn btn-secondary">置中</button>
          <button id="btnResetCrop" type="button" class="btn btn-secondary">重設</button>
          <button id="btnCancelCrop" type="button" class="btn btn-secondary">取消</button>
          <button id="btnApplyCrop" type="button" class="btn btn-primary">套用並上傳</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./update-form.js?v=804"></script>
</body>
</html>
