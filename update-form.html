<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>智慧名片資料更新</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{
      --bg:#0b1220;
      --card:#111827;
      --card2:#0f172a;
      --line:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.96);
      --muted:rgba(255,255,255,.66);
      --brand:#7dd3fc;
      --ok:#34d399;
      --warn:#fbbf24;
      --bad:#fb7185;
      --radius:20px;
      --shadow:0 16px 40px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:linear-gradient(180deg,#0b1220 0%,#111827 100%);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    body{min-height:100vh}
    .wrap{max-width:980px;margin:0 auto;padding:20px 14px 48px}
    .hero{
      padding:20px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(125,211,252,.10),rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }
    .hero h1{margin:0 0 8px;font-size:28px}
    .hero p{margin:0;color:var(--muted);line-height:1.7}
    .card{
      background:rgba(17,24,39,.92);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }
    .section-title{
      margin:0 0 12px;
      font-size:18px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .section-title small{
      color:var(--muted);
      font-size:12px;
      font-weight:500;
    }
    .grid{display:grid;gap:12px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field{display:flex;flex-direction:column;gap:8px}
    .field label{font-size:13px;color:var(--muted)}
    .input,.textarea{
      width:100%;
      border:1px solid var(--line);
      background:#0b1220;
      color:var(--text);
      border-radius:14px;
      padding:12px 14px;
      outline:none;
      font-size:15px;
    }
    .input:focus,.textarea:focus{border-color:rgba(125,211,252,.55);box-shadow:0 0 0 3px rgba(125,211,252,.12)}
    .textarea{min-height:110px;resize:vertical;line-height:1.7}
    .muted{color:var(--muted)}
    .status{
      display:none;
      margin-bottom:16px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--line);
      line-height:1.7;
      white-space:pre-wrap;
    }
    .status.show{display:block}
    .status.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.34)}
    .status.warn{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.34)}
    .status.bad{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.34)}
    .toolbar{
      position:sticky;bottom:0;z-index:20;
      padding-top:8px;
    }
    .toolbar-inner{
      display:flex;gap:10px;flex-wrap:wrap;
      padding:12px;
      border:1px solid var(--line);
      background:rgba(11,18,32,.92);
      backdrop-filter:blur(14px);
      border-radius:18px;
      box-shadow:var(--shadow);
    }
    .btn{
      appearance:none;border:0;cursor:pointer;
      border-radius:14px;
      padding:12px 16px;
      font-size:15px;
      font-weight:700;
    }
    .btn-primary{background:var(--brand);color:#082032}
    .btn-secondary{background:#1f2937;color:var(--text);border:1px solid var(--line)}
    .btn-danger{background:#3a1520;color:#ffd5dd;border:1px solid rgba(251,113,133,.28)}
    .btn[disabled]{opacity:.56;cursor:not-allowed}
    .preview-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }
    .preview-item{
      border:1px solid var(--line);
      background:#0b1220;
      border-radius:16px;
      padding:10px;
    }
    .preview-item h4{
      margin:0 0 8px;
      font-size:13px;
      color:var(--muted);
      font-weight:600;
    }
    .thumb{
      width:100%;
      aspect-ratio:1/1;
      border-radius:14px;
      background:#0f172a center/cover no-repeat;
      border:1px solid var(--line);
    }
    .thumb.wide{aspect-ratio:16/10}
    .help{
      font-size:12px;
      color:var(--muted);
      line-height:1.7;
      margin-top:4px;
    }
    .hidden{display:none !important}
    @media (max-width: 820px){
      .grid-2,.grid-3,.preview-grid{grid-template-columns:1fr}
      .hero h1{font-size:24px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>智慧名片資料更新</h1>
      <p>
        這個更新連結僅限本次使用，並有時效限制。<br>
        請確認資料後再送出；若連結失效，請聯繫客服重新取得更新連結。
      </p>
    </section>

    <div id="statusBox" class="status"></div>

    <form id="updateForm" class="hidden" novalidate>
      <section class="card">
        <h2 class="section-title">基本資料 <small>可修改顯示文字</small></h2>
        <div class="grid grid-2">
          <div class="field">
            <label for="name">姓名 / 品牌名稱</label>
            <input id="name" name="name" class="input" />
          </div>
          <div class="field">
            <label for="unit">單位</label>
            <input id="unit" name="unit" class="input" />
          </div>
          <div class="field">
            <label for="title">職稱</label>
            <input id="title" name="title" class="input" />
          </div>
          <div class="field">
            <label for="slogan">一句話介紹</label>
            <input id="slogan" name="slogan" class="input" />
          </div>
        </div>
        <div class="grid">
          <div class="field">
            <label for="services">服務項目</label>
            <textarea id="services" name="services" class="textarea"></textarea>
          </div>
          <div class="field">
            <label for="experience">經歷 / 品牌故事</label>
            <textarea id="experience" name="experience" class="textarea"></textarea>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">聯絡方式 <small>會顯示在名片聯繫區</small></h2>
        <div class="grid grid-2">
          <div class="field">
            <label for="phone">電話</label>
            <input id="phone" name="phone" class="input" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" class="input" />
          </div>
          <div class="field">
            <label for="line_url">LINE 連結</label>
            <input id="line_url" name="line_url" class="input" />
          </div>
          <div class="field">
            <label for="line_oa">LINE 官方帳號</label>
            <input id="line_oa" name="line_oa" class="input" />
          </div>
          <div class="field">
            <label for="wechat_id">WeChat ID</label>
            <input id="wechat_id" name="wechat_id" class="input" />
          </div>
          <div class="field">
            <label for="website">網站</label>
            <input id="website" name="website" class="input" />
          </div>
        </div>
        <div class="grid">
          <div class="field">
            <label for="address">地址</label>
            <input id="address" name="address" class="input" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">影音與社群</h2>
        <div class="grid grid-3">
          <div class="field">
            <label for="video1">影片 1</label>
            <input id="video1" name="video1" class="input" />
          </div>
          <div class="field">
            <label for="video2">影片 2</label>
            <input id="video2" name="video2" class="input" />
          </div>
          <div class="field">
            <label for="video3">影片 3</label>
            <input id="video3" name="video3" class="input" />
          </div>
          <div class="field">
            <label for="social1">社群 1</label>
            <input id="social1" name="social1" class="input" />
          </div>
          <div class="field">
            <label for="social2">社群 2</label>
            <input id="social2" name="social2" class="input" />
          </div>
          <div class="field">
            <label for="social3">社群 3</label>
            <input id="social3" name="social3" class="input" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">行動按鈕 CTA</h2>
        <div class="grid grid-2">
          <div class="field">
            <label for="cta_text_1">按鈕 1 文字</label>
            <input id="cta_text_1" name="cta_text_1" class="input" />
          </div>
          <div class="field">
            <label for="cta_link_1">按鈕 1 連結</label>
            <input id="cta_link_1" name="cta_link_1" class="input" />
          </div>
          <div class="field">
            <label for="cta_text_2">按鈕 2 文字</label>
            <input id="cta_text_2" name="cta_text_2" class="input" />
          </div>
          <div class="field">
            <label for="cta_link_2">按鈕 2 連結</label>
            <input id="cta_link_2" name="cta_link_2" class="input" />
          </div>
          <div class="field">
            <label for="cta_text_3">按鈕 3 文字</label>
            <input id="cta_text_3" name="cta_text_3" class="input" />
          </div>
          <div class="field">
            <label for="cta_link_3">按鈕 3 連結</label>
            <input id="cta_link_3" name="cta_link_3" class="input" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">圖片更新 <small>目前採圖片網址更新</small></h2>
        <div class="help">
          目前這一版是直接更新圖片網址。若要「上傳新圖＋裁切＋套用」，需要再補圖片上傳儲存流程。
        </div>

        <div class="grid grid-2" style="margin-top:12px">
          <div class="field">
            <label for="avatar_url">頭像網址</label>
            <input id="avatar_url" name="avatar_url" class="input js-img-url" data-preview="preview_avatar" />
          </div>
          <div class="field">
            <label for="logo_url">Logo 網址</label>
            <input id="logo_url" name="logo_url" class="input js-img-url" data-preview="preview_logo" />
          </div>
        </div>

        <div class="grid grid-3" style="margin-top:12px">
          <div class="field">
            <label for="photo1_url">照片 1 網址</label>
            <input id="photo1_url" name="photo1_url" class="input js-img-url" data-preview="preview_photo1" />
          </div>
          <div class="field">
            <label for="photo2_url">照片 2 網址</label>
            <input id="photo2_url" name="photo2_url" class="input js-img-url" data-preview="preview_photo2" />
          </div>
          <div class="field">
            <label for="photo3_url">照片 3 網址</label>
            <input id="photo3_url" name="photo3_url" class="input js-img-url" data-preview="preview_photo3" />
          </div>
          <div class="field">
            <label for="photo4_url">照片 4 網址</label>
            <input id="photo4_url" name="photo4_url" class="input js-img-url" data-preview="preview_photo4" />
          </div>
          <div class="field">
            <label for="photo5_url">照片 5 網址</label>
            <input id="photo5_url" name="photo5_url" class="input js-img-url" data-preview="preview_photo5" />
          </div>
        </div>

        <div class="preview-grid" style="margin-top:14px">
          <div class="preview-item">
            <h4>頭像預覽</h4>
            <div id="preview_avatar" class="thumb"></div>
          </div>
          <div class="preview-item">
            <h4>Logo 預覽</h4>
            <div id="preview_logo" class="thumb"></div>
          </div>
          <div class="preview-item">
            <h4>照片 1 預覽</h4>
            <div id="preview_photo1" class="thumb wide"></div>
          </div>
          <div class="preview-item">
            <h4>照片 2 預覽</h4>
            <div id="preview_photo2" class="thumb wide"></div>
          </div>
          <div class="preview-item">
            <h4>照片 3 預覽</h4>
            <div id="preview_photo3" class="thumb wide"></div>
          </div>
          <div class="preview-item">
            <h4>照片 4 預覽</h4>
            <div id="preview_photo4" class="thumb wide"></div>
          </div>
          <div class="preview-item">
            <h4>照片 5 預覽</h4>
            <div id="preview_photo5" class="thumb wide"></div>
          </div>
        </div>
      </section>

      <div class="toolbar">
        <div class="toolbar-inner">
          <button id="btnSubmit" type="submit" class="btn btn-primary">送出更新</button>
          <button id="btnReload" type="button" class="btn btn-secondary">重新載入資料</button>
          <button id="btnTop" type="button" class="btn btn-secondary">回到上方</button>
        </div>
      </div>
    </form>
  </div>

  <script src="./update-form.js?v=721.0"></script>
</body>
</html>
